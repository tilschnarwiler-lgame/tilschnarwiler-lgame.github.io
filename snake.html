<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Snake Arcade</title>

<style>
body {
    margin: 0;
    background: black;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial;
    color: white;
}

button {
    padding: 10px 15px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #007bff;
    color: white;
    font-size: 16px;
    display: none;
}

canvas {
    background: black;
    border: 2px solid white;
}
</style>
</head>

<body>

<button id="restartBtn" onclick="restartGame()">🔁 Restart</button>
<canvas id="game" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 600;
const HEIGHT = 400;
const BLOCK = 20;

let snake, direction, food, score, highscore, gameOver;

// ---------------- AUDIO ----------------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

let musicInterval;

// 🔊 Grundton-Generator
function playTone(freq, duration, type = "square", volume = 0.08) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.value = volume;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// 🎵 SPANNENDERE ARCADE MUSIK (leicht „drückend“)
function startMusic() {
    if (musicInterval) return;

    const melody = [
        220, 247, 262, 247,
        220, 196, 220, 247,
        196, 185, 196, 220
    ];

    let i = 0;

    musicInterval = setInterval(() => {
        playTone(melody[i % melody.length], 0.12, "square", 0.05);
        i++;
    }, 140);
}

function stopMusic() {
    clearInterval(musicInterval);
    musicInterval = null;
}

// 🍎 ESSEN SOUND (knackiger + „arcade pop“)
function playEatSound() {
    playTone(700, 0.05, "square", 0.08);
    setTimeout(() => playTone(1000, 0.05, "square", 0.06), 60);
}

// 💀 DEATH SOUND (dein bestehender bleibt gut)
function playDeathSound() {
    playTone(120, 0.3, "sawtooth", 0.1);
    setTimeout(() => playTone(80, 0.4, "sawtooth", 0.1), 150);
}

// 🎧 Audio Unlock
document.addEventListener("click", () => {
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}, { once: true });

// 🚫 ANTI SCROLL FIX
window.addEventListener("keydown", function(e) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
    }
});

// ---------------- START ----------------
highscore = localStorage.getItem("snake_highscore");
highscore = highscore ? parseInt(highscore) : 0;

function startGame() {
    snake = [{x: 200, y: 200}];
    direction = "RIGHT";
    score = 0;
    gameOver = false;

    document.getElementById("restartBtn").style.display = "none";

    food = spawnFood();

    startMusic();
}

// ---------------- FOOD ----------------
function spawnFood() {
    let newFood;

    while (true) {
        newFood = {
            x: Math.floor(Math.random() * (WIDTH / BLOCK)) * BLOCK,
            y: Math.floor(Math.random() * (HEIGHT / BLOCK)) * BLOCK
        };

        let onSnake = false;

        for (let part of snake) {
            if (part.x === newFood.x && part.y === newFood.y) {
                onSnake = true;
                break;
            }
        }

        if (!onSnake) break;
    }

    return newFood;
}

// ---------------- CONTROLS ----------------
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
    if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
    if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
    if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
});

// ---------------- RESTART ----------------
function restartGame() {
    startGame();
}

// ---------------- UPDATE ----------------
function update() {
    if (gameOver) return;

    let head = {x: snake[0].x, y: snake[0].y};

    if (direction === "LEFT") head.x -= BLOCK;
    if (direction === "RIGHT") head.x += BLOCK;
    if (direction === "UP") head.y -= BLOCK;
    if (direction === "DOWN") head.y += BLOCK;

    // WRAP
    if (head.x < 0) head.x = WIDTH - BLOCK;
    else if (head.x >= WIDTH) head.x = 0;

    if (head.y < 0) head.y = HEIGHT - BLOCK;
    else if (head.y >= HEIGHT) head.y = 0;

    // SELF COLLISION
    for (let part of snake) {
        if (part.x === head.x && part.y === head.y) {
            gameOver = true;

            stopMusic();
            playDeathSound();

            localStorage.setItem("snake_highscore", Math.max(score, highscore));

            document.getElementById("restartBtn").style.display = "block";
            return;
        }
    }

    snake.unshift(head);

    // FOOD
    if (head.x === food.x && head.y === food.y) {
        score++;
        playEatSound();
        food = spawnFood();
    } else {
        snake.pop();
    }
}

// ---------------- DRAW ----------------
function drawSnake() {
    snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#0b6b2a" : "#2ecc71";
        ctx.fillRect(s.x, s.y, BLOCK, BLOCK);

        if (i === 0) {
            ctx.fillStyle = "white";
            ctx.fillRect(s.x + 5, s.y + 5, 4, 4);
            ctx.fillRect(s.x + 12, s.y + 5, 4, 4);
        }
    });
}

function drawApple() {
    const x = food.x + BLOCK / 2;
    const y = food.y + BLOCK / 2;

    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(x, y, BLOCK / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "green";
    ctx.beginPath();
    ctx.ellipse(x + 5, y - 10, 6, 3, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
}

// ---------------- DRAW ----------------
function draw() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    drawApple();
    drawSnake();

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("Score: " + score, 10, 20);
    ctx.fillText("Highscore: " + highscore, 10, 45);

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.fillText("GAME OVER", 200, 180);
    }
}

// ---------------- LOOP ----------------
function loop() {
    update();
    draw();
    setTimeout(loop, 100);
}

startGame();
loop();
</script>

</body>
</html>
