<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Snake Arcade</title>

<style>
body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial;
    color: white;
}

/* MENU */
#menu {
    position: absolute;
    text-align: center;
}

#menu h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

/* BUTTON STYLE (Start + Restart gleich!) */
.btn {
    padding: 12px 20px;
    font-size: 18px;
    background: limegreen;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px;
}

/* Restart auch zentriert */
#restartContainer {
    position: absolute;
    display: none;
    text-align: center;
}

/* GAME */
canvas {
    background: black;
    border: 2px solid white;
}
</style>
</head>

<body>

<!-- 🎮 MENU -->
<div id="menu">
    <h1>🐍 Snake Arcade</h1>
    <button class="btn" onclick="bootGame()">▶ Start Game</button>
</div>

<!-- 🔄 RESTART SCREEN -->
<div id="restartContainer">
    <button class="btn" onclick="restartGame()">🔁 Restart</button>
</div>

<canvas id="game" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 600;
const HEIGHT = 400;
const BLOCK = 20;

let snake, direction, food, score, highscore, gameOver;
let gameStarted = false;

// ---------------- TOUCH (SWIPE) ----------------
let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
});

document.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];

    let dx = t.clientX - touchStartX;
    let dy = t.clientY - touchStartY;

    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && direction !== "LEFT") direction = "RIGHT";
        else if (dx < 0 && direction !== "RIGHT") direction = "LEFT";
    } else {
        if (dy > 0 && direction !== "UP") direction = "DOWN";
        else if (dy < 0 && direction !== "DOWN") direction = "UP";
    }
});

// ---------------- AUDIO ----------------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

let musicInterval;

function playTone(freq, duration, type = "square", volume = 0.06) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.value = volume;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// 🎵 MUSIC
function startMusic() {
    if (musicInterval) return;

    const melody = [
        110,110,146,110,
        98,110,131,110,
        92,98,110,98
    ];

    let i = 0;

    musicInterval = setInterval(() => {
        playTone(melody[i % melody.length], 0.25, "sine", 0.04);
        i++;
    }, 260);
}

function stopMusic() {
    clearInterval(musicInterval);
    musicInterval = null;
}

// 🍎 EAT
function playEatSound() {
    playTone(700, 0.05);
    setTimeout(() => playTone(1000, 0.05), 60);
}

// 💀 DEATH
function playDeathSound() {
    playTone(120, 0.3, "sawtooth", 0.1);
    setTimeout(() => playTone(80, 0.4, "sawtooth", 0.1), 150);
}

// unlock audio
document.addEventListener("click", () => {
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}, { once: true });

// 🚫 anti scroll
window.addEventListener("keydown", (e) => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
        e.preventDefault();
    }
});

// ---------------- START ----------------
highscore = localStorage.getItem("snake_highscore");
highscore = highscore ? parseInt(highscore) : 0;

function bootGame() {
    if (gameStarted) return;

    gameStarted = true;
    document.getElementById("menu").style.display = "none";

    startGame();
    loop();
}

function startGame() {
    snake = [{x: 200, y: 200}];
    direction = "RIGHT";
    score = 0;
    gameOver = false;

    document.getElementById("restartContainer").style.display = "none";

    food = spawnFood();

    startMusic();
}

// ---------------- FOOD ----------------
function spawnFood() {
    let newFood;

    while (true) {
        newFood = {
            x: Math.floor(Math.random() * (WIDTH / BLOCK)) * BLOCK,
            y: Math.floor(Math.random() * (HEIGHT / BLOCK)) * BLOCK
        };

        let onSnake = false;

        for (let part of snake) {
            if (part.x === newFood.x && part.y === newFood.y) {
                onSnake = true;
                break;
            }
        }

        if (!onSnake) break;
    }

    return newFood;
}

// ---------------- CONTROLS ----------------
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
    if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
    if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
    if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
});

// ---------------- RESTART ----------------
function restartGame() {
    startGame();
}

// ---------------- UPDATE ----------------
function update() {
    if (gameOver) return;

    let head = {x: snake[0].x, y: snake[0].y};

    if (direction === "LEFT") head.x -= BLOCK;
    if (direction === "RIGHT") head.x += BLOCK;
    if (direction === "UP") head.y -= BLOCK;
    if (direction === "DOWN") head.y += BLOCK;

    if (head.x < 0) head.x = WIDTH - BLOCK;
    else if (head.x >= WIDTH) head.x = 0;

    if (head.y < 0) head.y = HEIGHT - BLOCK;
    else if (head.y >= HEIGHT) head.y = 0;

    for (let part of snake) {
        if (part.x === head.x && part.y === head.y) {
            gameOver = true;

            stopMusic();
            playDeathSound();

            localStorage.setItem("snake_highscore", Math.max(score, highscore));

            document.getElementById("restartContainer").style.display = "block";
            return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        playEatSound();
        food = spawnFood();
    } else {
        snake.pop();
    }
}

// ---------------- DRAW ----------------
function drawSnake() {
    snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#0b6b2a" : "#2ecc71";
        ctx.fillRect(s.x, s.y, BLOCK, BLOCK);
    });
}

function drawApple() {
    const x = food.x + BLOCK / 2;
    const y = food.y + BLOCK / 2;

    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(x, y, BLOCK / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
}

// ---------------- DRAW ----------------
function draw() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    drawApple();
    drawSnake();

    ctx.fillStyle = "white";
    ctx.fillText("Score: " + score, 10, 20);
}

// ---------------- LOOP ----------------
function loop() {
    update();
    draw();
    setTimeout(loop, 100);
}
</script>

</body>
</html>
