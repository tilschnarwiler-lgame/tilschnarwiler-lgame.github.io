<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panzer 1v1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #5a9e2f 0%, #4a7c2e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #homeScreen {
            text-align: center;
            color: #2d5016;
            z-index: 10;
            animation: fadeIn 0.8s ease;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(139, 69, 19, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-title {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 3px 3px 0 #8B4513, 6px 6px 0 rgba(139, 69, 19, 0.3);
            letter-spacing: 3px;
            color: #2d5016;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .menu-button {
            width: 350px;
            padding: 20px 30px;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid rgba(139, 69, 19, 0.4);
            border-radius: 15px;
            cursor: pointer;
            color: #2d5016;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .menu-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.6);
        }

        .menu-button.pvp {
            border-left: 6px solid #8B4513;
        }

        .menu-button.pvp:hover {
            background: rgba(139, 69, 19, 0.2);
        }

        .menu-button.bot {
            border-left: 6px solid #2d5016;
        }

        .menu-button.bot:hover {
            background: rgba(45, 80, 22, 0.2);
        }

        #gameScreen {
            display: none;
            text-align: center;
            position: relative;
        }

        #gameContainer {
            position: relative;
            display: inline-block;
        }

        canvas {
            border: 5px solid #8B4513;
            background: #7ec850;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        #victoryOverlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            z-index: 20;
            border: 3px solid #FFD700;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
            animation: victoryPulse 2s infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.8); }
        }

        #victoryText {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        #victorySubtext {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 20px;
        }

        #restartButton {
            padding: 12px 30px;
            font-size: 18px;
            background: #FFD700;
            color: #333;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #restartButton:hover {
            background: #FFA500;
            transform: scale(1.05);
        }

        #gameUI {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        #backButton {
            padding: 12px 25px;
            font-size: 16px;
            background: rgba(139, 69, 19, 0.8);
            color: white;
            border: 2px solid #5a3e2b;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        #backButton:hover {
            background: #8B4513;
            transform: scale(1.05);
        }

        #gameInfo {
            color: #2d5016;
            font-size: 18px;
            flex-grow: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 10px;
            margin: 0 20px;
            font-weight: bold;
        }

        @media (max-width: 1000px) {
            canvas { width: 100%; height: auto; }
            .game-title { font-size: 40px; }
            .menu-button { width: 280px; padding: 15px 20px; font-size: 18px; }
            #homeScreen { padding: 40px 25px; }
            #victoryText { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div id="homeScreen">
        <h1 class="game-title">PANZER DUEL</h1>
        
        <div class="menu-container">
            <button class="menu-button bot" onclick="selectMode('bot')">
                1 Spieler
            </button>
            
            <button class="menu-button pvp" onclick="selectMode('pvp')">
                2 Spieler
            </button>
        </div>
    </div>

    <div id="gameScreen">
        <div id="gameUI">
            <button id="backButton" onclick="goToHome()">← Zurück</button>
            <div id="gameInfo">Wähle einen Spielmodus</div>
            <div style="width: 80px;"></div>
        </div>
        <div id="gameContainer">
            <canvas id="gameCanvas" width="900" height="550"></canvas>
            <div id="victoryOverlay">
                <div id="victoryText"></div>
                <div id="victorySubtext"></div>
                <button id="restartButton" onclick="restartGame()">Erneut spielen</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameInfo = document.getElementById('gameInfo');
        const homeScreen = document.getElementById('homeScreen');
        const gameScreen = document.getElementById('gameScreen');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const victoryText = document.getElementById('victoryText');
        const victorySubtext = document.getElementById('victorySubtext');

        let gameMode = null;
        let gameRunning = false;
        let gameEnded = false;

        const obstacles = [
            { x: 250, y: 150, radius: 35, type: 'tree' },
            { x: 650, y: 400, radius: 38, type: 'tree' },
            { x: 150, y: 420, radius: 30, type: 'tree' },
            { x: 750, y: 150, radius: 32, type: 'tree' },
            { x: 450, y: 100, radius: 36, type: 'tree' },
            { x: 450, y: 450, radius: 34, type: 'tree' },
            { x: 350, y: 250, width: 55, height: 45, type: 'rock' },
            { x: 550, y: 300, width: 50, height: 40, type: 'rock' },
            { x: 300, y: 380, width: 45, height: 50, type: 'rock' },
            { x: 600, y: 180, width: 48, height: 52, type: 'rock' },
            { x: 100, y: 250, radius: 22, type: 'bush' },
            { x: 800, y: 300, radius: 22, type: 'bush' },
            { x: 500, y: 200, radius: 18, type: 'bush' },
            { x: 400, y: 350, radius: 20, type: 'bush' },
        ];

        function checkObstacleCollision(x, y, radius = 20) {
            for (let obs of obstacles) {
                if (obs.type === 'tree' || obs.type === 'bush') {
                    let dx = x - obs.x;
                    let dy = y - obs.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < obs.radius + radius) return true;
                } else if (obs.type === 'rock') {
                    let closestX = Math.max(obs.x - obs.width/2, Math.min(x, obs.x + obs.width/2));
                    let closestY = Math.max(obs.y - obs.height/2, Math.min(y, obs.y + obs.height/2));
                    let dx = x - closestX;
                    let dy = y - closestY;
                    if (Math.sqrt(dx * dx + dy * dy) < radius) return true;
                }
            }
            return false;
        }

        function bulletHitsObstacle(bullet) {
            for (let obs of obstacles) {
                if (obs.type === 'tree' || obs.type === 'bush') {
                    let dx = bullet.x - obs.x;
                    let dy = bullet.y - obs.y;
                    if (Math.sqrt(dx * dx + dy * dy) < obs.radius) return true;
                } else if (obs.type === 'rock') {
                    if (bullet.x > obs.x - obs.width/2 && bullet.x < obs.x + obs.width/2 &&
                        bullet.y > obs.y - obs.height/2 && bullet.y < obs.y + obs.height/2) {
                        return true;
                    }
                }
            }
            return false;
        }

        class Tank {
            constructor(x, y, color, controls, name) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 50;
                this.color = color;
                this.angle = 0;
                this.speed = 2.5;
                this.turnSpeed = 0.04;
                this.hp = 100;
                this.maxHp = 100;
                this.controls = controls;
                this.bullets = [];
                this.reloadTime = 0;
                this.maxReload = 45;
                this.name = name;
            }

            move(keys) {
                let newX = this.x;
                let newY = this.y;

                if (keys[this.controls.forward]) {
                    newX += Math.sin(this.angle) * this.speed;
                    newY -= Math.cos(this.angle) * this.speed;
                }
                if (keys[this.controls.backward]) {
                    newX -= Math.sin(this.angle) * this.speed;
                    newY += Math.cos(this.angle) * this.speed;
                }

                if (!checkObstacleCollision(newX, newY, 22)) {
                    this.x = newX;
                    this.y = newY;
                }

                if (keys[this.controls.left]) {
                    this.angle -= this.turnSpeed;
                }
                if (keys[this.controls.right]) {
                    this.angle += this.turnSpeed;
                }
                if (keys[this.controls.shoot] && this.reloadTime <= 0) {
                    this.shoot();
                }

                this.x = Math.max(this.width/2, Math.min(canvas.width - this.width/2, this.x));
                this.y = Math.max(this.height/2, Math.min(canvas.height - this.height/2, this.y));

                this.reloadTime--;
            }

            shoot() {
                this.bullets.push({
                    x: this.x + Math.sin(this.angle) * 30,
                    y: this.y - Math.cos(this.angle) * 30,
                    vx: Math.sin(this.angle) * 6,
                    vy: -Math.cos(this.angle) * 6,
                    life: 100
                });
                this.reloadTime = this.maxReload;
            }

            updateBullets() {
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    let b = this.bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    b.life--;

                    if (bulletHitsObstacle(b)) {
                        this.bullets.splice(i, 1);
                        continue;
                    }

                    if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        this.bullets.splice(i, 1);
                    }
                }
            }

            checkCollision(otherTank) {
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    let b = this.bullets[i];
                    let dx = b.x - otherTank.x;
                    let dy = b.y - otherTank.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 28) {
                        otherTank.hp -= 15;
                        this.bullets.splice(i, 1);
                        return true;
                    }
                }
                return false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Schatten
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(-this.width/2 + 3, -this.height/2 + 3, this.width, this.height);

                // Ketten
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(-this.width/2 - 5, -this.height/2, 8, this.height);
                ctx.fillRect(this.width/2 - 3, -this.height/2, 8, this.height);
                
                // Ketten-Details
                ctx.fillStyle = '#444';
                for (let i = 0; i < 6; i++) {
                    ctx.fillRect(-this.width/2 - 3, -this.height/2 + 3 + i * 9, 4, 3);
                    ctx.fillRect(this.width/2 - 1, -this.height/2 + 3 + i * 9, 4, 3);
                }

                // Panzerkörper
                let bodyGradient = ctx.createLinearGradient(-this.width/2, 0, this.width/2, 0);
                bodyGradient.addColorStop(0, this.color);
                bodyGradient.addColorStop(0.5, this.lightenColor(this.color, 20));
                bodyGradient.addColorStop(1, this.color);
                ctx.fillStyle = bodyGradient;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                
                // Karosserie-Rand
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
                
                // Motorabdeckung (hinten)
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(-this.width/2 + 3, this.height/2 - 15, this.width - 6, 12);
                
                // Lüftungsschlitze
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-this.width/2 + 8, this.height/2 - 12 + i * 3);
                    ctx.lineTo(this.width/2 - 8, this.height/2 - 12 + i * 3);
                    ctx.stroke();
                }

                // Turm
                let turmGradient = ctx.createRadialGradient(0, -5, 5, 0, -5, 18);
                turmGradient.addColorStop(0, this.lightenColor(this.color, 30));
                turmGradient.addColorStop(1, this.color);
                ctx.fillStyle = turmGradient;
                ctx.beginPath();
                ctx.arc(0, -5, 17, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Turm-Details
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.arc(0, -5, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // Luke
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(-5, -10, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // Antenne
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(8, -18);
                ctx.lineTo(10, -28);
                ctx.stroke();
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(10, -28, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Kanone
                let barrelGradient = ctx.createLinearGradient(-3, -38, 3, -10);
                barrelGradient.addColorStop(0, '#555');
                barrelGradient.addColorStop(0.3, '#888');
                barrelGradient.addColorStop(0.5, '#aaa');
                barrelGradient.addColorStop(0.7, '#888');
                barrelGradient.addColorStop(1, '#555');
                ctx.fillStyle = barrelGradient;
                ctx.fillRect(-4, -38, 8, 30);
                
                // Kanonen-Rand
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.strokeRect(-4, -38, 8, 30);
                
                // Mündung
                ctx.fillStyle = '#333';
                ctx.fillRect(-5, -40, 10, 6);
                
                ctx.restore();

                // Kugeln
                for (let b of this.bullets) {
                    // Leuchteffekt
                    ctx.fillStyle = 'rgba(255, 200, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            lightenColor(color, percent) {
                let num = parseInt(color.replace('#', ''), 16);
                let amt = Math.round(2.55 * percent);
                let R = Math.min(255, (num >> 16) + amt);
                let G = Math.min(255, (num >> 8 & 0x00FF) + amt);
                let B = Math.min(255, (num & 0x0000FF) + amt);
                return `rgb(${R}, ${G}, ${B})`;
            }
        }

        class Bot {
            constructor(tank, target) {
                this.tank = tank;
                this.target = target;
                this.actionTimer = 0;
                this.currentAction = 'move';
            }

            update() {
                this.actionTimer--;
                if (this.actionTimer <= 0) {
                    this.decideAction();
                    this.actionTimer = Math.random() * 40 + 25;
                }

                let dx = this.target.x - this.tank.x;
                let dy = this.target.y - this.tank.y;
                let targetAngle = Math.atan2(dx, -dy);
                
                let angleDiff = targetAngle - this.tank.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                if (Math.abs(angleDiff) > 0.03) {
                    this.tank.angle += Math.sign(angleDiff) * this.tank.turnSpeed * 1.2;
                }

                let newX = this.tank.x;
                let newY = this.tank.y;

                if (this.currentAction === 'move') {
                    newX += Math.sin(this.tank.angle) * this.tank.speed * 0.7;
                    newY -= Math.cos(this.tank.angle) * this.tank.speed * 0.7;
                } else if (this.currentAction === 'retreat') {
                    newX -= Math.sin(this.tank.angle) * this.tank.speed * 0.6;
                    newY += Math.cos(this.tank.angle) * this.tank.speed * 0.6;
                } else if (this.currentAction === 'strafe_left') {
                    newX -= Math.cos(this.tank.angle) * this.tank.speed * 0.6;
                    newY -= Math.sin(this.tank.angle) * this.tank.speed * 0.6;
                } else if (this.currentAction === 'strafe_right') {
                    newX += Math.cos(this.tank.angle) * this.tank.speed * 0.6;
                    newY += Math.sin(this.tank.angle) * this.tank.speed * 0.6;
                }

                if (!checkObstacleCollision(newX, newY, 22)) {
                    this.tank.x = newX;
                    this.tank.y = newY;
                }

                if (Math.abs(angleDiff) < 0.15 && this.tank.reloadTime <= 0) {
                    if (this.hasLineOfSight()) {
                        this.tank.shoot();
                    }
                }

                this.tank.x = Math.max(this.tank.width/2, Math.min(canvas.width - this.tank.width/2, this.tank.x));
                this.tank.y = Math.max(this.tank.height/2, Math.min(canvas.height - this.tank.height/2, this.tank.y));
            }

            hasLineOfSight() {
                let dx = this.target.x - this.tank.x;
                let dy = this.target.y - this.tank.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 400) return false;
                
                let steps = Math.floor(dist / 20);
                for (let i = 1; i < steps; i++) {
                    let checkX = this.tank.x + (dx / steps) * i;
                    let checkY = this.tank.y + (dy / steps) * i;
                    if (checkObstacleCollision(checkX, checkY, 5)) return false;
                }
                return true;
            }

            decideAction() {
                let dist = Math.sqrt(
                    (this.tank.x - this.target.x)**2 + 
                    (this.tank.y - this.target.y)**2
                );
                if (dist < 150) {
                    this.currentAction = Math.random() > 0.5 ? 'retreat' : 'strafe_left';
                } else if (dist > 300) {
                    this.currentAction = 'move';
                } else {
                    let actions = ['strafe_left', 'strafe_right', 'move'];
                    this.currentAction = actions[Math.floor(Math.random() * actions.length)];
                }
            }
        }

        let player1, player2, bot;
        let keys = {};

        function selectMode(mode) {
            gameMode = mode;
            homeScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            victoryOverlay.style.display = 'none';
            gameEnded = false;
            startGame(mode);
        }

        function goToHome() {
            gameRunning = false;
            player1 = null;
            player2 = null;
            bot = null;
            gameScreen.style.display = 'none';
            homeScreen.style.display = 'block';
            victoryOverlay.style.display = 'none';
            gameEnded = false;
            gameInfo.textContent = 'Wähle einen Spielmodus';
        }

        function restartGame() {
            victoryOverlay.style.display = 'none';
            gameEnded = false;
            startGame(gameMode);
        }

        function startGame(mode) {
            gameRunning = true;
            gameEnded = false;
            victoryOverlay.style.display = 'none';
            
            player1 = new Tank(150, 275, '#4a8b2e', {
                forward: 'w',
                backward: 's',
                left: 'a',
                right: 'd',
                shoot: ' '
            }, 'Spieler 1');

            if (mode === 'pvp') {
                player2 = new Tank(750, 275, '#8b4513', {
                    forward: 'ArrowUp',
                    backward: 'ArrowDown',
                    left: 'ArrowLeft',
                    right: 'ArrowRight',
                    shoot: 'Enter'
                }, 'Spieler 2');
                bot = null;
                gameInfo.textContent = '👥 P1: WASD + Space | P2: Pfeiltasten + Enter';
            } else {
                player2 = new Tank(750, 275, '#8b4513', {}, 'Bot');
                bot = new Bot(player2, player1);
                gameInfo.textContent = '🤖 Du: WASD + Space | Bot: KI-gesteuert';
            }
        }

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function drawBackground() {
            let grassGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grassGradient.addColorStop(0, '#7ec850');
            grassGradient.addColorStop(1, '#5a9e2f');
            ctx.fillStyle = grassGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#6ab840';
            for (let i = 0; i < 300; i++) {
                let gx = Math.random() * canvas.width;
                let gy = Math.random() * canvas.height;
                ctx.fillRect(gx, gy, 2, 8 + Math.random() * 6);
            }
        }

        function drawObstacles() {
            for (let obs of obstacles) {
                if (obs.type === 'tree') {
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.arc(obs.x + 2, obs.y + 2, obs.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#2d5016';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#3a6b1e';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#4a8b2e';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius * 0.55, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#5a9b3e';
                    for (let i = 0; i < 5; i++) {
                        let angle = (i / 5) * Math.PI * 2;
                        let dotX = obs.x + Math.cos(angle) * obs.radius * 0.5;
                        let dotY = obs.y + Math.sin(angle) * obs.radius * 0.5;
                        ctx.beginPath();
                        ctx.arc(dotX, dotY, obs.radius * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                } else if (obs.type === 'rock') {
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fillRect(obs.x - obs.width/2 + 3, obs.y - obs.height/2 + 3, obs.width, obs.height);
                    
                    ctx.fillStyle = '#808080';
                    ctx.fillRect(obs.x - obs.width/2, obs.y - obs.height/2, obs.width, obs.height);
                    
                    ctx.fillStyle = '#999';
                    ctx.beginPath();
                    ctx.arc(obs.x - obs.width/4, obs.y - obs.height/4, obs.width * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x - obs.width/2, obs.y - obs.height/2, obs.width, obs.height);
                    
                    ctx.strokeStyle = '#777';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(obs.x - obs.width/3, obs.y - obs.height/3);
                    ctx.lineTo(obs.x + obs.width/4, obs.y + obs.height/4);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width/4, obs.y - obs.height/4);
                    ctx.lineTo(obs.x - obs.width/3, obs.y + obs.height/3);
                    ctx.stroke();
                    
                } else if (obs.type === 'bush') {
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.arc(obs.x + 2, obs.y + 2, obs.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#3a6b1e';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#4a8b2e';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#5a9b3e';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function drawHUD() {
            if (!player1 || !player2) return;
            
            ctx.fillStyle = '#333';
            ctx.fillRect(20, 20, 200, 20);
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(20, 20, 200 * (player1.hp/player1.maxHp), 20);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px Arial';
            ctx.fillText(`Spieler 1: ${Math.max(0, Math.round(player1.hp))} HP`, 25, 35);

            ctx.fillStyle = '#333';
            ctx.fillRect(canvas.width - 220, 20, 200, 20);
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(canvas.width - 220, 20, 200 * (player2.hp/player2.maxHp), 20);
            ctx.fillStyle = 'white';
            ctx.fillText(`${gameMode === 'pvp' ? 'Spieler 2' : 'Bot'}: ${Math.max(0, Math.round(player2.hp))} HP`, canvas.width - 215, 35);

            if (player1.reloadTime > 0) {
                ctx.fillStyle = 'rgba(255,215,0,0.7)';
                ctx.font = '12px Arial';
                ctx.fillText('Lädt nach...', 20, 55);
            }
            if (gameMode === 'pvp' && player2.reloadTime > 0) {
                ctx.fillStyle = 'rgba(255,215,0,0.7)';
                ctx.fillText('Lädt nach...', canvas.width - 120, 55);
            }
        }

        function showVictory(winner) {
            gameRunning = false;
            gameEnded = true;
            victoryOverlay.style.display = 'block';
            victoryText.textContent = `🏆 ${winner} hat gewonnen! 🏆`;
            if (gameMode === 'bot' && winner === 'Spieler 1') {
                victorySubtext.textContent = 'Du hast den Bot besiegt!';
            } else if (gameMode === 'bot') {
                victorySubtext.textContent = 'Der Bot war stärker. Versuche es erneut!';
            } else {
                victorySubtext.textContent = 'Großartiges Duell!';
            }
        }

        function checkWin() {
            if (player1.hp <= 0) {
                let winner = gameMode === 'pvp' ? 'Spieler 2' : 'Bot';
                gameInfo.textContent = `🎉 ${winner} hat gewonnen!`;
                showVictory(winner);
            } else if (player2.hp <= 0) {
                gameInfo.textContent = '🎉 Spieler 1 hat gewonnen!';
                showVictory('Spieler 1');
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawObstacles();

            if (gameRunning && player1 && player2) {
                player1.move(keys);
                player1.updateBullets();
                
                if (bot) {
                    bot.update();
                } else {
                    player2.move(keys);
                }
                player2.updateBullets();

                player1.checkCollision(player2);
                player2.checkCollision(player1);

                checkWin();
            }

            if (player1) player1.draw(ctx);
            if (player2) player2.draw(ctx);
            drawHUD();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
