<script>
window.onerror=(m,u,l)=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#900;color:#fff;padding:8px;font:14px monospace';d.textContent='Fehler: '+m+' (Zeile '+l+')';document.body.appendChild(d)};
function boot(){
const T=THREE,$=id=>document.getElementById(id);
const HOR=new T.Color(.98,.76,.58),SUN=new T.Vector3(.35,.15,-.9).normalize();
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(ren.domElement);
const scene=new T.Scene();scene.fog=new T.Fog(HOR,2500,14000);
const cam=new T.PerspectiveCamera(60,1,1,30000);
scene.add(new T.HemisphereLight(0xa8c4f0,0x45566a,.75));
const dl=new T.DirectionalLight(0xffd7a2,1.5);dl.position.copy(SUN).multiplyScalar(1000);scene.add(dl);
// Himmel
const sky=new T.Mesh(new T.SphereGeometry(15000,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:SUN}},
vertexShader:'varying vec3 d;void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'varying vec3 d;uniform vec3 sun;void main(){vec3 n=normalize(d);float h=clamp(n.y,0.,1.);vec3 c=mix(vec3(.98,.76,.58),vec3(.2,.42,.78),pow(h,.45));float s=max(dot(n,sun),0.);c+=vec3(1.,.85,.6)*(pow(s,900.)*4.+pow(s,14.)*.4+pow(s,3.)*.12);gl_FragColor=vec4(c,1.);}'}));
sky.renderOrder=-1;scene.add(sky);
// Ozean
const ocean=new T.Mesh(new T.PlaneGeometry(60000,60000).rotateX(-Math.PI/2),new T.ShaderMaterial({uniforms:{t:{value:0},sun:{value:SUN},cp:{value:new T.Vector3()}},
vertexShader:'varying vec3 w;void main(){vec4 p=modelMatrix*vec4(position,1.);w=p.xyz;gl_Position=projectionMatrix*viewMatrix*p;}',
fragmentShader:`varying vec3 w;uniform float t;uniform vec3 sun,cp;
void main(){vec2 p=w.xz;vec3 V=cp-w;float dist=length(V);V/=dist;vec2 g=vec2(0.);float h=0.;
for(int i=0;i<5;i++){float fi=float(i);vec2 dr=vec2(cos(fi*2.4+.3),sin(fi*2.4+.3));float k=.012*pow(1.6,fi);float ph=dot(dr,p)*k+t*sqrt(k*9.8);float a=.55/(1.+fi*.6);g+=dr*cos(ph)*a;h+=sin(ph)*a;}
g/=1.+dist*.00035;vec3 N=normalize(vec3(-g.x,1.,-g.y));float fr=pow(1.-max(dot(N,V),0.),4.)*.85+.05;vec3 R=reflect(-V,N);
vec3 sk=mix(vec3(.98,.76,.58),vec3(.2,.42,.78),clamp(R.y*1.6,0.,1.));float s=max(dot(R,sun),0.);sk+=vec3(1.,.8,.5)*(pow(s,350.)*5.+pow(s,25.)*.35);
vec3 deep=mix(vec3(.01,.1,.2),vec3(.03,.35,.42),clamp(h*.25+.35,0.,1.)*max(N.y-.6,0.)*2.5);
vec3 c=mix(deep,sk,fr);c+=vec3(.9,.97,1.)*smoothstep(1.55,2.2,h)*.18/(1.+dist*.0002);
c=mix(c,vec3(.98,.76,.58),smoothstep(2500.,14000.,dist));gl_FragColor=vec4(c,1.);}`}));
scene.add(ocean);
// Rauschen & Inseln
const hs=(x,y)=>{let s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
