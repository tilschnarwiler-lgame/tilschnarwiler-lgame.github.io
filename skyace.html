<script>
window.onerror=(m,u,l)=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#900;color:#fff;padding:8px;font:14px monospace';d.textContent='Fehler: '+m+' (Zeile '+l+')';document.body.appendChild(d)};
function boot(){
const T=THREE,$=id=>document.getElementById(id);
const HOR=new T.Color(.98,.76,.58),SUN=new T.Vector3(.35,.15,-.9).normalize();
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(ren.domElement);
const scene=new T.Scene();scene.fog=new T.Fog(HOR,2500,14000);
const cam=new T.PerspectiveCamera(60,1,1,30000);
scene.add(new T.HemisphereLight(0xa8c4f0,0x45566a,.75));
const dl=new T.DirectionalLight(0xffd7a2,1.5);dl.position.copy(SUN).multiplyScalar(1000);scene.add(dl);
// Himmel
const sky=new T.Mesh(new T.SphereGeometry(15000,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:SUN}},
vertexShader:'varying vec3 d;void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'varying vec3 d;uniform vec3 sun;void main(){vec3 n=normalize(d);float h=clamp(n.y,0.,1.);vec3 c=mix(vec3(.98,.76,.58),vec3(.2,.42,.78),pow(h,.45));float s=max(dot(n,sun),0.);c+=vec3(1.,.85,.6)*(pow(s,900.)*4.+pow(s,14.)*.4+pow(s,3.)*.12);gl_FragColor=vec4(c,1.);}'}));
sky.renderOrder=-1;scene.add(sky);
// Ozean
const ocean=new T.Mesh(new T.PlaneGeometry(60000,60000).rotateX(-Math.PI/2),new T.ShaderMaterial({uniforms:{t:{value:0},sun:{value:SUN},cp:{value:new T.Vector3()}},
vertexShader:'varying vec3 w;void main(){vec4 p=modelMatrix*vec4(position,1.);w=p.xyz;gl_Position=projectionMatrix*viewMatrix*p;}',
fragmentShader:`varying vec3 w;uniform float t;uniform vec3 sun,cp;
void main(){vec2 p=w.xz;vec3 V=cp-w;float dist=length(V);V/=dist;vec2 g=vec2(0.);float h=0.;
for(int i=0;i<5;i++){float fi=float(i);vec2 dr=vec2(cos(fi*2.4+.3),sin(fi*2.4+.3));float k=.012*pow(1.6,fi);float ph=dot(dr,p)*k+t*sqrt(k*9.8);float a=.55/(1.+fi*.6);g+=dr*cos(ph)*a;h+=sin(ph)*a;}
g/=1.+dist*.00035;vec3 N=normalize(vec3(-g.x,1.,-g.y));float fr=pow(1.-max(dot(N,V),0.),4.)*.85+.05;vec3 R=reflect(-V,N);
vec3 sk=mix(vec3(.98,.76,.58),vec3(.2,.42,.78),clamp(R.y*1.6,0.,1.));float s=max(dot(R,sun),0.);sk+=vec3(1.,.8,.5)*(pow(s,350.)*5.+pow(s,25.)*.35);
vec3 deep=mix(vec3(.01,.1,.2),vec3(.03,.35,.42),clamp(h*.25+.35,0.,1.)*max(N.y-.6,0.)*2.5);
vec3 c=mix(deep,sk,fr);c+=vec3(.9,.97,1.)*smoothstep(1.55,2.2,h)*.18/(1.+dist*.0002);
c=mix(c,vec3(.98,.76,.58),smoothstep(2500.,14000.,dist));gl_FragColor=vec4(c,1.);}`}));
scene.add(ocean);
// Rauschen & Inseln
const hs=(x,y)=>{let s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
const vn=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx*=fx*(3-2*fx);fy*=fy*(3-2*fy);const a=hs(ix,iy),b=hs(ix+1,iy),c=hs(ix,iy+1),d=hs(ix+1,iy+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
const fbm=(x,y)=>{let v=0,a=.5;for(let i=0;i<5;i++){v+=a*vn(x,y);x*=2.03;y*=2.03;a*=.5}return v};
const terr=(I,x,z)=>{const d=Math.hypot(x,z)/I.R,e=1-d*(.8+.6*vn(x*.004+I.s,z*.004+I.s));if(e<=0)return -8;return Math.max(-8,I.H*Math.pow(e,1.3)*(.45+fbm(x*.006+I.s,z*.006+I.s*1.7)*1.1)-4)};
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const isl=[],shTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(90,235,205,.9)');g.addColorStop(.55,'rgba(70,225,205,.7)');g.addColorStop(1,'rgba(60,210,215,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)})();
const treeGs=[new T.CylinderGeometry(.6,.9,5,6).translate(0,2.5,0),new T.ConeGeometry(5,11,8).translate(0,10,0),new T.ConeGeometry(3.4,9,8).translate(0,15.5,0)],treeM=new T.MeshLambertMaterial({color:0xffffff});
const lm=new T.MeshLambertMaterial({vertexColors:true}),tmp=new T.Matrix4(),col=new T.Color();
for(let n=0;n<12;n++){
 const I=n?{x:(rnd()-.5)*11600,z:(rnd()-.5)*11600,R:350+rnd()*550,H:70+rnd()*120,s:rnd()*100}:{x:500,z:-2000,R:520,H:150,s:3.3};
 if(n&&Math.hypot(I.x,I.z)<1500){I.x+=2500;}
 const gr=new T.Group(),S=I.R*2.3,N=84,geo=new T.PlaneGeometry(S,S,N,N).rotateX(-Math.PI/2),P=geo.attributes.position,C=new Float32Array(P.count*3);
 for(let i=0;i<P.count;i++){const x=P.getX(i),z=P.getZ(i),h=terr(I,x,z),nz=vn(x*.05,z*.05);P.setY(i,h);
  if(h<1.5)col.setRGB(.88,.8,.57);else if(h<5)col.setRGB(.88,.8,.57).lerp(new T.Color(.3,.52,.2),(h-1.5)/3.5);
  else if(h<I.H*.5)col.setRGB(.26+nz*.1,.48+nz*.1,.18);else if(h<I.H*.8)col.setRGB(.36,.34,.29).lerp(new T.Color(.5,.47,.44),nz);else col.setRGB(.9,.92,.95);
  if(h>=1.5&&h<I.H*.5&&nz>.75)col.multiplyScalar(.82);col.toArray(C,i*3)}
 geo.setAttribute('color',new T.BufferAttribute(C,3));geo.computeVertexNormals();gr.add(new T.Mesh(geo,lm));
 const ring=new T.Mesh(new T.CircleGeometry(I.R*1.5,48).rotateX(-Math.PI/2),new T.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false,fog:false,polygonOffset:true,polygonOffsetFactor:-4}));ring.position.y=1;gr.add(ring);
 const trs=treeGs.map(g=>new T.InstancedMesh(g,treeM,200));let k=0;
 for(let a=0;a<1500&&k<200;a++){const x=(rnd()-.5)*I.R*2,z=(rnd()-.5)*I.R*2,h=terr(I,x,z);if(h>4&&h<I.H*.45){const sc=.7+rnd()*.8,gv=rnd();tmp.makeRotationY(rnd()*6.28).scale(new T.Vector3(sc,sc*(.85+rnd()*.4),sc)).setPosition(x,h-1,z);trs.forEach((m,j)=>{m.setMatrixAt(k,tmp);m.setColorAt(k,j?col.setRGB(.08+gv*.1,.3+gv*.15,.1):col.setRGB(.3,.2,.12))});k++}}
 trs.forEach(m=>{m.count=k;gr.add(m)});scene.add(gr);I.g=gr;isl.push(I)}
const wrp=v=>(((v+6000)%12000)+12000)%12000-6000;
const groundAt=(x,z)=>{let m=0;for(const I of isl){const lx=x-I.px,lz=z-I.pz;if(Math.abs(lx)<I.R*1.1&&Math.abs(lz)<I.R*1.1)m=Math.max(m,terr(I,lx,lz))}return m};
// Wolken
const cTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,248,240,.85)');g.addColorStop(1,'rgba(255,235,220,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)})();
const clouds=[];for(let i=0;i<30;i++){const g=new T.Group(),sc=300+rnd()*500;for(let j=0;j<4;j++){const s=new T.Sprite(new T.SpriteMaterial({map:cTex,transparent:true,depthWrite:false,opacity:.5+rnd()*.4}));s.scale.set(sc*(.7+rnd()),sc*(.3+rnd()*.3),1);s.position.set((rnd()-.5)*sc*1.6,(rnd()-.5)*sc*.15,(rnd()-.5)*sc*.6);g.add(s)}
 g.userData={x:(rnd()-.5)*14000,z:(rnd()-.5)*14000,y:450+rnd()*600};scene.add(g);clouds.push(g)}
