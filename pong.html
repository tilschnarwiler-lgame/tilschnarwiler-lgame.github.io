<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PONG</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan:   #00ffe7;
    --pink:   #ff1a1a;
    --yellow: #ffe600;
    --dark:   #04060f;
  }

  body {
    background: var(--dark);
    color: white;
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── CRT wrapper ── */
  #crt {
    position: relative;
    width: 820px;
    height: 540px;
  }

  /* Scanlines overlay */
  #crt::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.22) 3px,
      rgba(0,0,0,0.22) 4px
    );
    pointer-events: none;
    z-index: 10;
    border-radius: 14px;
  }

  /* CRT vignette */
  #crt::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 55%,
      rgba(0,0,0,0.75) 100%
    );
    pointer-events: none;
    z-index: 11;
    border-radius: 14px;
  }

  canvas#game {
    display: block;
    width: 820px;
    height: 540px;
    border-radius: 14px;
    border: 2px solid rgba(0,255,231,0.25);
    box-shadow:
      0 0 0 1px rgba(0,255,231,0.08),
      0 0 40px rgba(0,255,231,0.15),
      0 0 100px rgba(0,255,231,0.07),
      inset 0 0 80px rgba(0,0,0,0.6);
  }

  /* ── MENU ── */
  #menu {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    background: rgba(4,6,15,0.82);
    backdrop-filter: blur(6px);
    border-radius: 14px;
  }

  #menu .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 18px;
    color: var(--cyan);
    text-shadow:
      0 0 10px var(--cyan),
      0 0 40px var(--cyan),
      0 0 80px rgba(0,255,231,0.4);
    animation: flicker 4s infinite;
    margin-bottom: 10px;
  }

  #menu .subtitle {
    font-size: 11px;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 50px;
    text-transform: uppercase;
  }

  .menu-btn {
    position: relative;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    color: white;
    background: transparent;
    border: 1px solid rgba(0,255,231,0.35);
    padding: 14px 48px;
    margin: 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    border-radius: 4px;
  }

  .menu-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,255,231,0.08), rgba(255,45,120,0.08));
    opacity: 0;
    transition: opacity 0.15s;
    border-radius: 4px;
  }

  .menu-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 20px rgba(0,255,231,0.3);
    text-shadow: 0 0 10px var(--cyan);
    transform: scale(1.04);
  }

  .menu-btn:hover::before { opacity: 1; }

  /* ── BACK BUTTON ── */
  #backBtn {
    position: absolute;
    top: -44px;
    left: 0;
    z-index: 25;
    display: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 14px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
    letter-spacing: 2px;
  }

  #backBtn:hover {
    color: white;
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
  }

  /* ── GAME OVER ── */
  #gameOverScreen {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(4,6,15,0.88);
    backdrop-filter: blur(8px);
    border-radius: 14px;
  }

  #resultText {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    margin-bottom: 12px;
    animation: resultPulse 1s infinite alternate;
  }

  .result-sub {
    font-size: 11px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 44px;
    text-transform: uppercase;
  }

  @keyframes resultPulse {
    from { text-shadow: 0 0 10px currentColor, 0 0 30px currentColor; }
    to   { text-shadow: 0 0 20px currentColor, 0 0 60px currentColor, 0 0 100px currentColor; }
  }

  @keyframes flicker {
    0%,19%,21%,23%,25%,54%,56%,100% { opacity:1; }
    20%,24%,55% { opacity:0.7; }
  }

  /* Starfield bg */
  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  #crt { z-index: 1; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="crt">
  <canvas id="game" width="820" height="540"></canvas>

  <button id="backBtn" onclick="goMenu()">← BACK</button>

  <div id="menu">
    <div class="logo">PONG</div>
    <div class="subtitle">Insert coin to play</div>
    <button class="menu-btn" onclick="startGame(1)">1 PLAYER</button>
    <button class="menu-btn" onclick="startGame(2)">2 PLAYER</button>
    <button class="menu-btn" style="border-color:rgba(255,230,0,0.35)" onclick="startTraining()">TRAINING</button>
  </div>

  <div id="gameOverScreen">
    <div id="resultText"></div>
    <div class="result-sub" id="resultSub"></div>
    <button class="menu-btn" onclick="restartGame()">PLAY AGAIN</button>
    <button class="menu-btn" style="border-color:rgba(255,45,120,0.35)" onclick="goMenu()">MENU</button>
  </div>
</div>

<script>
/* ══════════════ STARFIELD BG ══════════════ */
const bgC = document.getElementById('bgCanvas');
const bgX = bgC.getContext('2d');
let stars = [];

function resizeBG() {
  bgC.width = window.innerWidth;
  bgC.height = window.innerHeight;
  stars = Array.from({length: 180}, () => ({
    x: Math.random() * bgC.width,
    y: Math.random() * bgC.height,
    r: Math.random() * 1.2,
    sp: Math.random() * 0.3 + 0.05,
    op: Math.random()
  }));
}
window.addEventListener('resize', resizeBG);
resizeBG();

(function bgLoop() {
  bgX.fillStyle = 'rgba(4,6,15,0.4)';
  bgX.fillRect(0, 0, bgC.width, bgC.height);
  for (const s of stars) {
    s.op += (Math.random() - 0.5) * 0.04;
    s.op = Math.max(0.05, Math.min(0.8, s.op));
    bgX.fillStyle = `rgba(180,220,255,${s.op})`;
    bgX.beginPath();
    bgX.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgX.fill();
  }
  requestAnimationFrame(bgLoop);
})();

/* ══════════════ GAME ══════════════ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 820, H = 540;

let mode = 0, ball = null, left, right;
let score1 = 0, score2 = 0, gameOver = false;
let keys = {};
let hitParticles = [];
let scoreFlash = { l: 0, r: 0 };
let trails = [];

// Training mode
let trainingScore = 0;
let trainingHigh = parseInt(localStorage.getItem('pong_training_hs') || '0');
let trainingScoreFlash = 0;

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup',   e => keys[e.key] = false);
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))
    e.preventDefault();
}, { passive: false });

/* ── Particles ── */
function spawnHit(x, y, color) {
  for (let i = 0; i < 22; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1.5;
    hitParticles.push({
      x, y,
      dx: Math.cos(angle) * speed,
      dy: Math.sin(angle) * speed,
      life: 1,
      color,
      r: Math.random() * 3 + 1
    });
  }
}

/* ── Trail ── */
function addTrail(x, y) {
  trails.push({ x, y, life: 1 });
  if (trails.length > 28) trails.shift();
}

/* ── Start ── */
function startGame(m) {
  mode = m;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('backBtn').style.display = 'block';
  score1 = score2 = 0;
  gameOver = false;
  hitParticles = [];
  trails = [];
  left  = { x: 22, y: 220 };
  right = { x: 788, y: 220 };
  resetBall();
}

function resetBall() {
  trails = [];
  ball = {
    x: W / 2, y: H / 2,
    dx: (Math.random() > 0.5 ? 3.2 : -3.2),
    dy: (Math.random() * 3 - 1.5)
  };
}

function goMenu() {
  mode = 0; ball = null;
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
}

function restartGame() { mode === 3 ? startTraining() : startGame(mode); }

function startTraining() {
  mode = 3;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('backBtn').style.display = 'block';
  trainingScore = 0;
  gameOver = false;
  hitParticles = [];
  trails = [];
  left = { x: 22, y: 220 };
  resetBallTraining();
}

function resetBallTraining() {
  trails = [];
  // Always launch toward player first
  ball = {
    x: W / 2, y: H / 2,
    dx: -3.2,
    dy: (Math.random() * 3 - 1.5)
  };
}

/* ══════════════ UPDATE ══════════════ */
function update() {
  if (!ball || mode === 0 || gameOver) return;

  /* ── TRAINING MODE ── */
  if (mode === 3) {
    const spd = 6.5;
    if (keys['ArrowUp'] || keys['w']) left.y -= spd;
    if (keys['ArrowDown'] || keys['s']) left.y += spd;
    left.y = Math.max(0, Math.min(H - 110, left.y));

    addTrail(ball.x, ball.y);
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Top/bottom walls
    if (ball.y <= 6)     { ball.dy = Math.abs(ball.dy) * 1.1; ball.dx *= 1.1; ball.dx = Math.min(Math.abs(ball.dx), 15) * Math.sign(ball.dx); spawnHit(ball.x, 6, '#fff'); }
    if (ball.y >= H - 6) { ball.dy = -Math.abs(ball.dy) * 1.1; ball.dx *= 1.1; ball.dx = Math.min(Math.abs(ball.dx), 15) * Math.sign(ball.dx); spawnHit(ball.x, H - 6, '#fff'); }

    // Right wall
    if (ball.x >= W - 7) {
      ball.dx = -Math.abs(ball.dx) * 1.1;
      ball.dx = Math.max(ball.dx, -15);
      ball.x = W - 7;
      spawnHit(W - 7, ball.y, '#ffe600');
    }

    // Left paddle hit
    if (ball.x < left.x + 14 && ball.x > left.x - 4 &&
        ball.y > left.y - 6 && ball.y < left.y + 110 + 6) {
      const hit = (ball.y - left.y) / 110;
      ball.dx = Math.min(Math.abs(ball.dx) * 1.18, 18);
      ball.dy = (hit - 0.5) * 11;
      ball.x = left.x + 14;
      trainingScore++;
      trainingScoreFlash = 1;
      if (trainingScore > trainingHigh) {
        trainingHigh = trainingScore;
        localStorage.setItem('pong_training_hs', trainingHigh);
      }
      spawnHit(ball.x, ball.y, '#00ffe7');
    }

    // Ball exits left → game over
    if (ball.x < -10) {
      gameOver = true;
      const go = document.getElementById('gameOverScreen');
      go.style.display = 'flex';
      document.getElementById('resultText').textContent = 'GAME OVER';
      document.getElementById('resultText').style.color = 'var(--pink)';
      document.getElementById('resultSub').textContent = `SCORE: ${trainingScore}  |  BEST: ${trainingHigh}`;
    }

    // Particles & trail decay
    for (const p of hitParticles) {
      p.x += p.dx; p.y += p.dy;
      p.dy += 0.08; p.dx *= 0.97;
      p.life -= 0.035;
    }
    hitParticles = hitParticles.filter(p => p.life > 0);
    trainingScoreFlash = Math.max(0, trainingScoreFlash - 0.06);
    for (const t of trails) t.life -= 0.06;
    trails = trails.filter(t => t.life > 0);
    return;
  }

  if (score1 >= 7 || score2 >= 7) {
    gameOver = true;
    const go = document.getElementById('gameOverScreen');
    go.style.display = 'flex';
    const win1 = score1 >= 7;
    document.getElementById('resultText').textContent =
      mode === 1 ? (win1 ? 'YOU WIN' : 'YOU LOSE') : (win1 ? 'P1 WINS' : 'P2 WINS');
    document.getElementById('resultText').style.color =
      win1 ? 'var(--cyan)' : 'var(--pink)';
    document.getElementById('resultSub').textContent = `${score1}  —  ${score2}`;
    return;
  }

  /* Controls */
  const spd = 6.5;
  if (mode === 1) {
    if (keys['ArrowUp'] || keys['w']) left.y -= spd;
    if (keys['ArrowDown'] || keys['s']) left.y += spd;
    right.y += (ball.y - right.y - 50) * 0.075;
  } else {
    if (keys['w'])          left.y  -= spd;
    if (keys['s'])          left.y  += spd;
    if (keys['ArrowUp'])    right.y -= spd;
    if (keys['ArrowDown'])  right.y += spd;
  }

  left.y  = Math.max(0, Math.min(H - 110, left.y));
  right.y = Math.max(0, Math.min(H - 110, right.y));

  addTrail(ball.x, ball.y);

  ball.x += ball.dx;
  ball.y += ball.dy;

  /* Wall bounce */
  if (ball.y <= 6)       { ball.dy =  Math.abs(ball.dy) * 1.1; ball.dx *= 1.1; ball.dx = Math.min(Math.abs(ball.dx), 13) * Math.sign(ball.dx); spawnHit(ball.x, 6, '#fff'); }
  if (ball.y >= H - 6)   { ball.dy = -Math.abs(ball.dy) * 1.1; ball.dx *= 1.1; ball.dx = Math.min(Math.abs(ball.dx), 13) * Math.sign(ball.dx); spawnHit(ball.x, H - 6, '#fff'); }

  /* Left paddle */
  if (ball.x < left.x + 14 && ball.x > left.x &&
      ball.y > left.y - 6 && ball.y < left.y + 110 + 6) {
    const hit = (ball.y - left.y) / 110;
    ball.dx = Math.min(Math.abs(ball.dx) * 1.18, 16);
    ball.dy = (hit - 0.5) * 9;
    ball.x = left.x + 14;
    spawnHit(ball.x, ball.y, '#00ffe7');
  }

  /* Right paddle */
  if (ball.x > right.x - 14 && ball.x < right.x + 14 &&
      ball.y > right.y - 6 && ball.y < right.y + 110 + 6) {
    const hit = (ball.y - right.y) / 110;
    ball.dx = -Math.min(Math.abs(ball.dx) * 1.18, 16);
    ball.dy = (hit - 0.5) * 9;
    ball.x = right.x - 14;
    spawnHit(ball.x, ball.y, '#ff1a1a');
  }

  /* Score */
  if (ball.x < -10) { score2++; scoreFlash.r = 1; resetBall(); }
  if (ball.x > W + 10) { score1++; scoreFlash.l = 1; resetBall(); }

  /* Update particles */
  for (const p of hitParticles) {
    p.x += p.dx;
    p.y += p.dy;
    p.dy += 0.08;
    p.dx *= 0.97;
    p.life -= 0.035;
  }
  hitParticles = hitParticles.filter(p => p.life > 0);

  /* Flash decay */
  scoreFlash.l = Math.max(0, scoreFlash.l - 0.05);
  scoreFlash.r = Math.max(0, scoreFlash.r - 0.05);

  /* Trail decay */
  for (const t of trails) t.life -= 0.06;
  trails = trails.filter(t => t.life > 0);
}

/* ══════════════ DRAW ══════════════ */
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (mode === 0) return;

  /* Court background */
  ctx.fillStyle = '#04080f';
  ctx.fillRect(0, 0, W, H);

  /* ── TRAINING DRAW ── */
  if (mode === 3) {
    // Grid
    ctx.strokeStyle = 'rgba(255,230,0,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // Right wall
    const wGrad = ctx.createLinearGradient(W - 18, 0, W, 0);
    wGrad.addColorStop(0, 'rgba(255,230,0,0)');
    wGrad.addColorStop(1, 'rgba(255,230,0,0.18)');
    ctx.fillStyle = wGrad;
    ctx.fillRect(W - 18, 0, 18, H);

    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ffe600';
    ctx.strokeStyle = '#ffe600';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W - 3, 0);
    ctx.lineTo(W - 3, H);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Score top-left
    ctx.textAlign = 'left';
    ctx.font = '900 52px Orbitron, monospace';
    const sc = trainingScoreFlash > 0 ? 1 : 1;
    ctx.fillStyle = `#00ffe7`;
    ctx.shadowColor = '#00ffe7';
    ctx.shadowBlur = trainingScoreFlash > 0 ? 50 : 22;
    ctx.fillText(trainingScore, 22, 62);
    ctx.shadowBlur = 0;
    ctx.font = '700 11px Orbitron, monospace';
    ctx.fillStyle = 'rgba(0,255,231,0.55)';
    ctx.fillText('SCORE', 22, 80);

    // High score top-right
    ctx.textAlign = 'right';
    ctx.font = '900 52px Orbitron, monospace';
    ctx.fillStyle = '#ffe600';
    ctx.shadowColor = '#ffe600';
    ctx.shadowBlur = 22;
    ctx.fillText(trainingHigh, W - 22, 62);
    ctx.shadowBlur = 0;
    ctx.font = '700 11px Orbitron, monospace';
    ctx.fillStyle = 'rgba(255,230,0,0.55)';
    ctx.fillText('BEST', W - 22, 80);

    // Trail
    for (const t of trails) {
      ctx.globalAlpha = t.life * 0.35;
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#ffe600';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 6 * t.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // Ball
    if (ball) {
      ctx.shadowBlur = 28; ctx.shadowColor = 'white'; ctx.fillStyle = 'white';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#fffde0';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 3, 0, Math.PI * 2); ctx.fill();
    }

    // Particles
    for (const p of hitParticles) {
      ctx.globalAlpha = p.life * 0.9;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    // Player paddle
    drawPaddle(left.x, left.y, '#00ffe7');
    return;
  }

  /* Subtle grid */
  ctx.strokeStyle = 'rgba(0,255,231,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  /* Center line */
  ctx.setLineDash([6, 10]);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  /* Center circle */
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2);
  ctx.stroke();

  /* ── SCORE ── */
  ctx.font = '900 58px Orbitron, monospace';
  ctx.textAlign = 'center';

  // P1 score
  ctx.fillStyle = scoreFlash.l > 0 ? `rgba(0,255,231,1)` : 'rgba(0,255,231,0.75)';
  ctx.shadowColor = '#00ffe7';
  ctx.shadowBlur = scoreFlash.l > 0 ? 50 : 18;
  ctx.fillText(score1, W / 2 - 80, 70);

  // P2 score
  ctx.fillStyle = scoreFlash.r > 0 ? `rgba(255,26,26,1)` : 'rgba(255,26,26,0.85)';
  ctx.shadowColor = '#ff1a1a';
  ctx.shadowBlur = scoreFlash.r > 0 ? 50 : 18;
  ctx.fillText(score2, W / 2 + 80, 70);
  ctx.shadowBlur = 0;

  /* Labels */
  ctx.font = '11px Orbitron, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillText(mode === 1 ? 'YOU' : 'P1', W / 2 - 80, 90);
  ctx.fillText(mode === 1 ? 'ENEMY' : 'P2', W / 2 + 80, 90);

  /* ── BALL TRAIL ── */
  for (const t of trails) {
    ctx.globalAlpha = t.life * 0.35;
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00ffe7';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 6 * t.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  /* ── BALL ── */
  if (ball) {
    ctx.shadowBlur = 28;
    ctx.shadowColor = 'white';
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
    ctx.fill();

    /* Inner bright core */
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e0ffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ── PARTICLES ── */
  for (const p of hitParticles) {
    ctx.globalAlpha = p.life * 0.9;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  /* ── PADDLES ── */
  drawPaddle(left.x, left.y, '#00ffe7');
  drawPaddle(right.x - 12, right.y, '#ff1a1a');
}

function drawPaddle(x, y, color) {
  const W_P = 12, H_P = 110, R = 6;

  /* Outer glow */
  ctx.shadowBlur = 30;
  ctx.shadowColor = color;

  /* Gradient fill */
  const grad = ctx.createLinearGradient(x, y, x + W_P, y + H_P);
  grad.addColorStop(0,   color);
  grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(1,   color);

  ctx.fillStyle = grad;
  roundRect(ctx, x, y, W_P, H_P, R);
  ctx.fill();

  /* Edge highlight */
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  roundRect(ctx, x + 1, y + 1, W_P - 2, H_P - 2, R - 1);
  ctx.stroke();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.arcTo(x + w, y,     x + w, y + r,     r);
  c.lineTo(x + w, y + h - r);
  c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h);
  c.arcTo(x,     y + h, x,     y + h - r, r);
  c.lineTo(x,     y + r);
  c.arcTo(x,     y,     x + r, y,         r);
  c.closePath();
}

/* ══════════════ LOOP ══════════════ */
(function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
})();
</script>
