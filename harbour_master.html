<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Canal Master</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #0a0f1a;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
overflow: hidden;
font-family: ‘Share Tech Mono’, monospace;
}

#ui-bar {
width: 600px;
display: flex;
justify-content: space-between;
align-items: center;
padding: 8px 16px;
background: rgba(255,255,255,0.04);
border: 1px solid rgba(255,255,255,0.1);
border-bottom: none;
border-radius: 8px 8px 0 0;
}

#score-display {
color: #00e5ff;
font-family: ‘Orbitron’, monospace;
font-size: 14px;
letter-spacing: 2px;
}
#score-val { font-size: 22px; font-weight: 900; color: #fff; }

#title-text {
font-family: ‘Orbitron’, monospace;
font-size: 16px;
font-weight: 700;
color: rgba(255,255,255,0.5);
letter-spacing: 4px;
}

#level-display {
color: #ffcc00;
font-family: ‘Orbitron’, monospace;
font-size: 14px;
letter-spacing: 2px;
text-align: right;
}
#level-val { font-size: 22px; font-weight: 900; color: #fff; }

canvas {
display: block;
cursor: crosshair;
border-radius: 0 0 8px 8px;
}

#overlay {
position: absolute;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 20px;
pointer-events: none;
}

#overlay.active { pointer-events: all; }

.overlay-box {
background: rgba(10,15,26,0.92);
border: 2px solid rgba(0,229,255,0.4);
border-radius: 12px;
padding: 40px 60px;
text-align: center;
backdrop-filter: blur(10px);
box-shadow: 0 0 60px rgba(0,229,255,0.15);
}

.overlay-box h1 {
font-family: ‘Orbitron’, monospace;
font-size: 32px;
font-weight: 900;
color: #00e5ff;
letter-spacing: 6px;
margin-bottom: 10px;
}

.overlay-box h2 {
font-family: ‘Orbitron’, monospace;
font-size: 22px;
color: #ff4444;
letter-spacing: 4px;
margin-bottom: 6px;
}

.overlay-box p {
color: rgba(255,255,255,0.6);
font-size: 13px;
line-height: 1.8;
margin-bottom: 20px;
}

.overlay-box .final-score {
font-family: ‘Orbitron’, monospace;
font-size: 40px;
font-weight: 900;
color: #ffcc00;
margin-bottom: 20px;
}

.btn {
background: #00e5ff;
color: #0a0f1a;
border: none;
padding: 12px 40px;
font-family: ‘Orbitron’, monospace;
font-size: 14px;
font-weight: 700;
letter-spacing: 3px;
border-radius: 6px;
cursor: pointer;
transition: all 0.2s;
}
.btn:hover { background: #fff; transform: scale(1.05); }
</style>

</head>
<body>

<div id="ui-bar">
  <div id="score-display">PUNKTE<br><span id="score-val">0</span></div>
  <div id="title-text">CANAL MASTER</div>
  <div id="level-display">LEVEL<br><span id="level-val">1</span></div>
</div>
<canvas id="gameCanvas" width="600" height="520"></canvas>

<div id="overlay" class="active">
  <div class="overlay-box" id="start-screen">
    <h1>CANAL MASTER</h1>
    <p>
      Ziehe mit der Maus (oder dem Finger) eine<br>
      Linie vom Schiff zum gleichfarbigen Hafen.<br><br>
      <span style="color:#ff9900">■</span> Orange · <span style="color:#ffcc00">■</span> Gelb · <span style="color:#cc44ff">■</span> Violett<br><br>
      Nach dem Entladen das Schiff wieder hinausführen.<br>
      Kollisionen = Game Over!
    </p>
    <button class="btn" onclick="startGame()">STARTEN</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Farben & Häfen ────────────────────────────────────────────────────
const COLORS = {
  orange:  '#ff9900',
  yellow:  '#ffdd00',
  violet:  '#cc44ff'
};

// Hafen-Definitionen: { id, color, x, y, w, h, side }
// Linke Landmasse: x 0..120, volle Höhe
// Violett oben links, Gelb unten links, Orange oben rechts
const HARBOURS = [
  { id:'violet', color:'violet', cx:60, cy:110, r:28, side:'left' },
  { id:'yellow', color:'yellow', cx:60, cy:380, r:28, side:'left' },
  { id:'orange', color:'orange', cx:540, cy:60,  r:28, side:'right' }
];

// Spawn-Zonen: Schiffe kommen von oben, unten oder rechts ins Wasser
const SPAWN_ZONES = [
  { x: 280, y: -30, angle: Math.PI/2 },
  { x: 400, y: -30, angle: Math.PI/2 },
  { x: 500, y: -30, angle: Math.PI/2 },
  { x: 620, y: 200, angle: Math.PI },
  { x: 620, y: 300, angle: Math.PI },
  { x: 280, y: 550, angle: -Math.PI/2 },
  { x: 420, y: 550, angle: -Math.PI/2 },
];

// ── Spielzustand ──────────────────────────────────────────────────────
let ships = [], score = 0, level = 1, gameRunning = false;
let spawnTimer = 0, spawnInterval = 280;
let shipsDelivered = 0;
let draggedShip = null, dragPath = [];
let gameOverFlag = false;
let particles = [];
let flashTimer = 0;

// ── Schiff-Klasse ────────────────────────────────────────────────────
class Ship {
  constructor() {
    this.reset();
  }

  reset() {
    const colorKeys = Object.keys(COLORS);
    this.colorName = colorKeys[Math.floor(Math.random() * colorKeys.length)];

    // Container-Anzahl: Level 1 = 1-2, ab Level 3 = 1-3, ab Level 5 = 1-4, ab 8 = 1-5
    let maxC = 2;
    if (level >= 3) maxC = 3;
    if (level >= 5) maxC = 4;
    if (level >= 8) maxC = 5;
    this.containers = Math.floor(Math.random() * maxC) + 1;
    this.maxContainers = this.containers;

    const sp = SPAWN_ZONES[Math.floor(Math.random() * SPAWN_ZONES.length)];
    this.x = sp.x;
    this.y = sp.y;
    this.angle = sp.angle;
    this.spawnAngle = sp.angle;

    this.speed = 0.8 + level * 0.08;
    this.path = [];
    this.pathIndex = 0;
    this.state = 'entering'; // entering | idle | following | docking | unloading | exiting | done
    this.dockTimer = 0;
    this.harbour = null;
    this.targetExit = null;
    this.w = 36 + this.maxContainers * 6;
    this.h = 18;
    this.id = Math.random();
    this.opacity = 1;
    this.pulseTimer = Math.random() * Math.PI * 2;

    // Schiff fährt automatisch etwas ins Spielfeld hinein
    this.enterTarget = this.getEnterTarget(sp);
  }

  getEnterTarget(sp) {
    if (sp.angle === Math.PI/2)   return { x: sp.x, y: 100 + Math.random() * 80 };
    if (sp.angle === -Math.PI/2)  return { x: sp.x, y: 380 + Math.random() * 80 };
    if (sp.angle === Math.PI)     return { x: 480, y: sp.y };
    return { x: sp.x + 60, y: sp.y };
  }

  update() {
    this.pulseTimer += 0.05;

    // Frozen while player is drawing a route on this ship
    if (this.frozen) return;

    if (this.state === 'entering') {
      const dx = this.enterTarget.x - this.x;
      const dy = this.enterTarget.y - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 3) {
        this.state = 'idle';
        this.x = this.enterTarget.x;
        this.y = this.enterTarget.y;
      } else {
        const s = Math.min(this.speed, dist);
        this.x += (dx / dist) * s;
        this.y += (dy / dist) * s;
        this.angle = Math.atan2(dy, dx);
      }
    }

    if (this.state === 'following') {
      // Check if we've consumed the entire path
      if (this.pathIndex >= this.path.length) {
        if (this.harbour && this.containers > 0) {
          this.state = 'unloading';
          this.dockTimer = 0;
        } else if (this.targetExit) {
          this.state = 'done';
        } else {
          this.state = 'idle';
        }
        this.path = [];
        this.pathIndex = 0;
        return;
      }
      const target = this.path[this.pathIndex];
      const dx = target.x - this.x;
      const dy = target.y - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 5) {
        this.pathIndex++;
      } else {
        const s = Math.min(this.speed * 1.8, dist);
        this.x += (dx / dist) * s;
        this.y += (dy / dist) * s;
        this.angle = Math.atan2(dy, dx);
      }
    }

    if (this.state === 'unloading') {
      this.dockTimer++;
      if (this.dockTimer >= 60) { // 1 Sekunde pro Container
        this.dockTimer = 0;
        this.containers--;
        score++;
        updateUI();
        spawnParticles(this.x, this.y, COLORS[this.colorName], 8);
        if (this.containers <= 0) {
          this.state = 'idle';
          this.harbour = null;
        }
      }
    }

    if (this.state === 'exiting') {
      if (!this.targetExit) { this.state = 'done'; return; }
      const dx = this.targetExit.x - this.x;
      const dy = this.targetExit.y - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 6) {
        this.state = 'done';
      } else {
        const s = Math.min(this.speed * 1.5, dist);
        this.x += (dx / dist) * s;
        this.y += (dy / dist) * s;
        this.angle = Math.atan2(dy, dx);
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.globalAlpha = this.opacity;

    const col = COLORS[this.colorName];
    const pulse = this.state === 'idle' ? 0.15 * Math.sin(this.pulseTimer) : 0;

    // Rumpf
    ctx.beginPath();
    ctx.moveTo(this.w/2, 0);
    ctx.lineTo(this.w/2 - 8, -this.h/2);
    ctx.lineTo(-this.w/2, -this.h/2);
    ctx.lineTo(-this.w/2 - 4, 0);
    ctx.lineTo(-this.w/2, this.h/2);
    ctx.lineTo(this.w/2 - 8, this.h/2);
    ctx.closePath();
    ctx.fillStyle = '#1a2540';
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5 + pulse;
    ctx.stroke();

    // Container
    const cW = 14, cH = 10, gap = 2;
    const totalW = this.maxContainers * (cW + gap) - gap;
    let cx = -totalW/2 + cW/2;
    for (let i = 0; i < this.maxContainers; i++) {
      if (i < this.containers) {
        ctx.fillStyle = col;
        ctx.globalAlpha = this.opacity * 0.9;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.globalAlpha = this.opacity * 0.5;
      }
      ctx.fillRect(cx - cW/2, -cH/2, cW, cH);
      ctx.globalAlpha = this.opacity;
      cx += cW + gap;
    }

    // Unloading-Fortschritt
    if (this.state === 'unloading') {
      const prog = this.dockTimer / 60;
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.8;
      ctx.fillRect(-this.w/2, this.h/2 + 3, this.w * prog, 3);
      ctx.globalAlpha = this.opacity;
    }

    ctx.restore();
  }

  getBounds() {
    return { x: this.x - this.w/2 - 6, y: this.y - this.h/2 - 6, w: this.w + 12, h: this.h + 12 };
  }
}

// ── Partikel ──────────────────────────────────────────────────────────
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, color, life: 1 });
  }
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= 0.03;
    return p.life > 0;
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── Hintergrund / Karte ───────────────────────────────────────────────
function drawBackground() {
  // Wasser
  const waterGrad = ctx.createLinearGradient(0, 0, W, H);
  waterGrad.addColorStop(0, '#0d2137');
  waterGrad.addColorStop(1, '#0a1828');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, 0, W, H);

  // Wasser-Textur (animierte Wellen)
  const t = Date.now() * 0.001;
  ctx.strokeStyle = 'rgba(0,120,200,0.08)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++) {
    ctx.beginPath();
    for (let x = 130; x < W; x += 4) {
      const y = 60 + i * 42 + Math.sin(x * 0.03 + t + i) * 4;
      x === 130 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Linke Landmasse
  const landGrad = ctx.createLinearGradient(0, 0, 120, 0);
  landGrad.addColorStop(0, '#1a3a1a');
  landGrad.addColorStop(1, '#152e15');
  ctx.fillStyle = landGrad;
  ctx.fillRect(0, 0, 120, H);

  // Küstenlinie
  ctx.strokeStyle = 'rgba(80,160,80,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(120, 0);
  ctx.lineTo(120, H);
  ctx.stroke();

  // Gras-Textur auf Land
  ctx.fillStyle = 'rgba(30,80,30,0.3)';
  for (let y = 0; y < H; y += 20) {
    for (let x = 0; x < 120; x += 20) {
      if (Math.sin(x * 7.3 + y * 3.1) > 0.3) ctx.fillRect(x, y, 8, 3);
    }
  }

  // Häfen zeichnen
  HARBOURS.forEach(h => drawHarbour(h));
}

function drawHarbour(h) {
  const col = COLORS[h.color];
  const t = Date.now() * 0.002;
  const pulse = 1 + 0.1 * Math.sin(t + HARBOURS.indexOf(h));

  // Hafenbecken
  ctx.beginPath();
  ctx.arc(h.cx, h.cy, h.r * pulse, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Innerer Kreis
  ctx.beginPath();
  ctx.arc(h.cx, h.cy, h.r * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = col + '33';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Farb-Symbol
  ctx.fillStyle = col;
  ctx.font = 'bold 11px Share Tech Mono';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const label = h.color === 'violet' ? 'V' : h.color === 'yellow' ? 'G' : 'O';
  ctx.fillText(label, h.cx, h.cy);

  // Leuchtfeuer
  ctx.beginPath();
  ctx.arc(h.cx, h.cy, h.r + 8 + pulse * 4, 0, Math.PI * 2);
  ctx.strokeStyle = col + '22';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ── Pfad zeichnen ─────────────────────────────────────────────────────
function drawDragPath() {
  if (!draggedShip || dragPath.length < 2) return;
  const col = COLORS[draggedShip.colorName];
  ctx.save();
  ctx.setLineDash([6, 4]);
  ctx.lineDashOffset = -(Date.now() * 0.05 % 10);
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.moveTo(dragPath[0].x, dragPath[0].y);
  for (let i = 1; i < dragPath.length; i++) ctx.lineTo(dragPath[i].x, dragPath[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawShipPath(ship) {
  if (!ship.path || ship.path.length < 2) return;
  const col = COLORS[ship.colorName];
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.lineDashOffset = -(Date.now() * 0.04 % 10);
  ctx.strokeStyle = col + '88';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(ship.x, ship.y);
  for (let i = ship.pathIndex; i < ship.path.length; i++) ctx.lineTo(ship.path[i].x, ship.path[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ── Kollisionserkennung ───────────────────────────────────────────────
function checkCollisions() {
  for (let i = 0; i < ships.length; i++) {
    for (let j = i + 1; j < ships.length; j++) {
      const a = ships[i], b = ships[j];
      if (a.state === 'done' || b.state === 'done') continue;
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist < 28) {
        spawnParticles((a.x+b.x)/2, (a.y+b.y)/2, '#ff4444', 20);
        flashTimer = 20;
        triggerGameOver();
        return;
      }
    }
  }
}

// ── Hafen-Erkennung ───────────────────────────────────────────────────
function getHarbourAt(x, y) {
  return HARBOURS.find(h => Math.hypot(x - h.cx, y - h.cy) < h.r + 15);
}

function getExitPoint(ship) {
  const sp = SPAWN_ZONES[Math.floor(Math.random() * SPAWN_ZONES.length)];
  return { x: sp.x, y: sp.y };
}

// ── Spawn ─────────────────────────────────────────────────────────────
function spawnShip() {
  if (ships.filter(s => s.state !== 'done').length >= 6 + level) return;
  const s = new Ship();
  ships.push(s);
}

// ── Game Loop ─────────────────────────────────────────────────────────
let lastTime = 0;
function gameLoop(ts) {
  if (!gameRunning) return;
  const dt = ts - lastTime; lastTime = ts;

  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnInterval = Math.max(120, 280 - level * 15);
    spawnShip();
  }

  // Level-Up
  const newLevel = Math.floor(score / 15) + 1;
  if (newLevel !== level) {
    level = newLevel;
    updateUI();
  }

  // Schiffe aktualisieren
  ships.forEach(s => s.update());
  ships = ships.filter(s => s.state !== 'done');

  checkCollisions();
  updateParticles();

  // Zeichnen
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255,60,60,${flashTimer/20*0.4})`;
    ctx.fillRect(0, 0, W, H);
    flashTimer--;
  }

  drawBackground();
  ships.forEach(s => drawShipPath(s));
  drawDragPath();
  ships.forEach(s => s.draw());
  drawParticles();

  requestAnimationFrame(gameLoop);
}

// ── Input ─────────────────────────────────────────────────────────────
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  // Scale from CSS pixels to canvas pixels
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top)  * scaleY
  };
}

function onDown(e) {
  if (!gameRunning) return;
  e.preventDefault();
  const pos = getPos(e);
  draggedShip = null;
  // Find topmost ship under cursor (generous hit area)
  for (let i = ships.length - 1; i >= 0; i--) {
    const s = ships[i];
    if (s.state === 'done' || s.state === 'unloading') continue;
    if (Math.hypot(pos.x - s.x, pos.y - s.y) < 36) {
      draggedShip = s;
      // Freeze ship while drawing path
      draggedShip.frozen = true;
      dragPath = [{ x: s.x, y: s.y }];
      break;
    }
  }
}

function onMove(e) {
  if (!gameRunning || !draggedShip) return;
  e.preventDefault();
  const pos = getPos(e);
  // Only add point if moved enough (avoid duplicate points)
  const last = dragPath[dragPath.length - 1];
  if (Math.hypot(pos.x - last.x, pos.y - last.y) > 4) {
    dragPath.push({ x: pos.x, y: pos.y });
  }
}

function onUp(e) {
  if (!gameRunning || !draggedShip) return;
  e.preventDefault();

  const ship = draggedShip;
  ship.frozen = false;
  draggedShip = null;

  // Need at least a short path
  if (dragPath.length < 3) {
    dragPath = [];
    return;
  }

  const lastPt = dragPath[dragPath.length - 1];
  const harbour = getHarbourAt(lastPt.x, lastPt.y);

  if (harbour) {
    if (harbour.color === ship.colorName && ship.containers > 0) {
      // Correct harbour → unload
      ship.path = [...dragPath, { x: harbour.cx, y: harbour.cy }];
      ship.pathIndex = 0;
      ship.harbour = harbour;
      ship.targetExit = null;
      ship.state = 'following';
    } else {
      // Wrong harbour or no containers → ignore, ship stays idle
    }
  } else {
    // Check if path leads outside the canvas borders
    const isOutside = lastPt.x > W - 10 || lastPt.y < 10 || lastPt.y > H - 10;
    if (isOutside && ship.containers === 0) {
      // Send empty ship out
      ship.path = [...dragPath];
      ship.pathIndex = 0;
      ship.harbour = null;
      ship.targetExit = lastPt;
      ship.state = 'following';
    } else if (ship.containers > 0 || !isOutside) {
      // Move ship along path, then idle at end
      ship.path = [...dragPath];
      ship.pathIndex = 0;
      ship.harbour = null;
      ship.targetExit = null;
      ship.state = 'following';
    }
  }

  dragPath = [];
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp, { passive: false });

// ── Overlay ───────────────────────────────────────────────────────────
function updateUI() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('level-val').textContent = level;
}

function triggerGameOver() {
  gameRunning = false;
  setTimeout(() => {
    const overlay = document.getElementById('overlay');
    overlay.innerHTML = `
      <div class="overlay-box">
        <h2>KOLLISION!</h2>
        <p>Zwei Schiffe haben sich gerammt.<br>Du hast Level ${level} erreicht.</p>
        <div class="final-score">${score} Punkte</div>
        <button class="btn" onclick="startGame()">NOCHMAL</button>
      </div>`;
    overlay.classList.add('active');
  }, 600);
}

function startGame() {
  ships = []; particles = [];
  score = 0; level = 1; spawnTimer = 0; spawnInterval = 280;
  draggedShip = null; dragPath = [];
  gameOverFlag = false; flashTimer = 0;
  updateUI();

  const overlay = document.getElementById('overlay');
  overlay.innerHTML = '';
  overlay.classList.remove('active');

  gameRunning = true;
  spawnShip();
  requestAnimationFrame(ts => { lastTime = ts; gameLoop(ts); });
}

// Init-Zeichnung
drawBackground();
</script>

</body>
</html>
