    <style>
        * {

<body>
<div id="app">
    <!-- Homescreen -->
    <div id="homeScreen">
        <div id="homeMain" class="home-panel">
            <div class="home-title">♔ Schach ♚</div>
            <div class="home-subtitle">Lokales Zweispieler-Spiel</div>
            <button class="home-btn" id="btnTwoPlayer">2 Spieler</button>
        </div>
        <div id="homeOptions" class="home-panel" style="display: none;">
            <div class="home-title" style="font-size: 2.5rem;">Brett drehen?</div>
            <button class="home-btn" id="btnRotateYes">↻ Mit Drehung</button>
            <button class="home-btn" id="btnRotateNo">↺ Ohne Drehung</button>
            <button class="home-btn back-btn" id="btnBackToMain">← Zurück</button>
        </div>
    </div>

    <!-- Spiel -->
    <div class="game-container" id="gameContainer">
        <div class="board-wrapper" id="boardWrapper">
            <canvas id="chessCanvas" width="480" height="480"></canvas>
        </div>
        <div class="info-panel">
            <div class="turn-indicator">
                🎲 Zug:
                <span id="turnSymbol">⚪ Weiß</span>
            </div>
            <div class="status" id="statusMsg">
                Spielbereit
            </div>
            <button id="homeBtn">🏠 Home</button>
            <button id="resetBtn">🔄 Neustart</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- Canvas ----------
        const canvas = document.getElementById('chessCanvas');
        const ctx = canvas.getContext('2d');
        const size = 480;
        const cellSize = size / 8;
        const boardWrapper = document.getElementById('boardWrapper');
        const homeScreen = document.getElementById('homeScreen');
        const gameContainer = document.getElementById('gameContainer');
        const homeMain = document.getElementById('homeMain');
        const homeOptions = document.getElementById('homeOptions');

        // ---------- Spielzustand ----------
        let board = Array(8).fill().map(() => Array(8).fill(null));
        let turn = 'w';        // 'w' weiß beginnt
        let gameOver = false;
        let gameResult = null;

        // Brettorientierung: 'w' = Weiß unten, 'b' = Schwarz unten (für die Zeichnung)
        let orientation = 'w';

        // Rochaderechte
        let castlingRights = {
            wK: true, wQ: true,
            bK: true, bQ: true
        };

        // En passant Ziel
        let enPassantTarget = null;

        // Für UI: ausgewählte Figur (interne Board-Koordinaten!)
        let selectedX = null, selectedY = null;
        let legalMoves = [];

        // Sperre für Animation: während der Brettdrehung keine weiteren Züge
        let isAnimating = false;

        // Option: Brett drehen oder nicht
        let rotateBoard = true;

        // --- Figuren-Initialisierung ---
        function initBoard() {
            for(let i = 0; i < 8; i++) {
                for(let j = 0; j < 8; j++) {
                    board[i][j] = null;
                }
            }
            // Bauern
            for(let i = 0; i < 8; i++) {
                board[1][i] = { type: 'p', color: 'b' };
                board[6][i] = { type: 'p', color: 'w' };
            }
            // andere Figuren Schwarz
            const backRowBlack = ['r','n','b','q','k','b','n','r'];
            for(let i = 0; i < 8; i++) {
                board[0][i] = { type: backRowBlack[i], color: 'b' };
            }
            // Weiß
            const backRowWhite = ['r','n','b','q','k','b','n','r'];
            for(let i = 0; i < 8; i++) {
                board[7][i] = { type: backRowWhite[i], color: 'w' };
            }
        }

        // Spiel zurücksetzen (ohne Homescreen)
        function resetGame(keepRotationSetting = true) {
            // Animation abbrechen
            isAnimating = false;
            boardWrapper.classList.remove('flip');
            boardWrapper.style.transition = '';
            boardWrapper.style.transform = '';
            
            initBoard();
            turn = 'w';
            orientation = 'w';
            gameOver = false;
            gameResult = null;
            castlingRights = {
                wK: true, wQ: true,
                bK: true, bQ: true
            };
            enPassantTarget = null;
            selectedX = null;
            selectedY = null;
            legalMoves = [];
            if (keepRotationSetting === false) {
                rotateBoard = true; // default
            }
            drawBoard();
            updateUI();
        }

        // Homescreen-Menüs
        document.getElementById('btnTwoPlayer').addEventListener('click', () => {
            homeMain.style.display = 'none';
            homeOptions.style.display = 'flex';
        });

        document.getElementById('btnBackToMain').addEventListener('click', () => {
            homeOptions.style.display = 'none';
            homeMain.style.display = 'flex';
        });

        document.getElementById('btnRotateYes').addEventListener('click', () => {
            rotateBoard = true;
            startGameFromHome();
        });

        document.getElementById('btnRotateNo').addEventListener('click', () => {
            rotateBoard = false;
            startGameFromHome();
        });

        function startGameFromHome() {
            homeScreen.classList.add('hidden');
            // Spiel zurücksetzen, aber rotateBoard beibehalten
            resetGame(false);
            // rotateBoard wurde in resetGame(false) auf true gesetzt, deshalb überschreiben wir es
            // besser: wir übergeben die Einstellung separat
        }

        // Korrektur: rotateBoard nach resetGame setzen
        function startGameWithRotation(rotate) {
            rotateBoard = rotate;
            resetGame(true); // behält rotateBoard bei
            homeScreen.classList.add('hidden');
            drawBoard();
        }

        document.getElementById('btnRotateYes').addEventListener('click', () => startGameWithRotation(true));
        document.getElementById('btnRotateNo').addEventListener('click', () => startGameWithRotation(false));

        document.getElementById('homeBtn').addEventListener('click', () => {
            // Zurück zum Homescreen
            homeScreen.classList.remove('hidden');
            homeOptions.style.display = 'none';
            homeMain.style.display = 'flex';
            resetGame(true); // Spielzustand zurücksetzen
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            resetGame(true);
            drawBoard();
        });

        // --- Figuren-Symbole ---
        function getPieceSymbol(piece) {
            if(!piece) return '';
            const symbols = {
                'k': '♔', 'q': '♕', 'r': '♖', 'b': '♗', 'n': '♘', 'p': '♙'
            };
            return symbols[piece.type] || '';
        }

        // Konvertiert Canvas-Koordinaten zu internen Board-Koordinaten (abhängig von Orientierung)
        function canvasToInternal(colCanvas, rowCanvas) {
            if(orientation === 'w') {
                return { x: colCanvas, y: rowCanvas };
            } else {
                return { x: 7 - colCanvas, y: 7 - rowCanvas };
            }
        }

        // Konvertiert interne Board-Koordinaten zu Canvas-Pixel-Position
        function internalToCanvas(x, y) {
            if(orientation === 'w') {
                return { cx: x * cellSize, cy: y * cellSize };
            } else {
                return { cx: (7 - x) * cellSize, cy: (7 - y) * cellSize };
            }
        }

        // Zeichnet das gesamte Brett
        function drawBoard() {
            for(let row = 0; row < 8; row++) {
                for(let col = 0; col < 8; col++) {
                    const { cx, cy } = internalToCanvas(col, row);
                    const isLight = (row + col) % 2 === 0;
                    ctx.fillStyle = isLight ? '#f0d9b5' : '#b58863';
                    ctx.fillRect(cx, cy, cellSize, cellSize);
                    
                    if(selectedX === col && selectedY === row) {
                        ctx.fillStyle = 'rgba(90, 190, 90, 0.65)';
                        ctx.fillRect(cx, cy, cellSize, cellSize);
                    }
                    
                    if(legalMoves.some(move => move.x === col && move.y === row)) {
                        ctx.fillStyle = 'rgba(70, 130, 200, 0.55)';
                        ctx.fillRect(cx, cy, cellSize, cellSize);
                        ctx.beginPath();
                        ctx.arc(cx + cellSize/2, cy + cellSize/2, cellSize*0.18, 0, 2*Math.PI);
                        ctx.fillStyle = '#2c6e2f';
                        ctx.fill();
                    }
                    
                    const piece = board[row][col];
                    if(piece) {
                        const symbol = getPieceSymbol(piece);
                        ctx.font = `500 ${cellSize * 0.68}px 'Segoe UI', 'Noto Sans', system-ui`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const isWhite = piece.color === 'w';
                        ctx.fillStyle = isWhite ? '#FFF9E6' : '#1A1814';
                        ctx.fillText(symbol, cx + cellSize/2, cy + cellSize/2);
                        ctx.fillStyle = isWhite ? '#E0D5B0' : '#4A3E32';
                        ctx.fillText(symbol, cx + cellSize/2 - 1, cy + cellSize/2 - 1);
                        ctx.fillStyle = isWhite ? '#FFFFFF' : '#0A0A0A';
                        ctx.fillText(symbol, cx + cellSize/2, cy + cellSize/2);
                    }
                }
            }
            
            if(!gameOver && isCheck(turn)) {
                const kingPos = findKing(turn);
                if(kingPos) {
                    const { cx, cy } = internalToCanvas(kingPos.x, kingPos.y);
                    ctx.fillStyle = 'rgba(220, 60, 50, 0.75)';
                    ctx.fillRect(cx, cy, cellSize, cellSize);
                }
            }
        }

        // --- Kernlogik: Bewegung & Angriffsprüfung ---
        function isSquareAttacked(x, y, colorDefender, boardState) {
            for(let row = 0; row < 8; row++) {
                for(let col = 0; col < 8; col++) {
                    const piece = boardState[row][col];
                    if(piece && piece.color === colorDefender) {
                        if(canPieceMoveTo(piece, col, row, x, y, boardState, true)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function canPieceMoveTo(piece, fromX, fromY, toX, toY, boardState, attackOnly = false) {
            if(toX < 0 || toX > 7 || toY < 0 || toY > 7) return false;
            const targetPiece = boardState[toY][toX];
            if(targetPiece && targetPiece.color === piece.color) return false;
            
            const deltaX = toX - fromX;
            const deltaY = toY - fromY;
            const absDeltaX = Math.abs(deltaX);
            const absDeltaY = Math.abs(deltaY);
            
            switch(piece.type) {
                case 'p':
                    const direction = (piece.color === 'w') ? -1 : 1;
                    const startRow = (piece.color === 'w') ? 6 : 1;
                    if(deltaX === 0 && deltaY === direction && !targetPiece) return true;
                    if(deltaX === 0 && deltaY === 2*direction && !targetPiece && fromY === startRow && !boardState[toY - direction][toX]) return true;
                    if(absDeltaX === 1 && deltaY === direction && targetPiece) return true;
                    if(!attackOnly && enPassantTarget && enPassantTarget.x === toX && enPassantTarget.y === toY && absDeltaX === 1 && deltaY === direction && !targetPiece) {
                        const pawnY = (piece.color === 'w') ? toY+1 : toY-1;
                        const oppPawn = boardState[pawnY][toX];
                        if(oppPawn && oppPawn.type === 'p' && oppPawn.color !== piece.color) return true;
                    }
                    return false;
                case 'n':
                    return (absDeltaX === 2 && absDeltaY === 1) || (absDeltaX === 1 && absDeltaY === 2);
                case 'b':
                    if(absDeltaX !== absDeltaY) return false;
                    return isClearDiagonal(fromX, fromY, toX, toY, boardState);
                case 'r':
                    if(fromX !== toX && fromY !== toY) return false;
                    return isClearLine(fromX, fromY, toX, toY, boardState);
                case 'q':
                    if(fromX === toX || fromY === toY) return isClearLine(fromX, fromY, toX, toY, boardState);
                    if(absDeltaX === absDeltaY) return isClearDiagonal(fromX, fromY, toX, toY, boardState);
                    return false;
                case 'k':
                    if(absDeltaX <= 1 && absDeltaY <= 1) return true;
                    if(!attackOnly && !gameOver && !isCheck(piece.color)) {
                        if(deltaX === 2 && deltaY === 0 && fromY === toY) {
                            const backrank = (piece.color === 'w') ? 7 : 0;
                            if(fromY === backrank && fromX === 4 && toX === 6) {
                                const kingRook = boardState[backrank][7];
                                if(castlingRights[piece.color === 'w' ? 'wK' : 'bK'] && kingRook && kingRook.type === 'r' && kingRook.color === piece.color &&
                                    !boardState[backrank][5] && !boardState[backrank][6] &&
                                    !isSquareAttacked(5, backrank, oppositeColor(piece.color), boardState) &&
                                    !isSquareAttacked(6, backrank, oppositeColor(piece.color), boardState)) {
                                    return true;
                                }
                            }
                        }
                        if(deltaX === -2 && deltaY === 0 && fromY === toY) {
                            const backrank = (piece.color === 'w') ? 7 : 0;
                            if(fromY === backrank && fromX === 4 && toX === 2) {
                                const queenRook = boardState[backrank][0];
                                if(castlingRights[piece.color === 'w' ? 'wQ' : 'bQ'] && queenRook && queenRook.type === 'r' && queenRook.color === piece.color &&
                                    !boardState[backrank][3] && !boardState[backrank][2] && !boardState[backrank][1] &&
                                    !isSquareAttacked(3, backrank, oppositeColor(piece.color), boardState) &&
                                    !isSquareAttacked(2, backrank, oppositeColor(piece.color), boardState)) {
                                    return true;
                                }
                            }
                        }
                    }
                    return false;
                default: return false;
            }
        }
        
        function isClearLine(fx, fy, tx, ty, boardState) {
            if(fx === tx) {
                let stepY = (ty > fy) ? 1 : -1;
                for(let y = fy+stepY; y !== ty; y += stepY) {
                    if(boardState[y][fx]) return false;
                }
            } else if(fy === ty) {
                let stepX = (tx > fx) ? 1 : -1;
                for(let x = fx+stepX; x !== tx; x += stepX) {
                    if(boardState[fy][x]) return false;
                }
            } else return false;
            return true;
        }
        
        function isClearDiagonal(fx, fy, tx, ty, boardState) {
            let stepX = (tx > fx) ? 1 : -1;
            let stepY = (ty > fy) ? 1 : -1;
            let x = fx+stepX, y = fy+stepY;
            while(x !== tx && y !== ty) {
                if(boardState[y][x]) return false;
                x += stepX;
                y += stepY;
            }
            return true;
        }
        
        function oppositeColor(color) {
            return color === 'w' ? 'b' : 'w';
        }
        
        function findKing(color) {
            for(let i=0;i<8;i++) {
                for(let j=0;j<8;j++) {
                    if(board[i][j] && board[i][j].type === 'k' && board[i][j].color === color) return { x: j, y: i };
                }
            }
            return null;
        }
        
        function isCheck(color) {
            const kingPos = findKing(color);
            if(!kingPos) return false;
            return isSquareAttacked(kingPos.x, kingPos.y, oppositeColor(color), board);
        }
        
        function getAllLegalMovesForPiece(x, y, piece) {
            const moves = [];
            for(let i=0;i<8;i++) {
                for(let j=0;j<8;j++) {
                    if(canPieceMoveTo(piece, x, y, i, j, board, false)) {
                        const tempBoard = copyBoard();
                        executeMoveOnBoard(tempBoard, x, y, i, j, piece, false);
                        const kingPosAfter = findKing(piece.color);
                        if(kingPosAfter && !isSquareAttacked(kingPosAfter.x, kingPosAfter.y, oppositeColor(piece.color), tempBoard)) {
                            moves.push({ x: i, y: j });
                        }
                    }
                }
            }
            return moves;
        }
        
        function executeMoveOnBoard(boardState, fromX, fromY, toX, toY, piece, isRealMove = true) {
            const capturedPiece = boardState[toY][toX];
            if(piece.type === 'p' && !capturedPiece && enPassantTarget && enPassantTarget.x === toX && enPassantTarget.y === toY) {
                const direction = (piece.color === 'w') ? -1 : 1;
                const capY = toY - direction;
                const capPawn = boardState[capY][toX];
                if(capPawn && capPawn.type === 'p' && capPawn.color !== piece.color) {
                    boardState[capY][toX] = null;
                }
            }
            boardState[toY][toX] = piece;
            boardState[fromY][fromX] = null;
            
            if(piece.type === 'p' && (toY === 0 || toY === 7)) {
                boardState[toY][toX] = { type: 'q', color: piece.color };
            }
            
            if(piece.type === 'k' && Math.abs(toX - fromX) === 2 && fromY === toY) {
                const backrank = fromY;
                if(toX === 6) {
                    const rook = boardState[backrank][7];
                    if(rook && rook.type === 'r') {
                        boardState[backrank][5] = rook;
                        boardState[backrank][7] = null;
                    }
                } else if(toX === 2) {
                    const rook = boardState[backrank][0];
                    if(rook && rook.type === 'r') {
                        boardState[backrank][3] = rook;
                        boardState[backrank][0] = null;
                    }
                }
            }
            
            if(isRealMove) {
                if(piece.type === 'k') {
                    if(piece.color === 'w') { castlingRights.wK = false; castlingRights.wQ = false; }
                    else { castlingRights.bK = false; castlingRights.bQ = false; }
                }
                if(piece.type === 'r') {
                    if(fromY === 0 && fromX === 0) castlingRights.bQ = false;
                    if(fromY === 0 && fromX === 7) castlingRights.bK = false;
                    if(fromY === 7 && fromX === 0) castlingRights.wQ = false;
                    if(fromY === 7 && fromX === 7) castlingRights.wK = false;
                }
                if(capturedPiece && capturedPiece.type === 'r') {
                    if(toY === 0 && toX === 0) castlingRights.bQ = false;
                    if(toY === 0 && toX === 7) castlingRights.bK = false;
                    if(toY === 7 && toX === 0) castlingRights.wQ = false;
                    if(toY === 7 && toX === 7) castlingRights.wK = false;
                }
                if(piece.type === 'p' && Math.abs(toY - fromY) === 2) {
                    const midY = (fromY + toY) / 2;
                    enPassantTarget = { x: fromX, y: midY };
                } else {
                    enPassantTarget = null;
                }
            }
        }
        
        function copyBoard() {
            const newBoard = Array(8).fill().map(()=>Array(8).fill(null));
            for(let i=0;i<8;i++) {
                for(let j=0;j<8;j++) {
                    if(board[i][j]) newBoard[i][j] = {...board[i][j]};
                }
            }
            return newBoard;
        }
        
        // Führt einen Zug aus, optional mit Drehanimation
        function makeMove(fromX, fromY, toX, toY) {
            if(isAnimating) return false;
            const piece = board[fromY][fromX];
            if(!piece || piece.color !== turn) return false;
            const movesForPiece = getAllLegalMovesForPiece(fromX, fromY, piece);
            const isValid = movesForPiece.some(m => m.x === toX && m.y === toY);
            if(!isValid) return false;
            
            const tempBoard = copyBoard();
            const pieceCopy = tempBoard[fromY][fromX];
            executeMoveOnBoard(tempBoard, fromX, fromY, toX, toY, pieceCopy, false);
            const kingPos = findKing(turn);
            if(kingPos && isSquareAttacked(kingPos.x, kingPos.y, oppositeColor(turn), tempBoard)) return false;
            
            // Zug ausführen
            const realPiece = board[fromY][fromX];
            executeMoveOnBoard(board, fromX, fromY, toX, toY, realPiece, true);
            
            // Spielerwechsel
            turn = oppositeColor(turn);
            
            selectedX = null;
            selectedY = null;
            legalMoves = [];
            
            if (rotateBoard) {
                // Animation starten
                isAnimating = true;
                boardWrapper.classList.add('flip');
                
                setTimeout(() => {
                    orientation = (orientation === 'w') ? 'b' : 'w';
                    drawBoard();
                }, 225);
                
                setTimeout(() => {
                    boardWrapper.style.transition = 'none';
                    boardWrapper.classList.remove('flip');
                    boardWrapper.style.transform = 'none';
                    boardWrapper.offsetHeight;
                    boardWrapper.style.transition = '';
                    isAnimating = false;
                    drawBoard();
                }, 450);
            } else {
                // Keine Drehung, einfach neu zeichnen
                drawBoard();
            }
            
            if(isGameOverAfterMove()) {
                drawBoard();
                updateUI();
                return true;
            }
            updateUI();
            return true;
        }
        
        function isGameOverAfterMove() {
            const currentColor = turn;
            const allPieces = getAllPiecesOfColor(currentColor);
            let anyMove = false;
            for(let p of allPieces) {
                const moves = getAllLegalMovesForPiece(p.x, p.y, p.piece);
                if(moves.length > 0) { anyMove = true; break; }
            }
            if(!anyMove) {
                gameOver = true;
                if(isCheck(currentColor)) {
                    gameResult = 'checkmate';
                } else {
                    gameResult = 'stalemate';
                }
                return true;
            }
            return false;
        }
        
        function getAllPiecesOfColor(color) {
            const pieces = [];
            for(let y=0;y<8;y++) {
                for(let x=0;x<8;x++) {
                    if(board[y][x] && board[y][x].color === color) {
                        pieces.push({ x, y, piece: board[y][x] });
                    }
                }
            }
            return pieces;
        }
        
        function updateUI() {
            const turnSpan = document.getElementById('turnSymbol');
            const statusDiv = document.getElementById('statusMsg');
            if(gameOver) {
                if(gameResult === 'checkmate') {
                    const loser = turn === 'w' ? 'Schwarz' : 'Weiß';
                    statusDiv.innerHTML = `🏆 Schachmatt! ${loser} gewinnt! 🏆`;
                } else if(gameResult === 'stalemate') {
                    statusDiv.innerHTML = `♟️ Patt – Unentschieden! ♟️`;
                } else {
                    statusDiv.innerHTML = `Spiel beendet.`;
                }
                turnSpan.innerHTML = gameResult === 'checkmate' ? (turn === 'w' ? '⚫ Schwarz' : '⚪ Weiß') + " gewinnt" : "🏁 Ende";
                return;
            }
            const checkNotice = isCheck(turn) ? " (SCHACH!)" : "";
            turnSpan.innerHTML = turn === 'w' ? '⚪ Weiß' + checkNotice : '⚫ Schwarz' + checkNotice;
            statusDiv.innerHTML = turn === 'w' ? 'Weiß am Zug' : 'Schwarz am Zug';
        }
        
        // Klick-Event mit Koordinatentransformation
        function handleCanvasClick(e) {
            if(gameOver || isAnimating) return;
            if(homeScreen && !homeScreen.classList.contains('hidden')) return; // Spiel versteckt
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            const colCanvas = Math.floor(mouseX / cellSize);
            const rowCanvas = Math.floor(mouseY / cellSize);
            if(colCanvas<0 || colCanvas>7 || rowCanvas<0 || rowCanvas>7) return;
            
            const { x: internalX, y: internalY } = canvasToInternal(colCanvas, rowCanvas);
            
            if(selectedX !== null && selectedY !== null) {
                const isLegalTarget = legalMoves.some(m => m.x === internalX && m.y === internalY);
                if(isLegalTarget) {
                    makeMove(selectedX, selectedY, internalX, internalY);
                    return;
                } else {
                    selectedX = null;
                    selectedY = null;
                    legalMoves = [];
                    drawBoard();
                }
            }
            const piece = board[internalY][internalX];
            if(piece && piece.color === turn && !gameOver) {
                selectedX = internalX;
                selectedY = internalY;
                legalMoves = getAllLegalMovesForPiece(selectedX, selectedY, piece);
                drawBoard();
            } else {
                selectedX = null;
                selectedY = null;
                legalMoves = [];
                drawBoard();
            }
        }
        
        canvas.addEventListener('click', handleCanvasClick);
        
        // Start: Homescreen anzeigen, Spiel initialisieren aber nicht starten
        homeScreen.classList.remove('hidden');
        resetGame(true);
        drawBoard();
    })();
</script>
