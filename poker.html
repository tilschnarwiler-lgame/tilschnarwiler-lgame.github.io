<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Poker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            width: 100%;
        }

        /* Tisch */
        .table {
            background: radial-gradient(ellipse, #1a7a3a 0%, #0d5e2e 50%, #073a1a 100%);
            border-radius: 200px;
            padding: 25px 30px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 10px #3d1c00, 0 0 0 16px #1a0a00;
            border: 4px solid #6b3a1f;
        }
        .table-inner {
            background: radial-gradient(ellipse, #0e5c2c 0%, #083a1a 100%);
            border-radius: 170px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        /* Gegner */
        .opponents {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .opp {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 8px 14px;
            color: #f0e6d3;
            min-width: 110px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }
        .opp.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            50% {
                box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
            }
        }
        .opp-name {
            font-weight: bold;
            font-size: 0.9em;
        }
        .opp-chips {
            color: #d4a843;
            font-size: 0.8em;
        }
        .opp-cards {
            display: flex;
            gap: 3px;
            justify-content: center;
            margin: 3px 0;
        }
        .opp-status {
            font-size: 0.7em;
            min-height: 16px;
            color: #ffd700;
        }
        .folded {
            color: #e74c3c !important;
            font-style: italic;
        }

        /* Mini-Karten */
        .mini-card {
            width: 26px;
            height: 36px;
            border-radius: 3px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5em;
            font-weight: bold;
            line-height: 1.1;
            text-align: center;
            border: 1px solid #ccc;
        }
        .mini-card.red {
            color: #c0392b;
        }
        .mini-card.black {
            color: #000;
        }
        .mini-card.back {
            background: #1a3a5c;
            color: #3a6a9c;
            font-size: 0.7em;
        }

        /* Gemeinschaftskarten */
        .community {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
            min-height: 100px;
            align-items: center;
        }
        .card-placeholder {
            width: 65px;
            height: 90px;
            border-radius: 8px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
        }

        /* Große Karten */
        .card {
            width: 65px;
            height: 90px;
            border-radius: 8px;
            background: linear-gradient(150deg, #fff 0%, #f5f3ed 50%, #ece8df 100%);
            position: relative;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
            border: 1px solid #d5cfc6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            transition: transform 0.2s;
            animation: deal 0.3s ease-out;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        @keyframes deal {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .card.red {
            color: #c0392b;
        }
        .card.black {
            color: #1a1a1a;
        }
        .card .corner-top {
            position: absolute;
            top: 4px;
            left: 5px;
            font-size: 0.6em;
            line-height: 1.1;
            text-align: center;
            font-weight: bold;
        }
        .card .corner-bottom {
            position: absolute;
            bottom: 4px;
            right: 5px;
            font-size: 0.6em;
            line-height: 1.1;
            text-align: center;
            font-weight: bold;
            transform: rotate(180deg);
        }
        .card .center {
            font-size: 2.2em;
            text-align: center;
            line-height: 1;
        }

        /* Pot */
        .pot {
            color: #ffd700;
            font-size: 1.1em;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 16px;
            border-radius: 20px;
            margin: 5px 0;
        }

        /* Spieler */
        .player-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 14px;
            padding: 12px 20px;
            color: #f0e6d3;
            display: inline-block;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
            margin-top: 5px;
        }
        .player-box.active {
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            animation: pulse 1.5s infinite;
        }
        .player-name {
            font-weight: bold;
            font-size: 1em;
        }
        .player-chips {
            color: #d4a843;
            font-size: 0.85em;
        }
        .player-cards {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 6px 0;
        }
        .player-cards .card {
            width: 55px;
            height: 76px;
        }
        .player-cards .card .corner-top {
            font-size: 0.5em;
            top: 2px;
            left: 3px;
        }
        .player-cards .card .corner-bottom {
            font-size: 0.5em;
            bottom: 2px;
            right: 3px;
        }
        .player-cards .card .center {
            font-size: 1.6em;
        }
        .player-bet {
            font-size: 0.8em;
            color: #ffd700;
            min-height: 18px;
        }

        /* Nachricht */
        .message {
            color: #f1c40f;
            font-weight: bold;
            font-size: 0.95em;
            min-height: 22px;
            margin: 6px 0;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 5px;
        }
        .actions button {
            padding: 9px 15px;
            font-size: 0.85em;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            background: #c8963e;
            color: #1a1a2e;
            transition: 0.2s;
            font-family: inherit;
        }
        .actions button:hover:not(:disabled) {
            background: #d4a843;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-fold {
            background: #7f8c8d;
            color: #fff;
        }
        .btn-allin {
            background: #e74c3c;
            color: #fff;
        }
        .raise-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .raise-group input {
            width: 100px;
            accent-color: #d4a843;
        }
        .raise-group span {
            color: #fff;
            font-weight: bold;
            min-width: 35px;
        }

        .new-game-btn {
            display: block;
            margin: 15px auto 0;
            padding: 10px 25px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 25px;
            border: 2px solid #d4a843;
            cursor: pointer;
            background: transparent;
            color: #d4a843;
            transition: 0.3s;
            font-family: inherit;
        }
        .new-game-btn:hover {
            background: #d4a843;
            color: #1a1a2e;
        }

        @media (max-width: 650px) {
            .table {
                border-radius: 50px;
                padding: 15px 10px;
            }
            .table-inner {
                border-radius: 40px;
                padding: 10px;
            }
            .card,
            .card-placeholder {
                width: 45px;
                height: 63px;
                border-radius: 5px;
            }
            .card .corner-top,
            .card .corner-bottom {
                font-size: 0.45em;
            }
            .card .center {
                font-size: 1.4em;
            }
            .player-cards .card {
                width: 40px;
                height: 56px;
            }
            .opp {
                min-width: 70px;
                padding: 5px 8px;
            }
            .opp-name {
                font-size: 0.7em;
            }
            .actions button {
                padding: 7px 10px;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="table">
            <div class="table-inner">
                <!-- Gegner -->
                <div class="opponents" id="opponents"></div>

                <!-- Gemeinschaftskarten -->
                <div class="community" id="community"></div>

                <!-- Pot -->
                <div class="pot">🤑 Pot: <span id="potAmount">0</span></div>

                <!-- Spieler -->
                <div class="player-box active" id="playerBox">
                    <div class="player-name">😎 Du</div>
                    <div class="player-chips" id="playerChips">💰 1500</div>
                    <div class="player-cards" id="playerCards"></div>
                    <div class="player-bet" id="playerBet"></div>
                </div>

                <!-- Nachricht -->
                <div class="message" id="message"></div>

                <!-- Aktionen -->
                <div class="actions" id="actions">
                    <button onclick="spielerAktion('fold')" class="btn-fold" id="btnFold">❌ Fold</button>
                    <button onclick="spielerAktion('check')" id="btnCheck">✅ Check</button>
                    <button onclick="spielerAktion('call')" id="btnCall">👈 Call</button>
                    <span class="raise-group">
                        <button onclick="spielerAktion('raise')" id="btnRaise">🔥 Raise</button>
                        <input type="range" id="raiseSlider" min="20" max="100" value="40" oninput="updateSlider()">
                        <span id="raiseLabel">40</span>
                    </span>
                    <button onclick="spielerAktion('allin')" class="btn-allin" id="btnAllin">💀 All-In</button>
                </div>
            </div>
        </div>
        <button class="new-game-btn" onclick="neuesSpiel()">🔄 Neues Spiel</button>
    </div>

    <script>
        // ==================== SPIEL-LOGIK ====================
        const SUITS = ['♥', '♦', '♠', '♣'];
        const SUIT_NAMES = ['Herz', 'Karo', 'Pik', 'Kreuz'];
        const VALUES = ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'Bube', 'Dame', 'König', 'As'];
        const FACE_SYMBOLS = { 'Bube': '♝', 'Dame': '♛', 'König': '♚', 'As': '★' };
        const RED_SUITS = ['♥', '♦'];
        const NAMES = ['Du', 'Anna', 'Ben', 'Clara'];
        const EMOJIS = ['😎', '👩', '👨', '👩‍🦰'];
        const NUM = 4;
        const START_CHIPS = 1500;
        const SB = 10;
        const BB = 20;

        let deck, community, hands, chips, bets, folded, allin, pot, currentBet;
        let dealer, activePlayer, lastRaiser, phase, roundOver;

        function newDeck() {
            deck = [];
            for (let s of SUIT_NAMES)
                for (let v of VALUES) deck.push({ value: v, suit: s, symbol: SUITS[SUIT_NAMES.indexOf(s)] });
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function draw() { return deck.pop(); }

        function cardValue(v) { return VALUES.indexOf(v) + 2; }

        function isFace(v) { return ['Bube', 'Dame', 'König', 'As'].includes(v); }

        // Karten-HTML
        function cardHTML(c, small = false) {
            const red = RED_SUITS.includes(c.symbol);
            const cls = red ? 'red' : 'black';
            const sz = small ? 'width:45px;height:63px;' : '';
            const fnt = small ? 'font-size:0.45em;' : 'font-size:0.6em;';
            const cfnt = small ? 'font-size:1.4em;' : 'font-size:2.2em;';
            let center;
            if (isFace(c.value)) {
                center = `<span style="${cfnt}">${FACE_SYMBOLS[c.value]}</span>`;
            } else {
                center = `<span style="${cfnt}">${c.symbol}</span>`;
            }
            return `<div class="card ${cls}" style="${sz}">
                <div class="corner-top" style="${fnt}">${c.value}<br>${c.symbol}</div>
                ${center}
                <div class="corner-bottom" style="${fnt}">${c.value}<br>${c.symbol}</div>
            </div>`;
        }

        function cardBack(small = false) {
            const sz = small ? 'width:45px;height:63px;' : '';
            return `<div class="card" style="background:#1a3a5c;color:#4a7aac;${sz}">
                <div class="center" style="font-size:1.8em;">🂠</div>
            </div>`;
        }

        function miniCardHTML(c) {
            const red = RED_SUITS.includes(c.symbol);
            const cls = red ? 'red' : 'black';
            let txt = isFace(c.value) ? `${FACE_SYMBOLS[c.value]} ${c.symbol}` : `${c.value} ${c.symbol}`;
            return `<div class="mini-card ${cls}">${txt}</div>`;
        }

        function miniCardBack() {
            return '<div class="mini-card back">🂠</div>';
        }

        // UI aktualisieren
        function updateUI() {
            // Community
            let comm = '';
            for (let i = 0; i < 5; i++) {
                comm += i < community.length ? cardHTML(community[i]) :
                    '<div class="card-placeholder"></div>';
            }
            document.getElementById('community').innerHTML = comm;

            // Spieler
            document.getElementById('playerChips').textContent = `💰 ${chips[0]}`;
            let pCards = '';
            if (hands[0].length > 0) pCards = hands[0].map(c => cardHTML(c, true)).join('');
            else pCards = '<span style="color:#888;">Keine Karten</span>';
            document.getElementById('playerCards').innerHTML = pCards;
            let pBet = '';
            if (bets[0] > 0) pBet = `💵 Einsatz: ${bets[0]}`;
            if (folded[0]) pBet += ' <span class="folded">FOLD</span>';
            if (allin[0]) pBet += ' <span style="color:#ff6b6b;"> ALL-IN</span>';
            document.getElementById('playerBet').innerHTML = pBet;
            document.getElementById('playerBox').classList.toggle('active', activePlayer === 0 && !roundOver);

            // Gegner
            let opps = '';
            for (let i = 1; i < NUM; i++) {
                let cardsHTML = '';
                if (hands[i].length > 0) {
                    cardsHTML = (roundOver || folded[i]) ?
                        hands[i].map(c => miniCardHTML(c)).join('') :
                        hands[i].map(() => miniCardBack()).join('');
                }
                let status = '';
                if (folded[i]) status += '<span class="folded">FOLD</span> ';
                if (allin[i]) status += '<span style="color:#ff6b6b;">ALL-IN</span> ';
                if (bets[i] > 0 && !roundOver) status += `💵 ${bets[i]}`;
                opps += `
                <div class="opp${activePlayer === i && !roundOver ? ' active' : ''}" id="opp${i}Box">
                    <div class="opp-name">${EMOJIS[i]} ${NAMES[i]}</div>
                    <div class="opp-chips">💰 ${chips[i]}</div>
                    <div class="opp-cards">${cardsHTML}</div>
                    <div class="opp-status">${status}</div>
                </div>`;
            }
            document.getElementById('opponents').innerHTML = opps;
            document.getElementById('potAmount').textContent = pot;

            // Slider
            const maxR = Math.max(0, chips[0] - (currentBet - bets[0]));
            const slider = document.getElementById('raiseSlider');
            slider.max = maxR;
            slider.min = Math.min(currentBet > 0 ? currentBet * 2 : BB, maxR);
            if (parseInt(slider.value) > maxR) slider.value = maxR;
            if (parseInt(slider.value) < parseInt(slider.min)) slider.value = slider.min;
            updateSlider();
        }

        function updateSlider() {
            document.getElementById('raiseLabel').textContent = document.getElementById('raiseSlider').value;
        }

        function setMsg(m) { document.getElementById('message').textContent = m; }

        function updateButtons() {
            const myTurn = (activePlayer === 0 && !roundOver && !folded[0] && !allin[0]);
            ['btnFold', 'btnCheck', 'btnCall', 'btnRaise', 'btnAllin', 'raiseSlider'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = !myTurn;
            });
            if (!myTurn) return;
            const callAmt = currentBet - bets[0];
            document.getElementById('btnAllin').disabled = chips[0] <= 0;
            if (callAmt <= 0) {
                document.getElementById('btnCheck').disabled = false;
                document.getElementById('btnCall').disabled = true;
                document.getElementById('btnCheck').textContent = '✅ Check';
            } else {
                document.getElementById('btnCheck').disabled = true;
                document.getElementById('btnCall').disabled = chips[0] <= 0;
                document.getElementById('btnCall').textContent = `👈 Call (${callAmt})`;
            }
        }

        // Hand-Bewertung
        function evaluate(h) {
            const all = [...h, ...community];
            const vals = all.map(c => cardValue(c.value)).sort((a, b) => b - a);
            const suits = all.map(c => c.suit);
            const suitCount = {};
            suits.forEach(s => suitCount[s] = (suitCount[s] || 0) + 1);
            const flush = Object.values(suitCount).some(c => c >= 5);
            const unique = [...new Set(vals)].sort((a, b) => b - a);
            let straight = false,
                sh = 0;
            for (let i = 0; i <= unique.length - 5; i++) {
                if (unique[i] - unique[i + 4] === 4) { straight = true;
                    sh = unique[i]; break; }
            }
            if (!straight && unique.includes(14) && unique.includes(2) && unique.includes(3) && unique.includes(4) && unique
                .includes(5)) { straight = true;
                sh = 5; }
            const freq = {};
            vals.forEach(v => freq[v] = (freq[v] || 0) + 1);
            const cnt = Object.entries(freq).map(([v, c]) => [parseInt(v), c]).sort((a, b) => b[1] - a[1] || b[0] - a[0]);
            if (flush && straight) {
                const fs = Object.entries(suitCount).find(([, c]) => c >= 5)[0];
                const fv = all.filter(c => c.suit === fs).map(c => cardValue(c.value)).sort((a, b) => b - a);
                const fu = [...new Set(fv)].sort((a, b) => b - a);
                let sfh = 0,
                    isf = false;
                for (let i = 0; i <= fu.length - 5; i++) { if (fu[i] - fu[i + 4] === 4) { isf = true;
                        sfh = fu[i]; break; } }
                if (!isf && fu.includes(14) && fu.includes(2) && fu.includes(3) && fu.includes(4) && fu.includes(5)) { isf =
                        true;
                    sfh = 5; }
                if (isf) return { rank: sfh === 14 ? 10 : 9, name: sfh === 14 ? 'Royal Flush' : 'Straight Flush',
                    kicker: [sfh] };
            }
            if (cnt[0][1] === 4) return { rank: 8, name: 'Vierling', kicker: [cnt[0][0], cnt[1][0]] };
            if (cnt[0][1] === 3 && cnt[1][1] === 2) return { rank: 7, name: 'Full House', kicker: [cnt[0][0], cnt[1][0]] };
            if (flush) {
                const fs = Object.entries(suitCount).find(([, c]) => c >= 5)[0];
                const fv = all.filter(c => c.suit === fs).map(c => cardValue(c.value)).sort((a, b) => b - a);
                return { rank: 6, name: 'Flush', kicker: fv.slice(0, 5) };
            }
            if (straight) return { rank: 5, name: 'Straße', kicker: [sh] };
            if (cnt[0][1] === 3) return { rank: 4, name: 'Drilling', kicker: [cnt[0][0], ...cnt.slice(1).map(c => c[0])]
                    .slice(0, 3) };
            if (cnt[0][1] === 2 && cnt[1][1] === 2) return { rank: 3, name: 'Zwei Paare', kicker: [cnt[0][0], cnt[1][0],
                    ...cnt.slice(2).map(c => c[0])].slice(0, 3) };
            if (cnt[0][1] === 2) return { rank: 2, name: 'Paar', kicker: [cnt[0][0], ...cnt.slice(1).map(c => c[0])].slice(0,
                    4) };
            return { rank: 1, name: 'High Card', kicker: vals.slice(0, 5) };
        }

        function compare(a, b) {
            if (a.rank !== b.rank) return a.rank - b.rank;
            for (let i = 0; i < Math.max(a.kicker.length, b.kicker.length); i++) {
                if ((a.kicker[i] || 0) !== (b.kicker[i] || 0)) return (a.kicker[i] || 0) - (b.kicker[i] || 0);
            }
            return 0;
        }

        function allActed() {
            for (let i = 0; i < NUM; i++)
                if (!folded[i] && !allin[i] && bets[i] !== currentBet) return false;
            return true;
        }

        function setBlinds() {
            bets = [0, 0, 0, 0];
            currentBet = 0;
            pot = 0;
            const sb = (dealer + 1) % NUM;
            const bb = (dealer + 2) % NUM;
            const sbA = Math.min(SB, chips[sb]);
            chips[sb] -= sbA;
            bets[sb] = sbA;
            pot += sbA;
            const bbA = Math.min(BB, chips[bb]);
            chips[bb] -= bbA;
            bets[bb] = bbA;
            pot += bbA;
            currentBet = Math.max(sbA, bbA);
            if (chips[sb] <= 0) allin[sb] = true;
            if (chips[bb] <= 0) allin[bb] = true;
            activePlayer = (bb + 1) % NUM;
            lastRaiser = bb;
            while ((folded[activePlayer] || allin[activePlayer]) && activePlayer !== lastRaiser)
                activePlayer = (activePlayer + 1) % NUM;
        }

        function newRound() {
            newDeck();
            community = [];
            hands = [
                [draw(), draw()],
                [draw(), draw()],
                [draw(), draw()],
                [draw(), draw()]
            ];
            folded = [false, false, false, false];
            allin = [false, false, false, false];
            roundOver = false;
            phase = 'preflop';
            dealer = (dealer + 1) % NUM;
            setBlinds();
            updateUI();
            updateButtons();
            setMsg(`🃏 Pre-Flop – ${NAMES[activePlayer]} ist dran!`);
            if (activePlayer !== 0) setTimeout(() => botTurn(activePlayer), 1000 + Math.random() * 500);
        }

        function spielerAktion(act) {
            if (activePlayer !== 0 || roundOver || folded[0] || allin[0]) return;
            const callAmt = currentBet - bets[0];
            switch (act) {
                case 'fold':
                    folded[0] = true;
                    setMsg('😞 Du foldest.');
                    break;
                case 'check':
                    setMsg('✅ Du checkst.');
                    break;
                case 'call':
                    const c = Math.min(callAmt, chips[0]);
                    chips[0] -= c;
                    bets[0] += c;
                    pot += c;
                    if (chips[0] <= 0) allin[0] = true;
                    setMsg(`👈 Du callst ${c}.`);
                    break;
                case 'raise':
                    let r = parseInt(document.getElementById('raiseSlider').value);
                    if (r <= currentBet) return;
                    r = Math.min(r, chips[0] + bets[0]);
                    const add = r - bets[0];
                    chips[0] -= add;
                    bets[0] = r;
                    pot += add;
                    currentBet = bets[0];
                    lastRaiser = 0;
                    if (chips[0] <= 0) allin[0] = true;
                    setMsg(`🔥 Du raist auf ${currentBet}.`);
                    break;
                case 'allin':
                    const a = chips[0];
                    chips[0] = 0;
                    bets[0] += a;
                    pot += a;
                    allin[0] = true;
                    if (bets[0] > currentBet) { currentBet = bets[0];
                        lastRaiser = 0; }
                    setMsg('💀 Du gehst ALL-IN!');
                    break;
            }
            updateUI();
            updateButtons();
            if (roundOver) return;
            nextPlayer();
        }

        function nextPlayer() {
            activePlayer = (activePlayer + 1) % NUM;
            let loops = 0;
            while (activePlayer !== lastRaiser && (folded[activePlayer] || allin[activePlayer]) && loops < NUM) {
                activePlayer = (activePlayer + 1) % NUM;
                loops++;
            }
            if (allActed() || activePlayer === lastRaiser || loops >= NUM) { nextPhase(); return; }
            updateUI();
            updateButtons();
            setMsg(`${NAMES[activePlayer]} ist dran...`);
            if (activePlayer !== 0) setTimeout(() => botTurn(activePlayer), 700 + Math.random() * 500);
        }

        function botTurn(idx) {
            if (roundOver || folded[idx] || allin[idx] || activePlayer !== idx) return;
            const callAmt = currentBet - bets[idx];
            const ev = evaluate(hands[idx]);
            const hs = ev.rank;
            const rf = Math.random();
            let act;
            if (callAmt <= 0) {
                if (hs >= 5 && rf < 0.5) act = 'raise';
                else if (hs >= 3 && rf < 0.3) act = 'raise';
                else act = 'check';
            } else {
                const cv = callAmt / (chips[idx] + callAmt);
                if (hs >= 7) act = rf < 0.55 ? 'raise' : 'call';
                else if (hs >= 5 && cv < 0.4) act = rf < 0.3 ? 'raise' : 'call';
                else if (hs >= 3 && cv < 0.25) act = 'call';
                else if (hs <= 1 && cv > 0.35) act = rf < 0.7 ? 'fold' : 'call';
                else if (cv > 0.65) act = rf < 0.8 ? 'fold' : 'call';
                else act = rf < 0.4 ? 'call' : 'fold';
            }
            if (act === 'raise' && Math.random() < 0.35) act = 'call';
            switch (act) {
                case 'fold':
                    folded[idx] = true;
                    setMsg(`${NAMES[idx]} foldet.`);
                    break;
                case 'check':
                    setMsg(`${NAMES[idx]} checkt.`);
                    break;
                case 'call':
                    const c = Math.min(callAmt, chips[idx]);
                    chips[idx] -= c;
                    bets[idx] += c;
                    pot += c;
                    if (chips[idx] <= 0) allin[idx] = true;
                    setMsg(`${NAMES[idx]} callt ${c}.`);
                    break;
                case 'raise':
                    let rv = currentBet > 0 ? currentBet * 2 : BB * 2;
                    rv = Math.min(rv, chips[idx] + bets[idx]);
                    const add = rv - bets[idx];
                    if (add > 0) {
                        chips[idx] -= add;
                        bets[idx] = rv;
                        pot += add;
                        currentBet = bets[idx];
                        lastRaiser = idx;
                        if (chips[idx] <= 0) allin[idx] = true;
                        setMsg(`${NAMES[idx]} raist auf ${currentBet}.`);
                    } else setMsg(`${NAMES[idx]} checkt.`);
                    break;
            }
            updateUI();
            nextPlayer();
        }

        function nextPhase() {
            if (roundOver) return;
            const active = [];
            for (let i = 0; i < NUM; i++)
                if (!folded[i]) active.push(i);
            if (active.length <= 1) {
                chips[active[0]] += pot;
                pot = 0;
                roundOver = true;
                phase = 'showdown';
                setMsg(`🏆 ${NAMES[active[0]]} gewinnt – alle gefoldet!`);
                updateUI();
                updateButtons();
                return;
            }
            bets = [0, 0, 0, 0];
            currentBet = 0;
            lastRaiser = -1;
            switch (phase) {
                case 'preflop':
                    community.push(draw(), draw(), draw());
                    phase = 'flop';
                    setMsg('🃏🃏🃏 Flop!');
                    break;
                case 'flop':
                    community.push(draw());
                    phase = 'turn';
                    setMsg('🃏 Turn!');
                    break;
                case 'turn':
                    community.push(draw());
                    phase = 'river';
                    setMsg('🃏 River!');
                    break;
                case 'river':
                    phase = 'showdown';
                    showdown();
                    return;
            }
            activePlayer = (dealer + 1) % NUM;
            while (folded[activePlayer] || allin[activePlayer])
                activePlayer = (activePlayer + 1) % NUM;
            lastRaiser = activePlayer;
            updateUI();
            updateButtons();
            setMsg(m => m + ` ${NAMES[activePlayer]} beginnt.`);
            if (activePlayer !== 0) setTimeout(() => botTurn(activePlayer), 800 + Math.random() * 400);
        }

        function showdown() {
            roundOver = true;
            while (community.length < 5) community.push(draw());
            const active = [];
            for (let i = 0; i < NUM; i++)
                if (!folded[i]) active.push(i);
            if (active.length === 1) {
                chips[active[0]] += pot;
                pot = 0;
                setMsg(`🏆 ${NAMES[active[0]]} gewinnt!`);
                updateUI();
                updateButtons();
                return;
            }
            let best = [active[0]];
            let bestEval = evaluate(hands[active[0]]);
            for (let i = 1; i < active.length; i++) {
                const ev = evaluate(hands[active[i]]);
                const cmp = compare(ev, bestEval);
                if (cmp > 0) { best = [active[i]];
                    bestEval = ev; } else if (cmp === 0) best.push(active[i]);
            }
            const share = Math.floor(pot / best.length);
            let rest = pot - share * best.length;
            best.forEach(i => { chips[i] += share; if (rest > 0) { chips[i] += 1;
                    rest--; } });
            const winners = best.map(i => NAMES[i]).join(' & ');
            setMsg(`🏆 ${winners} gewinnt mit: ${bestEval.name}!`);
            pot = 0;
            updateUI();
            updateButtons();
            if (chips[0] <= 0) setTimeout(() => setMsg('💀 Keine Chips mehr – starte ein neues Spiel!'), 1500);
        }

        function neuesSpiel() {
            chips = [START_CHIPS, START_CHIPS, START_CHIPS, START_CHIPS];
            bets = [0, 0, 0, 0];
            folded = [false, false, false, false];
            allin = [false, false, false, false];
            pot = 0;
            currentBet = 0;
            roundOver = false;
            community = [];
            hands = [
                [],
                [],
                [],
                []
            ];
            phase = 'preflop';
            dealer = Math.floor(Math.random() * NUM);
            activePlayer = -1;
            lastRaiser = -1;
            document.getElementById('raiseSlider').value = BB * 2;
            updateSlider();
            setMsg('🔄 Neues Spiel! Viel Glück!');
            newRound();
        }

        function init() {
            chips = [START_CHIPS, START_CHIPS, START_CHIPS, START_CHIPS];
            bets = [0, 0, 0, 0];
            folded = [false, false, false, false];
            allin = [false, false, false, false];
            pot = 0;
            currentBet = 0;
            roundOver = false;
            community = [];
            hands = [
                [],
                [],
                [],
                []
            ];
            phase = 'preflop';
            dealer = Math.floor(Math.random() * NUM);
            activePlayer = -1;
            lastRaiser = -1;
            document.getElementById('raiseSlider').value = BB * 2;
            updateSlider();
            newRound();
        }
        init();
    </script>
</body>
</html>
