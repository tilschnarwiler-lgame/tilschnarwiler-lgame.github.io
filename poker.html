<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Poker – 4 Spieler</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --table: #0d5e2e;
            --table-inner: #0a4a24;
            --text: #f0e6d3;
            --gold: #d4a843;
            --card-bg: #ffffff;
            --card-shadow: rgba(0, 0, 0, 0.35);
            --btn: #c8963e;
            --btn-hover: #d4a843;
            --highlight: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at center, #1a2a3e 0%, #0a0a14 100%);
            font-family: 'Segoe UI', 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 1000px;
        }

        /* ---- TISCH ---- */
        .table {
            background: var(--table);
            background: radial-gradient(ellipse at center, #1a7a3a 0%, #0d5e2e 50%, #073a1a 100%);
            border-radius: 220px;
            padding: 35px 25px 25px;
            box-shadow:
                inset 0 0 100px rgba(0, 0, 0, 0.5),
                0 25px 60px rgba(0, 0, 0, 0.8),
                0 0 0 14px #3d1c00,
                0 0 0 20px #1a0a00;
            position: relative;
            border: 5px solid #6b3a1f;
        }

        .table-inner {
            background: var(--table-inner);
            background: radial-gradient(ellipse at center, #0e5c2c 0%, #0a4a24 70%);
            border-radius: 180px;
            padding: 20px 25px;
            position: relative;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        /* ---- GEGNER-LEISTE OBEN ---- */
        .opponents-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }
        .opponent-mini {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            padding: 10px 14px;
            text-align: center;
            color: var(--text);
            min-width: 100px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.3s, box-shadow 0.3s;
            flex: 1;
            max-width: 160px;
        }
        .opponent-mini.active-turn {
            border-color: var(--highlight);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            }
        }
        .opponent-mini .opp-name {
            font-weight: bold;
            font-size: 0.95em;
            color: #f0e6d3;
        }
        .opponent-mini .opp-chips {
            font-size: 0.8em;
            color: var(--gold);
        }
        .opponent-mini .opp-status {
            font-size: 0.75em;
            min-height: 16px;
            font-weight: bold;
        }
        .opponent-mini .opp-cards-mini {
            display: flex;
            gap: 3px;
            justify-content: center;
            margin: 4px 0;
        }
        .mini-card {
            width: 28px;
            height: 40px;
            border-radius: 3px;
            background: #1a3a5c;
            border: 1px solid #3a6a9c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6em;
            color: #6a9acc;
        }
        .mini-card.revealed {
            background: #fff;
            color: #000;
            font-weight: bold;
            font-size: 0.55em;
            line-height: 1.1;
        }
        .folded-tag {
            color: #e74c3c;
            font-style: italic;
            font-size: 0.8em;
        }
        .allin-tag {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 0.8em;
        }

        /* ---- GEMEINSCHAFTSKARTEN ---- */
        .community-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 105px;
            align-items: center;
        }
        .community-area .card-placeholder {
            width: 68px;
            height: 96px;
            border-radius: 9px;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
        }

        /* ---- KARTEN (richtiges Design) ---- */
        .card {
            width: 68px;
            height: 96px;
            border-radius: 9px;
            background: #fff;
            background: linear-gradient(145deg, #ffffff 0%, #f0ece4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 12px var(--card-shadow), inset 0 0 0 1px rgba(0, 0, 0, 0.06);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: default;
            font-family: 'Georgia', 'Times New Roman', serif;
            border: 1px solid #ddd;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }
        .card.red {
            color: #c0392b;
        }
        .card.black {
            color: #1a1a1a;
        }
        /* Oberes linkes Eck */
        .card .corner-top {
            position: absolute;
            top: 5px;
            left: 7px;
            font-size: 0.65em;
            line-height: 1.1;
            text-align: center;
            font-weight: bold;
        }
        /* Unteres rechtes Eck (gedreht) */
        .card .corner-bottom {
            position: absolute;
            bottom: 5px;
            right: 7px;
            font-size: 0.65em;
            line-height: 1.1;
            text-align: center;
            font-weight: bold;
            transform: rotate(180deg);
        }
        /* Großes Bild in der Mitte */
        .card .card-symbol {
            font-size: 2.2em;
            line-height: 1;
            margin-top: 2px;
        }
        /* Bild-Karten: Bild statt Zahl */
        .card .card-face-icon {
            font-size: 2.6em;
            line-height: 1;
            margin-top: 2px;
        }
        .card .card-value-text {
            font-size: 1.1em;
            font-weight: bold;
            line-height: 1;
        }

        /* ---- SPIELER-BEREICH UNTEN ---- */
        .player-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 14px 22px;
            text-align: center;
            color: var(--text);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s, box-shadow 0.3s;
            max-width: 400px;
            width: 100%;
        }
        .player-area.active-turn {
            border-color: var(--highlight);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }
        .player-name {
            font-weight: bold;
            font-size: 1.15em;
            margin-bottom: 2px;
        }
        .player-chips {
            color: var(--gold);
            font-size: 0.95em;
        }
        .player-cards {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .player-cards .card {
            width: 60px;
            height: 84px;
        }
        .player-cards .card .corner-top,
        .player-cards .card .corner-bottom {
            font-size: 0.55em;
        }
        .player-cards .card .card-symbol {
            font-size: 1.6em;
        }
        .player-cards .card .card-face-icon {
            font-size: 2em;
        }
        .bet-info {
            font-size: 0.85em;
            color: #ffd700;
            min-height: 20px;
            font-weight: bold;
        }

        /* ---- POT ---- */
        .pot-display {
            color: var(--highlight);
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
        }

        /* ---- BUTTONS ---- */
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }
        .actions button {
            padding: 11px 18px;
            font-size: 0.95em;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            background: var(--btn);
            color: #1a1a2e;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            font-family: inherit;
        }
        .actions button:hover:not(:disabled) {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        .actions button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .actions button.fold-btn {
            background: #7f8c8d;
            color: #fff;
        }
        .actions button.fold-btn:hover:not(:disabled) {
            background: #95a5a6;
        }
        .actions button.allin-btn {
            background: #e74c3c;
            color: #fff;
        }
        .actions button.allin-btn:hover:not(:disabled) {
            background: #f35b4c;
        }

        /* ---- RAISE ---- */
        .raise-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .raise-control input[type="range"] {
            width: 120px;
            accent-color: var(--gold);
        }
        .raise-control span {
            color: var(--text);
            font-weight: bold;
            min-width: 40px;
        }

        /* ---- MESSAGE ---- */
        .message {
            color: #f1c40f;
            text-align: center;
            font-weight: bold;
            font-size: 1em;
            min-height: 24px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
        }

        /* ---- NEUES SPIEL BUTTON ---- */
        .new-game-btn {
            display: block;
            margin: 18px auto 0;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 30px;
            border: 2px solid var(--gold);
            cursor: pointer;
            background: transparent;
            color: var(--gold);
            transition: all 0.3s;
            letter-spacing: 1px;
            font-family: inherit;
        }
        .new-game-btn:hover {
            background: var(--gold);
            color: #1a1a2e;
            box-shadow: 0 8px 30px rgba(212, 168, 67, 0.4);
        }

        /* ---- ANIMATION ---- */
        .deal-anim {
            animation: dealCard 0.35s ease-out;
        }
        @keyframes dealCard {
            from {
                transform: translateY(-50px) rotateY(90deg);
                opacity: 0;
            }
            to {
                transform: translateY(0) rotateY(0);
                opacity: 1;
            }
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 700px) {
            .table {
                border-radius: 60px;
                padding: 20px 10px 15px;
            }
            .table-inner {
                border-radius: 45px;
                padding: 12px 8px;
                min-height: 300px;
            }
            .card,
            .community-area .card-placeholder {
                width: 44px;
                height: 62px;
                border-radius: 5px;
            }
            .card .corner-top,
            .card .corner-bottom {
                font-size: 0.5em;
                top: 3px;
                left: 4px;
            }
            .card .card-symbol {
                font-size: 1.4em;
            }
            .card .card-face-icon {
                font-size: 1.7em;
            }
            .player-cards .card {
                width: 42px;
                height: 58px;
            }
            .opponent-mini {
                padding: 6px 8px;
                min-width: 70px;
                border-radius: 10px;
            }
            .opponent-mini .opp-name {
                font-size: 0.75em;
            }
            .actions button {
                padding: 8px 12px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="table">
            <div class="table-inner">
                <!-- 3 Gegner (oben) -->
                <div class="opponents-row" id="opponentsRow">
                    <!-- Anna -->
                    <div class="opponent-mini" id="opp1Area">
                        <div class="opp-name">👩 Anna</div>
                        <div class="opp-chips" id="opp1Chips">💰 1500</div>
                        <div class="opp-cards-mini" id="opp1Cards"></div>
                        <div class="opp-status" id="opp1Status"></div>
                    </div>
                    <!-- Ben -->
                    <div class="opponent-mini" id="opp2Area">
                        <div class="opp-name">👨 Ben</div>
                        <div class="opp-chips" id="opp2Chips">💰 1500</div>
                        <div class="opp-cards-mini" id="opp2Cards"></div>
                        <div class="opp-status" id="opp2Status"></div>
                    </div>
                    <!-- Clara -->
                    <div class="opponent-mini" id="opp3Area">
                        <div class="opp-name">👩‍🦰 Clara</div>
                        <div class="opp-chips" id="opp3Chips">💰 1500</div>
                        <div class="opp-cards-mini" id="opp3Cards"></div>
                        <div class="opp-status" id="opp3Status"></div>
                    </div>
                </div>

                <!-- Gemeinschaftskarten -->
                <div class="community-area" id="communityCards">
                    <div class="card-placeholder"></div>
                    <div class="card-placeholder"></div>
                    <div class="card-placeholder"></div>
                    <div class="card-placeholder"></div>
                    <div class="card-placeholder"></div>
                </div>

                <!-- Pot -->
                <div class="pot-display">🤑 Pot: <span id="potAmount">0</span></div>

                <!-- Spieler (unten) -->
                <div class="player-area active-turn" id="playerArea">
                    <div class="player-name">😎 Du</div>
                    <div class="player-chips" id="playerChips">💰 1500</div>
                    <div class="player-cards" id="playerCards"></div>
                    <div class="bet-info" id="playerBet"></div>
                </div>

                <!-- Nachricht -->
                <div class="message" id="message"></div>

                <!-- Aktionen -->
                <div class="actions" id="actions">
                    <button onclick="spielerAktion('fold')" class="fold-btn" id="foldBtn">❌ Fold</button>
                    <button onclick="spielerAktion('check')" id="checkBtn">✅ Check</button>
                    <button onclick="spielerAktion('call')" id="callBtn">👈 Call</button>
                    <div class="raise-control">
                        <button onclick="spielerAktion('raise')" id="raiseBtn">🔥 Raise</button>
                        <input type="range" id="raiseSlider" min="0" max="100" value="40" oninput="updateRaiseLabel()">
                        <span id="raiseLabel">40</span>
                    </div>
                    <button onclick="spielerAktion('allin')" class="allin-btn" id="allinBtn">💀 All-In</button>
                </div>
            </div>
        </div>
        <button class="new-game-btn" onclick="neuesSpiel()">🔄 Neues Spiel</button>
    </div>

    <script>
        // ==================== SPIEL-LOGIK (4 Spieler) ====================
        const FARBEN = ['Herz', 'Karo', 'Pik', 'Kreuz'];
        const WERTE = ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'Bube', 'Dame', 'König', 'As'];
        const SUIT_SYMBOLS = { 'Herz': '♥', 'Karo': '♦', 'Pik': '♠', 'Kreuz': '♣' };
        const RED_SUITS = ['Herz', 'Karo'];
        const BLACK_SUITS = ['Pik', 'Kreuz'];

        // Bild-Emojis für Hofkarten
        const FACE_ICONS = {
            'Bube': '🤴',
            'Dame': '👸',
            'König': '🤴',
            'As': '👑'
        };
        // Alternative Unicode-Symbole
        const FACE_SYMBOLS = {
            'Bube': '♛',
            'Dame': '♕',
            'König': '♚',
            'As': '★'
        };

        const START_CHIPS = 1500;
        const SMALL_BLIND = 10;
        const BIG_BLIND = 20;

        // Spieler-Daten
        const SPIELER_NAMEN = ['Du', 'Anna', 'Ben', 'Clara'];
        const SPIELER_EMOJI = ['😎', '👩', '👨', '👩‍🦰'];
        const ANZAHL_SPIELER = 4;

        let deck = [];
        let gemeinschaftsKarten = [];
        let haende = [
            [],
            [],
            [],
            []
        ]; // 0=Du, 1=Anna, 2=Ben, 3=Clara
        let chips = [START_CHIPS, START_CHIPS, START_CHIPS, START_CHIPS];
        let einsaetze = [0, 0, 0, 0];
        let gefoldet = [false, false, false, false];
        let allIn = [false, false, false, false];
        let pot = 0;
        let aktuellerEinsatz = 0;
        let dealerIndex = 0; // Wer Dealer ist (rotiert)
        let gamePhase = 'preflop';
        let rundeBeendet = false;
        let aktiverSpielerIndex = -1; // Wer ist dran?
        let letzterRaiser = -1;

        function kartenWert(wert) {
            return WERTE.indexOf(wert) + 2;
        }

        function neuesDeck() {
            deck = [];
            for (let farbe of FARBEN) {
                for (let wert of WERTE) {
                    deck.push({ wert, farbe });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function zieheKarte() {
            return deck.pop();
        }

        // ---- KARTEN-RENDERING (richtiges Design) ----
        function istBildKarte(wert) {
            return ['Bube', 'Dame', 'König', 'As'].includes(wert);
        }

        function kartenHTML(karte, klein = false) {
            const symbol = SUIT_SYMBOLS[karte.farbe];
            const farbKlasse = RED_SUITS.includes(karte.farbe) ? 'red' : 'black';
            const sizeStyle = klein ? 'width:44px;height:62px;' : '';

            let inhalt;
            if (istBildKarte(karte.wert)) {
                // Bild-Karte: Zeige Symbol/Emoji statt Text
                const faceIcon = FACE_SYMBOLS[karte.wert];
                inhalt = `
                    <div class="corner-top">${karte.wert}<br>${symbol}</div>
                    <div class="card-face-icon">${faceIcon}</div>
                    <div class="card-symbol" style="font-size:1.4em;">${symbol}</div>
                    <div class="corner-bottom">${karte.wert}<br>${symbol}</div>`;
            } else {
                // Zahlen-Karte
                inhalt = `
                    <div class="corner-top">${karte.wert}<br>${symbol}</div>
                    <div class="card-symbol">${symbol}</div>
                    <div class="card-value-text">${karte.wert}</div>
                    <div class="corner-bottom">${karte.wert}<br>${symbol}</div>`;
            }

            return `<div class="card ${farbKlasse} deal-anim" style="${sizeStyle}">${inhalt}</div>`;
        }

        function kartenRueckseite(klein = false) {
            const sizeStyle = klein ? 'width:44px;height:62px;' : '';
            return `<div class="card deal-anim" style="background:#1a3a5c;color:#4a7aac;${sizeStyle}">
                <div class="card-symbol" style="font-size:2em;">🂠</div>
            </div>`;
        }

        function miniKarteHTML(karte) {
            const symbol = SUIT_SYMBOLS[karte.farbe];
            const farbKlasse = RED_SUITS.includes(karte.farbe) ? 'red' : 'black';
            let inhalt;
            if (istBildKarte(karte.wert)) {
                const faceIcon = FACE_SYMBOLS[karte.wert];
                inhalt = `${faceIcon} ${symbol}`;
            } else {
                inhalt = `${karte.wert} ${symbol}`;
            }
            return `<div class="mini-card revealed ${farbKlasse}">${inhalt}</div>`;
        }

        function updateUI() {
            // Gemeinschaftskarten
            const commDiv = document.getElementById('communityCards');
            let commHTML = '';
            for (let i = 0; i < 5; i++) {
                if (i < gemeinschaftsKarten.length) {
                    commHTML += kartenHTML(gemeinschaftsKarten[i], false);
                } else {
                    commHTML += '<div class="card-placeholder"></div>';
                }
            }
            commDiv.innerHTML = commHTML;

            // Spieler-Karten (Index 0)
            const pCardsDiv = document.getElementById('playerCards');
            if (haende[0].length > 0) {
                pCardsDiv.innerHTML = haende[0].map(k => kartenHTML(k, true)).join('');
            } else {
                pCardsDiv.innerHTML = '<span style="color:#888;">Keine Karten</span>';
            }

            // Gegner-Karten (Indizes 1,2,3)
            for (let i = 1; i <= 3; i++) {
                const oppCardsDiv = document.getElementById(`opp${i}Cards`);
                const oppStatusDiv = document.getElementById(`opp${i}Status`);
                if (haende[i].length > 0) {
                    if (rundeBeendet || gefoldet[i]) {
                        oppCardsDiv.innerHTML = haende[i].map(k => miniKarteHTML(k)).join('');
                    } else {
                        oppCardsDiv.innerHTML = haende[i].map(() =>
                            '<div class="mini-card">🂠</div>').join('');
                    }
                } else {
                    oppCardsDiv.innerHTML = '';
                }

                // Status
                let statusHTML = '';
                if (gefoldet[i]) statusHTML += '<span class="folded-tag">FOLD</span> ';
                if (allIn[i]) statusHTML += '<span class="allin-tag">ALL-IN</span> ';
                if (einsaetze[i] > 0 && !rundeBeendet) statusHTML += `💵 ${einsaetze[i]}`;
                oppStatusDiv.innerHTML = statusHTML;
                document.getElementById(`opp${i}Chips`).textContent = `💰 ${chips[i]}`;
            }

            // Chips & Pot
            document.getElementById('playerChips').textContent = `💰 ${chips[0]}`;
            document.getElementById('potAmount').textContent = pot;
            document.getElementById('playerBet').textContent = einsaetze[0] > 0 ? `💵 Einsatz: ${einsaetze[0]}` : '';

            if (gefoldet[0]) {
                document.getElementById('playerBet').innerHTML += ' <span class="folded-tag">GEFOLDET</span>';
            }
            if (allIn[0]) {
                document.getElementById('playerBet').innerHTML += ' <span class="allin-tag">ALL-IN</span>';
            }

            // Aktiver-Spieler Highlight
            document.getElementById('playerArea').classList.toggle('active-turn', aktiverSpielerIndex === 0 && !rundeBeendet);
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`opp${i}Area`).classList.toggle('active-turn', aktiverSpielerIndex === i && !
                    rundeBeendet);
            }

            // Raise Slider
            const maxRaise = Math.max(0, chips[0] - (aktuellerEinsatz - einsaetze[0]));
            const minRaise = Math.min(maxRaise, aktuellerEinsatz > 0 ? aktuellerEinsatz * 2 : BIG_BLIND);
            const slider = document.getElementById('raiseSlider');
            slider.max = maxRaise;
            slider.min = Math.min(minRaise, maxRaise);
            if (parseInt(slider.value) > maxRaise) slider.value = maxRaise;
            if (parseInt(slider.value) < parseInt(slider.min)) slider.value = slider.min;
            updateRaiseLabel();
        }

        function updateRaiseLabel() {
            document.getElementById('raiseLabel').textContent = document.getElementById('raiseSlider').value;
        }

        function setMessage(msg) {
            document.getElementById('message').textContent = msg;
        }

        function updateButtons() {
            const foldBtn = document.getElementById('foldBtn');
            const checkBtn = document.getElementById('checkBtn');
            const callBtn = document.getElementById('callBtn');
            const raiseBtn = document.getElementById('raiseBtn');
            const allinBtn = document.getElementById('allinBtn');
            const slider = document.getElementById('raiseSlider');

            const istDran = (aktiverSpielerIndex === 0 && !rundeBeendet && !gefoldet[0] && !allIn[0]);

            if (!istDran) {
                foldBtn.disabled = true;
                checkBtn.disabled = true;
                callBtn.disabled = true;
                raiseBtn.disabled = true;
                allinBtn.disabled = true;
                slider.disabled = true;
                return;
            }

            foldBtn.disabled = false;
            allinBtn.disabled = (chips[0] <= 0);
            slider.disabled = false;

            const callAmount = aktuellerEinsatz - einsaetze[0];

            if (callAmount <= 0) {
                checkBtn.disabled = false;
                callBtn.disabled = true;
                checkBtn.textContent = '✅ Check';
            } else {
                checkBtn.disabled = true;
                callBtn.disabled = (chips[0] <= 0);
                callBtn.textContent = `👈 Call (${callAmount})`;
            }

            const maxRaise = Math.max(0, chips[0] - callAmount);
            raiseBtn.disabled = (maxRaise <= 0 || (aktuellerEinsatz > 0 && maxRaise < aktuellerEinsatz));
        }

        // ==================== HAND-BEWERTUNG ====================
        function bewerteHand(hand, gemeinschaft) {
            const alle = [...hand, ...gemeinschaft];
            const werte = alle.map(k => kartenWert(k.wert));
            const farben = alle.map(k => k.farbe);
            werte.sort((a, b) => b - a);

            const farbenZaehler = {};
            farben.forEach(f => farbenZaehler[f] = (farbenZaehler[f] || 0) + 1);
            const istFlush = Object.values(farbenZaehler).some(c => c >= 5);

            const einzigartig = [...new Set(werte)].sort((a, b) => b - a);
            let istStraight = false;
            let straightHoch = 0;
            for (let i = 0; i <= einzigartig.length - 5; i++) {
                if (einzigartig[i] - einzigartig[i + 4] === 4) {
                    istStraight = true;
                    straightHoch = einzigartig[i];
                    break;
                }
            }
            if (!istStraight && einzigartig.includes(14) && einzigartig.includes(2) && einzigartig.includes(3) &&
                einzigartig.includes(4) && einzigartig.includes(5)) {
                istStraight = true;
                straightHoch = 5;
            }

            const haeufigkeiten = {};
            werte.forEach(w => haeufigkeiten[w] = (haeufigkeiten[w] || 0) + 1);
            const counts = Object.entries(haeufigkeiten).map(([w, c]) => [parseInt(w), c]);
            counts.sort((a, b) => b[1] - a[1] || b[0] - a[0]);

            if (istFlush && istStraight) {
                const farbeFlush = Object.entries(farbenZaehler).find(([f, c]) => c >= 5)[0];
                const kartenFarbe = alle.filter(k => k.farbe === farbeFlush).map(k => kartenWert(k.wert)).sort((a, b) =>
                    b - a);
                const einzigartigF = [...new Set(kartenFarbe)].sort((a, b) => b - a);
                let sfHoch = 0;
                let istSF = false;
                for (let i = 0; i <= einzigartigF.length - 5; i++) {
                    if (einzigartigF[i] - einzigartigF[i + 4] === 4) { istSF = true;
                        sfHoch = einzigartigF[i]; break; }
                }
                if (!istSF && einzigartigF.includes(14) && einzigartigF.includes(2) && einzigartigF.includes(3) &&
                    einzigartigF.includes(4) && einzigartigF.includes(5)) { istSF = true;
                    sfHoch = 5; }
                if (istSF) {
                    if (sfHoch === 14) return { rang: 10, name: 'Royal Flush', kicker: [14] };
                    return { rang: 9, name: 'Straight Flush', kicker: [sfHoch] };
                }
            }
            if (counts[0][1] === 4) return { rang: 8, name: 'Vierling', kicker: [counts[0][0], counts[1][0]] };
            if (counts[0][1] === 3 && counts[1][1] === 2) return { rang: 7, name: 'Full House', kicker: [counts[0][0],
                    counts[1][0]
                ] };
            if (istFlush) {
                const farbeFlush = Object.entries(farbenZaehler).find(([f, c]) => c >= 5)[0];
                const flushWerte = alle.filter(k => k.farbe === farbeFlush).map(k => kartenWert(k.wert)).sort((a, b) => b -
                    a);
                return { rang: 6, name: 'Flush', kicker: flushWerte.slice(0, 5) };
            }
            if (istStraight) return { rang: 5, name: 'Straße', kicker: [straightHoch] };
            if (counts[0][1] === 3) return { rang: 4, name: 'Drilling', kicker: [counts[0][0], ...counts.slice(1).map(c => c[
                    0])].slice(0, 3) };
            if (counts[0][1] === 2 && counts[1][1] === 2) {
                const rest = counts.slice(2).map(c => c[0]);
                return { rang: 3, name: 'Zwei Paare', kicker: [counts[0][0], counts[1][0], ...rest].slice(0, 3) };
            }
            if (counts[0][1] === 2) return { rang: 2, name: 'Paar', kicker: [counts[0][0], ...counts.slice(1).map(c => c[0])]
                    .slice(0, 4) };
            return { rang: 1, name: 'High Card', kicker: werte.slice(0, 5) };
        }

        function vergleicheHaende(bew1, bew2) {
            if (bew1.rang !== bew2.rang) return bew1.rang - bew2.rang;
            for (let i = 0; i < Math.max(bew1.kicker.length, bew2.kicker.length); i++) {
                const k1 = bew1.kicker[i] || 0;
                const k2 = bew2.kicker[i] || 0;
                if (k1 !== k2) return k1 - k2;
            }
            return 0;
        }

        // ==================== SPIELABLAUF ====================
        function naechsterSpielerMitAktion(startIndex) {
            let idx = startIndex;
            for (let i = 0; i < ANZAHL_SPIELER; i++) {
                idx = (startIndex + i) % ANZAHL_SPIELER;
                if (!gefoldet[idx] && !allIn[idx]) return idx;
            }
            return -1; // Keiner kann mehr handeln
        }

        function alleHabenGehandelt() {
            // Prüft ob alle Spieler entweder gefoldet, all-in oder Einsatz gleich aktuellerEinsatz sind
            for (let i = 0; i < ANZAHL_SPIELER; i++) {
                if (!gefoldet[i] && !allIn[i] && einsaetze[i] !== aktuellerEinsatz) return false;
            }
            return true;
        }

        function blindsSetzen() {
            einsaetze = [0, 0, 0, 0];
            aktuellerEinsatz = 0;
            pot = 0;

            // Small Blind = dealerIndex + 1, Big Blind = dealerIndex + 2
            const sbIndex = (dealerIndex + 1) % ANZAHL_SPIELER;
            const bbIndex = (dealerIndex + 2) % ANZAHL_SPIELER;

            const sbBetrag = Math.min(SMALL_BLIND, chips[sbIndex]);
            chips[sbIndex] -= sbBetrag;
            einsaetze[sbIndex] = sbBetrag;
            pot += sbBetrag;

            const bbBetrag = Math.min(BIG_BLIND, chips[bbIndex]);
            chips[bbIndex] -= bbBetrag;
            einsaetze[bbIndex] = bbBetrag;
            pot += bbBetrag;

            aktuellerEinsatz = Math.max(sbBetrag, bbBetrag);

            if (chips[sbIndex] <= 0) allIn[sbIndex] = true;
            if (chips[bbIndex] <= 0) allIn[bbIndex] = true;

            // Erster Spieler nach Big Blind ist dran (Under the Gun)
            aktiverSpielerIndex = (bbIndex + 1) % ANZAHL_SPIELER;
            letzterRaiser = bbIndex;
        }

        function neueRunde() {
            neuesDeck();
            gemeinschaftsKarten = [];
            haende = [
                [zieheKarte(), zieheKarte()],
                [zieheKarte(), zieheKarte()],
                [zieheKarte(), zieheKarte()],
                [zieheKarte(), zieheKarte()]
            ];
            gefoldet = [false, false, false, false];
            allIn = [false, false, false, false];
            rundeBeendet = false;
            gamePhase = 'preflop';
            dealerIndex = (dealerIndex + 1) % ANZAHL_SPIELER;
            blindsSetzen();

            // Wenn aktiver Spieler All-In ist, überspringen
            while (aktiverSpielerIndex >= 0 && (gefoldet[aktiverSpielerIndex] || allIn[aktiverSpielerIndex])) {
                aktiverSpielerIndex = (aktiverSpielerIndex + 1) % ANZAHL_SPIELER;
                if (aktiverSpielerIndex === (dealerIndex + 3) % ANZAHL_SPIELER) break;
            }

            updateUI();
            updateButtons();
            setMessage(`🃏 Pre-Flop – ${SPIELER_NAMEN[aktiverSpielerIndex]} ist dran!`);

            if (aktiverSpielerIndex !== 0 && aktiverSpielerIndex >= 0) {
                setTimeout(() => computerZug(aktiverSpielerIndex), 1000 + Math.random() * 600);
            }
        }

        function spielerAktion(aktion) {
            if (aktiverSpielerIndex !== 0 || rundeBeendet || gefoldet[0] || allIn[0]) return;

            const callAmount = aktuellerEinsatz - einsaetze[0];

            switch (aktion) {
                case 'fold':
                    gefoldet[0] = true;
                    setMessage('😞 Du foldest.');
                    break;
                case 'check':
                    setMessage('✅ Du checkst.');
                    break;
                case 'call':
                    const callBetrag = Math.min(callAmount, chips[0]);
                    chips[0] -= callBetrag;
                    einsaetze[0] += callBetrag;
                    pot += callBetrag;
                    if (chips[0] <= 0) allIn[0] = true;
                    setMessage(`👈 Du callst ${callBetrag}.`);
                    break;
                case 'raise':
                    let raiseBetrag = parseInt(document.getElementById('raiseSlider').value);
                    raiseBetrag = Math.min(raiseBetrag, chips[0] + einsaetze[0]);
                    if (raiseBetrag <= aktuellerEinsatz) return;
                    const additional = raiseBetrag - einsaetze[0];
                    chips[0] -= additional;
                    einsaetze[0] = raiseBetrag;
                    pot += additional;
                    aktuellerEinsatz = einsaetze[0];
                    letzterRaiser = 0;
                    if (chips[0] <= 0) allIn[0] = true;
                    setMessage(`🔥 Du raist auf ${aktuellerEinsatz}.`);
                    break;
                case 'allin':
                    const allInBetrag = chips[0];
                    chips[0] = 0;
                    einsaetze[0] += allInBetrag;
                    pot += allInBetrag;
                    allIn[0] = true;
                    if (einsaetze[0] > aktuellerEinsatz) {
                        aktuellerEinsatz = einsaetze[0];
                        letzterRaiser = 0;
                    }
                    setMessage('💀 Du gehst ALL-IN!');
                    break;
            }

            updateUI();
            updateButtons();

            if (rundeBeendet) return;

            // Nächsten Spieler bestimmen
            aktiverSpielerIndex = (aktiverSpielerIndex + 1) % ANZAHL_SPIELER;
            while (aktiverSpielerIndex !== letzterRaiser && (gefoldet[aktiverSpielerIndex] || allIn[aktiverSpielerIndex])) {
                aktiverSpielerIndex = (aktiverSpielerIndex + 1) % ANZAHL_SPIELER;
                if (alleHabenGehandelt()) break;
            }

            if (alleHabenGehandelt() || aktiverSpielerIndex === letzterRaiser) {
                naechstePhase();
                return;
            }

            updateUI();
            updateButtons();
            setMessage(`${SPIELER_NAMEN[aktiverSpielerIndex]} ist dran...`);

            if (aktiverSpielerIndex !== 0) {
                setTimeout(() => computerZug(aktiverSpielerIndex), 800 + Math.random() * 700);
            }
        }

        function computerZug(spielerIdx) {
            if (rundeBeendet || gefoldet[spielerIdx] || allIn[spielerIdx]) return;
            if (aktiverSpielerIndex !== spielerIdx) return;

            const callAmount = aktuellerEinsatz - einsaetze[spielerIdx];
            const bewertung = bewerteHand(haende[spielerIdx], gemeinschaftsKarten);
            const handStaerke = bewertung.rang;
            const randomFaktor = Math.random();

            let aktion;
            if (callAmount <= 0) {
                if (handStaerke >= 5 && randomFaktor < 0.55) aktion = 'raise';
                else if (handStaerke >= 3 && randomFaktor < 0.35) aktion = 'raise';
                else aktion = 'check';
            } else {
                const callVerhaeltnis = callAmount / (chips[spielerIdx] + callAmount);
                if (handStaerke >= 7) aktion = randomFaktor < 0.6 ? 'raise' : 'call';
                else if (handStaerke >= 5 && callVerhaeltnis < 0.4) aktion = randomFaktor < 0.35 ? 'raise' : 'call';
                else if (handStaerke >= 3 && callVerhaeltnis < 0.25) aktion = 'call';
                else if (handStaerke <= 1 && callVerhaeltnis > 0.35) aktion = randomFaktor < 0.7 ? 'fold' : 'call';
                else if (callVerhaeltnis > 0.65) aktion = randomFaktor < 0.8 ? 'fold' : 'call';
                else aktion = randomFaktor < 0.4 ? 'call' : 'fold';
            }
            if (aktion === 'raise' && Math.random() < 0.35) aktion = 'call';

            const name = SPIELER_NAMEN[spielerIdx];
            switch (aktion) {
                case 'fold':
                    gefoldet[spielerIdx] = true;
                    setMessage(`${name} foldet.`);
                    break;
                case 'check':
                    setMessage(`${name} checkt.`);
                    break;
                case 'call':
                    const callB = Math.min(callAmount, chips[spielerIdx]);
                    chips[spielerIdx] -= callB;
                    einsaetze[spielerIdx] += callB;
                    pot += callB;
                    if (chips[spielerIdx] <= 0) allIn[spielerIdx] = true;
                    setMessage(`${name} callt ${callB}.`);
                    break;
                case 'raise':
                    let raiseVal = aktuellerEinsatz > 0 ? aktuellerEinsatz * 2 : BIG_BLIND * 2;
                    raiseVal = Math.min(raiseVal, chips[spielerIdx] + einsaetze[spielerIdx]);
                    const add = raiseVal - einsaetze[spielerIdx];
                    if (add > 0) {
                        chips[spielerIdx] -= add;
                        einsaetze[spielerIdx] = raiseVal;
                        pot += add;
                        aktuellerEinsatz = einsaetze[spielerIdx];
                        letzterRaiser = spielerIdx;
                        if (chips[spielerIdx] <= 0) allIn[spielerIdx] = true;
                        setMessage(`${name} raist auf ${aktuellerEinsatz}.`);
                    } else {
                        setMessage(`${name} checkt.`);
                    }
                    break;
            }

            updateUI();

            // Nächsten Spieler finden
            aktiverSpielerIndex = (spielerIdx + 1) % ANZAHL_SPIELER;
            let durchlaeufe = 0;
            while (durchlaeufe < ANZAHL_SPIELER &&
                aktiverSpielerIndex !== letzterRaiser &&
                (gefoldet[aktiverSpielerIndex] || allIn[aktiverSpielerIndex])) {
                aktiverSpielerIndex = (aktiverSpielerIndex + 1) % ANZAHL_SPIELER;
                durchlaeufe++;
            }

            if (alleHabenGehandelt() || aktiverSpielerIndex === letzterRaiser || durchlaeufe >= ANZAHL_SPIELER) {
                naechstePhase();
                return;
            }

            updateUI();
            updateButtons();
            setMessage(`${SPIELER_NAMEN[aktiverSpielerIndex]} ist dran...`);

            if (aktiverSpielerIndex !== 0) {
                setTimeout(() => computerZug(aktiverSpielerIndex), 700 + Math.random() * 600);
            }
        }

        function naechstePhase() {
            if (rundeBeendet) return;

            // Prüfen ob nur noch ein Spieler übrig ist
            const aktiveSpieler = [];
            for (let i = 0; i < ANZAHL_SPIELER; i++) {
                if (!gefoldet[i]) aktiveSpieler.push(i);
            }
            if (aktiveSpieler.length <= 1) {
                const gewinner = aktiveSpieler[0];
                chips[gewinner] += pot;
                pot = 0;
                rundeBeendet = true;
                gamePhase = 'showdown';
                setMessage(`🏆 ${SPIELER_NAMEN[gewinner]} gewinnt den Pot (alle anderen gefoldet)!`);
                updateUI();
                updateButtons();
                return;
            }

            // Einsatz zurücksetzen für nächste Phase
            for (let i = 0; i < ANZAHL_SPIELER; i++) einsaetze[i] = 0;
            aktuellerEinsatz = 0;
            letzterRaiser = -1;

            switch (gamePhase) {
                case 'preflop':
                    gemeinschaftsKarten.push(zieheKarte(), zieheKarte(), zieheKarte());
                    gamePhase = 'flop';
                    setMessage('🃏🃏🃏 Flop!');
                    break;
                case 'flop':
                    gemeinschaftsKarten.push(zieheKarte());
                    gamePhase = 'turn';
                    setMessage('🃏 Turn!');
                    break;
                case 'turn':
                    gemeinschaftsKarten.push(zieheKarte());
                    gamePhase = 'river';
                    setMessage('🃏 River!');
                    break;
                case 'river':
                    gamePhase = 'showdown';
                    runShowdown();
                    return;
            }

            // Erster Spieler nach Dealer beginnt
            aktiverSpielerIndex = (dealerIndex + 1) % ANZAHL_SPIELER;
            while (gefoldet[aktiverSpielerIndex] || allIn[aktiverSpielerIndex]) {
                aktiverSpielerIndex = (aktiverSpielerIndex + 1) % ANZAHL_SPIELER;
            }
            letzterRaiser = aktiverSpielerIndex;

            updateUI();
            updateButtons();
            setMessage(prev => prev + ` ${SPIELER_NAMEN[aktiverSpielerIndex]} beginnt.`);

            if (aktiverSpielerIndex !== 0) {
                setTimeout(() => computerZug(aktiverSpielerIndex), 900 + Math.random() * 600);
            }
        }

        function runShowdown() {
            rundeBeendet = true;
            gamePhase = 'showdown';

            while (gemeinschaftsKarten.length < 5) {
                gemeinschaftsKarten.push(zieheKarte());
            }

            const aktiveSpieler = [];
            for (let i = 0; i < ANZAHL_SPIELER; i++) {
                if (!gefoldet[i]) aktiveSpieler.push(i);
            }

            if (aktiveSpieler.length === 1) {
                chips[aktiveSpieler[0]] += pot;
                pot = 0;
                setMessage(`🏆 ${SPIELER_NAMEN[aktiveSpieler[0]]} gewinnt!`);
                updateUI();
                updateButtons();
                return;
            }

            // Beste Hand ermitteln
            let besteSpieler = [aktiveSpieler[0]];
            let besteBewertung = bewerteHand(haende[aktiveSpieler[0]], gemeinschaftsKarten);

            for (let i = 1; i < aktiveSpieler.length; i++) {
                const bew = bewerteHand(haende[aktiveSpieler[i]], gemeinschaftsKarten);
                const vergleich = vergleicheHaende(bew, besteBewertung);
                if (vergleich > 0) {
                    besteSpieler = [aktiveSpieler[i]];
                    besteBewertung = bew;
                } else if (vergleich === 0) {
                    besteSpieler.push(aktiveSpieler[i]);
                }
            }

            // Pot verteilen
            const anteil = Math.floor(pot / besteSpieler.length);
            let rest = pot - anteil * besteSpieler.length;
            besteSpieler.forEach(idx => {
                chips[idx] += anteil;
                if (rest > 0) { chips[idx] += 1;
                    rest--; }
            });

            const gewinnerNamen = besteSpieler.map(idx => SPIELER_NAMEN[idx]).join(' & ');
            setMessage(`🏆 ${gewinnerNamen} gewinnt mit: ${besteBewertung.name}!`);
            pot = 0;
            updateUI();
            updateButtons();

            if (chips[0] <= 0) {
                setTimeout(() => setMessage('💀 Du hast alle Chips verloren! Neues Spiel?'), 1500);
            }
        }

        function neuesSpiel() {
            chips = [START_CHIPS, START_CHIPS, START_CHIPS, START_CHIPS];
            einsaetze = [0, 0, 0, 0];
            gefoldet = [false, false, false, false];
            allIn = [false, false, false, false];
            pot = 0;
            aktuellerEinsatz = 0;
            rundeBeendet = false;
            gemeinschaftsKarten = [];
            haende = [
                [],
                [],
                [],
                []
            ];
            gamePhase = 'preflop';
            dealerIndex = Math.floor(Math.random() * ANZAHL_SPIELER);
            aktiverSpielerIndex = -1;
            letzterRaiser = -1;
            document.getElementById('raiseSlider').value = BIG_BLIND * 2;
            updateRaiseLabel();
            setMessage('🔄 Neues Spiel! Viel Glück!');
            neueRunde();
        }

        function init() {
            document.getElementById('raiseSlider').value = BIG_BLIND * 2;
            updateRaiseLabel();
            dealerIndex = Math.floor(Math.random() * ANZAHL_SPIELER);
            neueRunde();
        }

        init();
    </script>
