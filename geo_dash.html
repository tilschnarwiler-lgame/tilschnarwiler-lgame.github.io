<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBE DASH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#050510;color:#fff;font-family:'Orbitron',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;user-select:none;
}
#wrap{position:relative;border:1px solid rgba(0,255,255,.25);box-shadow:0 0 40px rgba(0,255,255,.12);}
canvas{display:block;}
#pbar{width:100%;height:4px;background:rgba(0,255,255,.08);}
#pfill{height:100%;background:linear-gradient(90deg,#00ffff,#ff00ff);width:0%;box-shadow:0 0 6px #00ffff;transition:width .12s;}
#ui{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:.5rem;padding:0 4px;}
.stat{font-family:'Share Tech Mono',monospace;font-size:.65rem;letter-spacing:.07em;color:rgba(0,255,255,.55);}
.stat b{color:#ffff00;font-size:.82rem;}
/* overlay */
#ov{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,5,16,.93);backdrop-filter:blur(7px);
  padding:12px 0;overflow:hidden;
}
/* level carousel */
#carousel{
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  width:100%;
}
.lvl-card{
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  padding:1.1rem 1.6rem;border:2px solid currentColor;
  background:rgba(0,0,0,.3);min-width:220px;cursor:pointer;
  transition:all .2s;
}
.lvl-card:hover{filter:brightness(1.3);box-shadow:0 0 24px currentColor;}
.lvl-card .num{font-size:2rem;font-weight:900;letter-spacing:.15em;line-height:1;}
.lvl-card .dname{font-size:.72rem;font-weight:700;letter-spacing:.15em;}
.lvl-card .desc{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:rgba(255,255,255,.4);letter-spacing:.1em;margin-top:.1rem;}
.lvl-card .bst{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:rgba(255,255,255,.5);margin-top:.15rem;}
.arrow-row{display:flex;align-items:center;gap:1.4rem;margin-top:.1rem;}
.arr-btn{
  font-size:1.4rem;background:transparent;border:2px solid rgba(255,255,255,.25);
  color:rgba(255,255,255,.5);cursor:pointer;padding:.2rem .7rem;
  transition:all .18s;line-height:1;
}
.arr-btn:hover{border-color:#00ffff;color:#00ffff;box-shadow:0 0 10px rgba(0,255,255,.3);}
.arr-btn:disabled{opacity:.2;cursor:default;}
.lvl-dots{display:flex;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .2s;}
.dot.on{background:currentColor;box-shadow:0 0 6px currentColor;}
.hint-txt{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:rgba(255,255,255,.18);letter-spacing:.1em;margin-top:.4rem;}
.play-btn{
  font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;letter-spacing:.18em;
  padding:.6rem 2.2rem;background:transparent;border:2px solid currentColor;
  cursor:pointer;transition:all .18s;margin-top:.3rem;
}
.play-btn:hover{filter:brightness(1.4);box-shadow:0 0 20px currentColor;}
.skin-btn{
  font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;letter-spacing:.12em;
  padding:.38rem 1.5rem;background:transparent;border:2px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.45);cursor:pointer;transition:all .18s;margin-top:.1rem;
}
.skin-btn:hover{border-color:#00ffff;color:#00ffff;box-shadow:0 0 10px rgba(0,255,255,.25);}
/* game overlays */
.big{font-size:1.9rem;font-weight:900;letter-spacing:.15em;text-shadow:0 0 26px currentColor;}
.pct-txt{font-family:'Share Tech Mono',monospace;font-size:.9rem;color:#ffff00;letter-spacing:.1em;}
.g-btn{font-family:'Orbitron',monospace;font-size:.7rem;font-weight:700;letter-spacing:.12em;padding:.5rem 1.6rem;background:transparent;border:2px solid currentColor;cursor:pointer;transition:all .18s;}
.g-btn:hover{filter:brightness(1.4);}
/* skins */
.skingrid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:480px;padding:0 8px;}
.skincard{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 6px;border:2px solid rgba(255,255,255,.1);border-radius:4px;transition:all .15s;min-width:56px;}
.skincard:hover{filter:brightness(1.2);}
.skincard.sel{background:rgba(255,255,255,.07);}
.skinname{font-family:Orbitron,monospace;font-size:.48rem;letter-spacing:.04em;}
.otitle{font-size:1.3rem;font-weight:900;letter-spacing:.2em;color:#00ffff;text-shadow:0 0 16px #00ffff;margin-bottom:.2rem;}
.osub{font-family:'Share Tech Mono',monospace;font-size:.65rem;color:rgba(255,255,255,.35);letter-spacing:.12em;margin-bottom:.4rem;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="700" height="260"></canvas>
  <div id="pbar"><div id="pfill"></div></div>
  <div id="ov"></div>
</div>
<div id="ui">
  <div class="stat" id="lvlstat">LEVEL —</div>
  <div class="stat">FORTSCHRITT <b id="pct">0</b>%</div>
  <div class="stat">VERSUCHE <b id="att">0</b></div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const ov=document.getElementById('ov');
const pfill=document.getElementById('pfill'),pctEl=document.getElementById('pct');
const attEl=document.getElementById('att'),lvlEl=document.getElementById('lvlstat');
const W=canvas.width,H=canvas.height,GY=H-42,CS=26;
const SPD=5.5,GRAV=0.82,JUMPV=-13.2;

const hs=[0,0,0,0,0];
let menuIdx=0; // currently displayed level in carousel

// ── 10 SKINS
const SKINS=[
  {id:'neon',   name:'NEON',   colors:['#00ffff'],
   draw(c,cs){c.fillStyle=this.colors[0];c.fillRect(-cs/2,-cs/2,cs,cs);c.fillStyle='rgba(0,0,0,.38)';c.fillRect(-cs/2+4,-cs/2+4,cs-8,cs-8);c.fillStyle='#fff';[[-cs/2+2,-cs/2+2],[cs/2-7,-cs/2+2]].forEach(([a,b])=>c.fillRect(a,b,5,5));c.strokeStyle=this.colors[0]+'88';c.lineWidth=1;c.beginPath();c.moveTo(-3,0);c.lineTo(3,0);c.stroke();c.beginPath();c.moveTo(0,-3);c.lineTo(0,3);c.stroke();}},
  {id:'diamond',name:'DIAMOND',colors:['#55ddff'],
   draw(c,cs){c.fillStyle=this.colors[0];c.fillRect(-cs/2,-cs/2,cs,cs);c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.5;c.beginPath();c.moveTo(0,-cs/2+4);c.lineTo(cs/2-4,0);c.lineTo(0,cs/2-4);c.lineTo(-cs/2+4,0);c.closePath();c.stroke();c.fillStyle='rgba(255,255,255,.18)';c.fill();}},
  {id:'fire',   name:'FEUER',  colors:['#ff5500'],
   draw(c,cs){let g=c.createLinearGradient(0,-cs/2,0,cs/2);g.addColorStop(0,'#ffee00');g.addColorStop(.5,'#ff6600');g.addColorStop(1,'#cc0000');c.fillStyle=g;c.fillRect(-cs/2,-cs/2,cs,cs);c.fillStyle='rgba(0,0,0,.28)';c.fillRect(-cs/2+3,-cs/2+3,cs-6,cs-6);c.strokeStyle='rgba(255,230,0,.7)';c.lineWidth=1.5;[-4,0,4].forEach(ox=>{c.beginPath();c.moveTo(ox,cs/2-4);c.lineTo(ox-2,-cs/2+6);c.stroke();});}},
  {id:'galaxy', name:'GALAXY', colors:['#aa00ff'],
   draw(c,cs){let g=c.createLinearGradient(-cs/2,-cs/2,cs/2,cs/2);g.addColorStop(0,'#080020');g.addColorStop(.5,'#6600cc');g.addColorStop(1,'#dd00ff');c.fillStyle=g;c.fillRect(-cs/2,-cs/2,cs,cs);c.fillStyle='#fff';[[-4,-5],[5,-3],[-6,4],[3,6],[0,0]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,1,0,Math.PI*2);c.fill();});c.strokeStyle='rgba(200,100,255,.6)';c.lineWidth=1.5;c.strokeRect(-cs/2+2,-cs/2+2,cs-4,cs-4);}},
  {id:'robot',  name:'ROBOT',  colors:['#99aacc'],
   draw(c,cs){c.fillStyle='#667788';c.fillRect(-cs/2,-cs/2,cs,cs);c.strokeStyle='#2a3a4a';c.lineWidth=1.5;c.strokeRect(-cs/2+2,-cs/2+2,cs-4,cs-4);c.beginPath();c.moveTo(-cs/2+2,0);c.lineTo(cs/2-2,0);c.stroke();c.fillStyle='#00ffcc';c.fillRect(-cs/2+4,-cs/2+5,5,4);c.fillRect(cs/2-9,-cs/2+5,5,4);}},
  {id:'rainbow',name:'RAINBOW',colors:['#ff0000','#ff8800','#ffff00','#00ff00','#0088ff','#ff00ff'],
   draw(c,cs){const cols=this.colors,sw=cs/cols.length;cols.forEach((col,i)=>{c.fillStyle=col;c.fillRect(-cs/2+i*sw,-cs/2,sw,cs);});c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1.5;c.strokeRect(-cs/2,-cs/2,cs,cs);}},
  {id:'ice',    name:'ICE',    colors:['#aaeeff'],
   draw(c,cs){let g=c.createLinearGradient(-cs/2,-cs/2,cs/2,cs/2);g.addColorStop(0,'#e0f8ff');g.addColorStop(1,'#4488cc');c.fillStyle=g;c.fillRect(-cs/2,-cs/2,cs,cs);c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1;[[-cs/2+4,0],[0,-cs/2+4],[cs/2-4,0],[0,cs/2-4]].forEach(([x,y])=>{c.beginPath();c.moveTo(0,0);c.lineTo(x,y);c.stroke();});c.strokeRect(-cs/2+2,-cs/2+2,cs-4,cs-4);}},
  {id:'gold',   name:'GOLD',   colors:['#ffcc00'],
   draw(c,cs){let g=c.createLinearGradient(0,-cs/2,0,cs/2);g.addColorStop(0,'#ffe066');g.addColorStop(.5,'#ffaa00');g.addColorStop(1,'#cc7700');c.fillStyle=g;c.fillRect(-cs/2,-cs/2,cs,cs);c.fillStyle='rgba(255,255,200,.3)';c.fillRect(-cs/2+3,-cs/2+3,cs-6,cs/2-2);c.strokeStyle='#ffee88';c.lineWidth=1.5;c.strokeRect(-cs/2+1,-cs/2+1,cs-2,cs-2);}},
  {id:'dark',   name:'DARK',   colors:['#ff2244'],
   draw(c,cs){c.fillStyle='#110008';c.fillRect(-cs/2,-cs/2,cs,cs);c.strokeStyle='#ff2244';c.lineWidth=2;c.strokeRect(-cs/2+1,-cs/2+1,cs-2,cs-2);c.fillStyle='rgba(255,34,68,.6)';c.beginPath();c.moveTo(0,-cs/2+5);c.lineTo(cs/2-5,cs/2-5);c.lineTo(-cs/2+5,cs/2-5);c.closePath();c.fill();}},
  {id:'matrix', name:'MATRIX', colors:['#00ff44'],
   draw(c,cs){c.fillStyle='#001a00';c.fillRect(-cs/2,-cs/2,cs,cs);c.fillStyle='#00ff44';c.font=`bold ${Math.floor(cs/3.5)}px monospace`;c.textAlign='center';['01','10','00','11'].forEach((t,i)=>{c.fillText(t,(i%2===0?-cs/4:cs/4),(i<2?-cs/4+2:cs/4+4));});c.strokeStyle='#00ff44';c.lineWidth=1.5;c.strokeRect(-cs/2+1,-cs/2+1,cs-2,cs-2);}},
];
let selectedSkin=0;

const stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*(GY-10),r:Math.random()*1.4,a:Math.random()*Math.PI*2}));

// ── tile builders
function s1(x)        {return{type:'spike',x,y:GY-28,w:28,h:28};}        // ground spike
function sp(x,y)      {return{type:'spike',x,y,w:28,h:28};}               // spike at y
function bl(x,h,w=30) {return{type:'block',x,y:GY-h,w,h};}               // block from ground
function pf(x,y,w,c)  {return{type:'plat',x,y,w,h:12,color:c||'#fff'};}  // floating platform

// Physics reference (SPD=5.5, GRAV=0.82, JUMPV=-13.2, CS=26, GY=218):
//   Max jump height: ~113px above ground  →  lowest reachable platform y = GY-CS-113 = 79
//   Air time: ~34 frames  →  horizontal distance = ~187px
//   Max block height: 86px (86+26=112 < 113)
//   Wide block (w>148) = impassable from ground, forces platform use
//   Platform heights used: L1=GY-55, L2=GY-70, L3=GY-90, L4=GY-108  (all reachable)

// ════════════════════════════════════════════════════════
// LEVEL 1 — "NEON VALLEY"
// Pure ground level. Teaches jump timing.
// 8 distinct sections, each with a different feel.
// No platforms — just varied spikes and blocks.
// ════════════════════════════════════════════════════════
const LEVEL1=(()=>{
  const T=[];
  // § 1  Slow start — 3 wide-spaced singles
  T.push(s1(900), s1(1150), s1(1400));
  // § 2  First block — short, then a single after
  T.push(bl(1660,36), s1(1880));
  // § 3  Rapid doubles — two pairs close together
  T.push(s1(2120),s1(2180), s1(2380),s1(2440));
  // § 4  Staircase of two blocks (h=36, h=52) — land on top of each
  T.push(bl(2700,36,28), bl(2738,52,28));
  T.push(s1(2960));
  // § 5  Long relaxed run then surprise double
  T.push(s1(3220), s1(3520), s1(3820),s1(3880));
  // § 6  Tall block (h=68) flanked by spikes — must time carefully
  T.push(s1(4140), bl(4340,68,28), s1(4500));
  // § 7  Rapid singles — rhythm section (6 spikes, shrinking gaps)
  T.push(s1(4760),s1(5020),s1(5250),s1(5460),s1(5650),s1(5820));
  // § 8  Final challenge — two blocks + spike sandwich
  T.push(bl(6060,44,28), s1(6180), bl(6300,52,28));
  T.push(s1(6540), s1(6800), s1(7060));
  T.push(bl(7300,40), s1(7540), s1(7800),s1(7860));
  T.push(bl(8100,56,28), s1(8340), s1(8600));
  return T;
})();
const FINISH1=9100;

// ════════════════════════════════════════════════════════
// LEVEL 2 — "PLATFORM JUNGLE"
// First appearance of platforms. Three LEVELS of elevation.
// Mandatory wide blockers mix with optional shortcut platforms.
// Each section uses a different platform height / width.
// ════════════════════════════════════════════════════════
const LEVEL2=(()=>{
  const T=[], C='#00ccff';
  // § 1  Ground warm-up (no platforms yet)
  T.push(s1(900),s1(960), bl(1180,50), s1(1400),s1(1460));

  // § 2  Level-1 platform (y=GY-55) over short wide block
  //      Player jumps up to low platform, rides over w=140 block, lands back
  T.push(s1(1680));
  T.push(pf(1730, GY-55, 190, C));
  T.push(bl(1760, 32, 140));          // w=140 < 148 but h=32 so borderline — spike before forces jump
  T.push(s1(1940));

  // § 3  Ground interlude — doubles + block
  T.push(s1(2160),s1(2220), bl(2440,54));

  // § 4  Level-2 platform (y=GY-70) over taller wide block
  T.push(s1(2680));
  T.push(pf(2730, GY-70, 210, C));
  T.push(bl(2760, 40, 160));
  T.push(s1(2940));

  // § 5  Two platforms at DIFFERENT heights — step up then step down
  T.push(s1(3160));
  T.push(pf(3220, GY-55, 100, C));   // low platform first
  T.push(pf(3370, GY-80, 100, C));   // high platform second
  T.push(bl(3220, 30, 220));          // wide blocker below both
  T.push(s1(3480));
  T.push(s1(3680),s1(3740));

  // § 6  Tall block (jumpable) + spike after
  T.push(bl(3980,68,28), s1(4140), s1(4200));

  // § 7  Level-2 platform, spike ON platform halfway
  T.push(s1(4420));
  T.push(pf(4470, GY-70, 220, C));
  T.push(bl(4500, 38, 160));
  T.push(sp(4590, GY-70-28));        // spike on platform — must jump while elevated
  T.push(s1(4700));

  // § 8  Ground run — staircase block pair
  T.push(s1(4920),s1(4980));
  T.push(bl(5200,36,28), bl(5238,58,28));
  T.push(s1(5460));

  // § 9  Three-platform staircase ascending: L1 → L2 → L3
  T.push(s1(5680));
  T.push(pf(5730, GY-55, 90, C));    // step 1
  T.push(pf(5870, GY-75, 90, C));    // step 2
  T.push(pf(6010, GY-95, 90, C));    // step 3 (high!)
  T.push(bl(5730, 30, 290));          // wide blocker under all three
  T.push(s1(6120));

  // § 10 Final — doubles + mandatory platform + double spike after
  T.push(s1(6340),s1(6400), bl(6600,56));
  T.push(s1(6840));
  T.push(pf(6890, GY-70, 200, C));
  T.push(bl(6920, 38, 150));
  T.push(s1(7090));
  T.push(s1(7310),s1(7370), bl(7590,52), s1(7810),s1(7870));
  return T;
})();
const FINISH2=8400;

// ════════════════════════════════════════════════════════
// LEVEL 3 — "SPIKE TOWER"
// Tall towers dominate. Platforms at 3 heights bridge gaps.
// Some sections: platform-only route. Others: ground-only.
// Spikes on platforms, spike-between-platforms, towers you land ON.
// ════════════════════════════════════════════════════════
const LEVEL3=(()=>{
  const T=[], C='#ffff00';
  // § 1  Doubles + first tower
  T.push(s1(900),s1(960), bl(1180,68,28));
  T.push(s1(1400),s1(1460));

  // § 2  Two platforms at same height bridging a spike pit (3 ground spikes between)
  T.push(pf(1680, GY-72, 95, C));
  T.push(s1(1790),s1(1850),s1(1910));  // spike pit — must stay on platforms
  T.push(pf(1980, GY-72, 95, C));
  T.push(s1(2130));

  // § 3  Ascending staircase platforms: jump from L1→L2→L3, each with spike
  T.push(s1(2350));
  T.push(pf(2420, GY-58, 80, C));  sp(2450,GY-58-28); // L1 platform + spike
  T.push(sp(2450,GY-58-28));
  T.push(pf(2560, GY-78, 80, C));  // L2
  T.push(sp(2590,GY-78-28));
  T.push(pf(2700, GY-100, 80, C)); // L3 (high)
  T.push(s1(2820));
  T.push(bl(2420, 30, 370));        // wide blocker below all

  // § 4  Ground interlude: tower + spike wrap
  T.push(s1(3040),s1(3100), bl(3320,74,28), s1(3480),s1(3540));

  // § 5  Descending platforms: L3→L2→L1, no spikes — relief section
  T.push(s1(3760));
  T.push(pf(3820, GY-95, 85, C));  // L3
  T.push(pf(3960, GY-72, 85, C));  // L2
  T.push(pf(4100, GY-52, 85, C));  // L1
  T.push(bl(3820, 30, 330));
  T.push(s1(4240));

  // § 6  Tower pair with spike between them
  T.push(bl(4460,70,28), s1(4558), bl(4616,70,28));
  T.push(s1(4810),s1(4870));

  // § 7  Platform with two spikes on it (medium height)
  T.push(s1(5090));
  T.push(pf(5150, GY-72, 180, C));
  T.push(sp(5180,GY-72-28), sp(5270,GY-72-28));
  T.push(bl(5150,36,160));
  T.push(s1(5380));

  // § 8  Three towers ascending in height — land on each
  T.push(s1(5600));
  T.push(bl(5800,46,34), bl(5900,62,34), bl(6000,78,34));
  T.push(s1(6170),s1(6230));

  // § 9  Mixed: L1 platform → ground spike → L2 platform → tower
  T.push(pf(6450, GY-58, 90, C));
  T.push(s1(6560));
  T.push(pf(6640, GY-78, 90, C));
  T.push(sp(6670,GY-78-28));
  T.push(bl(6450,28,270));
  T.push(bl(6780,70,28));
  T.push(s1(6970),s1(7030));

  // § 10 Final gauntlet: spike pit + 3-level platforms + tower + spike
  T.push(pf(7250, GY-60, 80, C));
  T.push(pf(7390, GY-82, 80, C));
  T.push(pf(7530, GY-104, 80, C));  // very high
  T.push(s1(7260),s1(7320),s1(7380)); // pit below
  T.push(bl(7250,28,350));
  T.push(s1(7660));
  T.push(bl(7880,72,28));
  T.push(s1(8100),s1(8160));
  T.push(pf(8380, GY-78, 140, C));
  T.push(sp(8420,GY-78-28), sp(8480,GY-78-28));
  T.push(bl(8380,36,120));
  T.push(s1(8570));
  return T;
})();
const FINISH3=9100;

// ════════════════════════════════════════════════════════
// LEVEL 4 — "VOID BRIDGE"
// Platforms are always forced (wide blockers). But now:
// - Platforms at 4 different heights
// - Some sections have TWO stacked platforms (upper + lower route choice)
// - Spikes on platforms become more complex
// - Short "breather" ground sections between corridor runs
// ════════════════════════════════════════════════════════
const LEVEL4=(()=>{
  const T=[], C='#ff8800';
  // § 1  Ground warm-up
  T.push(s1(900),s1(960), bl(1200,72,28), s1(1420),s1(1480));

  // § 2  Low corridor (y=GY-58): spike before, wide block, spike after
  T.push(s1(1700));
  T.push(pf(1750, GY-58, 200, C));
  T.push(bl(1780, 32, 150));
  T.push(s1(1950));
  T.push(s1(2170),s1(2230));

  // § 3  Mid corridor (y=GY-78) with spike in middle
  T.push(bl(2450,76,28));

function spawnDeathParts(){

  for(let i=0;i<40;i++){let a=(i/40)*Math.PI*2,sp=Math.random()*6+2;particles.push({x:cube.worldX+CS/2,y:cube.y+CS/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1.1,color:c,size:Math.random()*5+2,grav:true});}
  [{ox:-CS/2,oy:-CS/2,vx:-3.5,vy:-4},{ox:CS/2,oy:-CS/2,vx:3.5,vy:-4},{ox:-CS/2,oy:CS/2,vx:-3,vy:2},{ox:CS/2,oy:CS/2,vx:3,vy:2}]
    .forEach(s=>shards.push({x:cube.worldX+CS/2+s.ox,y:cube.y+CS/2+s.oy,vx:s.vx,vy:s.vy,rot:cube.rot,vrot:(Math.random()-.5)*18,color:c,size:CS/2-2,life:1.2}));
}

// ── update
function update(){
  if(state!=='playing'){updP();updS();return;}
  frame++;cube.color=skinColor();
  cube.worldX+=SPD;camX=cube.worldX-100;
  cube.vy+=GRAV;cube.y+=cube.vy;
  if(cube.spinning) cube.rot+=SPD*1.6;
  let onPlat=false;
  for(let t of tiles){
    if(t.type!=='plat') continue;
    if(cube.worldX+CS-4>t.x&&cube.worldX+4<t.x+t.w&&cube.y+CS>=t.y&&cube.y+CS<=t.y+14&&cube.vy>=0){
      cube.y=t.y-CS;cube.vy=0;land();onPlat=true;break;
    }
  }
  if(cube.y>=GY-CS){cube.y=GY-CS;cube.vy=0;if(!cube.onGround)land();cube.onGround=true;}
  else if(!onPlat) cube.onGround=false;
  cube.trail.push({x:cube.worldX+CS/2,y:cube.y+CS/2,life:1});
  if(cube.trail.length>12) cube.trail.shift();
  cube.trail.forEach(t=>t.life-=.09);
  for(let t of tiles){
    if(t.type==='plat') continue;

    // Broad overlap check (generous hitbox for blocks, tight for spikes)
    const isSp = t.type==='spike';
    const sh = isSp ? 4 : 2;  // smaller shrink = more forgiving on blocks
    const overlapX = cube.worldX+sh < t.x+t.w-sh && cube.worldX+CS-sh > t.x+sh;
    const overlapY = cube.y+sh < t.y+t.h && cube.y+CS-sh > t.y;
    if(!overlapX || !overlapY) continue;

    if(t.type==='block'){
      // TOP LANDING: cube is coming from above if its bottom is near the block top.
      // We check the cube bottom against block top with a generous threshold
      // to handle fast-falling (vy can be large, so prevY check alone fails).
      const blockTop = t.y;
      const cubeBotNow  = cube.y + CS;
      const cubeBotPrev = cube.y - cube.vy + CS;  // where bottom was last frame
      // Landing condition: bottom crossed or is near the top surface, moving downward
      const crossedTop = cubeBotPrev <= blockTop + 6 && cubeBotNow >= blockTop - 4;
      const nearTop    = cubeBotNow <= blockTop + 14;  // extra leniency at low speed
      if((crossedTop || nearTop) && cube.vy >= 0){
        cube.y   = blockTop - CS;
        cube.vy  = 0;
        if(!cube.onGround) land();
        cube.onGround = true;
        continue;
      }
      // Side / bottom hit = death
      cube.dead=true;spawnDeathParts();state='dying';setTimeout(()=>{state='dead';showDead();},900);return;
    }

    // Spike = always death on overlap
    cube.dead=true;spawnDeathParts();state='dying';setTimeout(()=>{state='dead';showDead();},900);return;
  }
  if(cube.worldX>=finishX){
    if(100>hs[currentLevel]) hs[currentLevel]=100;
    spawnWinParts();state='win';setTimeout(()=>showWin(),700);return;
  }
  let cur=Math.min(100,Math.floor(cube.worldX/finishX*100));
  if(cur>hs[currentLevel]) hs[currentLevel]=cur;
  updP();updS();bgX-=SPD*.4;
  pfill.style.width=cur+'%';pctEl.textContent=cur;
}
function updP(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=.22;p.life-=.028;});particles=particles.filter(p=>p.life>0);}
function updS(){shards.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.28;s.rot+=s.vrot;s.life-=.022;if(s.y+s.size>GY){s.y=GY-s.size;s.vy*=-.45;s.vx*=.7;}});shards=shards.filter(s=>s.life>0);}
function land(){cube.rot=Math.round(cube.rot/90)*90;cube.spinning=false;cube.onGround=true;for(let i=0;i<5;i++) particles.push({x:cube.worldX+CS/2,y:cube.y+CS,vx:(Math.random()-.5)*2.5,vy:-(Math.random()*2+.4),life:.7,color:skinColor(),size:Math.random()*3+1,grav:false});}

// ── draw
function glow(c,b=12){ctx.shadowBlur=b;ctx.shadowColor=c;}
function noG(){ctx.shadowBlur=0;}

function drawBg(){
  const lv=(state==='playing'||state==='dying'||state==='dead'||state==='win')?LEVELS[currentLevel]:null;
  ctx.fillStyle=lv?lv.bg:'#050510';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.a+=.007;ctx.globalAlpha=.2+Math.sin(s.a)*.15;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(0,255,255,.03)';ctx.lineWidth=1;
  let o=bgX%50;
  for(let x=o;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GY);ctx.stroke();}
  for(let y=0;y<GY;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function drawGround(){
  ctx.fillStyle='#070718';ctx.fillRect(0,GY,W,H-GY);
  glow('#00ffff',8);ctx.strokeStyle='#00ffff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(W,GY);ctx.stroke();noG();
  ctx.strokeStyle='rgba(0,255,255,.12)';ctx.lineWidth=1;
  let g=bgX%55;for(let x=g;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,GY);ctx.lineTo(x,H);ctx.stroke();}
}
function drawFinish(){
  if(state!=='playing'&&state!=='dying') return;
  let sx=finishX-camX;if(sx<-10||sx>W+60) return;
  glow('#ffff00',14);ctx.strokeStyle='#ffff00';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,GY);ctx.stroke();
  for(let r=0;r<8;r++)for(let cc=0;cc<3;cc++)if((r+cc)%2===0){ctx.fillStyle='#ffff00';ctx.fillRect(sx+cc*10,r*GY/8,10,GY/8);}
  noG();
}
function drawTiles(){
  for(let t of tiles){
    let sx=t.x-camX;if(sx>W+60||sx+t.w<-10) continue;
    const c=t.color;
    if(t.type==='plat'){
      glow(c,9);ctx.fillStyle=c+'28';ctx.fillRect(sx,t.y,t.w,t.h);
      ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(sx,t.y,t.w,t.h);
      // bright top edge
      ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(sx,t.y);ctx.lineTo(sx+t.w,t.y);ctx.stroke();
      // support pillars
      ctx.strokeStyle=c+'44';ctx.lineWidth=1;ctx.setLineDash([3,5]);
      [sx+10,sx+t.w-10].forEach(px=>{ctx.beginPath();ctx.moveTo(px,t.y+t.h);ctx.lineTo(px,GY);ctx.stroke();});
      ctx.setLineDash([]);noG();
    } else if(t.type==='spike'){
      glow(c,12);ctx.fillStyle=c;
      ctx.beginPath();ctx.moveTo(sx,t.y+t.h);ctx.lineTo(sx+t.w/2,t.y);ctx.lineTo(sx+t.w,t.y+t.h);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.2)';
      ctx.beginPath();ctx.moveTo(sx+t.w*.17,t.y+t.h);ctx.lineTo(sx+t.w*.5,t.y+t.h*.15);ctx.lineTo(sx+t.w*.43,t.y+t.h);ctx.closePath();ctx.fill();
      noG();
    } else if(t.type==='block'){
      glow(c,9);ctx.fillStyle=c+'1a';ctx.fillRect(sx,t.y,t.w,t.h);
      ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(sx,t.y,t.w,t.h);
      ctx.strokeStyle=c+'55';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx,t.y);ctx.lineTo(sx+t.w,t.y+t.h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx+t.w,t.y);ctx.lineTo(sx,t.y+t.h);ctx.stroke();
      noG();
    }
  }
}
function drawCube(){
  if(cube.dead) return;
  const skin=SKINS[selectedSkin];
  let sx=cube.worldX-camX;
  cube.trail.forEach((t,i)=>{ctx.globalAlpha=t.life*.18;ctx.fillStyle=skin.colors[0];let sz=CS*(i/cube.trail.length)*.5,tsx=t.x-camX;ctx.fillRect(tsx-sz/2,t.y-sz/2,sz,sz);});
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(sx+CS/2,cube.y+CS/2);ctx.rotate(cube.rot*Math.PI/180);
  glow(skin.colors[0],18);skin.draw(ctx,CS);noG();ctx.restore();
}
function drawShards(){
  shards.forEach(s=>{ctx.save();ctx.globalAlpha=Math.max(0,s.life*.9);ctx.translate(s.x-camX,s.y);ctx.rotate(s.rot*Math.PI/180);glow(s.color,12);ctx.fillStyle=s.color;ctx.fillRect(-s.size/2,-s.size/2,s.size,s.size);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-s.size/2+2,-s.size/2+2,s.size-4,s.size-4);noG();ctx.restore();});ctx.globalAlpha=1;
}
function drawParts(){
  particles.forEach(p=>{let sx=p.x-camX;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;glow(p.color,7);ctx.fillRect(sx-p.size/2,p.y-p.size/2,p.size,p.size);});ctx.globalAlpha=1;noG();
}
function drawHUD(){
  if(state!=='playing') return;
  const lv=LEVELS[currentLevel];
  glow(lv.color,8);ctx.fillStyle=lv.color;ctx.textAlign='left';
  ctx.font='bold 11px Orbitron,monospace';ctx.fillText(lv.name+' · '+lv.dname,10,20);noG();
  ctx.font='bold 12px Share Tech Mono,monospace';ctx.fillStyle='rgba(255,255,255,.35)';ctx.textAlign='right';
  ctx.fillText(Math.min(100,Math.floor(cube.worldX/finishX*100))+'%',W-10,20);ctx.textAlign='left';
}

function render(){
  ctx.clearRect(0,0,W,H);drawBg();drawFinish();
  if(state==='playing'||state==='dying'||state==='dead'||state==='win') drawTiles();
  drawGround();drawCube();drawShards();drawParts();drawHUD();
}
function loop(){update();render();requestAnimationFrame(loop);}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  if(e.code==='ArrowLeft'&&state==='menu') menuNav(-1);
  if(e.code==='ArrowRight'&&state==='menu') menuNav(1);
  if(e.code==='Enter'&&state==='menu') loadLevel(menuIdx);
});
canvas.addEventListener('mousedown',jump);
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});

showMenu(0);loop();
</script>

</body>
