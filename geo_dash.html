<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBE DASH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#050510;color:#fff;font-family:'Orbitron',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;user-select:none;
}
#wrap{position:relative;border:1px solid rgba(0,255,255,.25);box-shadow:0 0 40px rgba(0,255,255,.12);}
canvas{display:block;}
#pbar{width:100%;height:4px;background:rgba(0,255,255,.08);}
#pfill{height:100%;background:linear-gradient(90deg,#00ffff,#ff00ff);width:0%;box-shadow:0 0 6px #00ffff;transition:width .12s;}
#ui{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:.55rem;padding:0 4px;}
.stat{font-family:'Share Tech Mono',monospace;font-size:.68rem;letter-spacing:.08em;color:rgba(0,255,255,.6);}
.stat b{color:#ffff00;font-size:.85rem;}
#ov{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,5,16,.92);backdrop-filter:blur(6px);
  gap:.4rem;overflow-y:auto;padding:10px 0;
}
.otitle{font-size:1.5rem;font-weight:900;letter-spacing:.2em;color:#00ffff;text-shadow:0 0 18px #00ffff;}
.osub{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:rgba(255,255,255,.38);letter-spacing:.13em;}
.lvlrow{display:flex;gap:8px;margin-top:.3rem;flex-wrap:wrap;justify-content:center;}
.lvlbtn{
  font-family:'Orbitron',monospace;font-size:.68rem;font-weight:700;letter-spacing:.08em;
  padding:.5rem .9rem;background:transparent;border:2px solid currentColor;
  cursor:pointer;transition:all .18s;text-transform:uppercase;color:inherit;line-height:1.6;min-width:90px;
}
.lvlbtn:hover{filter:brightness(1.4);box-shadow:0 0 16px currentColor;}
.hint{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:rgba(255,255,255,.18);letter-spacing:.1em;}
.big{font-size:1.9rem;font-weight:900;letter-spacing:.15em;text-shadow:0 0 26px currentColor;}
.pct{font-family:'Share Tech Mono',monospace;font-size:.9rem;color:#ffff00;letter-spacing:.1em;}
.skinsbtn{
  font-family:'Orbitron',monospace;font-size:.66rem;font-weight:700;letter-spacing:.13em;
  padding:.45rem 1.8rem;background:transparent;border:2px solid rgba(255,255,255,.22);
  color:rgba(255,255,255,.5);cursor:pointer;transition:all .18s;
}
.skinsbtn:hover{border-color:#00ffff;color:#00ffff;box-shadow:0 0 12px rgba(0,255,255,.28);}
.skingrid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:480px;padding:0 8px;}
.skincard{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;padding:5px 6px;border:2px solid rgba(255,255,255,.1);
  border-radius:4px;transition:all .15s;min-width:56px;
}
.skincard:hover{filter:brightness(1.2);}
.skincard.sel{background:rgba(255,255,255,.07);}
.skinname{font-family:Orbitron,monospace;font-size:.48rem;letter-spacing:.04em;}
</style>

function bl(x,h,w=30) {return{type:'block',x,y:GY-h,w,h};}   // max h=86
function pf(x,yT,w)   {return{type:'plat',x,y:yT,w,h:12};}

const cube={worldX:100,y:GY-CS,vy:0,rot:0,spinning:false,onGround:true,dead:false,color:'#00ffff',trail:[]};

function skinColor(){return SKINS[selectedSkin].colors[0];}

function loadLevel(idx){
  currentLevel=idx;tiles=LEVELS[idx].tiles.slice();finishX=LEVELS[idx].finish;
  attempts=0;lvlEl.textContent='LEVEL '+(idx+1);startRun();
}
function startRun(){
  attempts++;attEl.textContent=attempts;
  Object.assign(cube,{worldX:100,y:GY-CS,vy:0,rot:0,spinning:false,onGround:true,dead:false,trail:[]});
  particles=[];shards=[];camX=0;bgX=0;frame=0;state='playing';ov.style.display='none';
}

function jump(){
  if(state!=='playing') return;
  if(cube.onGround){cube.vy=JUMPV;cube.onGround=false;cube.spinning=true;spawnJumpParts();}
}

function spawnJumpParts(){
  for(let i=0;i<7;i++) particles.push({x:cube.worldX+CS/2,y:GY,vx:(Math.random()-.5)*3.5,vy:-(Math.random()*3+.8),life:1,color:skinColor(),size:Math.random()*3.5+1.5,grav:false});
}
function spawnDeathParts(){
  const c=skinColor();
  for(let i=0;i<40;i++){let a=(i/40)*Math.PI*2,sp=Math.random()*6+2;particles.push({x:cube.worldX+CS/2,y:cube.y+CS/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1.1,color:c,size:Math.random()*5+2,grav:true});}
  [{ox:-CS/2,oy:-CS/2,vx:-3.5,vy:-4},{ox:CS/2,oy:-CS/2,vx:3.5,vy:-4},{ox:-CS/2,oy:CS/2,vx:-3,vy:2},{ox:CS/2,oy:CS/2,vx:3,vy:2}]
    .forEach(s=>shards.push({x:cube.worldX+CS/2+s.ox,y:cube.y+CS/2+s.oy,vx:s.vx,vy:s.vy,rot:cube.rot,vrot:(Math.random()-.5)*18,color:c,size:CS/2-2,life:1.2}));
}
function spawnWinParts(){
  for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2,sp=Math.random()*6+2;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1.2,color:skinColor(),size:Math.random()*7+3,grav:true});}
}

function update(){
  if(state!=='playing'){updP();updS();return;}
  frame++;cube.color=skinColor();
  cube.worldX+=SPD;camX=cube.worldX-100;
  cube.vy+=GRAV;cube.y+=cube.vy;
  if(cube.spinning) cube.rot+=SPD*1.6;
  let onPlat=false;
  for(let t of tiles){
    if(t.type!=='plat') continue;
    if(cube.worldX+CS-4>t.x&&cube.worldX+4<t.x+t.w&&cube.y+CS>=t.y&&cube.y+CS<=t.y+14&&cube.vy>=0){
      cube.y=t.y-CS;cube.vy=0;land();onPlat=true;break;
    }
  }
  if(cube.y>=GY-CS){cube.y=GY-CS;cube.vy=0;if(!cube.onGround)land();cube.onGround=true;}
  else if(!onPlat) cube.onGround=false;
  cube.trail.push({x:cube.worldX+CS/2,y:cube.y+CS/2,life:1});
  if(cube.trail.length>12) cube.trail.shift();
  cube.trail.forEach(t=>t.life-=.09);
  for(let t of tiles){
    if(t.type==='plat') continue;
    if(cube.worldX+5<t.x+t.w-5&&cube.worldX+CS-5>t.x+5&&cube.y+5<t.y+t.h&&cube.y+CS-5>t.y){
      cube.dead=true;spawnDeathParts();state='dying';setTimeout(()=>{state='dead';showDead();},900);return;
    }
  }
  if(cube.worldX>=finishX){
    if(100>hs[currentLevel]) hs[currentLevel]=100;
    spawnWinParts();state='win';setTimeout(()=>showWin(),700);return;
  }
  let cur=Math.min(100,Math.floor(cube.worldX/finishX*100));
  if(cur>hs[currentLevel]) hs[currentLevel]=cur;
  updP();updS();bgX-=SPD*.4;
  pfill.style.width=cur+'%';pctEl.textContent=cur;
}
function updP(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=.22;p.life-=.028;});particles=particles.filter(p=>p.life>0);}
function updS(){shards.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.28;s.rot+=s.vrot;s.life-=.022;if(s.y+s.size>GY){s.y=GY-s.size;s.vy*=-.45;s.vx*=.7;}});shards=shards.filter(s=>s.life>0);}
function land(){cube.rot=Math.round(cube.rot/90)*90;cube.spinning=false;cube.onGround=true;for(let i=0;i<5;i++) particles.push({x:cube.worldX+CS/2,y:cube.y+CS,vx:(Math.random()-.5)*2.5,vy:-(Math.random()*2+.4),life:.7,color:skinColor(),size:Math.random()*3+1,grav:false});}

function hsStr(i){return hs[i]>0?`<div style="font-family:Share Tech Mono,monospace;font-size:.5rem;color:rgba(255,255,255,.42);margin-top:1px">BEST: ${hs[i]}%</div>`:`<div style="font-family:Share Tech Mono,monospace;font-size:.5rem;color:rgba(255,255,255,.2);margin-top:1px">—</div>`;}

function showMenu(){
  state='menu';ov.style.display='flex';
  ov.innerHTML=`
    <div class="otitle">CUBE DASH</div>
    <div class="osub" style="margin-bottom:.2rem">WÄHLE EIN LEVEL</div>
    <div class="lvlrow">
      <button class="lvlbtn" style="color:#00ff88" onclick="loadLevel(0)">LEVEL 1<br><span style="font-size:.55rem;color:rgba(255,255,255,.35)">EINFACH</span>${hsStr(0)}</button>
      <button class="lvlbtn" style="color:#00ccff" onclick="loadLevel(1)">LEVEL 2<br><span style="font-size:.55rem;color:rgba(255,255,255,.35)">LEICHT</span>${hsStr(1)}</button>
      <button class="lvlbtn" style="color:#ffff00" onclick="loadLevel(2)">LEVEL 3<br><span style="font-size:.55rem;color:rgba(255,255,255,.35)">MITTEL</span>${hsStr(2)}</button>
    </div>
    <div class="lvlrow" style="margin-top:0">
      <button class="lvlbtn" style="color:#ff8800" onclick="loadLevel(3)">LEVEL 4<br><span style="font-size:.55rem;color:rgba(255,255,255,.35)">SCHWER</span>${hsStr(3)}</button>
      <button class="lvlbtn" style="color:#ff00ff" onclick="loadLevel(4)">LEVEL 5<br><span style="font-size:.55rem;color:rgba(255,255,255,.35)">EXTREM</span>${hsStr(4)}</button>
    </div>
    <button class="skinsbtn" onclick="showSkins()">🎨 SKINS AUSWÄHLEN</button>
    <div class="hint">LEERTASTE · KLICK · TOUCH ZUM SPRINGEN</div>
  `;
}

function showSkins(){
  state='skins';
  ov.innerHTML=`
    <div class="otitle" style="font-size:1.2rem">SKINS</div>
    <div class="osub">WÄHLE DEINEN WÜRFEL</div>
    <div class="skingrid" id="sgrid"></div>
    <button class="skinsbtn" style="margin-top:.3rem" onclick="showMenu()">← ZURÜCK</button>
  `;
  const g=document.getElementById('sgrid');
  g.innerHTML=SKINS.map((s,i)=>`
    <div class="skincard ${i===selectedSkin?'sel':''}" id="sc_${i}" onclick="selSkin(${i})" style="border-color:${i===selectedSkin?s.colors[0]:'rgba(255,255,255,.1)'}">
      <canvas id="sp_${i}" width="38" height="38"></canvas>
      <div class="skinname" style="color:${s.colors[0]}">${s.name}</div>
    </div>`).join('');
  SKINS.forEach((s,i)=>{
    const pc=document.getElementById('sp_'+i);if(!pc)return;
    const px=pc.getContext('2d');px.clearRect(0,0,38,38);
    px.shadowBlur=10;px.shadowColor=s.colors[0];px.save();px.translate(19,19);s.draw(px,28);px.restore();px.shadowBlur=0;
  });
}
function selSkin(i){
  selectedSkin=i;
  document.querySelectorAll('.skincard').forEach((el,j)=>{
    el.style.borderColor=j===i?SKINS[j].colors[0]:'rgba(255,255,255,.1)';
    el.style.background=j===i?'rgba(255,255,255,.07)':'transparent';
    el.className='skincard'+(j===i?' sel':'');
  });
}

function showDead(){
  ov.style.display='flex';
  const lv=LEVELS[currentLevel];
  const pct=Math.min(100,Math.floor(cube.worldX/finishX*100));
  ov.innerHTML=`
    <div class="big" style="color:#ff00ff">DEAD</div>
    <div class="pct">${pct}% GESCHAFFT</div>
    <button class="lvlbtn" style="color:${lv.color};margin-top:.5rem" onclick="startRun()">NOCHMAL</button>
    <button class="lvlbtn" style="color:rgba(255,255,255,.3);margin-top:.3rem;font-size:.63rem" onclick="showMenu()">LEVEL WAHL</button>
    <div class="hint" style="margin-top:.3rem">VERSUCHE: ${attempts}</div>
  `;
}
function showWin(){
  ov.style.display='flex';
  const lv=LEVELS[currentLevel],next=currentLevel<LEVELS.length-1;
  ov.innerHTML=`
    <div class="big" style="color:${lv.color}">LEVEL KLAR!</div>
    <div class="pct">100% — ${attempts} VERSUCHE</div>
    ${next?`<button class="lvlbtn" style="color:${LEVELS[currentLevel+1].color};margin-top:.5rem" onclick="loadLevel(${currentLevel+1})">NÄCHSTES LEVEL</button>`:'<div class="pct" style="color:#00ff88;margin-top:.5rem">ALLE LEVELS GESCHAFFT 🎉</div>'}
    <button class="lvlbtn" style="color:rgba(255,255,255,.28);margin-top:.3rem;font-size:.63rem" onclick="startRun()">NOCHMAL</button>
    <button class="lvlbtn" style="color:rgba(255,255,255,.28);margin-top:.2rem;font-size:.63rem" onclick="showMenu()">LEVEL WAHL</button>
  `;
}

// ── draw
function glow(c,b=12){ctx.shadowBlur=b;ctx.shadowColor=c;}
function noG(){ctx.shadowBlur=0;}

function drawBg(){
  const lv=(state==='playing'||state==='dying'||state==='dead'||state==='win')?LEVELS[currentLevel]:null;
  ctx.fillStyle=lv?lv.bg:'#050510';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.a+=.007;ctx.globalAlpha=.2+Math.sin(s.a)*.15;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(0,255,255,.03)';ctx.lineWidth=1;
  let o=bgX%50;
  for(let x=o;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GY);ctx.stroke();}
  for(let y=0;y<GY;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function drawGround(){
  ctx.fillStyle='#070718';ctx.fillRect(0,GY,W,H-GY);
  glow('#00ffff',8);ctx.strokeStyle='#00ffff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(W,GY);ctx.stroke();noG();
  ctx.strokeStyle='rgba(0,255,255,.12)';ctx.lineWidth=1;
  let g=bgX%55;for(let x=g;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,GY);ctx.lineTo(x,H);ctx.stroke();}
}
function drawFinish(){
  if(state!=='playing'&&state!=='dying') return;
  let sx=finishX-camX;if(sx<-10||sx>W+60) return;
  glow('#ffff00',14);ctx.strokeStyle='#ffff00';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,GY);ctx.stroke();
  for(let r=0;r<8;r++)for(let cc=0;cc<3;cc++)if((r+cc)%2===0){ctx.fillStyle='#ffff00';ctx.fillRect(sx+cc*10,r*GY/8,10,GY/8);}
  noG();
}
function drawTiles(){
  const lvc=state==='playing'||state==='dying'||state==='dead'||state==='win'?LEVELS[currentLevel].color:'#00ffff';
  for(let t of tiles){
    let sx=t.x-camX;if(sx>W+60||sx+t.w<-10) continue;
    if(!t.color) t.color=t.type==='spike'?lvc:t.type==='block'?'#ff8800':'#00ffff';
    if(t.type==='plat'){
      glow(t.color,9);ctx.fillStyle=t.color+'28';ctx.fillRect(sx,t.y,t.w,t.h);
      ctx.strokeStyle=t.color;ctx.lineWidth=2;ctx.strokeRect(sx,t.y,t.w,t.h);
      ctx.strokeStyle=t.color+'44';ctx.lineWidth=1;ctx.setLineDash([3,5]);
      [sx+8,sx+t.w-8].forEach(px=>{ctx.beginPath();ctx.moveTo(px,t.y+t.h);ctx.lineTo(px,GY);ctx.stroke();});
      ctx.setLineDash([]);noG();
    } else if(t.type==='spike'){
      glow(t.color,12);ctx.fillStyle=t.color;
      ctx.beginPath();ctx.moveTo(sx,t.y+t.h);ctx.lineTo(sx+t.w/2,t.y);ctx.lineTo(sx+t.w,t.y+t.h);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.2)';
      ctx.beginPath();ctx.moveTo(sx+t.w*.17,t.y+t.h);ctx.lineTo(sx+t.w*.5,t.y+t.h*.15);ctx.lineTo(sx+t.w*.43,t.y+t.h);ctx.closePath();ctx.fill();
      noG();
    } else if(t.type==='block'){
      glow(t.color,9);ctx.fillStyle=t.color+'1a';ctx.fillRect(sx,t.y,t.w,t.h);
      ctx.strokeStyle=t.color;ctx.lineWidth=2;ctx.strokeRect(sx,t.y,t.w,t.h);
      ctx.strokeStyle=t.color+'55';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx,t.y);ctx.lineTo(sx+t.w,t.y+t.h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx+t.w,t.y);ctx.lineTo(sx,t.y+t.h);ctx.stroke();
      noG();
    }
  }
}
function drawCube(){
  if(cube.dead) return;
  const skin=SKINS[selectedSkin];
  let sx=cube.worldX-camX;
  cube.trail.forEach((t,i)=>{ctx.globalAlpha=t.life*.18;ctx.fillStyle=skin.colors[0];let sz=CS*(i/cube.trail.length)*.5,tsx=t.x-camX;ctx.fillRect(tsx-sz/2,t.y-sz/2,sz,sz);});
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(sx+CS/2,cube.y+CS/2);ctx.rotate(cube.rot*Math.PI/180);
  glow(skin.colors[0],18);skin.draw(ctx,CS);noG();ctx.restore();
}
function drawShards(){
  shards.forEach(s=>{ctx.save();ctx.globalAlpha=Math.max(0,s.life*.9);ctx.translate(s.x-camX,s.y);ctx.rotate(s.rot*Math.PI/180);glow(s.color,12);ctx.fillStyle=s.color;ctx.fillRect(-s.size/2,-s.size/2,s.size,s.size);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-s.size/2+2,-s.size/2+2,s.size-4,s.size-4);noG();ctx.restore();});ctx.globalAlpha=1;
}
function drawParts(){
  particles.forEach(p=>{let sx=p.x-camX;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;glow(p.color,7);ctx.fillRect(sx-p.size/2,p.y-p.size/2,p.size,p.size);});ctx.globalAlpha=1;noG();
}
function drawHUD(){
  if(state!=='playing') return;
  const lv=LEVELS[currentLevel];
  ctx.font='bold 12px Orbitron,monospace';glow(lv.color,8);ctx.fillStyle=lv.color;ctx.textAlign='left';ctx.fillText(lv.name,12,22);noG();
  ctx.font='bold 12px Share Tech Mono,monospace';ctx.fillStyle='rgba(255,255,255,.35)';ctx.textAlign='right';
  ctx.fillText(Math.min(100,Math.floor(cube.worldX/finishX*100))+'%',W-10,22);ctx.textAlign='left';
}

function render(){
  ctx.clearRect(0,0,W,H);drawBg();drawFinish();
  if(state==='playing'||state==='dying'||state==='dead'||state==='win') drawTiles();
  drawGround();drawCube();drawShards();drawParts();drawHUD();
}
function loop(){update();render();requestAnimationFrame(loop);}

document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});
canvas.addEventListener('mousedown',jump);
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});

showMenu();loop();
</script>
</body>
</html>
