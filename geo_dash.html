<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBE DASH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  :root {
    --cyan: #00ffff; --pink: #ff00ff; --yellow: #ffff00;
    --green: #00ff88; --bg: #050510;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    font-family: 'Orbitron', monospace;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden; user-select: none; color:#fff;
  }
  h1 {
    font-size: 2.2rem; font-weight:900; letter-spacing:0.3em; margin-bottom:0.2rem;
    background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 12px var(--cyan));
  }
  #subtitle {
    font-family:'Share Tech Mono',monospace; font-size:0.7rem;
    letter-spacing:0.2em; color:rgba(0,255,255,0.45); margin-bottom:1rem;
  }
  #gameWrapper {
    position:relative;
    border:1px solid rgba(0,255,255,0.25);
    box-shadow:0 0 40px rgba(0,255,255,0.12), inset 0 0 60px rgba(0,0,40,0.8);
  }
  canvas { display:block; }
  #progressBar { width:100%; height:3px; background:rgba(0,255,255,0.08); }
  #progressFill {
    height:100%;
    background:linear-gradient(90deg,var(--cyan),var(--pink));
    width:0%; box-shadow:0 0 6px var(--cyan); transition:width 0.1s;
  }
  #ui {
    display:flex; justify-content:space-between;
    width:100%; margin-top:0.6rem; padding:0 4px;
  }
  .stat {
    font-family:'Share Tech Mono',monospace; font-size:0.68rem;
    letter-spacing:0.08em; color:rgba(0,255,255,0.65);
  }
  .stat span { color:var(--yellow); font-size:0.85rem; }
  #overlay {
    position:absolute; top:0;left:0;right:0;bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(5,5,16,0.88); backdrop-filter:blur(4px);
  }
  #overlay h2 {
    font-size:1.7rem; font-weight:900; letter-spacing:0.2em;
    color:var(--cyan); text-shadow:0 0 20px var(--cyan); margin-bottom:0.4rem;
  }
  #overlay p {
    font-family:'Share Tech Mono',monospace; font-size:0.72rem;
    color:rgba(255,255,255,0.45); letter-spacing:0.13em; margin-bottom:0.3rem;
  }
  .ovl-hint {
    font-family:'Share Tech Mono',monospace; font-size:0.62rem;
    color:rgba(0,255,136,0.55); letter-spacing:0.1em; margin-bottom:1.2rem;
  }
  #startBtn {
    font-family:'Orbitron',monospace; font-size:0.82rem; font-weight:700;
    letter-spacing:0.18em; padding:0.75rem 2.2rem; background:transparent;
    border:2px solid var(--cyan); color:var(--cyan); cursor:pointer;
    transition:all 0.18s;
    box-shadow:0 0 14px rgba(0,255,255,0.28), inset 0 0 14px rgba(0,255,255,0.05);
  }
  #startBtn:hover {
    background:rgba(0,255,255,0.09);
    box-shadow:0 0 28px rgba(0,255,255,0.55), inset 0 0 18px rgba(0,255,255,0.1);
    text-shadow:0 0 8px var(--cyan);
  }
  #djBar {
    display:flex; gap:5px; margin-top:0.5rem;
  }
  .djDot {
    width:10px; height:10px; border-radius:2px;
    background:var(--pink); box-shadow:0 0 6px var(--pink);
    transition:opacity 0.1s;
  }
  .djDot.used { opacity:0.15; }
</style>
</head>
<body>

<h1>CUBE DASH</h1>
<div id="subtitle">SPACE / KLICK / TOUCH — DOPPELSPRUNG MÖGLICH</div>

<div id="gameWrapper">
  <canvas id="gameCanvas" width="700" height="270"></canvas>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="overlay">
    <h2>CUBE DASH</h2>
    <p>ÜBERLEBE SO LANGE WIE MÖGLICH</p>
    <p class="ovl-hint">✦ PLATTFORMEN · DOPPELSPRUNG · SPIKES</p>
    <button id="startBtn" onclick="startGame()">START</button>
    <div style="font-family:Share Tech Mono,monospace;font-size:0.62rem;color:rgba(255,255,255,0.25);margin-top:0.9rem;letter-spacing:0.1em">LEERTASTE · KLICK · TOUCH</div>
  </div>
</div>

<div id="ui">
  <div class="stat">SCORE <span id="scoreVal">0</span></div>
  <div class="stat">BEST <span id="bestVal">0</span></div>
  <div class="stat">SPEED <span id="speedVal">6.0</span></div>
  <div id="djBar">
    <div class="djDot" id="dj0"></div>
    <div class="djDot used" id="dj1"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('scoreVal');
const bestEl  = document.getElementById('bestVal');
const speedEl = document.getElementById('speedVal');
const progressFill = document.getElementById('progressFill');
const dj0 = document.getElementById('dj0');
const dj1 = document.getElementById('dj1');

const W = canvas.width, H = canvas.height;
const GROUND    = H - 42;
const CS        = 28;           // cube size
const GRAVITY   = 0.62;
const JUMP_V    = -13.8;
const SNAP_DEG  = 90;           // rotation snaps to multiples of 90°

// Colors
const COLS = ['#00ffff','#ff00ff','#ffff00','#00ff88','#ff8800'];

let state = 'idle';
let score = 0, best = 0, frame = 0;
let gameSpeed = 6;
let particles = [], obstacles = [], platforms = [], stars = [];
let bgX = 0;
let obstacleTimer = 0;
let sectionTimer  = 0; // controls segment spawning

// ── stars ──────────────────────────────────────────────
for (let i = 0; i < 80; i++)
  stars.push({ x:Math.random()*W, y:Math.random()*(GROUND-10),
               r:Math.random()*1.4, a:Math.random()*Math.PI*2 });

// ── cube ───────────────────────────────────────────────
const cube = {
  x:90, y:GROUND-CS, vy:0,
  rot:0,          // visual rotation (degrees, always snapped to 90° on land)
  spinning:false, // true while airborne
  spinDir:1,
  onGround:false,
  onPlatform:null,
  jumpsLeft:2,    // double jump counter
  dead:false,
  color:'#00ffff',
  trail:[],
  colorT:0
};

// ── obstacle / segment catalogue ───────────────────────
// Each segment has a pattern array of obstacles spawned relative to W
// type: spike|block|platform
// x,y relative offsets from right edge; y negative = from GROUND up

function seg_singleSpike()   { return [{ type:'spike', dx:0,  fromGround:true, h:28,w:28 }]; }
function seg_doubleSpike()   { return [{ type:'spike', dx:0,  fromGround:true, h:28,w:28 },
                                        { type:'spike', dx:36, fromGround:true, h:28,w:28 }]; }
function seg_tripleSpike()   { return [{ type:'spike', dx:0,  fromGround:true, h:28,w:28 },
                                        { type:'spike', dx:36, fromGround:true, h:28,w:28 },
                                        { type:'spike', dx:72, fromGround:true, h:28,w:28 }]; }
function seg_tallBlock()     { return [{ type:'block', dx:0,  fromGround:true, h:56,w:28 }]; }
function seg_veryTallBlock() { return [{ type:'block', dx:0,  fromGround:true, h:80,w:28 }]; }
// Platform with spike on top (must jump onto platform then over spike)
function seg_platformSpike() {
  return [
    { type:'platform', dx:0,  yAbs: GROUND-65, w:80, h:10 },
    { type:'spike',    dx:26, yAbs: GROUND-65-28, w:28,h:28 }
  ];
}
// Platform for double-jump: spike on ground, platform high, spike on platform
function seg_doubleJump() {
  return [
    { type:'spike',    dx:0,   fromGround:true, h:28,w:28 },
    { type:'platform', dx:50,  yAbs: GROUND-70, w:90,h:10 },
    { type:'spike',    dx:76,  yAbs: GROUND-70-28, w:28,h:28 }
  ];
}
// Two elevated platforms in a row
function seg_stairPlatforms() {
  return [
    { type:'platform', dx:0,   yAbs: GROUND-55, w:75, h:10 },
    { type:'platform', dx:100, yAbs: GROUND-90, w:75, h:10 },
    { type:'spike',    dx:110, yAbs: GROUND-90-28, w:28,h:28 }
  ];
}
// Tall block that forces double jump over it
function seg_tallDoubleJump() {
  return [
    { type:'block', dx:0, fromGround:true, h:64,w:28 },
    { type:'spike', dx:36, fromGround:true, h:28,w:28 }
  ];
}

const SEGMENTS_EASY   = [seg_singleSpike, seg_doubleSpike, seg_tallBlock, seg_platformSpike];
const SEGMENTS_MEDIUM = [seg_doubleSpike, seg_tripleSpike, seg_tallBlock, seg_veryTallBlock,
                         seg_doubleJump, seg_platformSpike, seg_stairPlatforms];
const SEGMENTS_HARD   = [seg_tripleSpike, seg_veryTallBlock, seg_doubleJump,
                         seg_stairPlatforms, seg_tallDoubleJump];

function pickSegment() {
  let pool = score < 60  ? SEGMENTS_EASY
           : score < 150 ? SEGMENTS_MEDIUM
           :               SEGMENTS_HARD;
  return pool[Math.floor(Math.random()*pool.length)]();
}

function spawnSegment() {
  let items = pickSegment();
  items.forEach(item => {
    let obj = {
      type: item.type,
      x: W + 30 + item.dx,
      w: item.w, h: item.h,
      color: COLS[Math.floor(Math.random()*COLS.length)]
    };
    if (item.fromGround)    obj.y = GROUND - item.h;
    else if (item.yAbs !== undefined) obj.y = item.yAbs;

    if (item.type === 'platform') platforms.push(obj);
    else                          obstacles.push(obj);
  });
}

// ── jump ───────────────────────────────────────────────
function jump() {
  if (state === 'dead') return;
  if (state !== 'playing') { startGame(); return; }
  if (cube.jumpsLeft > 0) {
    cube.vy = JUMP_V;
    cube.jumpsLeft--;
    cube.onGround   = false;
    cube.onPlatform = null;
    cube.spinning   = true;
    cube.spinDir    = 1;
    spawnJumpParticles(cube.x + CS/2, cube.y + CS);
    updateDJBar();
  }
}

function updateDJBar() {
  dj0.className = 'djDot' + (cube.jumpsLeft < 1 ? ' used' : '');
  dj1.className = 'djDot' + (cube.jumpsLeft < 2 ? ' used' : '');
}

// ── particles ──────────────────────────────────────────
function spawnJumpParticles(px, py) {
  for (let i=0;i<8;i++)
    particles.push({ x:px, y:py, vx:(Math.random()-.5)*4, vy:-(Math.random()*4+1),
                     life:1, color:cube.color, size:Math.random()*4+2 });
}
function spawnDeathParticles() {
  for (let i=0;i<32;i++) {
    let a = (i/32)*Math.PI*2;
    particles.push({ x:cube.x+CS/2, y:cube.y+CS/2,
                     vx:Math.cos(a)*(Math.random()*5+2),
                     vy:Math.sin(a)*(Math.random()*5+2)-2,
                     life:1, color:COLS[Math.floor(Math.random()*COLS.length)],
                     size:Math.random()*6+2, gravity:true });
  }
}
function spawnLandParticles(px,py) {
  for(let i=0;i<6;i++)
    particles.push({ x:px, y:py, vx:(Math.random()-.5)*3,
                     vy:-(Math.random()*2+0.5), life:0.7,
                     color:cube.color, size:Math.random()*3+1 });
}

// ── startGame ──────────────────────────────────────────
function startGame() {
  cube.x=90; cube.y=GROUND-CS; cube.vy=0; cube.rot=0;
  cube.onGround=true; cube.onPlatform=null; cube.dead=false;
  cube.jumpsLeft=2; cube.spinning=false; cube.trail=[];
  obstacles=[]; platforms=[]; particles=[];
  score=0; frame=0; gameSpeed=6; bgX=0;
  obstacleTimer=0; sectionTimer=0;
  state='playing';
  overlay.style.display='none';
  updateDJBar();
}

function showOverlay(dead) {
  overlay.style.display='flex';
  overlay.innerHTML = dead ? `
    <div style="font-size:2.2rem;font-weight:900;color:#ff00ff;text-shadow:0 0 28px #ff00ff;margin-bottom:.4rem;letter-spacing:.15em">DEAD</div>
    <div style="font-family:Share Tech Mono,monospace;font-size:.95rem;color:#ffff00;margin-bottom:1.1rem;letter-spacing:.1em">SCORE: ${score} &nbsp;|&nbsp; BEST: ${best}</div>
    <button id="startBtn" onclick="startGame()" style="font-family:Orbitron,monospace;font-size:.82rem;font-weight:700;letter-spacing:.18em;padding:.75rem 2.2rem;background:transparent;border:2px solid #00ffff;color:#00ffff;cursor:pointer;box-shadow:0 0 14px rgba(0,255,255,.28)">RETRY</button>
    <div style="font-family:Share Tech Mono,monospace;font-size:.6rem;color:rgba(255,255,255,.22);margin-top:.9rem;letter-spacing:.1em">LEERTASTE · KLICK · TOUCH</div>
  ` : `
    <h2>CUBE DASH</h2>
    <p>ÜBERLEBE SO LANGE WIE MÖGLICH</p>
    <p class="ovl-hint">✦ PLATTFORMEN · DOPPELSPRUNG · SPIKES</p>
    <button id="startBtn" onclick="startGame()" style="font-family:Orbitron,monospace;font-size:.82rem;font-weight:700;letter-spacing:.18em;padding:.75rem 2.2rem;background:transparent;border:2px solid #00ffff;color:#00ffff;cursor:pointer;box-shadow:0 0 14px rgba(0,255,255,.28)">START</button>
    <div style="font-family:Share Tech Mono,monospace;font-size:.62rem;color:rgba(255,255,255,.25);margin-top:.9rem;letter-spacing:.1em">LEERTASTE · KLICK · TOUCH</div>
  `;
}

// ── snap rotation helper ────────────────────────────────
// Returns nearest multiple of 90
function snapRot(r) { return Math.round(r / SNAP_DEG) * SNAP_DEG; }

// ── main update ────────────────────────────────────────
function update() {
  if (state !== 'playing') return;
  frame++;
  score = Math.floor(frame/6);
  if (score > best) best = score;

  gameSpeed = Math.min(13, 6 + Math.floor(score/70)*0.6);

  // Color cycle (smooth)
  cube.colorT += 0.02;
  let ci = Math.floor(cube.colorT) % COLS.length;
  cube.color = COLS[ci];

  // ── gravity & movement ──
  cube.vy += GRAVITY;
  cube.y  += cube.vy;

  // ── rotation: spin 90° increments while airborne ──
  if (cube.spinning) {
    // rotate at speed proportional to gameSpeed
    cube.rot += 5 * cube.spinDir;
  }

  // ── platform collision (top only) ──
  cube.onPlatform = null;
  for (let p of platforms) {
    // land on top of platform
    let prevY = cube.y - cube.vy;
    if (
      cube.x + CS - 4 > p.x &&
      cube.x + 4 < p.x + p.w &&
      prevY + CS <= p.y + 2 &&   // was above
      cube.y + CS >= p.y          // now at or below
    ) {
      cube.y = p.y - CS;
      cube.vy = 0;
      cube.onPlatform = p;
      landCube();
    }
  }

  // ── ground collision ──
  if (cube.y >= GROUND - CS) {
    cube.y = GROUND - CS;
    cube.vy = 0;
    if (!cube.onGround) { landCube(); }
    cube.onGround = true;
  } else {
    cube.onGround = false;
  }

  // ── check fell off platform ──
  if (cube.onPlatform) {
    cube.onGround = false;
  }

  // ── spawn segments ──
  sectionTimer++;
  let interval = Math.max(80, 130 - Math.floor(score/40)*6);
  if (sectionTimer >= interval) {
    sectionTimer = 0;
    spawnSegment();
  }

  // ── move obstacles & platforms ──
  obstacles.forEach(o => o.x -= gameSpeed);
  platforms.forEach(p => p.x -= gameSpeed);
  obstacles = obstacles.filter(o => o.x > -80);
  platforms = platforms.filter(p => p.x > -120);

  // ── obstacle collision ──
  for (let o of obstacles) {
    let shrink = 5;
    if (
      cube.x+shrink < o.x+o.w-shrink &&
      cube.x+CS-shrink > o.x+shrink &&
      cube.y+shrink < o.y+o.h &&
      cube.y+CS-shrink > o.y
    ) {
      spawnDeathParticles();
      state = 'dead';
      setTimeout(() => showOverlay(true), 480);
      return;
    }
  }

  // ── trail ──
  cube.trail.push({ x:cube.x+CS/2, y:cube.y+CS/2, life:1 });
  if (cube.trail.length > 14) cube.trail.shift();
  cube.trail.forEach(t => t.life -= 0.07);

  // ── particles ──
  particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if(p.gravity) p.vy+=0.22;
    p.life-=0.028;
  });
  particles = particles.filter(p=>p.life>0);

  bgX -= gameSpeed * 0.35;
  progressFill.style.width = Math.min(100, score/500*100)+'%';
  scoreEl.textContent = score;
  bestEl.textContent  = best;
  speedEl.textContent = gameSpeed.toFixed(1);
}

function landCube() {
  // snap rotation to nearest 90°
  cube.rot = snapRot(cube.rot);
  cube.spinning = false;
  cube.jumpsLeft = 2;
  updateDJBar();
  spawnLandParticles(cube.x+CS/2, cube.y+CS);
}

// ── draw helpers ───────────────────────────────────────
function drawGlow(color, blur=14) {
  ctx.shadowBlur = blur; ctx.shadowColor = color;
}
function clearGlow() { ctx.shadowBlur=0; }

function drawStars() {
  stars.forEach(s => {
    s.a += 0.008;
    ctx.globalAlpha = 0.25 + Math.sin(s.a)*0.18;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawGrid() {
  ctx.strokeStyle='rgba(0,255,255,0.035)';
  ctx.lineWidth=1;
  let off = bgX%50;
  for(let x=off;x<W;x+=50){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GROUND);ctx.stroke(); }
  for(let y=0;y<GROUND;y+=50){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
}

function drawGround() {
  ctx.fillStyle='#090918';
  ctx.fillRect(0,GROUND,W,H-GROUND);
  drawGlow('#00ffff',8);
  ctx.strokeStyle='#00ffff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  clearGlow();
  ctx.strokeStyle='rgba(0,255,255,0.12)'; ctx.lineWidth=1;
  let gOff = bgX%60;
  for(let x=gOff;x<W;x+=60){ ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x,H);ctx.stroke(); }
}

function drawPlatforms() {
  platforms.forEach(p => {
    // body
    ctx.fillStyle = p.color+'33';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    // top edge glow
    drawGlow(p.color, 10);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
    // brighter top line
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+p.w, p.y); ctx.stroke();
    clearGlow();
    // support pillars
    ctx.strokeStyle = p.color+'55'; ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(p.x+8, p.y+p.h); ctx.lineTo(p.x+8, GROUND); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x+p.w-8, p.y+p.h); ctx.lineTo(p.x+p.w-8, GROUND); ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawSpike(o) {
  ctx.save();
  drawGlow(o.color, 12);
  ctx.fillStyle = o.color;
  ctx.beginPath();
  ctx.moveTo(o.x,       o.y+o.h);
  ctx.lineTo(o.x+o.w/2, o.y);
  ctx.lineTo(o.x+o.w,   o.y+o.h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.moveTo(o.x+o.w*.18, o.y+o.h);
  ctx.lineTo(o.x+o.w/2,   o.y+o.h*.18);
  ctx.lineTo(o.x+o.w*.44, o.y+o.h);
  ctx.closePath(); ctx.fill();
  clearGlow();
  ctx.restore();
}

function drawBlock(o) {
  ctx.save();
  drawGlow(o.color, 9);
  ctx.fillStyle   = o.color+'1a'; ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle = o.color; ctx.lineWidth=2; ctx.strokeRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle = o.color+'55'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(o.x+o.w,o.y+o.h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(o.x+o.w,o.y); ctx.lineTo(o.x,o.y+o.h); ctx.stroke();
  clearGlow();
  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(o => o.type==='spike' ? drawSpike(o) : drawBlock(o));
}

function drawCube() {
  if (cube.dead) return;
  let cx = cube.x+CS/2, cy = cube.y+CS/2;

  // trail
  cube.trail.forEach((t,i) => {
    ctx.globalAlpha = t.life * 0.22;
    ctx.fillStyle = cube.color;
    let sz = CS*(i/cube.trail.length)*0.55;
    ctx.fillRect(t.x-sz/2, t.y-sz/2, sz, sz);
  });
  ctx.globalAlpha=1;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(cube.rot * Math.PI/180);

  drawGlow(cube.color, 18);
  ctx.fillStyle = cube.color;
  ctx.fillRect(-CS/2,-CS/2,CS,CS);

  ctx.fillStyle='rgba(0,0,0,0.38)';
  ctx.fillRect(-CS/2+5,-CS/2+5,CS-10,CS-10);

  // corner dots
  ctx.fillStyle='#fff';
  const corners=[[-CS/2+2,-CS/2+2],[CS/2-7,-CS/2+2]];
  corners.forEach(([cx2,cy2]) => ctx.fillRect(cx2,cy2,5,5));

  // center cross
  ctx.strokeStyle = cube.color+'88'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,4); ctx.stroke();

  clearGlow();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    drawGlow(p.color,7);
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  });
  ctx.globalAlpha=1; clearGlow();
}

function drawHUD() {
  if (state!=='playing') return;
  ctx.font='700 14px Orbitron,monospace';
  ctx.fillStyle='rgba(0,255,255,0.38)';
  ctx.textAlign='right';
  ctx.fillText(String(score).padStart(5,'0'), W-10, 22);
  ctx.textAlign='left';

  // double jump indicator inside canvas
  if (!cube.onGround && !cube.onPlatform) {
    ctx.font='600 11px Share Tech Mono,monospace';
    ctx.fillStyle = cube.jumpsLeft > 0 ? 'rgba(255,0,255,0.7)' : 'rgba(255,0,255,0.2)';
    ctx.fillText('2×', cube.x + CS + 5, cube.y + CS/2 + 4);
  }
}

// ── render ─────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#050510'; ctx.fillRect(0,0,W,H);
  drawStars();
  drawGrid();
  drawPlatforms();
  drawGround();
  drawObstacles();
  drawCube();
  drawParticles();
  drawHUD();
}

function loop() { update(); render(); requestAnimationFrame(loop); }

// ── input ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code==='Space'||e.code==='ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, {passive:false});

loop();
</script>
</body>
</html>
