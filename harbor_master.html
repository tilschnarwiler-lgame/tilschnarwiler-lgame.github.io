
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Canal Master – Container frei & Kollisionsfeuer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a2a1a;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100vh; overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  touch-action: none;
}
#ui {
  width: 660px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 20px;
  background: linear-gradient(180deg, #2a4a8a, #1e3670);
  border: 2px solid #5a8acc; border-bottom: none;
  border-radius: 12px 12px 0 0;
}
.us { display: flex; flex-direction: column; align-items: center; }
.ul { color: #8ab4e8; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
.uv { color: #fff; font-size: 26px; font-weight: 900; line-height: 1; }
#tt { color: #c8deff; font-size: 17px; font-weight: 900; letter-spacing: 3px; }
canvas { display: block; border-radius: 0 0 12px 12px; border: 2px solid #5a8acc; border-top: none; }
#ov {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
#ov.on { pointer-events: all; }
.ob {
  background: rgba(8,20,45,.96); border: 3px solid #5599ff;
  border-radius: 16px; padding: 36px 56px; text-align: center;
  box-shadow: 0 0 60px rgba(85,153,255,.3);
}
.ob h1 { color: #6bf; font-size: 28px; font-weight: 900; letter-spacing: 4px; margin-bottom: 12px; }
.ob h2 { color: #f55; font-size: 22px; font-weight: 900; margin-bottom: 8px; }
.ob p  { color: #9bc; font-size: 13px; line-height: 2; margin-bottom: 18px; }
.ob .fin { color: #ffd844; font-size: 44px; font-weight: 900; margin: 10px 0 20px; }
.btn {
  background: linear-gradient(180deg, #4a9eff, #2266cc);
  color: #fff; border: 2px solid #6ab4ff;
  padding: 12px 44px; font-size: 15px; font-weight: 900;
  letter-spacing: 2px; border-radius: 8px; cursor: pointer;
  transition: all .15s; text-transform: uppercase;
}
.btn:hover { background: linear-gradient(180deg, #6ab4ff, #3377dd); transform: scale(1.05); }
</style>
</head>
<body>
<div id="ui">
  <div class="us"><div class="ul">Cargo</div><div class="uv" id="sv">0</div></div>
  <div id="tt">CANAL MASTER</div>
  <div class="us"><div class="ul">Level</div><div class="uv" id="lv">1</div></div>
</div>
<canvas id="gc" width="660" height="540"></canvas>
<div id="ov" class="on">
  <div class="ob">
    <h1>CANAL MASTER</h1>
    <p>Ziehe vom Schiff eine Linie<br>zum gleichfarbigen Hafen.<br><br>
    <span style="color:#cc44ff">&#9632;</span> Violett &nbsp;&middot;&nbsp;
    <span style="color:#ffdd00">&#9632;</span> Gelb<br><br>
    <span style="color:#88ff88">Level 1:</span> nur 1 Container<br>
    <span style="color:#88ff88">ab Level 2:</span> 1-2 Container<br>
    <span style="color:#88ff88">ab Level 4:</span> 1, 2 oder 4 Container<br><br>
    🔥 Kollision = kleiner Brand mit Rauch<br>
    Leere Schiffe können aus dem Hafen gelotst werden</p>
    <button class="btn" onclick="startGame()">Spielen</button>
  </div>
</div>

<script>
'use strict';
const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d');
const W = 660, H = 540;

const COLORS = ['violet','yellow'];
const HEX    = { violet:'#cc44ff', yellow:'#ffdd00' };
const HEXD   = { violet:'#8800aa', yellow:'#aa8800' };

const LL=140, TRX=510, TRY=115;

const HARBOURS = [
  { color:'violet', bays:[
    { bx:50, by:76,  bw:92, bh:56, y1:76, y2:132 },
    { bx:50, by:140, bw:92, bh:56, y1:140, y2:196 },
  ]},
  { color:'yellow', bays:[
    { bx:50, by:318, bw:92, bh:56, y1:318, y2:374 },
    { bx:50, by:382, bw:92, bh:56, y1:382, y2:438 },
  ]},
];
HARBOURS.forEach(h => h.bays.forEach(b => {
  b.dockX = b.bx + b.bw * 0.45;
  b.dockY = b.by + b.bh * 0.5;
  b.entX  = b.bx + b.bw;
  b.entY  = b.dockY;
  b.color = h.color;
}));

const SPAWNS = [
  { x:230, y:-32, dx:0,  dy:1  },
  { x:360, y:-32, dx:0,  dy:1  },
  { x:470, y:-32, dx:0,  dy:1  },
  { x:692, y:190, dx:-1, dy:0  },
  { x:692, y:330, dx:-1, dy:0  },
  { x:260, y:572, dx:0,  dy:-1 },
  { x:420, y:572, dx:0,  dy:-1 },
];

function inWater(x,y){
  if(x<0||x>W||y<0||y>H) return false;
  if(x>TRX&&y<TRY) return false;
  if(x<LL){
    for(const h of HARBOURS)
      for(const b of h.bays)
        if(x>=b.bx&&x<=b.bx+b.bw&&y>=b.by&&y<=b.by+b.bh) return true;
    return false;
  }
  return true;
}
function offScreen(x,y){ return x<-40||x>W+40||y<-40||y>H+40; }
function isLeftLand(x,y){
  if(x>=LL||x<0) return false;
  for(const h of HARBOURS)
    for(const b of h.bays)
      if(x>=b.bx&&x<=b.bx+b.bw&&y>=b.by&&y<=b.by+b.bh) return false;
  return true;
}

let ships=[],score=0,level=1,running=false;
let spawnTimer=100,spawnDelay=300,nextZone=0,lastZone=-1;
let dragShip=null,dragPts=[],dragValid=true;
let particles=[],wakes=[],flashTimer=0;
let fireParticles=[];

function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function getMaxCargoForLevel(currentLevel){
  if(currentLevel < 2) return 1;
  if(currentLevel < 4) return 2;
  return 4;
}

function spawnCollisionFire(x,y){
  for(let i=0;i<25;i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.3 + Math.random() * 1.2;
    const type = Math.random() > 0.55 ? 'fire' : 'smoke';
    fireParticles.push({
      x: x + (Math.random()-0.5)*25,
      y: y + (Math.random()-0.5)*20,
      vx: Math.cos(angle) * speed,
      vy: -0.4 - Math.random() * 1.2,
      life: 0.8 + Math.random() * 0.5,
      type: type,
      size: 3 + Math.random() * 8
    });
  }
  for(let i=0;i<12;i++){
    fireParticles.push({
      x: x + (Math.random()-0.5)*30,
      y: y - 5 + Math.random() * 15,
      vx: (Math.random()-0.5) * 0.6,
      vy: -0.6 - Math.random() * 1.0,
      life: 0.7 + Math.random() * 0.6,
      type: 'smoke',
      size: 7 + Math.random() * 14
    });
  }
}

function updateFire(){
  fireParticles = fireParticles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= 0.008;
    return p.life > 0;
  });
}

function drawFire(){
  for(const p of fireParticles){
    ctx.globalAlpha = p.life * 0.6;
    if(p.type === 'fire'){
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * p.life);
      grad.addColorStop(0, '#ffaa44');
      grad.addColorStop(0.5, '#ff6600');
      grad.addColorStop(1, '#cc3300');
      ctx.fillStyle = grad;
    } else {
      const darkness = 40 + Math.floor(50 * (1 - p.life));
      ctx.fillStyle = `rgba(${darkness}, ${darkness}, ${darkness}, ${p.life * 0.5})`;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

class Ship {
  constructor(zi){
    const sp=SPAWNS[zi];
    this.x=sp.x; this.y=sp.y; this.vx=sp.dx; this.vy=sp.dy;
    this.angle=Math.atan2(sp.dy,sp.dx);
    this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
    
    const maxAllowed = getMaxCargoForLevel(level);
    let possibleSizes = [];
    if(maxAllowed === 1) possibleSizes = [1];
    else if(maxAllowed === 2) possibleSizes = [1, 2];
    else possibleSizes = [1, 2, 4];
    
    this.maxCargo = possibleSizes[Math.floor(Math.random() * possibleSizes.length)];
    this.cargo = this.maxCargo;
    
    this.spd = 0.92 - (this.maxCargo - 1) * 0.08;
    if(this.spd < 0.55) this.spd = 0.55;
    if(this.maxCargo === 1) this.spd = 0.92;
    
    this.state='enter';
    this.path=[]; this.pathIdx=0;
    this.dockBay=null; this.unloadT=0;
    this.pulseT=Math.random()*Math.PI*2;
    this.wakeT=0; this.warn=false; this.blinkT=0;
    
    this.HL = 38 + this.maxCargo * 9;
    this.HW = 12 + this.maxCargo * 1.5;
  }

  getMatchingBay(){
    for(const h of HARBOURS){
      if(h.color!==this.color) continue;
      for(const b of h.bays)
        if(this.x>=b.bx&&this.x<=b.bx+b.bw&&this.y>=b.by&&this.y<=b.by+b.bh) return b;
    }
    return null;
  }

  moveCargoStep(nx,ny){
    if(inWater(nx,ny)){this.x=nx;this.y=ny;return;}
    const cx=inWater(nx,this.y), cy=inWater(this.x,ny);
    if(cx){this.x=nx;this.vy*=-1;}
    else if(cy){this.y=ny;this.vx*=-1;}
    else{this.vx*=-1;this.vy*=-1;}
    this.angle=Math.atan2(this.vy,this.vx);
  }

  clampCargo(){
    if(this.x<LL+2){this.x=LL+2;this.vx=Math.abs(this.vx)||0.3;this.angle=Math.atan2(this.vy,this.vx);}
    if(this.x>W-2){this.x=W-2;this.vx=-(Math.abs(this.vx)||0.3);this.angle=Math.atan2(this.vy,this.vx);}
    if(this.y<2){this.y=2;this.vy=Math.abs(this.vy)||0.3;this.angle=Math.atan2(this.vy,this.vx);}
    if(this.y>H-2){this.y=H-2;this.vy=-(Math.abs(this.vy)||0.3);this.angle=Math.atan2(this.vy,this.vx);}
  }

  update(){
    this.pulseT+=0.04;
    this.blinkT=(this.blinkT+1)%30;
    const sp=this.spd;

    if(this.state==='enter'){
      this.x+=this.vx*sp; this.y+=this.vy*sp;
      if(inWater(this.x,this.y)) this.state='auto';
      return;
    }
    if(this.state==='done') return;
    if(this.state==='docked') return;

    if(this.state==='unloading'){
      this.unloadT++;
      if(this.unloadT>=85){
        this.unloadT=0; this.cargo--; score++; updateUI();
        for(let i=0;i<6;i++){
          const a=Math.random()*Math.PI*2, s=1+Math.random()*3;
          particles.push({x:this.x,y:this.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col:HEX[this.color],life:1});
        }
        if(this.cargo<=0) this.state='docked';
      }
      return;
    }

    if(this.state==='docking'){
      const b=this.dockBay;
      const dx=b.dockX-this.x, dy=b.dockY-this.y, d=Math.hypot(dx,dy);
      if(d<2){
        this.x=b.dockX; this.y=b.dockY;
        this.angle=Math.PI; this.state='unloading'; this.unloadT=0;
      } else {
        const s=Math.min(sp*0.8,d);
        this.x+=dx/d*s; this.y+=dy/d*s; this.angle=Math.atan2(dy,dx);
      }
      return;
    }

    if(this.state==='auto'){
      const nx=this.x+this.vx*sp, ny=this.y+this.vy*sp;
      if(this.cargo>0){
        this.moveCargoStep(nx,ny); this.clampCargo();
        const bay=this.getMatchingBay();
        if(bay){this.dockBay=bay;this.state='docking';return;}
      } else {
        this.x=nx; this.y=ny;
        if(offScreen(this.x,this.y)){this.state='done';return;}
        if(isLeftLand(this.x,this.y)){
          this.x-=this.vx*sp; this.y-=this.vy*sp;
          const cx=inWater(nx,this.y), cy=inWater(this.x,ny);
          if(!cx) this.vx*=-1;
          if(!cy) this.vy*=-1;
          if(cx&&cy){this.vx*=-1;this.vy*=-1;}
          this.angle=Math.atan2(this.vy,this.vx);
        }
      }
      return;
    }

    if(this.state==='path'){
      if(this.pathIdx>=this.path.length){
        if(this.cargo>0){
          const bay=this.getMatchingBay();
          if(bay){this.dockBay=bay;this.state='docking';}
          else this.state='auto';
        } else {
          this.state='auto';
        }
        this.path=[]; this.pathIdx=0; return;
      }
      const tgt=this.path[this.pathIdx];
      const dx=tgt.x-this.x, dy=tgt.y-this.y, d=Math.hypot(dx,dy);
      if(d<5){this.pathIdx++;return;}
      const s=Math.min(sp,d);
      const nx=this.x+dx/d*s, ny=this.y+dy/d*s;
      if(this.cargo>0){
        this.moveCargoStep(nx,ny); this.clampCargo();
        const bay=this.getMatchingBay();
        if(bay){this.dockBay=bay;this.state='docking';this.path=[];this.pathIdx=0;return;}
      } else {
        this.x=nx; this.y=ny;
        if(offScreen(this.x,this.y)){this.state='done';return;}
        if(isLeftLand(this.x,this.y)){
          this.x-=dx/d*s; this.y-=dy/d*s;
          this.vx*=-1; this.vy*=-1;
          this.state='auto'; this.path=[]; this.pathIdx=0; return;
        }
      }
      this.angle=Math.atan2(dy,dx);
      this.vx=Math.cos(this.angle); this.vy=Math.sin(this.angle);
    }
  }

  draw(){
    ctx.save();
    ctx.translate(this.x,this.y); ctx.rotate(this.angle);
    const L=this.HL, B=this.HW, n=this.maxCargo;
    const cc=HEX[this.color], cd=HEXD[this.color];
    const warnOn=this.warn&&this.blinkT<15;
    
    ctx.beginPath();
    ctx.moveTo(L/2,0);
    ctx.bezierCurveTo(L/2,-B/2,L/4,-B/2,0,-B/2);
    ctx.lineTo(-L/2+10,-B/2);
    ctx.quadraticCurveTo(-L/2,-B/2,-L/2,0);
    ctx.quadraticCurveTo(-L/2,B/2,-L/2+10,B/2);
    ctx.lineTo(0,B/2);
    ctx.bezierCurveTo(L/4,B/2,L/2,B/2,L/2,0);
    ctx.closePath();
    
    if(warnOn){
      ctx.fillStyle='#ff4444';
    } else {
      const g=ctx.createLinearGradient(0,-B/2,0,B/2);
      g.addColorStop(0,'#d8dfe8'); g.addColorStop(0.45,'#b8c2cc'); g.addColorStop(1,'#8898a8');
      ctx.fillStyle=g;
    }
    ctx.fill();
    ctx.strokeStyle=warnOn?'#ff0000':'#607080'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillStyle='#506070'; ctx.fillRect(-L/2+10,B/2-4,L-18,3);
    
    // Container (völlig freistehend)
    const cW = Math.max(7, Math.min(12, (L-34)/n));
    const cH = B * 0.55;
    const totW = n * cW + (n-1) * 2;
    let cx = -totW/2 + 4;
    
    for(let i=0;i<n;i++){
      const filled = i < this.cargo;
      rrect(cx, -cH/2, cW, cH, 2);
      if(filled){
        const grad = ctx.createLinearGradient(cx, -cH/2, cx+cW, cH/2);
        grad.addColorStop(0, cc); grad.addColorStop(1, cd);
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = 'rgba(150,160,175,0.28)';
      }
      ctx.fill();
      ctx.strokeStyle = filled ? cd : 'rgba(80,100,120,0.5)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      
      if(filled && cW > 8){
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(cx + cW*0.3, -cH/2); ctx.lineTo(cx + cW*0.3, cH/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx + cW*0.6, -cH/2); ctx.lineTo(cx + cW*0.6, cH/2); ctx.stroke();
      }
      cx += cW + 2;
    }
    
    // Heckbrücke (ganz links)
    ctx.fillStyle = '#6a7e8e';
    rrect(-L/2+4, -B*0.22, 14, B*0.48, 2);
    ctx.fill();
    ctx.fillStyle = '#8aa4b4';
    rrect(-L/2+6, -B*0.14, 8, B*0.32, 1.5);
    ctx.fill();
    ctx.fillStyle = '#c8deff';
    ctx.fillRect(-L/2+8, -B*0.07, 4, 5);
    
    // Schornstein (ganz rechts)
    ctx.fillStyle = '#5a6a78';
    rrect(L/2-10, -B*0.3, 5, B*0.45, 1);
    ctx.fill();
    
    ctx.font = `bold ${Math.max(8, Math.min(11, L*0.08))}px "Courier New", monospace`;
    ctx.fillStyle = '#ffeaaccc';
    ctx.fillText(`${this.maxCargo}`, L/2-10, -B*0.2);
    
    if(this.state==='auto'||this.state==='path'){
      const p=0.5+0.5*Math.sin(this.pulseT*2);
      ctx.beginPath(); 
      ctx.ellipse(0,0,L/2+5+p*4,B/2+4+p*2,0,0,Math.PI*2);
      ctx.strokeStyle=cc+Math.floor(p*120).toString(16).padStart(2,'0');
      ctx.lineWidth=1.5; ctx.stroke();
    }
    if(this.state==='docked'){
      const p=0.5+0.5*Math.sin(this.pulseT*1.5);
      ctx.beginPath(); 
      ctx.ellipse(0,0,L/2+6+p*3,B/2+5+p*2,0,0,Math.PI*2);
      ctx.strokeStyle=`rgba(80,255,120,${0.4+p*0.5})`; 
      ctx.lineWidth=2; ctx.stroke();
    }
    if(this.state==='unloading'){
      const pr=this.unloadT/85;
      ctx.fillStyle='rgba(0,0,0,0.3)'; 
      ctx.fillRect(-L/2,B/2+2,L,5);
      ctx.fillStyle=cc; 
      ctx.fillRect(-L/2,B/2+2,L*pr,5);
    }
    ctx.restore();
  }
}

function tickParticles(){
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.9;p.vy*=0.9;p.life-=0.025;return p.life>0;});
  wakes=wakes.filter(p=>{p.life-=0.04;p.r*=0.97;return p.life>0;});
}
function drawParticles(){
  wakes.forEach(p=>{ctx.globalAlpha=p.life*0.18;ctx.fillStyle='#cde';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
}

let bgCanvas=null;
function buildBackground(){
  bgCanvas=document.createElement('canvas'); bgCanvas.width=W; bgCanvas.height=H;
  const b=bgCanvas.getContext('2d');
  
  // Wasser
  const wg=b.createLinearGradient(LL,0,W,H);
  wg.addColorStop(0,'#3a8ec8'); wg.addColorStop(0.5,'#2878b5'); wg.addColorStop(1,'#1c62a0');
  b.fillStyle=wg; b.fillRect(0,0,W,H);
  
  // Linkes Land mit geschwungener Küste
  b.beginPath();
  b.moveTo(0,0);
  for(let y=0; y<=H; y+=12){
    let x = LL + Math.sin(y*0.035)*8 + Math.cos(y*0.02)*5;
    b.lineTo(x, y);
  }
  b.lineTo(0, H);
  const gradLand = b.createLinearGradient(0,0,LL,0);
  gradLand.addColorStop(0,'#2a5a2a');
  gradLand.addColorStop(0.5,'#4a8a3a');
  gradLand.addColorStop(1,'#6aaa50');
  b.fillStyle=gradLand;
  b.fill();
  
  // Sandbuchten
  b.beginPath();
  b.moveTo(0,0);
  for(let y=0; y<=H; y+=12){
    let x = LL + Math.sin(y*0.035)*8 + Math.cos(y*0.02)*5 - 6;
    b.lineTo(x, y);
  }
  b.lineTo(0, H);
  b.fillStyle='#d4b87a';
  b.fill();
  
  // Bäume
  for(let i=0;i<35;i++){
    let treeX = 15 + Math.random() * (LL - 20);
    let treeY = 20 + Math.random() * (H - 40);
    b.fillStyle='#3a6a2a';
    b.beginPath();
    b.ellipse(treeX, treeY, 5, 7, 0, 0, Math.PI*2);
    b.fill();
    b.fillStyle='#2a4a1a';
    b.beginPath();
    b.ellipse(treeX-1, treeY-2, 3, 5, 0, 0, Math.PI*2);
    b.fill();
  }
  
  // Felsen
  b.fillStyle='#6a6a5a';
  for(let i=0;i<18;i++){
    let rockX = 10 + Math.random() * (LL - 15);
    let rockY = 30 + Math.random() * (H - 60);
    b.beginPath();
    b.ellipse(rockX, rockY, 5+Math.random()*4, 3+Math.random()*3, 0, 0, Math.PI*2);
    b.fill();
    b.fillStyle='#8a7a5a';
    b.beginPath();
    b.ellipse(rockX-1, rockY-1, 3, 2, 0, 0, Math.PI*2);
    b.fill();
    b.fillStyle='#6a6a5a';
  }
  
  // Rechte obere Landzunge
  b.beginPath();
  b.moveTo(TRX, 0);
  for(let x=TRX; x<=W; x+=8){
    let y = TRY + Math.sin(x*0.04)*8 + Math.cos(x*0.015)*4;
    b.lineTo(x, y);
  }
  b.lineTo(W, 0);
  b.fillStyle='#4a7a3a';
  b.fill();
  
  // Bäume auf der rechten Landzunge
  for(let i=0;i<12;i++){
    let treeX = TRX + 10 + Math.random() * (W - TRX - 20);
    let treeY = 10 + Math.random() * (TRY - 15);
    b.fillStyle='#3a6a2a';
    b.beginPath();
    b.ellipse(treeX, treeY, 4, 6, 0, 0, Math.PI*2);
    b.fill();
  }
  
  // Hafenbecken
  HARBOURS.forEach(h=>{
    h.bays.forEach(bay=>{
      const wbg=b.createLinearGradient(bay.bx,0,bay.bx+bay.bw,0);
      wbg.addColorStop(0,'#1a6098'); wbg.addColorStop(1,'#2878b5');
      b.fillStyle=wbg; b.fillRect(bay.bx,bay.by,bay.bw,bay.bh);
      b.fillStyle='#3a5060';
      b.fillRect(bay.bx,bay.by,bay.bw,4);
      b.fillRect(bay.bx,bay.by+bay.bh-4,bay.bw,4);
      b.fillRect(bay.bx,bay.by,4,bay.bh);
      b.fillStyle='#7a8ea0'; b.fillRect(bay.bx+4,bay.by+4,40,bay.bh-8);
      b.fillStyle='#8da0b4'; b.fillRect(bay.bx+6,bay.by+6,36,bay.bh-12);
      const col=HEX[h.color];
      b.fillStyle=col; b.fillRect(bay.bx+6,bay.by+6,10,bay.bh-12);
      b.fillStyle=col+'88';
      [0.35,0.6].forEach(fx=>{b.beginPath();b.arc(bay.bx+6+fx*36,bay.dockY,4,0,Math.PI*2);b.fill();});
      [[bay.entX,bay.by+8],[bay.entX,bay.by+bay.bh-8]].forEach(([px,py])=>{
        b.beginPath();b.arc(px,py,4,0,Math.PI*2);b.fillStyle='#3a5060';b.fill();
        b.beginPath();b.arc(px,py,2.5,0,Math.PI*2);b.fillStyle='#7090a0';b.fill();
      });
      b.strokeStyle=col+'cc'; b.lineWidth=2; b.setLineDash([4,3]);
      b.beginPath(); b.moveTo(bay.entX+3,bay.by+6); b.lineTo(bay.entX+3,bay.by+bay.bh-6);
      b.stroke(); b.setLineDash([]);
    });
  });
  
  // Küstenlinie - OHNE die Hafenbecken zu durchschneiden
  b.strokeStyle='#c8b468'; b.lineWidth=2.5;
  // Sammle alle Y-Bereiche der Hafenbecken, die ausgespart werden müssen
  const skipRanges = [];
  HARBOURS.forEach(h => {
    h.bays.forEach(bay => {
      skipRanges.push({ start: bay.by - 2, end: bay.by + bay.bh + 2 });
    });
  });
  skipRanges.sort((a,b) => a.start - b.start);
  
  // Küstenlinie zeichnen, die die Hafenbereiche überspringt
  b.beginPath();
  let isDrawing = true;
  let lastX = null, lastY = null;
  
  for(let y=0; y<=H; y+=3){
    // Prüfen, ob aktuelle Y-Position in einem zu überspringenden Bereich liegt
    let skip = false;
    for(const range of skipRanges){
      if(y >= range.start && y <= range.end){
        skip = true;
        break;
      }
    }
    
    let x = LL + Math.sin(y*0.035)*8 + Math.cos(y*0.02)*5;
    
    if(!skip){
      if(!isDrawing){
        // Neuen Pfad beginnen
        b.beginPath();
        b.moveTo(x, y);
        isDrawing = true;
        lastX = x; lastY = y;
      } else {
        if(lastX !== null && Math.abs(x - lastX) < 30){
          b.lineTo(x, y);
        } else {
          b.stroke();
          b.beginPath();
          b.moveTo(x, y);
        }
        lastX = x; lastY = y;
      }
    } else {
      if(isDrawing){
        b.stroke();
        isDrawing = false;
        lastX = null;
      }
    }
  }
  if(isDrawing) b.stroke();
  
  // Zusätzliche Küstenlinie für die rechte Landzunge (keine Hafenbecken dort)
  b.beginPath();
  b.moveTo(TRX, 0);
  for(let x=TRX; x<=W; x+=5){
    let y = TRY + Math.sin(x*0.04)*8 + Math.cos(x*0.015)*4;
    b.lineTo(x, y);
  }
  b.stroke();
}

function drawWaves(){
  const t=Date.now()*0.0008;
  ctx.save();
  ctx.beginPath(); ctx.rect(LL,0,TRX-LL,TRY); ctx.rect(LL,TRY,W-LL,H-TRY); ctx.clip();
  for(let row=0;row<9;row++){
    ctx.strokeStyle=`rgba(255,255,255,${0.03+row*0.004})`; ctx.lineWidth=1.1;
    ctx.beginPath();
    for(let x=LL;x<=W;x+=3){
      const y=40+row*60+Math.sin(x*.026+t+row*.9)*5+Math.sin(x*.011+t*.55+row)*3;
      x===LL?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawHarbourGlows(){
  const t=Date.now()*0.002;
  HARBOURS.forEach((h,hi)=>{
    h.bays.forEach((bay,bi)=>{
      const p=0.55+0.45*Math.sin(t+hi*1.4+bi*0.7);
      const a16=Math.floor(p*160).toString(16).padStart(2,'0');
      const g=ctx.createRadialGradient(bay.entX,bay.entY,2,bay.entX,bay.entY,30);
      g.addColorStop(0,HEX[h.color]+a16); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bay.entX,bay.entY,30,0,Math.PI*2); ctx.fill();
    });
  });
}

function drawSpawnArrow(){
  if(!running) return;
  const thr=Math.min(spawnDelay*0.55,280);
  if(spawnTimer>thr) return;
  const sp=SPAWNS[nextZone];
  const frac=spawnTimer/thr, alpha=(1-frac)*0.9;
  const bounce=Math.sin(Date.now()*0.005)*5*(1-frac);
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.translate(Math.max(20,Math.min(W-20,sp.x)),Math.max(20,Math.min(H-20,sp.y)));
  ctx.rotate(Math.atan2(sp.dy,sp.dx)); ctx.translate(bounce,0);
  ctx.fillStyle='#ffdd22'; ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(18,0);ctx.lineTo(2,-11);ctx.lineTo(2,-5);
  ctx.lineTo(-14,-5);ctx.lineTo(-14,5);ctx.lineTo(2,5);ctx.lineTo(2,11);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,22,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-frac));
  ctx.strokeStyle='rgba(255,220,0,0.6)'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();
}

function inAnyBay(ship){
  for(const h of HARBOURS)
    for(const b of h.bays)
      if(ship.x>=b.bx&&ship.x<=b.bx+b.bw&&ship.y>=b.by&&ship.y<=b.by+b.bh) return true;
  return false;
}

function updateWarnings(){
  if(!running) return;
  ships.forEach(s=>s.warn=false);
  
  const dockOccupancy = new Map();
  for(const ship of ships){
    if(ship.state === 'done') continue;
    for(const h of HARBOURS){
      for(const b of h.bays){
        if(ship.x >= b.bx && ship.x <= b.bx+b.bw && ship.y >= b.by && ship.y <= b.by+b.bh){
          if(!dockOccupancy.has(b)) dockOccupancy.set(b, []);
          dockOccupancy.get(b).push(ship);
          break;
        }
      }
    }
  }
  
  for(const [bay, shipsInBay] of dockOccupancy){
    if(shipsInBay.length >= 2){
      for(const ship of shipsInBay) ship.warn = true;
      for(let i=0; i<shipsInBay.length; i++){
        for(let j=i+1; j<shipsInBay.length; j++){
          const a = shipsInBay[i], b = shipsInBay[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if(d < (a.HL + b.HL) * 0.28){
            spawnCollisionFire((a.x+b.x)/2, (a.y+b.y)/2);
            flashTimer=30;
            triggerGameOver();
            return;
          }
        }
      }
    }
  }
  
  for(let i=0;i<ships.length;i++){
    for(let j=i+1;j<ships.length;j++){
      const a=ships[i], b=ships[j];
      if(a.state==='done'||b.state==='done') continue;
      if(offScreen(a.x,a.y)||offScreen(b.x,b.y)) continue;
      
      const aInBay = inAnyBay(a);
      const bInBay = inAnyBay(b);
      
      if(aInBay && bInBay) continue;
      
      let collisionDist = (a.HL + b.HL) * 0.27;
      let warningDist = 130;
      
      if(aInBay !== bInBay){
        collisionDist = (a.HL + b.HL) * 0.23;
        warningDist = 100;
      }
      
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(d < collisionDist){
        spawnCollisionFire((a.x+b.x)/2, (a.y+b.y)/2);
        flashTimer=30;
        triggerGameOver();
        return;
      }
      if(d < warningDist){
        a.warn=true;
        b.warn=true;
      }
    }
  }
}

function validatePath(ship, pts){
  if(ship.cargo === 0 || ship.state === 'docked') return true;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], bp=pts[i];
    const steps=Math.ceil(Math.hypot(bp.x-a.x,bp.y-a.y)/8);
    for(let s=1;s<=steps;s++){
      const t=s/steps;
      const x=a.x+(bp.x-a.x)*t, y=a.y+(bp.y-a.y)*t;
      if(x<-5||x>W+5||y<-5||y>H+5) return false;
      if(!inWater(x,y)) return false;
    }
  }
  return true;
}

function getPos(e,te){
  const r=canvas.getBoundingClientRect();
  const sx=W/r.width, sy=H/r.height;
  const src=te?e.changedTouches[0]:(e.touches?e.touches[0]:e);
  return{x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy};
}
canvas.addEventListener('mousedown', e=>{e.preventDefault();pointerDown(getPos(e,false));});
canvas.addEventListener('mousemove', e=>{e.preventDefault();pointerMove(getPos(e,false));});
canvas.addEventListener('mouseup',   e=>{e.preventDefault();pointerUp(getPos(e,false));});
canvas.addEventListener('touchstart',e=>{e.preventDefault();pointerDown(getPos(e,false));},{passive:false});
canvas.addEventListener('touchmove', e=>{e.preventDefault();pointerMove(getPos(e,false));},{passive:false});
canvas.addEventListener('touchend',  e=>{e.preventDefault();pointerUp(getPos(e,true)); },{passive:false});

function pointerDown(pos){
  if(!running) return;
  dragShip=null; dragPts=[]; dragValid=true;
  for(let i=ships.length-1;i>=0;i--){
    const s=ships[i];
    if(s.state==='done'||s.state==='docking') continue;
    if(Math.hypot(pos.x-s.x,pos.y-s.y)<s.HL/2+18){
      dragShip=s; dragPts=[{x:s.x,y:s.y}]; break;
    }
  }
}
function pointerMove(pos){
  if(!dragShip) return;
  const stat=dragShip.state==='docked'||dragShip.state==='unloading';
  if(!stat) dragPts[0]={x:dragShip.x,y:dragShip.y};
  const last=dragPts[dragPts.length-1];
  if(Math.hypot(pos.x-last.x,pos.y-last.y)>6) dragPts.push({x:pos.x,y:pos.y});
  dragValid=validatePath(dragShip,dragPts);
}
function pointerUp(pos){
  if(!dragShip) return;
  const ship=dragShip; dragShip=null;
  if(dragPts.length<2||!dragValid){dragPts=[];dragValid=true;return;}
  const finalPath=[{x:ship.x,y:ship.y},...dragPts.slice(1)];
  const stationary=ship.state==='docked'||ship.state==='unloading';
  if(!stationary && finalPath.length>1){
    let startIdx=0;
    for(let i=1;i<finalPath.length;i++){
      const dx=finalPath[i].x-ship.x, dy=finalPath[i].y-ship.y;
      const dot=dx*ship.vx+dy*ship.vy;
      const len=Math.hypot(dx,dy);
      if(len<8) continue;
      if(dot>-len*0.5){ startIdx=i; break; }
      startIdx=i;
    }
    const trimmed=[{x:ship.x,y:ship.y},...finalPath.slice(startIdx)];
    ship.path=trimmed;
  } else {
    ship.path=finalPath;
  }
  if(ship.state==='unloading') ship.unloadT=0;
  ship.pathIdx=0; ship.state='path';
  dragPts=[]; dragValid=true;
}

function gameLoop(){
  if(!running) return;
  spawnTimer--;
  if(spawnTimer<=0){
    doSpawn();
    spawnDelay=Math.max(140,300-level*13);
    spawnTimer=spawnDelay;
    let nz=Math.floor(Math.random()*SPAWNS.length);
    while(SPAWNS.length>1&&nz===lastZone) nz=Math.floor(Math.random()*SPAWNS.length);
    nextZone=nz;
  }
  const nl=Math.floor(score/10)+1;
  if(nl!==level){level=nl;updateUI();}

  ships.forEach(s=>s.update());
  ships=ships.filter(s=>s.state!=='done');
  ships.forEach(s=>{
    if(s.state==='auto'||s.state==='path'||s.state==='enter'||s.state==='docking'){
      s.wakeT++;
      if(s.wakeT>=5){s.wakeT=0;wakes.push({x:s.x,y:s.y,life:1,r:2+Math.random()*2});}
    }
  });
  updateWarnings();
  tickParticles();
  updateFire();

  ctx.drawImage(bgCanvas,0,0);
  drawWaves();
  drawHarbourGlows();

  ships.forEach(s=>{
    if(s.state!=='path'||s.path.length<2||s.pathIdx>=s.path.length) return;
    ctx.save();
    ctx.setLineDash([5,4]); ctx.lineDashOffset=-(Date.now()*0.05%9);
    ctx.strokeStyle=HEX[s.color]+'77'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(s.x,s.y);
    for(let i=s.pathIdx;i<s.path.length;i++) ctx.lineTo(s.path[i].x,s.path[i].y);
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  });

  if(dragShip&&dragPts.length>1){
    ctx.save();
    ctx.setLineDash([5,4]); ctx.lineDashOffset=-(Date.now()*0.06%9);
    ctx.strokeStyle=dragValid?HEX[dragShip.color]:'#ff3333';
    ctx.lineWidth=2.5; ctx.globalAlpha=0.9;
    ctx.beginPath(); dragPts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }

  drawParticles();
  drawFire();
  ships.forEach(s=>s.draw());
  drawSpawnArrow();

  if(flashTimer>0){
    ctx.fillStyle=`rgba(255,30,30,${flashTimer/30*0.44})`;
    ctx.fillRect(0,0,W,H); flashTimer--;
  }
  requestAnimationFrame(gameLoop);
}

function doSpawn(){
  if(ships.filter(s=>s.state!=='done').length>=5+level) return;
  lastZone=nextZone;
  ships.push(new Ship(nextZone));
}
function updateUI(){
  document.getElementById('sv').textContent=score;
  document.getElementById('lv').textContent=level;
}
function triggerGameOver(){
  running=false;
  setTimeout(()=>{
    const ov=document.getElementById('ov');
    ov.innerHTML=`<div class="ob"><h2>🔥 KOLLISION! 🔥</h2><p>Level ${level} erreicht.</p><div class="fin">${score} Cargo</div><button class="btn" onclick="startGame()">Nochmal</button></div>`;
    ov.classList.add('on');
  },1200);
}
function startGame(){
  ships=[];particles=[];wakes=[];fireParticles=[];
  score=0;level=1;flashTimer=0;
  dragShip=null;dragPts=[];dragValid=true;
  spawnDelay=300;spawnTimer=260;lastZone=-1;
  nextZone=Math.floor(Math.random()*SPAWNS.length);
  updateUI();
  const ov=document.getElementById('ov');ov.innerHTML='';ov.classList.remove('on');
  running=true; doSpawn();
  let nz2=Math.floor(Math.random()*SPAWNS.length);
  while(SPAWNS.length>1&&nz2===nextZone) nz2=Math.floor(Math.random()*SPAWNS.length);
  nextZone=nz2;
  requestAnimationFrame(gameLoop);
}

buildBackground();
startGame();
</script>
