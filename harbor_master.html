'use strict';
const canvas=document.getElementById('gc');

const W=canvas.width, H=canvas.height;

// ═══════════ CONSTANTS ═══════════════════════════════════════════════
const COLORS=[‘violet’,‘yellow’];
const HEX={violet:’#cc44ff’,yellow:’#ffdd00’};
const HEXD={violet:’#550088’,yellow:’#776600’};

// Map: left land x=0..140, top-right nub x=510..660 y=0..115
const LL=140, TRX=510, TRY=115;

// Each harbour: 2 bays cut into left land.
// bx,by,bw,bh = bounding box of bay (navigable water area)
// dock_x = x-coordinate of fixed docking position (deep inside bay)
// dock_y = centre y of bay
const HARBOURS=[
{ color:‘violet’, bays:[
{ bx:55, by:78,  bw:90, bh:54 },
{ bx:55, by:140, bw:90, bh:54 },
]},
{ color:‘yellow’, bays:[
{ bx:55, by:322, bw:90, bh:54 },
{ bx:55, by:384, bw:90, bh:54 },
]},
];
// Pre-compute dock centre for each bay
HARBOURS.forEach(h=>h.bays.forEach(b=>{
b.dockX = b.bx + b.bw*0.5;   // centred inside bay
b.dockY = b.by + b.bh*0.5;   // vertical centre
b.entX  = b.bx + b.bw;       // entrance x (at land edge)
b.entY  = b.dockY;
}));

const SPAWNS=[
{x:240,y:-30,dx:0, dy:1 },
{x:360,y:-30,dx:0, dy:1 },
{x:460,y:-30,dx:0, dy:1 },
{x:690,y:185,dx:-1,dy:0 },
{x:690,y:320,dx:-1,dy:0 },
{x:270,y:570,dx:0, dy:-1},
{x:430,y:570,dx:0, dy:-1},
];

// ═══════════ WATER TEST ══════════════════════════════════════════════
function inWater(x,y){
if(x<0||x>W||y<0||y>H) return false;
if(x>TRX&&y<TRY) return false;  // top-right land
if(x<LL){
// check dock bays
for(const h of HARBOURS)
for(const b of h.bays)
if(x>=b.bx&&x<=b.bx+b.bw&&y>=b.by&&y<=b.by+b.bh) return true;
return false;
}
return true;
}
function offScreen(x,y){return x<-25||x>W+25||y<-25||y>H+25;}

// Returns a matching bay if ship has crossed its entrance threshold
function checkBayEntry(ship){
if(ship.cargo<=0) return null;
for(const h of HARBOURS){
if(h.color!==ship.color) continue;
for(const b of h.bays){
// Ship is within the bay’s y range and has passed the entrance x
if(ship.y>=b.by&&ship.y<=b.by+b.bh&&ship.x<=b.entX+4&&ship.x>=b.bx){
return b;
}
}
}
return null;
}

// ═══════════ GAME STATE ══════════════════════════════════════════════
let ships=[],score=0,level=1,running=false;
let spawnT=100,spawnI=300,pendZ=0;
let dragShip=null,dragPts=[],dragOk=true;
let parts=[],wakes=[];
let flashT=0;

// ═══════════ COLLISION WARNING ═══════════════════════════════════════
// Ships within this distance start flashing red
const WARN_DIST=120;
const COLL_DIST_FACTOR=0.27;

function nearestApproach(a,b){
// Simple: just current distance
return Math.hypot(a.x-b.x,a.y-b.y);
}

function updateCollisionWarnings(){
// Reset all
ships.forEach(s=>s.collWarn=false);
for(let i=0;i<ships.length;i++){
for(let j=i+1;j<ships.length;j++){
const a=ships[i],b=ships[j];
if(a.state===‘done’||b.state===‘done’) continue;
if(a.state===‘docked’||b.state===‘docked’) continue;
if(a.state===‘unloading’||b.state===‘unloading’) continue;
const d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<WARN_DIST){a.collWarn=true;b.collWarn=true;}
if(d<(a.HL+b.HL)*COLL_DIST_FACTOR){
spawnPart((a.x+b.x)/2,(a.y+b.y)/2,’#ff3322’,28);
flashT=30;
triggerGameOver();
return;
}
}
}
}

class Ship{
constructor(si){
const sp=SPAWNS[si];
this.x=sp.x; this.y=sp.y;
this.angle=Math.atan2(sp.dy,sp.dx);
this.vx=sp.dx; this.vy=sp.dy;
this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
let mx=1;
if(level>=2)mx=2; if(level>=4)mx=3; if(level>=6)mx=4; if(level>=9)mx=5;
this.cargo=Math.floor(Math.random()*mx)+1;
this.maxCargo=this.cargo;
this.spd=0.85-(this.maxCargo-1)*0.1;
this.state=‘auto’; // auto|path|docking|unloading|docked|done
this.path=[]; this.pi=0;
this.dockTarget=null;
this.unloadT=0;
this.pulseT=Math.random()*Math.PI*2;
this.wakeT=0;
this.HL=30+this.maxCargo*9;
this.HW=14+this.maxCargo*2;
this.collWarn=false;
this.warnBlink=0;
}

// Returns matching bay if ship centre is inside it
insideBay(){
for(const h of HARBOURS){
if(h.color!==this.color) continue;
for(const b of h.bays)
if(this.x>=b.bx&&this.x<=b.bx+b.bw&&this.y>=b.by&&this.y<=b.by+b.bh)
return b;
}
return null;
}

update(){
this.pulseT+=0.04;
this.warnBlink=(this.warnBlink+1)%30;

  } else {

    this.x=nx; this.y=ny;

  }
  this.angle=Math.atan2(dy,dx);
  this.vx=Math.cos(this.angle); this.vy=Math.sin(this.angle);
}

// ═══════════ UTILS ═══════════════════════════════════════════════════
function rrect(c,x,y,w,h,r){
c.beginPath();
c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r);
c.closePath();
}
function spawnPart(x,y,col,n){
for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,life:1});}
}
function tickParts(){
parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;p.life-=.025;return p.life>0;});
wakes=wakes.filter(p=>{p.life-=.04;p.r*=.97;return p.life>0;});
}
function drawParts(){
wakes.forEach(p=>{ctx.globalAlpha=p.life*.18;ctx.fillStyle=’#cde’;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
parts.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();});
ctx.globalAlpha=1;
}

if(cy<y1){b.beginPath();b.moveTo(LL,cy);b.lineTo(LL,y1);b.stroke();}
cy=y2;
});
if(cy<H){b.beginPath();b.moveTo(LL,cy);b.lineTo(LL,H);b.stroke();}
b.beginPath();b.moveTo(TRX,0);b.lineTo(TRX,TRY);b.stroke();
b.beginPath();b.moveTo(TRX,TRY);b.lineTo(W,TRY);b.stroke();
}

function paintLand(b,x,y,w,h,bs){
const g=b.createLinearGradient(bs===‘right’?x:x+w,0,bs===‘right’?x+w:x,0);
if(bs===‘right’){
g.addColorStop(0,’#285020’);g.addColorStop(.68,’#3a7830’);
g.addColorStop(.86,’#c0a855’);g.addColorStop(1,’#ccb260’);
} else {
g.addColorStop(0,’#ccb260’);g.addColorStop(.14,’#c0a855’);
g.addColorStop(.32,’#3a7830’);g.addColorStop(1,’#285020’);
}
b.fillStyle=g; b.fillRect(x,y,w,h);
b.fillStyle=‘rgba(18,72,18,0.22)’;
for(let gy=y+5;gy<y+h-5;gy+=16)
for(let gx=x+5;gx<x+w-5;gx+=16){
b.beginPath();
b.arc(gx+Math.sin(gx*.31+gy*.73)*3.5,gy+Math.cos(gx*.51+gy*.22)*3.5,
2.2+Math.abs(Math.sin(gx*gy))*.9,0,Math.PI*2);
b.fill();
}
b.fillStyle=‘rgba(10,55,10,0.26)’;
for(let gy=y+12;gy<y+h-12;gy+=28)
for(let gx=x+12;gx<x+w-12;gx+=28)
if(Math.sin(gx*1.4+gy*2.2)>.28){b.beginPath();b.arc(gx,gy,4.5,0,Math.PI*2);b.fill();}
}

// ═══════════ ANIMATED OVERLAYS ═══════════════════════════════════════
function drawWaves(){
const t=Date.now()*.0008;
ctx.save();
ctx.beginPath();
ctx.rect(LL,0,TRX-LL,TRY); ctx.rect(LL,TRY,W-LL,H-TRY);
ctx.clip();
for(let row=0;row<9;row++){
ctx.strokeStyle=`rgba(255,255,255,${.03+row*.004})`; ctx.lineWidth=1.1;
ctx.beginPath();
for(let x=LL;x<=W;x+=3){
const y=40+row*60+Math.sin(x*.026+t+row*.9)*5+Math.sin(x*.011+t*.55+row)*3;
x===LL?ctx.moveTo(x,y):ctx.lineTo(x,y);
}
ctx.stroke();
}
ctx.restore();
}

function drawHarbourGlows(){
const t=Date.now()*.002;
HARBOURS.forEach((h,hi)=>{
h.bays.forEach((bay,bi)=>{
const p=.55+.45*Math.sin(t+hi*1.4+bi*.7);
const a16=Math.floor(p*160).toString(16).padStart(2,‘0’);
const g=ctx.createRadialGradient(bay.entX,bay.entY,2,bay.entX,bay.entY,32);
g.addColorStop(0,HEX[h.color]+a16); g.addColorStop(1,‘rgba(0,0,0,0)’);
ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bay.entX,bay.entY,32,0,Math.PI*2); ctx.fill();
});
});
}

function drawSpawnArrow(){
if(!running) return;
const thr=Math.min(spawnI*.55,280);
if(spawnT>thr) return;
const sp=SPAWNS[pendZ];
const frac=spawnT/thr, alpha=(1-frac)*.9;
const bounce=Math.sin(Date.now()*.005)*5*(1-frac);
ctx.save(); ctx.globalAlpha=alpha;
ctx.translate(Math.max(20,Math.min(W-20,sp.x)),Math.max(20,Math.min(H-20,sp.y)));
ctx.rotate(Math.atan2(sp.dy,sp.dx)); ctx.translate(bounce,0);
ctx.fillStyle=’#ffdd22’; ctx.strokeStyle=‘rgba(0,0,0,.5)’; ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(18,0);ctx.lineTo(2,-11);ctx.lineTo(2,-5);
ctx.lineTo(-14,-5);ctx.lineTo(-14,5);ctx.lineTo(2,5);ctx.lineTo(2,11);
ctx.closePath(); ctx.fill(); ctx.stroke();
ctx.beginPath();
ctx.arc(0,0,22,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-frac));
ctx.strokeStyle=‘rgba(255,220,0,.6)’; ctx.lineWidth=3; ctx.stroke();
ctx.restore();
}

// ═══════════ DRAG PATH VALIDATION ════════════════════════════════════
function validateDragPath(ship){
const empty=(ship.cargo===0||ship.state===‘docked’);
// Find if ship starts inside a bay (for exit path leniency)
let startBay=null;
if(empty){
for(const h of HARBOURS)
for(const b of h.bays)
if(ship.x>=b.bx&&ship.x<=b.bx+b.bw&&ship.y>=b.by&&ship.y<=b.by+b.bh)
startBay=b;
}
for(let i=1;i<dragPts.length;i++){
const a=dragPts[i-1], bpt=dragPts[i];
const steps=Math.ceil(Math.hypot(bpt.x-a.x,bpt.y-a.y)/8);
for(let s=1;s<=steps;s++){
const t=s/steps;
const x=a.x+(bpt.x-a.x)*t, y=a.y+(bpt.y-a.y)*t;
// Off-screen is ok for empty-ship exit paths
if(x<-5||x>W+5||y<-5||y>H+5){ if(!empty) return false; continue; }
// If ship started in a bay, the exit corridor (x <= entX+10) is always valid
if(startBay&&x<=startBay.entX+10) continue;
if(!inWater(x,y)) return false;
}
}
return true;
}

// ═══════════ INPUT ════════════════════════════════════════════════════
function getPos(e,te){
const r=canvas.getBoundingClientRect();
const sx=W/r.width, sy=H/r.height;
const src=te?e.changedTouches[0]:(e.touches?e.touches[0]:e);
return{x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy};
}
canvas.addEventListener(‘mousedown’, e=>{e.preventDefault();onDn(getPos(e,false));});
canvas.addEventListener(‘mousemove’, e=>{e.preventDefault();onMv(getPos(e,false));});
canvas.addEventListener(‘mouseup’,   e=>{e.preventDefault();onUp(getPos(e,false));});
canvas.addEventListener(‘touchstart’,e=>{e.preventDefault();onDn(getPos(e,false));},{passive:false});
canvas.addEventListener(‘touchmove’, e=>{e.preventDefault();onMv(getPos(e,false));},{passive:false});
canvas.addEventListener(‘touchend’,  e=>{e.preventDefault();onUp(getPos(e,true)); },{passive:false});

function onDn(pos){
if(!running) return;
dragShip=null; dragPts=[]; dragOk=true;
for(let i=ships.length-1;i>=0;i--){
const s=ships[i];
// Only skip ships that can’t be redirected
if(s.state===‘done’||s.state===‘docking’) continue;
if(Math.hypot(pos.x-s.x,pos.y-s.y)<s.HL/2+18){
dragShip=s; dragPts=[{x:s.x,y:s.y}]; break;
}
}
}
function onMv(pos){
if(!dragShip) return;
// Stationary ships (docked/unloading): keep start point fixed at ship pos
// Moving ships: update start to live position
const stationary=dragShip.state===‘docked’||dragShip.state===‘unloading’;
if(!stationary) dragPts[0]={x:dragShip.x,y:dragShip.y};
const last=dragPts[dragPts.length-1];
if(Math.hypot(pos.x-last.x,pos.y-last.y)>6) dragPts.push({x:pos.x,y:pos.y});
dragOk=validateDragPath(dragShip);
}
function onUp(pos){
if(!dragShip) return;
const ship=dragShip; dragShip=null;
const minPts=(ship.state===‘docked’||ship.state===‘unloading’)?2:3;
if(dragPts.length<minPts||!dragOk){dragPts=[];dragOk=true;return;}
// Always start from ship’s actual current position
const path=[{x:ship.x,y:ship.y}, ...dragPts.slice(1)];
// If currently unloading, interrupt and start moving
if(ship.state===‘unloading’) ship.unloadT=0;
ship.path=path; ship.pi=0; ship.state=‘path’;
dragPts=[]; dragOk=true;
}

// ═══════════ GAME LOOP ════════════════════════════════════════════════
function gameLoop(){
if(!running) return;

spawnT–;
if(spawnT<=0){
doSpawn();
spawnI=Math.max(140,300-level*13);
spawnT=spawnI;
// Pick a different spawn zone than last time
let nz=Math.floor(Math.random()*SPAWNS.length);
if(SPAWNS.length>1){while(nz===lastSpawnZ)nz=Math.floor(Math.random()*SPAWNS.length);}
pendZ=nz;
}

const nl=Math.floor(score/15)+1;
if(nl!==level){level=nl;updUI();}

ships.forEach(s=>s.update());
ships=ships.filter(s=>s.state!==‘done’);

// Wake trails for moving ships
ships.forEach(s=>{
if(s.state===‘auto’||s.state===‘path’||s.state===‘docking’){
s.wakeT++;
if(s.wakeT>=5){s.wakeT=0;wakes.push({x:s.x,y:s.y,life:1,r:2+Math.random()*2});}
}
});

updateCollisionWarnings();
tickParts();

// ── DRAW ──────────────────────────────────────────────
ctx.drawImage(bg,0,0);
drawWaves();
drawHarbourGlows();

// Ship path lines
ships.forEach(s=>{
if(s.state===‘path’&&s.path.length>1&&s.pi<s.path.length){
ctx.save();
ctx.setLineDash([5,4]); ctx.lineDashOffset=-(Date.now()*.05%9);
ctx.strokeStyle=HEX[s.color]+‘77’; ctx.lineWidth=2;
ctx.beginPath(); ctx.moveTo(s.x,s.y);
for(let i=s.pi;i<s.path.length;i++) ctx.lineTo(s.path[i].x,s.path[i].y);
ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}
});

// Live drag line
if(dragShip&&dragPts.length>1){
ctx.save();
ctx.setLineDash([5,4]); ctx.lineDashOffset=-(Date.now()*.06%9);
ctx.strokeStyle=dragOk?HEX[dragShip.color]:’#ff3333’;
ctx.lineWidth=2.5; ctx.globalAlpha=.88;
ctx.beginPath(); dragPts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}

drawParts();
ships.forEach(s=>s.draw());
drawSpawnArrow();

if(flashT>0){
ctx.fillStyle=`rgba(255,30,30,${flashT/30*.45})`;
ctx.fillRect(0,0,W,H); flashT–;
}
requestAnimationFrame(gameLoop);
}

// ═══════════ SPAWN / UI ═══════════════════════════════════════════════
let lastSpawnZ=-1;
function doSpawn(){
if(ships.filter(s=>s.state!==‘done’).length>=5+level) return;
ships.push(new Ship(pendZ));
lastSpawnZ=pendZ;
}
function updUI(){
document.getElementById(‘sv’).textContent=score;
document.getElementById(‘lv’).textContent=level;
}
function triggerGameOver(){
running=false;
setTimeout(()=>{
const ov=document.getElementById(‘ov’);
ov.innerHTML=`<div class="ob"><h2>KOLLISION!</h2><p>Level ${level} erreicht.</p>`+
`<div class="fin">${score} Cargo</div><button class="btn" onclick="startGame()">Nochmal</button></div>`;
ov.classList.add(‘on’);
},700);
}
function startGame(){
ships=[];parts=[];wakes=[];
score=0;level=1;flashT=0;dragShip=null;dragPts=[];dragOk=true;
spawnI=300;spawnT=80;lastSpawnZ=-1;pendZ=Math.floor(Math.random()*SPAWNS.length);
updUI();
const ov=document.getElementById(‘ov’);ov.innerHTML=’’;ov.classList.remove(‘on’);
running=true; doSpawn();
requestAnimationFrame(gameLoop);
}

// Init
buildBg();
ctx.drawImage(bg,0,0);
</script>

</body>
