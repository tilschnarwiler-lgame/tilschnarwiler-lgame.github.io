<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Neon Tetris</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
 margin:0;
 background: radial-gradient(circle at top, #0b0f2a, #050510);
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
 font-family: Arial, sans-serif;
 color:white;
 touch-action: none;
}
.wrapper {
 display:flex;
 gap:20px;
 padding:18px;
 background: rgba(255,255,255,0.05);
 border:1px solid rgba(0,255,255,0.15);
 border-radius:16px;
 backdrop-filter: blur(12px);
}
canvas {
 background: linear-gradient(to bottom, #000814, #001d3d);
 border-radius:10px;
 box-shadow: 0 0 25px rgba(0,255,255,0.15);
}
.sidebar {
 width:150px;
 display:flex;
 flex-direction:column;
 padding-top:40px;
 gap:4px;
}
.sidebar p { margin: 4px 0; }
.hint { font-size:12px; opacity:0.7; margin-top:12px !important; line-height:1.6; }
.hs { color:#ffe66d; }
</style>
</head>
<body>
<div class="wrapper">
 <canvas id="game" width="240" height="600"></canvas>
 <div class="sidebar">
  <p>Score: <span id="score">0</span></p>
  <p>Lines: <span id="lines">0</span></p>
  <p>Level: <span id="level">1</span></p>
  <p class="hs">Best: <span id="highscore">0</span></p>
  <p class="hint">
   ← → bewegen<br>
   ↓ schneller<br>
   ↑ rotieren<br><br>
   Swipe: bewegen<br>
   Tippen: rotieren
  </p>
 </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 8, ROWS = 20, SIZE = 30;
let board = Array.from({length:ROWS},()=>Array(COLS).fill(0));

const COLORS=[null,"#00f5ff","#3a86ff","#ff9f1c","#ffe66d","#2ef7a5","#a29bfe","#ff4d6d"];
const SHAPES=[
 [],
 [[1,1,1,1]],
 [[2,0,0],[2,2,2]],
 [[0,0,3],[3,3,3]],
 [[4,4],[4,4]],
 [[0,5,5],[5,5,0]],
 [[0,6,0],[6,6,6]],
 [[7,7,0],[0,7,7]]
];

let piece = createPiece();
let dropCounter=0, lastTime=0;
let score=0, lines=0, level=1, dropInterval=600;
let highscore=0;

// Animation state
let clearingRows = [];
let clearAnim = 0;
let clearAnimActive = false;
const CLEAR_ANIM_DURATION = 300;

// Touch
let touchStartX=0, touchStartY=0, touchStartTime=0;
const SWIPE_THRESHOLD = 30;
const TAP_MAX_MOVE = 10;
const TAP_MAX_TIME = 200;

canvas.addEventListener("touchstart", e=>{
 e.preventDefault();
 touchStartX = e.touches[0].clientX;
 touchStartY = e.touches[0].clientY;
 touchStartTime = Date.now();
}, {passive:false});

canvas.addEventListener("touchend", e=>{
 e.preventDefault();
 let dx = e.changedTouches[0].clientX - touchStartX;
 let dy = e.changedTouches[0].clientY - touchStartY;
 let dt = Date.now() - touchStartTime;
 let dist = Math.sqrt(dx*dx + dy*dy);

 if(dist < TAP_MAX_MOVE && dt < TAP_MAX_TIME){
  rotateSafe(piece);
  return;
 }

 if(Math.abs(dx) > Math.abs(dy)){
  if(dx > SWIPE_THRESHOLD){ piece.x++; if(collide(board,piece)) piece.x--; }
  else if(dx < -SWIPE_THRESHOLD){ piece.x--; if(collide(board,piece)) piece.x++; }
 } else {
  if(dy > SWIPE_THRESHOLD){ piece.y++; if(collide(board,piece)) piece.y--; }
 }
}, {passive:false});

function createPiece(){
 let id=Math.floor(Math.random()*7)+1;
 return {x:2,y:0,shape:SHAPES[id],id};
}

function collide(board,p){
 return p.shape.some((r,y)=>r.some((v,x)=>{
  if(!v)return false;
  let bx=x+p.x, by=y+p.y;
  return bx<0||bx>=COLS||by>=ROWS||board[by][bx];
 }));
}

function merge(board,p){
 p.shape.forEach((r,y)=>r.forEach((v,x)=>{
  if(v) board[y+p.y][x+p.x]=v;
 }));
}

function clearRows(){
 let full = [];
 for(let y=0; y<ROWS; y++){
  if(board[y].every(v=>v!==0)) full.push(y);
 }
 if(full.length===0) return;

 clearingRows = full;
 clearAnim = 0;
 clearAnimActive = true;
}

function removeClearedRows(){
 // Alle vollen Reihen auf einmal rausfiltern
 board = board.filter((_, y) => !clearingRows.includes(y));

 // Oben auffüllen
 while(board.length < ROWS){
  board.unshift(Array(COLS).fill(0));
 }

 score += clearingRows.length * 10;
 lines += clearingRows.length;
 level = Math.floor(lines/4)+1;
 dropInterval = Math.max(60, 600*Math.pow(0.88,level));
 clearingRows = [];
 clearAnimActive = false;
 updateUI();
}

function rotateSafe(p){
 let m = p.shape;
 p.shape = m[0].map((_,i)=>m.map(row=>row[i])).reverse();

 let kicks = [0, 1, -1, 2, -2];
 for(let k of kicks){
  p.x += k;
  if(!collide(board,p)) return;
  p.x -= k;
 }
 // Rotation rückgängig (3x drehen = rückwärts)
 p.shape = p.shape[0].map((_,i)=>p.shape.map(row=>row[i])).reverse();
 p.shape = p.shape[0].map((_,i)=>p.shape.map(row=>row[i])).reverse();
 p.shape = p.shape[0].map((_,i)=>p.shape.map(row=>row[i])).reverse();
}

function drawClearAnimation(){
 let progress = clearAnim;
 clearingRows.forEach(y=>{
  let py = y*SIZE;
  ctx.globalAlpha = 1 - progress;
  ctx.fillStyle = `rgba(255,255,255,${1-progress})`;
  ctx.shadowColor = "#fff";
  ctx.shadowBlur = 30*(1-progress);
  ctx.fillRect(0, py, COLS*SIZE, SIZE);
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;

  board[y].forEach((v,x)=>{
   if(!v) return;
   let shrink = progress;
   let px = (x+0.5)*SIZE;
   let centerY = (y+0.5)*SIZE;
   let s = SIZE*(1-shrink);
   ctx.globalAlpha = 1-progress;
   ctx.fillStyle = COLORS[v];
   ctx.shadowColor = COLORS[v];
   ctx.shadowBlur = 18;
   ctx.fillRect(px-s/2, centerY-s/2, s, s);
   ctx.shadowBlur=0;
   ctx.globalAlpha=1;
  });
 });
}

function updateUI(){
 document.getElementById("score").textContent=score;
 document.getElementById("lines").textContent=lines;
 document.getElementById("level").textContent=level;
 if(score>highscore){
  highscore=score;
  document.getElementById("highscore").textContent=highscore;
 }
}

function update(t=0){
 let delta=t-lastTime; lastTime=t;

 if(clearAnimActive){
  clearAnim += delta / CLEAR_ANIM_DURATION;
  if(clearAnim >= 1){
   removeClearedRows();
   // Game over check nach Animation
   if(collide(board,piece)){
    if(score>highscore){
     highscore=score;
     document.getElementById("highscore").textContent=highscore;
    }
    board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    score=0; lines=0; level=1; dropInterval=600;
    updateUI();
   }
  }
  draw();
  requestAnimationFrame(update);
  return;
 }

 dropCounter+=delta;
 if(dropCounter>dropInterval){
  piece.y++;
  if(collide(board,piece)){
   piece.y--;
   merge(board,piece);
   piece=createPiece();
   clearRows();

   if(!clearAnimActive && collide(board,piece)){
    if(score>highscore){
     highscore=score;
     document.getElementById("highscore").textContent=highscore;
    }
    board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    score=0; lines=0; level=1; dropInterval=600;
    updateUI();
   }
  }
  dropCounter=0;
 }

 draw();
 requestAnimationFrame(update);
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 board.forEach((r,y)=>{
  if(clearingRows.includes(y)) return;
  r.forEach((v,x)=>{
   if(v){
    let px=x*SIZE, py=y*SIZE;
    ctx.shadowColor=COLORS[v]; ctx.shadowBlur=18;
    ctx.fillStyle=COLORS[v];
    ctx.fillRect(px,py,SIZE,SIZE);
    ctx.shadowBlur=0;
    ctx.strokeStyle="rgba(0,0,0,0.7)";
    ctx.strokeRect(px,py,SIZE,SIZE);
   }
  });
 });

 if(clearAnimActive) drawClearAnimation();
 if(!clearAnimActive) drawMatrix(piece.shape, piece);
}

function drawMatrix(m,o){
 m.forEach((r,y)=>r.forEach((v,x)=>{
  if(v){
   let px=(x+o.x)*SIZE, py=(y+o.y)*SIZE;
   ctx.shadowColor=COLORS[v]; ctx.shadowBlur=18;
   ctx.fillStyle=COLORS[v];
   ctx.fillRect(px,py,SIZE,SIZE);
   ctx.shadowBlur=0;
   ctx.strokeStyle="rgba(0,0,0,0.7)";
   ctx.strokeRect(px,py,SIZE,SIZE);
  }
 }));
}

document.addEventListener("keydown",e=>{
 if(clearAnimActive) return;
 if(e.key==="ArrowLeft"){piece.x--;if(collide(board,piece))piece.x++;}
 if(e.key==="ArrowRight"){piece.x++;if(collide(board,piece))piece.x--;}
 if(e.key==="ArrowDown"){piece.y++;if(collide(board,piece))piece.y--;}
 if(e.key==="ArrowUp") rotateSafe(piece);
});

window.addEventListener("keydown", function(e){
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)){
  e.preventDefault();
 }
}, {passive:false});

updateUI();
requestAnimationFrame(update);
</script>
</body>
</html>
