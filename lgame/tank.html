<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panzer Duel</title>
<style>
:root{--bg1:#1f2a17;--bg2:#3b4a2a;--ink:#e8e2c9;--gold:#d9b44a;--brown:#8b5a2b}
@media (prefers-color-scheme:dark){:root{--bg1:#10160c;--bg2:#27331b}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:radial-gradient(circle at 50% 40%,var(--bg2),var(--bg1));display:flex;justify-content:center;align-items:center;overflow:hidden;color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#homeScreen{text-align:center;z-index:10;animation:fadeIn .8s ease;background:rgba(20,26,14,.65);backdrop-filter:blur(12px);padding:56px 44px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.55);border:2px solid rgba(217,180,74,.35)}
@keyframes fadeIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.game-title{font-size:60px;font-weight:900;margin-bottom:8px;letter-spacing:4px;color:var(--gold);text-shadow:0 3px 0 #5a3e12,0 8px 18px rgba(0,0,0,.6)}
.sub{opacity:.7;margin-bottom:34px;letter-spacing:2px;font-size:14px}
.menu-container{display:flex;flex-direction:column;gap:16px;align-items:center}
.menu-button{width:340px;padding:18px 28px;font-size:20px;font-weight:700;border:2px solid rgba(217,180,74,.4);border-radius:12px;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));transition:all .25s;letter-spacing:1px}
.menu-button:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.5);border-color:var(--gold);background:rgba(217,180,74,.18)}
#gameScreen{display:none;text-align:center;width:100%;max-width:1240px;padding:0 10px}
#gameContainer{position:relative;display:inline-block;max-width:100%}
canvas{border:4px solid #3a2a14;border-radius:12px;box-shadow:0 0 0 2px #8b6b2e,0 18px 50px rgba(0,0,0,.65);max-width:100%;max-height:calc(100vh - 100px);height:auto;display:block;margin:0 auto}
#victoryOverlay{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,12,6,.88);padding:28px 48px;border-radius:18px;z-index:20;border:2px solid var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(217,180,74,.4)}50%{box-shadow:0 0 75px rgba(217,180,74,.75)}}
#victoryText{font-size:32px;font-weight:800;margin-bottom:10px;color:var(--gold)}
#victorySubtext{font-size:17px;opacity:.8;margin-bottom:20px}
#restartButton{padding:12px 28px;font-size:17px;background:var(--gold);color:#2a2008;border:none;border-radius:10px;cursor:pointer;font-weight:700;transition:all .25s}
#restartButton:hover{background:#f0cc62;transform:scale(1.05)}
#gameUI{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#backButton{padding:10px 20px;font-size:15px;background:rgba(0,0,0,.4);color:var(--ink);border:1px solid rgba(217,180,74,.5);border-radius:10px;cursor:pointer;transition:all .25s;font-weight:700}
#backButton:hover{background:rgba(217,180,74,.25)}
#gameInfo{flex-grow:1;font-size:15px;background:rgba(0,0,0,.35);padding:10px;border-radius:10px;margin:0 14px;font-weight:600}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(217,180,74,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(217,180,74,.06) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%);pointer-events:none}
#homeScreen{position:relative;overflow:hidden;width:min(860px,94vw);padding:44px 30px 26px;background:linear-gradient(160deg,rgba(44,58,30,.88),rgba(14,18,9,.92));border:1px solid rgba(217,180,74,.5);box-shadow:0 0 0 6px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.7),inset 0 0 90px rgba(217,180,74,.07)}
#homeScreen::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(217,180,74,.24),transparent 55%);pointer-events:none}
.badge{display:inline-block;font-size:12px;letter-spacing:5px;color:var(--gold);border:1px solid rgba(217,180,74,.5);padding:4px 14px;border-radius:20px;margin-bottom:14px;background:rgba(0,0,0,.3)}
.game-title{margin-bottom:4px;background:linear-gradient(180deg,#fff3c4,#d9b44a 55%,#9a6f1c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #3b2a08) drop-shadow(0 10px 18px rgba(0,0,0,.6))}
#homeScreen .sub{margin-bottom:6px}
.stage{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.stage .tank{width:70px;height:auto;filter:drop-shadow(6px 8px 6px rgba(0,0,0,.55))}
.tkL{color:#58823a;transform:rotate(90deg);animation:rockL 3s ease-in-out infinite}
.tkR{color:#a88a55;transform:rotate(-90deg);animation:rockR 3s ease-in-out infinite}
@keyframes rockL{50%{transform:rotate(90deg) translateY(4px)}}
@keyframes rockR{50%{transform:rotate(-90deg) translateY(4px)}}
.tracer{position:absolute;top:50%;left:16%;width:34px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffd34d);box-shadow:0 0 12px #ffb02e;animation:fire 2.6s linear infinite}
@keyframes fire{from{left:16%;opacity:0}10%{opacity:1}88%{opacity:1}to{left:78%;opacity:0}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px;position:relative}
.mode-card{position:relative;overflow:hidden;text-align:left;padding:20px 22px;border-radius:14px;cursor:pointer;color:var(--ink);font:inherit;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.02));border:1px solid rgba(217,180,74,.35);transition:all .25s}
.mode-card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-20deg);transition:left .6s}
.mode-card:hover::after{left:130%}
.mode-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 26px rgba(217,180,74,.22)}
.mode-ico{font-size:30px;margin-bottom:6px}
.mode-name{font-size:22px;font-weight:800;letter-spacing:1px;color:var(--gold)}
.mode-desc{font-size:13px;opacity:.72;margin-top:4px;line-height:1.4}
.hint{margin-top:20px;font-size:12px;opacity:.5;letter-spacing:1px}
@media (max-width:700px){.game-title{font-size:38px}.menu-button{width:250px;font-size:17px}#homeScreen{padding:38px 22px}#victoryText{font-size:22px}#victoryOverlay{padding:20px 24px}#gameInfo{font-size:12px}}
@media (max-width:700px){.stage .tank{width:40px}.modes{grid-template-columns:1fr}.hint{display:none}}
</style>
</head>
<body>
<div id="homeScreen">
  <svg width="0" height="0" style="position:absolute"><symbol id="tk" viewBox="0 -34 50 110"><rect x="0" y="2" width="11" height="74" rx="4" fill="#1d1d1d"/><rect x="39" y="2" width="11" height="74" rx="4" fill="#1d1d1d"/><rect x="0.5" y="10" width="10" height="56" rx="3" fill="currentColor" stroke="rgba(0,0,0,.5)"/><rect x="39.5" y="10" width="10" height="56" rx="3" fill="currentColor" stroke="rgba(0,0,0,.5)"/><path d="M13 2h24l3 10v54l-4 7H14l-4-7V12z" fill="currentColor" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/><rect x="40" y="36" width="9" height="28" rx="4.5" fill="currentColor" stroke="rgba(0,0,0,.6)"/><rect x="40" y="36" width="9" height="28" rx="4.5" fill="rgba(255,255,255,.15)"/><path d="M22 14l3-48 3 48z" fill="#8a8a8a" stroke="#333" stroke-width=".8"/><ellipse cx="25" cy="30" rx="18" ry="22" fill="currentColor" stroke="rgba(0,0,0,.6)" stroke-width="1.6"/><ellipse cx="22" cy="22" rx="12" ry="14" fill="rgba(255,255,255,.16)"/><circle cx="32" cy="36" r="6" fill="rgba(0,0,0,.4)"/><circle cx="17" cy="36" r="4.6" fill="rgba(0,0,0,.35)"/></symbol></svg>
  <div class="badge">★ 1 GEGEN 1 ★</div>
  <h1 class="game-title">PANZER DUEL</h1>
  <div class="sub">KETTEN · KANONEN · KAMPF</div>
  <div class="stage">
    <svg class="tank tkL" viewBox="0 -34 50 110"><use href="#tk"/></svg>
    <div class="tracer"></div>
    <svg class="tank tkR" viewBox="0 -34 50 110"><use href="#tk"/></svg>
  </div>
  <div class="modes">
    <button class="mode-card" onclick="selectMode('bot')"><div class="mode-ico">🤖</div><div class="mode-name">1 SPIELER</div><div class="mode-desc">Tritt gegen den Bot an</div></button>
    <button class="mode-card" onclick="selectMode('pvp')"><div class="mode-ico">⚔️</div><div class="mode-name">2 SPIELER</div><div class="mode-desc">Duell gegen einen Freund</div></button>
  </div>
  <div class="hint">SPIELER 1: WASD + LEERTASTE · SPIELER 2: PFEILTASTEN + ENTER</div>
</div>
<div id="gameScreen">
  <div id="gameUI">
    <button id="backButton" onclick="goToHome()">← Zurück</button>
    <div id="gameInfo">Wähle einen Spielmodus</div>
    <div style="width:80px"></div>
  </div>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1200" height="720"></canvas>
    <div id="victoryOverlay">
      <div id="victoryText"></div>
      <div id="victorySubtext"></div>
      <button id="restartButton" onclick="restartGame()">Erneut spielen</button>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const gameInfo=document.getElementById('gameInfo'),homeScreen=document.getElementById('homeScreen'),gameScreen=document.getElementById('gameScreen');
const victoryOverlay=document.getElementById('victoryOverlay'),victoryText=document.getElementById('victoryText'),victorySubtext=document.getElementById('victorySubtext');
const W=canvas.width,H=canvas.height;
let gameMode=null,gameRunning=false,gameEnded=false,shake=0;

/* ---------- Hilfsfunktionen ---------- */
const hash=n=>Math.abs(Math.sin(n*127.1)*43758.5453)%1;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);
  const c=v=>Math.max(0,Math.min(255,v+amt));
  return `rgb(${c(n>>16)},${c(n>>8&255)},${c(n&255)})`}

/* ---------- Hindernisse ---------- */
const obstacles=[
 {x:320,y:160,radius:38,type:'tree'},{x:900,y:570,radius:40,type:'tree'},{x:620,y:110,radius:38,type:'tree'},
 {x:820,y:280,radius:36,type:'tree'},{x:230,y:570,radius:32,type:'tree'},
 {x:870,y:180,radius:42,type:'pond'},
 {x:470,y:290,width:55,height:45,type:'rock'},{x:750,y:440,width:50,height:40,type:'rock'},{x:330,y:470,width:45,height:50,type:'rock'},
 {x:600,y:360,width:100,height:22,type:'sandbag'},{x:380,y:250,width:80,height:22,type:'sandbag'},
 {x:80,y:250,radius:22,type:'bush'},{x:1120,y:450,radius:22,type:'bush'},{x:650,y:250,radius:18,type:'bush'},{x:560,y:570,radius:20,type:'bush'}
];

function checkObstacleCollision(x,y,radius=20){
  for(const o of obstacles){
    if(o.width){
      const cx=Math.max(o.x-o.width/2,Math.min(x,o.x+o.width/2)),cy=Math.max(o.y-o.height/2,Math.min(y,o.y+o.height/2));
      if(Math.hypot(x-cx,y-cy)<radius)return true;
    }else if(Math.hypot(x-o.x,y-o.y)<o.radius+radius)return true;
  }
  return false;
}
function bulletHitsObstacle(b){
  for(const o of obstacles){
    if(o.width){
      if(b.x>o.x-o.width/2&&b.x<o.x+o.width/2&&b.y>o.y-o.height/2&&b.y<o.y+o.height/2)return true;
    }else if(o.type!=='pond'&&Math.hypot(b.x-o.x,b.y-o.y)<o.radius)return true;
  }
  return false;
}

/* ---------- Statischer Hintergrund (einmal gerendert → kein Flackern) ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
const trk=document.createElement('canvas');trk.width=W;trk.height=H; // Kettenspuren
const bgc=bg.getContext('2d'),trc=trk.getContext('2d');

function drawPond(c,o){
  const r=o.radius;c.save();
  let g=c.createRadialGradient(o.x,o.y,r*.2,o.x,o.y,r*1.2);
  g.addColorStop(0,'#4a97ad');g.addColorStop(.62,'#2f6d82');g.addColorStop(.8,'#35677a');g.addColorStop(.86,'#7a6f45');g.addColorStop(1,'rgba(100,85,50,0)');
  c.fillStyle=g;c.beginPath();c.ellipse(o.x,o.y,r*1.2,r*1.1,.3,0,7);c.fill();
  c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=1.2;
  for(let i=0;i<3;i++){c.beginPath();c.ellipse(o.x-r*.2+i*6,o.y-r*.25+i*8,r*(.35-i*.07),r*(.12),0,.2,2.8);c.stroke();}
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(o.x-r*.35,o.y-r*.4,r*.22,r*.08,-.5,0,7);c.fill();
  for(let i=0;i<14;i++){const a=hash(o.x+i)*6.283,d=r*(.95+.2*hash(o.y+i));
    c.strokeStyle='#4b6b2a';c.lineWidth=1.6;c.beginPath();c.moveTo(o.x+Math.cos(a)*d,o.y+Math.sin(a)*d);c.lineTo(o.x+Math.cos(a)*d+1,o.y+Math.sin(a)*d-9);c.stroke();
    c.fillStyle='#6b4a2a';c.fillRect(o.x+Math.cos(a)*d-.6,o.y+Math.sin(a)*d-12,2,4);}
  for(let i=0;i<4;i++){const a=i*1.7+hash(o.x)*3;c.fillStyle='#5a9a45';c.beginPath();c.ellipse(o.x+Math.cos(a)*r*.5,o.y+Math.sin(a)*r*.45,5,3,a,0,7);c.fill();}
  c.restore();
}
function drawSandbag(c,o){
  c.save();c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.roundRect(o.x-o.width/2+5,o.y-o.height/2+7,o.width,o.height,8);c.fill();
  const n=Math.round(o.width/16),w=o.width/n,h=o.height/2+3,x0=o.x-o.width/2;
  for(let r=0;r<2;r++){const cnt=r?n-1:n;
    for(let i=0;i<cnt;i++){const x=x0+i*w+(r?w/2:0),y=o.y-o.height/2-1+r*(o.height/2-2);
      const g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#d6c18a');g.addColorStop(1,'#9c8754');
      c.fillStyle=g;c.beginPath();c.roundRect(x+.8,y,w-1.6,h,6);c.fill();c.strokeStyle='#6e5e38';c.lineWidth=1;c.stroke();
      c.strokeStyle='rgba(90,70,40,.5)';c.beginPath();c.moveTo(x+w*.3,y+h*.5);c.lineTo(x+w*.7,y+h*.5);c.stroke();}}
  c.restore();
}
function drawObstacle(c,o){
  c.save();
  if(o.type==='tree'||o.type==='bush'){
    const r=o.radius,tree=o.type==='tree';
    c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=tree?16:8;c.shadowOffsetX=tree?8:4;c.shadowOffsetY=tree?10:5;
    c.fillStyle=tree?'#1f3d12':'#2c5518';c.beginPath();c.arc(o.x,o.y,r,0,7);c.fill();
    c.shadowColor='transparent';
    const cols=tree?['#27501a','#336a22','#418530','#55a040']:['#356b1f','#438628','#58a037'];
    cols.forEach((col,k)=>{
      const lr=r*(0.55-k*0.07),ring=r*(0.62-k*0.12);
      for(let i=0;i<7;i++){
        const a=i/7*6.283+hash(o.x+k)*3;
        c.fillStyle=col;c.beginPath();c.arc(o.x+Math.cos(a)*ring-k*1.5,o.y+Math.sin(a)*ring-k*1.5,lr,0,7);c.fill();
      }
    });
    c.fillStyle='rgba(200,255,150,.18)';c.beginPath();c.arc(o.x-r*.25,o.y-r*.3,r*.3,0,7);c.fill();
    if(tree){c.fillStyle='#3b2412';c.beginPath();c.arc(o.x,o.y,3.5,0,7);c.fill();}
  }else if(o.type==='pond'){drawPond(c,o);
  }else if(o.type==='sandbag'){drawSandbag(c,o);
  }else{
    const n=9,pts=[];
    for(let i=0;i<n;i++){const a=i/n*6.283;
      pts.push([o.x+Math.cos(a)*o.width/2*(.85+.3*hash(o.x+i)),o.y+Math.sin(a)*o.height/2*(.85+.3*hash(o.y+i*3))]);}
    const path=(dx=0,dy=0)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0]+dx,p[1]+dy):c.moveTo(p[0]+dx,p[1]+dy));c.closePath();};
    c.fillStyle='rgba(0,0,0,.35)';path(6,8);c.fill();
    const g=c.createLinearGradient(o.x-o.width/2,o.y-o.height/2,o.x+o.width/2,o.y+o.height/2);
    g.addColorStop(0,'#b7b4aa');g.addColorStop(.5,'#8a877f');g.addColorStop(1,'#5f5d57');
    c.fillStyle=g;path();c.fill();c.strokeStyle='#4a4842';c.lineWidth=1.5;c.stroke();
    c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=1;c.beginPath();
    c.moveTo(o.x-o.width/4,o.y-o.height/4);c.lineTo(o.x+2,o.y+4);c.lineTo(o.x+o.width/5,o.y+o.height/4);c.stroke();
    c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.ellipse(o.x-o.width/5,o.y-o.height/5,o.width*.16,o.height*.1,-.5,0,7);c.fill();
    c.fillStyle='rgba(80,120,50,.55)';c.beginPath();c.ellipse(o.x+o.width/4,o.y+o.height/3.2,8,4,0,0,7);c.fill(); // Moos
  }
  c.restore();
}

function buildBG(){
  const c=bgc,R=Math.random;
  let g=c.createRadialGradient(W/2,H/2,100,W/2,H/2,Math.hypot(W,H)/2);g.addColorStop(0,'#87b655');g.addColorStop(1,'#56792f');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let i=0;i<260;i++){ // Farbflecken
    c.fillStyle=`hsla(${75+R()*35},${32+R()*25}%,${27+R()*28}%,.12)`;
    c.beginPath();c.arc(R()*W,R()*H,25+R()*80,0,7);c.fill();
  }
  [[170,110,300,200,.15],[880,470,320,190,-.1],[760,80,230,150,.2]].forEach(([fx,fy,fw,fh,rot])=>{ // Felder mit Mähstreifen
    c.save();c.translate(fx+fw/2,fy+fh/2);c.rotate(rot);
    for(let y=-fh/2;y<fh/2;y+=14){c.fillStyle=Math.floor(y/14)%2?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)';c.fillRect(-fw/2,y,fw,14)}
    c.strokeStyle='rgba(60,45,20,.25)';c.lineWidth=2;c.strokeRect(-fw/2,-fh/2,fw,fh);c.restore();
  });
  const road=(p0,p1,p2,p3,w)=>{ // Feldwege mit Spurrillen
    const path=(o=0)=>{c.beginPath();c.moveTo(p0[0],p0[1]+o);c.bezierCurveTo(p1[0],p1[1]+o,p2[0],p2[1]+o,p3[0],p3[1]+o)};
    c.lineCap='round';
    c.strokeStyle='rgba(90,110,50,.5)';c.lineWidth=w+14;path();c.stroke();
    c.strokeStyle='rgba(112,86,52,.88)';c.lineWidth=w;path();c.stroke();
    c.strokeStyle='rgba(158,128,86,.6)';c.lineWidth=w*.62;path();c.stroke();
    c.strokeStyle='rgba(70,52,30,.45)';c.lineWidth=3;path(-w*.22);c.stroke();path(w*.22);c.stroke();
    c.strokeStyle='rgba(90,130,50,.55)';c.lineWidth=4;c.setLineDash([2,26]);path();c.stroke();c.setLineDash([]);
  };
  road([-30,H*.56],[W*.28,H*.34],[W*.62,H*.78],[W+30,H*.48],56);
  road([W*.47,H*.62],[W*.5,H*.8],[W*.43,H*.92],[W*.45,H+30],44);
  for(let i=0;i<9;i++){ // Einschlagkrater
    const x=120+R()*(W-240),y=60+R()*(H-120),r=8+R()*14;
    g=c.createRadialGradient(x,y,r*.2,x,y,r*1.5);g.addColorStop(0,'rgba(40,30,18,.75)');g.addColorStop(.55,'rgba(70,55,32,.55)');g.addColorStop(.8,'rgba(120,100,64,.35)');g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.ellipse(x,y,r*1.5,r*1.25,R()*3,0,7);c.fill();
  }
  for(let i=0;i<6500;i++){ // Grashalme
    const x=R()*W,y=R()*H,l=3+R()*7;
    c.strokeStyle=R()<.5?'rgba(40,80,20,.35)':'rgba(170,220,110,.3)';c.lineWidth=1;
    c.beginPath();c.moveTo(x,y);c.lineTo(x+(R()-.5)*3,y-l);c.stroke();
  }
  for(let i=0;i<170;i++){c.fillStyle=['#f2e96b','#fff','#e7a3c8','#b9a6ee'][i%4];c.globalAlpha=.75;c.beginPath();c.arc(R()*W,R()*H,1.3,0,7);c.fill()}
  for(let i=0;i<180;i++){c.fillStyle=`rgba(${120+R()*60|0},${115+R()*50|0},${100+R()*40|0},.7)`;c.beginPath();c.ellipse(R()*W,R()*H,1.5+R()*2,1+R()*1.5,R()*3,0,7);c.fill()}
  c.globalAlpha=1;
  obstacles.forEach(o=>drawObstacle(c,o));
  for(let i=0;i<W;i+=9)for(const y of[0,H]){c.fillStyle=`hsl(${95+R()*25},45%,${22+R()*12}%)`;c.beginPath();c.arc(i+R()*6,y+(y?-1:1)*R()*6,9+R()*7,0,7);c.fill()} // Hecke
  for(let j=0;j<H;j+=9)for(const x of[0,W]){c.fillStyle=`hsl(${95+R()*25},45%,${22+R()*12}%)`;c.beginPath();c.arc(x+(x?-1:1)*R()*6,j+R()*6,9+R()*7,0,7);c.fill()}
  g=c.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,W*.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.4)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
}

/* ---------- Partikel ---------- */
const parts=[];
function emit(x,y,n,o){
  for(let i=0;i<n;i++){
    const a=o.dir!==undefined?o.dir+(Math.random()-.5)*(o.spread||.5):Math.random()*6.283,s=Math.random()*(o.sp||2)+(o.min||0);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:o.life*(.6+Math.random()*.4),max:o.life,size:o.size*(.6+Math.random()*.8),grow:o.grow||0,c:o.c,add:!!o.add,op:o.op||.6});
  }
}
function explode(x,y,big){
  emit(x,y,big?40:10,{sp:big?5:3,life:big?35:20,size:big?9:5,grow:big?10:5,c:'255,150,40',add:true,op:.8});
  emit(x,y,big?30:8,{sp:big?3:2,life:big?80:40,size:big?12:6,grow:big?16:8,c:'40,40,40',op:.5});
  emit(x,y,big?30:12,{sp:big?7:5,min:1,life:25,size:1.6,c:'255,220,120',add:true,op:1});
}
function updateParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;
    if(!p.add&&p.size>3){p.vy-=.02}
    if(--p.life<=0)parts.splice(i,1);
  }
}
function drawParts(){
  for(const p of parts){
    const a=p.life/p.max;
    ctx.globalCompositeOperation=p.add?'lighter':'source-over';
    ctx.fillStyle=`rgba(${p.c},${a*p.op})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size+p.grow*(1-a),0,7);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

/* ---------- Panzer ---------- */
class Tank{
  constructor(x,y,color,controls,name){
    Object.assign(this,{x,y,color,controls,name,width:40,height:50,angle:0,speed:2,turnSpeed:.033,hp:100,maxHp:100,bullets:[],reloadTime:0,maxReload:80,tread:0,recoil:0,flash:0,dist:0,dead:false});
  }
  tick(){ // läuft für JEDEN Panzer jedes Frame (auch Bot!)
    if(this.reloadTime>0)this.reloadTime--;
    this.recoil*=.85;if(this.flash>0)this.flash--;
    if(this.hp<=0)this.dead=true;
    if(this.hp<45&&Math.random()<(this.dead?.5:.25))
      emit(this.x+(Math.random()-.5)*16,this.y+(Math.random()-.5)*16,1,{sp:.6,life:50,size:4,grow:8,c:this.dead?'30,30,30':'70,70,70',op:.5});
    if(this.dead&&Math.random()<.2)emit(this.x,this.y,1,{sp:1,life:18,size:4,grow:3,c:'255,130,30',add:true,op:.7});
  }
  pts(x,y,a){const s=Math.sin(a),c=Math.cos(a);return[[x-s*14,y+c*14],[x,y],[x+s*14,y-c*14]]}
  blocked(x,y,a){ // Hindernisse + andere Panzer (3 Kreise entlang der Wanne)
    const me=this.pts(x,y,a);
    for(const p of me)if(checkObstacleCollision(p[0],p[1],24))return true;
    for(const o of tanks){if(o===this)continue;
      for(const q of o.pts(o.x,o.y,o.angle))for(const p of me)if(Math.hypot(p[0]-q[0],p[1]-q[1])<46)return true}
    return false;
  }
  turn(da){const na=this.angle+da;if(!this.blocked(this.x,this.y,na)||this.blocked(this.x,this.y,this.angle))this.angle=na}
  hitBy(bx,by){return this.pts(this.x,this.y,this.angle).some(p=>Math.hypot(bx-p[0],by-p[1])<25)}
  moveTo(nx,ny,dirSign=1){
    const ox=this.x,oy=this.y;
    if(!this.blocked(nx,ny,this.angle)){this.x=nx;this.y=ny}
    else if(!this.blocked(nx,oy,this.angle))this.x=nx;       // an Hindernissen entlanggleiten
    else if(!this.blocked(ox,ny,this.angle))this.y=ny;
    const d=Math.hypot(this.x-ox,this.y-oy);
    this.tread+=d*dirSign;
    if(d>0){
      this.dist+=d;if(Math.random()<.35)emit(this.x-Math.sin(this.angle)*38*dirSign,this.y+Math.cos(this.angle)*38*dirSign,1,{sp:.5,life:32,size:3,grow:7,c:'165,140,100',op:.28});
      if(this.dist>7){this.dist=0;
        trc.save();trc.translate(this.x,this.y);trc.rotate(this.angle);trc.fillStyle='rgba(40,28,14,.22)';
        trc.fillRect(-24,30,9,3);trc.fillRect(15,30,9,3);trc.restore();}
    }
    return d>0;
  }
  move(keys){
    if(this.dead)return;
    const s=Math.sin(this.angle),c=Math.cos(this.angle);
    if(keys[this.controls.forward])this.moveTo(this.x+s*this.speed,this.y-c*this.speed,1);
    if(keys[this.controls.backward])this.moveTo(this.x-s*this.speed,this.y+c*this.speed,-1);
    let da=0;if(keys[this.controls.left])da-=this.turnSpeed;if(keys[this.controls.right])da+=this.turnSpeed;
    if(da)this.turn(da);
    if(keys[this.controls.shoot]&&this.reloadTime<=0)this.shoot();
    this.clamp();
  }
  clamp(){
    this.x=Math.max(42,Math.min(W-42,this.x));
    this.y=Math.max(42,Math.min(H-42,this.y));
  }
  shoot(err=0){
    const a=this.angle+err,s=Math.sin(a),c=Math.cos(a),mx=this.x+Math.sin(this.angle)*66,my=this.y-Math.cos(this.angle)*66;
    this.bullets.push({x:mx,y:my,px:mx,py:my,vx:s*5,vy:-c*5,life:180});
    this.reloadTime=this.maxReload;this.recoil=6;this.flash=5;shake=Math.max(shake,3);
    emit(mx,my,6,{dir:this.angle-1.5708,spread:.6,sp:3,min:1,life:20,size:3,grow:5,c:'255,190,80',add:true,op:.8});
    emit(mx,my,4,{dir:this.angle-1.5708,spread:.8,sp:1.5,life:35,size:4,grow:8,c:'150,150,150',op:.4});
  }
  updateBullets(){
    for(let i=this.bullets.length-1;i>=0;i--){
      const b=this.bullets[i];b.px=b.x;b.py=b.y;b.x+=b.vx;b.y+=b.vy;b.life--;
      if(bulletHitsObstacle(b)){explode(b.x,b.y,false);this.bullets.splice(i,1);continue}
      if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)this.bullets.splice(i,1);
    }
  }
  checkCollision(o){
    for(let i=this.bullets.length-1;i>=0;i--){
      const b=this.bullets[i];
      if(o.hitBy(b.x,b.y)){
        o.hp-=this.dmg||15;this.bullets.splice(i,1);shake=Math.max(shake,8);
        explode(b.x,b.y,false);return true;
      }
    }
    return false;
  }

    c.save();c.translate(this.x+6,this.y+8);c.rotate(this.angle);c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.roundRect(-26,-38,52,76,7);c.fill();c.fillRect(-3,-66,6,34);c.restore();

/* ---------- Bot ---------- */
class Bot{
  constructor(tank,target){this.tank=tank;this.target=target;this.actionTimer=0;this.currentAction='move'}
  update(){
    const t=this.tank;
    if(t.dead)return;
    if(--this.actionTimer<=0){this.decideAction();this.actionTimer=Math.random()*40+25}
    const dx=this.target.x-t.x,dy=this.target.y-t.y;
    let diff=Math.atan2(dx,-dy)-t.angle;
    while(diff>Math.PI)diff-=6.283;while(diff<-Math.PI)diff+=6.283;
    if(Math.abs(diff)>.03)t.turn(Math.sign(diff)*t.turnSpeed*.7);
    const s=Math.sin(t.angle),c=Math.cos(t.angle),sp=t.speed;
    let nx=t.x,ny=t.y,sign=1;
    switch(this.currentAction){
      case'move':nx+=s*sp*.5;ny-=c*sp*.5;break;
      case'retreat':nx-=s*sp*.45;ny+=c*sp*.45;sign=-1;break;
      case'strafe_left':nx-=c*sp*.45;ny-=s*sp*.45;break;
      case'strafe_right':nx+=c*sp*.45;ny+=s*sp*.45;break;
    }
    const moved=t.moveTo(nx,ny,sign);
    if(!moved)this.actionTimer=0; // festgefahren → neue Aktion wählen
    if(Math.abs(diff)<.1&&t.reloadTime<=0&&Math.random()<.03&&this.hasLineOfSight())t.shoot((Math.random()-.5)*.3);
    t.clamp();
  }
  hasLineOfSight(){
    const dx=this.target.x-this.tank.x,dy=this.target.y-this.tank.y,d=Math.hypot(dx,dy);
    if(d>360)return false;
    const steps=Math.floor(d/20);
    for(let i=1;i<steps;i++)if(checkObstacleCollision(this.tank.x+dx/steps*i,this.tank.y+dy/steps*i,5))return false;
    return true;
  }
  decideAction(){
    const d=Math.hypot(this.tank.x-this.target.x,this.tank.y-this.target.y);
    if(d<150)this.currentAction=Math.random()>.5?'retreat':'strafe_left';
    else if(d>300)this.currentAction='move';
    else{const a=['strafe_left','strafe_right','move'];this.currentAction=a[Math.floor(Math.random()*3)]}
  }
}

    player2=new Tank(W-170,H/2,'#a88a55',{forward:'ArrowUp',backward:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',shoot:'Enter'},'Spieler 2');

addEventListener('blur',()=>keys={});

function drawHUD(){
  if(!player1||!player2)return;
  const bar=(x,p,col,label,align)=>{
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(x,14,210,34,8);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.roundRect(x+8,32,194,10,5);ctx.fill();
    const w=194*Math.max(0,p.hp)/p.maxHp;
    if(w>0){ctx.fillStyle=p.hp>35?col:'#ff5a4a';ctx.beginPath();ctx.roundRect(x+8,32,w,10,5);ctx.fill();}
    ctx.fillStyle='#fff';ctx.font='bold 12px Segoe UI,Arial';ctx.textAlign='left';
    ctx.fillText(`${label}  ${Math.max(0,Math.round(p.hp))} HP`,x+10,27);
    const r=1-Math.max(0,p.reloadTime)/p.maxReload; // Nachladebalken
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,52,210,4);
    ctx.fillStyle=r>=1?'#ffd34d':'#b58a2a';ctx.fillRect(x,52,210*r,4);
  };
  bar(16,player1,'#7ddc5a','Spieler 1');
  bar(W-226,player2,'#e8b04a',gameMode==='pvp'?'Spieler 2':'Bot');
}

function showVictory(winner){
  gameRunning=false;gameEnded=true;victoryOverlay.style.display='block';
  victoryText.textContent=`🏆 ${winner} hat gewonnen! 🏆`;
  victorySubtext.textContent=gameMode==='bot'?(winner==='Spieler 1'?'Du hast den Bot besiegt!':'Der Bot war stärker. Versuche es erneut!'):'Großartiges Duell!';
}
function checkWin(){
  if(player1.hp<=0){explode(player1.x,player1.y,true);shake=18;const w=gameMode==='pvp'?'Spieler 2':'Bot';gameInfo.textContent=`🎉 ${w} hat gewonnen!`;showVictory(w)}
  else if(player2.hp<=0){explode(player2.x,player2.y,true);shake=18;gameInfo.textContent='🎉 Spieler 1 hat gewonnen!';showVictory('Spieler 1')}
}

let last=0,acc=0;const STEP=1000/60;
function gameLoop(ts=0){
  acc+=Math.min(100,ts-last);last=ts;
  while(acc>=STEP){acc-=STEP;step()}
  render();
  requestAnimationFrame(gameLoop);
}
function step(){
  if(gameRunning&&player1&&player2){
    player1.tick();player2.tick();
    player1.move(keys);player1.updateBullets();
    if(bot)bot.update();else player2.move(keys);
    player2.updateBullets();
    player1.checkCollision(player2);player2.checkCollision(player1);
    checkWin();
  }else if(player1&&player2){player1.tick();player2.tick();player1.updateBullets();player2.updateBullets()}
  updateParts();
  shake*=.88;
}
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>.3)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.drawImage(bg,0,0);
  ctx.drawImage(trk,0,0);
  if(player1)player1.draw(ctx);
  if(player2)player2.draw(ctx);
  drawParts();
  ctx.restore();
  drawHUD();
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
