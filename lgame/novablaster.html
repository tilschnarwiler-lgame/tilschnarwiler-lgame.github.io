<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NOVA BLASTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
width: 100%; height: 100%;
background: #010510;
overflow: hidden;
touch-action: none;
-webkit-tap-highlight-color: transparent;
user-select: none;
}

body {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-family: ‘Press Start 2P’, monospace;
position: relative;
}

.stars {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 0;
}

.scanlines {
position: absolute;
inset: 0;
background: repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(0,0,0,0.12) 2px,
rgba(0,0,0,0.12) 4px
);
pointer-events: none;
z-index: 20;
}

#scale-root {
position: absolute;
top: 0; left: 50%;
transform-origin: top center;
z-index: 5;
}

#game-wrapper {
display: flex;
flex-direction: column;
align-items: center;
gap: 8px;
width: 600px;
}

/* HUD */
.hud {
display: flex;
justify-content: space-between;
width: 600px;
padding: 8px 16px;
background: rgba(0,255,245,0.05);
border: 1px solid #00fff5;
box-shadow: 0 0 15px rgba(0,255,245,0.2), inset 0 0 15px rgba(0,255,245,0.05);
}

.hud-item {
display: flex;
flex-direction: column;
gap: 4px;
align-items: center;
}

.hud-label {
font-size: 6px;
color: rgba(0,255,245,0.6);
letter-spacing: 2px;
}

.hud-value {
font-size: 14px;
color: #00fff5;
text-shadow: 0 0 10px #00fff5, 0 0 30px rgba(0,255,245,0.5), 0 0 60px rgba(0,255,245,0.2);
}

#lives-display {
color: #ff0080;
text-shadow: 0 0 10px #ff0080, 0 0 30px rgba(255,0,128,0.5), 0 0 60px rgba(255,0,128,0.2);
font-size: 16px;
}
#level-display {
color: #ffff00;
text-shadow: 0 0 10px #ffff00, 0 0 30px rgba(255,255,0,0.5);
}

/* Powerup HUD row */
.powerup-hud {
display: flex;
gap: 8px;
align-items: center;
width: 600px;
padding: 4px 16px;
font-size: 7px;
color: rgba(255,255,255,0.5);
letter-spacing: 1px;
}

.pu-indicator {
display: flex;
align-items: center;
gap: 4px;
}

.pu-dot {
width: 8px; height: 8px;
border-radius: 50%;
background: #333;
border: 1px solid #555;
display: inline-block;
}

.pu-dot.active        { background: #ffff00; box-shadow: 0 0 6px #ffff00; border-color: #ffff00; }
.pu-dot.active.rapid  { background: #00fff5; box-shadow: 0 0 6px #00fff5; border-color: #00fff5; }
.pu-dot.active.multi  { background: #ff0080; box-shadow: 0 0 6px #ff0080; border-color: #ff0080; }

/* Canvas */
#gameCanvas {
border: 2px solid #00fff5;
box-shadow: 0 0 10px #00fff5, 0 0 30px rgba(0,255,245,0.5), 0 0 60px rgba(0,255,245,0.2), inset 0 0 60px rgba(0,0,20,0.8);
display: block;
background: #040d25;
touch-action: none;
}

/* Overlay */
#overlay {
position: absolute;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 24px;
z-index: 25;
background: rgba(1,5,16,0.0);
transition: background 0.4s ease;
pointer-events: none;
}

#overlay.visible {
background: rgba(1,5,16,0.92);
pointer-events: all;
}

#overlay.hidden { display: none; }

.overlay-title {
font-family: ‘Orbitron’, sans-serif;
font-weight: 900;
font-size: 36px;
text-align: center;
line-height: 1.2;
opacity: 0;
transform: translateY(-20px) scale(0.9);
transition: opacity 0.4s ease 0.1s, transform 0.4s ease 0.1s;
}

#overlay.visible .overlay-title {
opacity: 1;
transform: translateY(0) scale(1);
}

.overlay-title.cyan   { color: #00fff5; text-shadow: 0 0 10px #00fff5, 0 0 30px rgba(0,255,245,0.5), 0 0 60px rgba(0,255,245,0.2); }
.overlay-title.pink   { color: #ff0080; text-shadow: 0 0 10px #ff0080, 0 0 30px rgba(255,0,128,0.5), 0 0 60px rgba(255,0,128,0.2); }
.overlay-title.yellow { color: #ffff00; text-shadow: 0 0 20px #ffff00, 0 0 60px rgba(255,255,0,0.5); }

.overlay-sub {
font-size: 9px;
color: rgba(255,255,255,0.6);
letter-spacing: 3px;
text-align: center;
line-height: 2;
opacity: 0;
transition: opacity 0.4s ease 0.25s;
}

#overlay.visible .overlay-sub { opacity: 1; }

.start-btn {
font-family: ‘Press Start 2P’, monospace;
font-size: 12px;
padding: 16px 32px;
background: transparent;
color: #00ff88;
border: 2px solid #00ff88;
box-shadow: 0 0 15px rgba(0,255,136,0.4), inset 0 0 15px rgba(0,255,136,0.1);
cursor: pointer;
text-shadow: 0 0 10px #00ff88;
letter-spacing: 2px;
opacity: 0;
transform: translateY(10px);
transition: opacity 0.4s ease 0.35s, transform 0.4s ease 0.35s, background 0.15s, box-shadow 0.15s;
}

#overlay.visible .start-btn {
opacity: 1;
transform: translateY(0);
animation: btnPulse 1.5s ease-in-out infinite 0.5s;
}

.start-btn:hover {
background: rgba(0,255,136,0.15);
box-shadow: 0 0 30px rgba(0,255,136,0.7), inset 0 0 20px rgba(0,255,136,0.2);
transform: scale(1.05) !important;
}

@keyframes btnPulse {
0%, 100% { opacity: 1; }
50% { opacity: 0.7; }
}

.score-result {
font-size: 11px;
color: #ffff00;
text-shadow: 0 0 15px #ffff00;
text-align: center;
line-height: 2.5;
opacity: 0;
transition: opacity 0.4s ease 0.3s;
}

#overlay.visible .score-result { opacity: 1; }

.level-clear-info {
font-size: 9px;
color: rgba(255,255,255,0.6);
letter-spacing: 2px;
text-align: center;
line-height: 2.2;
opacity: 0;
transition: opacity 0.4s ease 0.3s;
}

#overlay.visible .level-clear-info { opacity: 1; }

/* Powerup toast */
.pu-toast {
position: absolute;
font-size: 8px;
letter-spacing: 1px;
pointer-events: none;
z-index: 30;
text-shadow: 0 0 10px currentColor;
animation: toastUp 1.6s ease forwards;
}

@keyframes toastUp {
0%   { opacity:0; transform: translateY(0) scale(0.8); }
15%  { opacity:1; transform: translateY(-10px) scale(1.1); }
70%  { opacity:1; transform: translateY(-30px) scale(1); }
100% { opacity:0; transform: translateY(-50px) scale(0.9); }
}
</style>

</head>
<body>

<canvas class="stars" id="stars"></canvas>

<div id="scale-root">
<div id="game-wrapper">
  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">SCORE</span>
      <span class="hud-value" id="score-display">000000</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">LIVES</span>
      <span class="hud-value" id="lives-display">♥♥♥</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">LEVEL</span>
      <span class="hud-value" id="level-display">01</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">HI-SCORE</span>
      <span class="hud-value" id="hi-score-display">000000</span>
    </div>
  </div>

  <div class="powerup-hud" id="powerup-hud">
    <span style="color:rgba(0,255,245,0.5)">SHOTS:</span>
    <span class="pu-indicator" id="shot-indicator"></span>
    <span style="color:rgba(0,255,245,0.5);margin-left:8px">RAPID:</span>
    <span class="pu-dot" id="rapid-dot"></span>
  </div>

  <div style="position:relative;">
    <canvas id="gameCanvas" width="600" height="500"></canvas>
    <div class="scanlines"></div>
    <div id="overlay" class="visible">
      <div class="overlay-title cyan">NOVA<br>BLASTER</div>
      <div class="overlay-sub">Destroy all enemies • Survive the waves<br>★ Collect stars for powerups ★<br><br>TAP = shoot &nbsp;│&nbsp; SWIPE = dodge</div>
      <button class="start-btn" id="startBtn">► START GAME</button>
    </div>
  </div>
</div><!-- /game-wrapper -->
</div><!-- /scale-root -->

<script>
// ═══════════════════════════════════════════
// STAR BACKGROUND
// ═══════════════════════════════════════════
const starsCanvas = document.getElementById('stars');
const sc = starsCanvas.getContext('2d');
starsCanvas.width = window.innerWidth;
starsCanvas.height = window.innerHeight;

const bgStars = Array.from({length: 200}, () => ({
  x: Math.random() * starsCanvas.width,
  y: Math.random() * starsCanvas.height,
  r: Math.random() * 1.5,
  speed: Math.random() * 0.5 + 0.1,
  brightness: Math.random()
}));

function animateStars() {
  sc.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
  bgStars.forEach(s => {
    s.y += s.speed;
    if (s.y > starsCanvas.height) s.y = 0;
    s.brightness += 0.02;
    const alpha = 0.4 + Math.sin(s.brightness) * 0.3;
    sc.beginPath();
    sc.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sc.fillStyle = `rgba(200,220,255,${alpha})`;
    sc.fill();
  });
  requestAnimationFrame(animateStars);
}
animateStars();

// ═══════════════════════════════════════════
// VIEWPORT SCALING — fits any screen/embed
// ═══════════════════════════════════════════
const scaleRoot = document.getElementById('scale-root');

function applyScale() {
  const GAME_W = 600;
  const GAME_H = 592;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(1, vw / GAME_W, vh / GAME_H);
  const topOffset = Math.max(0, (vh - GAME_H * scale) / 2);
  scaleRoot.style.transform = `translateX(-50%) scale(${scale})`;
  scaleRoot.style.top = topOffset + 'px';
}

applyScale();
window.addEventListener('resize', applyScale);

// ═══════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Scale factor for touch coords
function getCanvasScale() {
  const rect = canvas.getBoundingClientRect();
  return { sx: W / rect.width, sy: H / rect.height, rect };
}

let gameState = 'menu';
let score = 0, hiScore = 0, lives = 3, level = 1;

// Player powerup state
let shotLevel = 1;     // 1, 2, or 3 bullets
let rapidFire = false; // faster shooting
let playerMaxCooldown = 15;

const player = {
  x: W/2, y: H - 70, w: 36, h: 36,
  speed: 5, shootCooldown: 0, invincible: 0,
  thruster: 0
};

let bullets = [], enemyBullets = [], enemies = [], particles = [], powerups = [];
let keys = {};
let bgScrollY = 0;
let bossAlive = false, boss = null;

// Touch state
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let isSwiping = false;
let touchMoveX = 0; // delta
let activeTouches = {};

// Enemy types
const ENEMY_TYPES = [
  { color: '#ff4444', hp: 1, score: 100, size: 22, speed: 1.2, shootRate: 180, shape: 'basic' },
  { color: '#ff8800', hp: 2, score: 200, size: 26, speed: 0.9, shootRate: 120, shape: 'tank' },
  { color: '#aa00ff', hp: 1, score: 150, size: 18, speed: 2.2, shootRate: 200, shape: 'fast' },
  { color: '#00ffaa', hp: 3, score: 300, size: 30, speed: 0.7, shootRate: 90,  shape: 'armored' },
];

// Powerup types (drops from star collectibles)
const POWERUP_TYPES = [
  { id: 'shot2',  label: '+SHOT',   color: '#ff0080',  weight: 3 },
  { id: 'shot3',  label: '3-WAY',   color: '#ff0080',  weight: 2 },
  { id: 'rapid',  label: 'RAPID',   color: '#00fff5',  weight: 3 },
  { id: 'life',   label: '+LIFE',   color: '#ff4466',  weight: 2 },
  { id: 'score',  label: '+1000',   color: '#ffff00',  weight: 4 },
];

function weightedRandom(types) {
  const total = types.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of types) {
    r -= t.weight;
    if (r <= 0) return t;
  }
  return types[types.length - 1];
}

function resetGame() {
  score = 0; lives = 3; level = 1;
  shotLevel = 1; rapidFire = false; playerMaxCooldown = 15;
  bullets = []; enemyBullets = []; enemies = []; particles = []; powerups = [];
  player.x = W/2; player.y = H - 70;
  player.shootCooldown = 0; player.invincible = 0;
  bossAlive = false; boss = null;
  spawnWave();
  updateHUD();
  updatePowerupHUD();
}

// ═══════════════════════════════════════════
// WAVE SPAWNING
// ═══════════════════════════════════════════
function spawnWave() {
  const count = 5 + level * 2;
  const cols = Math.min(8, Math.ceil(Math.sqrt(count)));
  const rows = Math.ceil(count / cols);
  let placed = 0;

  for (let r = 0; r < rows && placed < count; r++) {
    for (let c = 0; c < cols && placed < count; c++) {
      const typeIdx = Math.min(Math.floor(Math.random() * Math.min(level, ENEMY_TYPES.length)), ENEMY_TYPES.length - 1);
      const t = ENEMY_TYPES[typeIdx];
      enemies.push({
        x: 60 + c * (W - 120) / Math.max(cols - 1, 1),
        y: 40 + r * 55,
        ...JSON.parse(JSON.stringify(t)),
        dx: (Math.random() - 0.5) * 1.5 * (1 + level * 0.1),
        shootTimer: Math.floor(Math.random() * t.shootRate),
        wobble: Math.random() * Math.PI * 2,
        alive: true
      });
      placed++;
    }
  }

  if (level % 3 === 0) spawnBoss();
}

function spawnBoss() {
  bossAlive = true;
  boss = {
    x: W/2, y: 80, w: 80, h: 60,
    hp: 20 + level * 5, maxHp: 20 + level * 5,
    dx: 1.5, dy: 0,
    phase: 0, phaseTimer: 0,
    shootTimer: 0, shootRate: 60,
    alive: true
  };
}

// ═══════════════════════════════════════════
// DRAW FUNCTIONS
// ═══════════════════════════════════════════
function drawPlayer() {
  const x = player.x, y = player.y;
  if (player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0) return;

  ctx.save();
  ctx.translate(x, y);

  player.thruster = (player.thruster + 0.3) % (Math.PI * 2);
  const flameH = 10 + Math.sin(player.thruster) * 6;
  const grad = ctx.createLinearGradient(0, 10, 0, 10 + flameH);
  grad.addColorStop(0, '#00fff5');
  grad.addColorStop(0.5, '#ff0080');
  grad.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.moveTo(-8, 10); ctx.lineTo(0, 10 + flameH); ctx.lineTo(8, 10);
  ctx.fillStyle = grad; ctx.fill();

  ctx.shadowBlur = 20; ctx.shadowColor = '#00fff5';
  ctx.fillStyle = '#00fff5';
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(14, 12); ctx.lineTo(6, 8); ctx.lineTo(0, 10); ctx.lineTo(-6, 8); ctx.lineTo(-14, 12);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#001133';
  ctx.beginPath(); ctx.ellipse(0, -2, 5, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,255,245,0.6)';
  ctx.beginPath(); ctx.ellipse(0, -2, 3, 5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  e.wobble += 0.05;
  ctx.translate(Math.sin(e.wobble) * 3, 0);

  ctx.shadowBlur = 15; ctx.shadowColor = e.color;
  ctx.fillStyle = e.color;

  if (e.shape === 'basic') {
    ctx.beginPath();
    ctx.moveTo(0, -e.size/2); ctx.lineTo(e.size/2, e.size/2); ctx.lineTo(0, e.size/3); ctx.lineTo(-e.size/2, e.size/2);
    ctx.closePath(); ctx.fill();
  } else if (e.shape === 'tank') {
    ctx.fillRect(-e.size/2, -e.size/2, e.size, e.size);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(-e.size/3, -e.size/3, e.size*2/3, e.size*2/3);
  } else if (e.shape === 'fast') {
    ctx.beginPath();
    ctx.moveTo(0, -e.size); ctx.lineTo(e.size/2, e.size/2); ctx.lineTo(0, 0); ctx.lineTo(-e.size/2, e.size/2);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const r = i % 2 === 0 ? e.size/2 : e.size/3;
      i === 0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
  }

  if (e.hp > 1) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-e.size/2, -e.size/2 - 8, e.size, 5);
    ctx.fillStyle = e.color; ctx.fillRect(-e.size/2, -e.size/2 - 8, e.size * (e.hp / (e.hp + 1)), 5);
  }
  ctx.restore();
}

function drawBoss() {
  if (!boss || !boss.alive) return;
  ctx.save();
  ctx.translate(boss.x, boss.y);
  const pulse = Math.sin(Date.now() / 200) * 5;
  ctx.shadowBlur = 30 + pulse; ctx.shadowColor = '#ff0080';
  ctx.fillStyle = '#cc0066';
  ctx.beginPath(); ctx.ellipse(0, 0, boss.w/2, boss.h/2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff0080';
  ctx.beginPath(); ctx.ellipse(0, 0, boss.w/3, boss.h/3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffff00'; ctx.shadowColor = '#ffff00';
  ctx.beginPath(); ctx.arc(0, -5, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, -5, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(3, -8, 3, 0, Math.PI * 2); ctx.fill();
  const bw = 160;
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(-bw/2, boss.h/2 + 8, bw, 10);
  ctx.fillStyle = `hsl(${(boss.hp/boss.maxHp)*120}, 100%, 50%)`;
  ctx.fillRect(-bw/2, boss.h/2 + 8, bw * (boss.hp / boss.maxHp), 10);
  ctx.fillStyle = '#fff'; ctx.font = '8px "Press Start 2P"';
  ctx.textAlign = 'center'; ctx.fillText('BOSS', 0, boss.h/2 + 6);
  ctx.restore();
}

function drawBullet(b, isEnemy) {
  ctx.save();
  ctx.shadowBlur = 12;
  if (isEnemy) {
    ctx.shadowColor = '#ff4400'; ctx.fillStyle = '#ff4400';
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff8800';
    ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.shadowColor = '#00fff5'; ctx.fillStyle = '#00fff5';
    ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x - 1, b.y - 6, 2, 6);
  }
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.shadowBlur = 10; ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.life / p.maxLife), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function drawPowerups() {
  powerups.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    p.rot = (p.rot || 0) + 0.06;
    ctx.rotate(p.rot);
    const pulse = 1 + Math.sin(Date.now() / 200 + p.x) * 0.15;
    ctx.scale(pulse, pulse);
    ctx.shadowBlur = 20; ctx.shadowColor = p.pu.color;
    ctx.fillStyle = p.pu.color;

    // Draw star shape
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      const r = i % 2 === 0 ? 12 : 5;
      i === 0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();

    // Label
    ctx.rotate(-p.rot);
    ctx.scale(1/pulse, 1/pulse);
    ctx.font = '5px "Press Start 2P"';
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.pu.label.slice(0,4), 0, 0);
    ctx.restore();
  });
}

// ═══════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════
function explode(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 2 + Math.random() * 4,
      color,
      life: 30 + Math.random() * 20,
      maxLife: 50
    });
  }
}

// ═══════════════════════════════════════════
// POWERUP APPLICATION
// ═══════════════════════════════════════════
function applyPowerup(pu, x, y) {
  switch (pu.id) {
    case 'shot2':
      shotLevel = Math.max(shotLevel, 2);
      break;
    case 'shot3':
      shotLevel = 3;
      break;
    case 'rapid':
      rapidFire = true;
      playerMaxCooldown = 11;
      break;
    case 'life':
      if (lives < 5) lives++;
      break;
    case 'score':
      score += 1000 * level;
      break;
  }
  updateHUD();
  updatePowerupHUD();
  showPowerupToast(pu.label, pu.color, x, y);
  explode(x, y, pu.color, 14);
}

function showPowerupToast(label, color, cx, cy) {
  const wrapper = document.querySelector('[style*="position:relative"]') || document.getElementById('game-wrapper');
  const toast = document.createElement('div');
  toast.className = 'pu-toast';
  toast.style.color = color;
  toast.style.left = (cx / W * canvas.getBoundingClientRect().width) + 'px';
  toast.style.top = (cy / H * canvas.getBoundingClientRect().height - 20) + 'px';
  toast.textContent = label;

  const canvasParent = canvas.parentElement;
  canvasParent.appendChild(toast);
  setTimeout(() => toast.remove(), 1700);
}

// ═══════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════
function update() {
  if (gameState !== 'playing') return;

  bgScrollY = (bgScrollY + 1) % H;

  // Touch swipe movement
  const swipeMove = touchMoveX;
  touchMoveX = 0;

  const movL = keys['ArrowLeft'] || keys['a'];
  const movR = keys['ArrowRight'] || keys['d'];
  if (movL && player.x > player.w/2) player.x -= player.speed;
  if (movR && player.x < W - player.w/2) player.x += player.speed;

  // Apply swipe — capped to keyboard speed
  if (Math.abs(swipeMove) > 0) {
    const capped = Math.max(-player.speed, Math.min(player.speed, swipeMove));
    player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x + capped));
  }

  // Shooting
  player.shootCooldown--;
  const shooting = keys[' '] || touchShootPulse;
  touchShootPulse = false;

  if (shooting && player.shootCooldown <= 0) {
    if (shotLevel === 1) {
      bullets.push({ x: player.x, y: player.y - 20, dy: -9 });
    } else if (shotLevel === 2) {
      bullets.push({ x: player.x - 8, y: player.y - 10, dy: -9 });
      bullets.push({ x: player.x + 8, y: player.y - 10, dy: -9 });
    } else {
      bullets.push({ x: player.x, y: player.y - 20, dy: -10 });
      bullets.push({ x: player.x - 12, y: player.y - 8, dy: -9, dx: -0.4 });
      bullets.push({ x: player.x + 12, y: player.y - 8, dy: -9, dx: 0.4 });
    }
    player.shootCooldown = playerMaxCooldown;
  }

  // Auto-fire on hold (touch)
  if (touchHolding && player.shootCooldown <= 0) {
    if (shotLevel === 1) {
      bullets.push({ x: player.x, y: player.y - 20, dy: -9 });
    } else if (shotLevel === 2) {
      bullets.push({ x: player.x - 8, y: player.y - 10, dy: -9 });
      bullets.push({ x: player.x + 8, y: player.y - 10, dy: -9 });
    } else {
      bullets.push({ x: player.x, y: player.y - 20, dy: -10 });
      bullets.push({ x: player.x - 12, y: player.y - 8, dy: -9, dx: -0.4 });
      bullets.push({ x: player.x + 12, y: player.y - 8, dy: -9, dx: 0.4 });
    }
    player.shootCooldown = playerMaxCooldown;
  }

  if (player.invincible > 0) player.invincible--;

  bullets = bullets.filter(b => {
    b.y += b.dy;
    if (b.dx) b.x += b.dx;
    return b.y > -10 && b.x > -10 && b.x < W + 10;
  });

  enemyBullets = enemyBullets.filter(b => {
    b.x += (b.dx || 0); b.y += b.dy;
    return b.y < H + 10 && b.x > -10 && b.x < W + 10;
  });

  enemies.forEach(e => {
    e.x += e.dx;
    if (e.x < e.size || e.x > W - e.size) e.dx *= -1;
    e.y += Math.sin(e.wobble * 0.5) * 0.3;

    e.shootTimer--;
    if (e.shootTimer <= 0) {
      e.shootTimer = Math.max(30, e.shootRate - level * 5);
      if (Math.random() < 0.4) {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        enemyBullets.push({ x: e.x, y: e.y + e.size/2, dx: Math.cos(angle) * 2, dy: Math.sin(angle) * 3 + 1 });
      }
    }
  });

  if (boss && boss.alive) {
    boss.x += boss.dx;
    boss.phaseTimer++;
    if (boss.x < boss.w/2 || boss.x > W - boss.w/2) boss.dx *= -1;
    if (boss.phaseTimer > 120) { boss.phaseTimer = 0; boss.phase = (boss.phase + 1) % 3; }
    boss.shootTimer--;
    if (boss.shootTimer <= 0) {
      boss.shootTimer = boss.shootRate;
      const patterns = [[[0,4]],[[-0.3,4],[0,4],[0.3,4]],[[-0.5,3],[-0.25,3],[0,4],[0.25,3],[0.5,3]]];
      patterns[boss.phase].forEach(([dx,dy]) => {
        enemyBullets.push({ x: boss.x, y: boss.y + boss.h/2 + 10, dx, dy });
      });
    }
  }

  // Bullet vs enemy
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.size) {
        b.hit = true; e.hp--;
        explode(e.x, e.y, e.color, 4);
        if (e.hp <= 0) {
          e.alive = false;
          explode(e.x, e.y, e.color, 16);
          score += e.score * level;
          // Drop star powerup
          if (Math.random() < 0.18) {
            const pu = weightedRandom(POWERUP_TYPES);
            powerups.push({ x: e.x, y: e.y, dy: 1.5, rot: 0, pu });
          }
        }
      }
    });

    if (boss && boss.alive && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.w/2) {
      b.hit = true; boss.hp--;
      explode(boss.x + (Math.random()-0.5)*40, boss.y + (Math.random()-0.5)*30, '#ff0080', 5);
      if (boss.hp <= 0) {
        boss.alive = false; bossAlive = false;
        explode(boss.x, boss.y, '#ff0080', 40);
        explode(boss.x, boss.y, '#ffff00', 30);
        score += 5000 * level;
        // Boss drops 3 powerups
        for (let i = 0; i < 3; i++) {
          const pu = weightedRandom(POWERUP_TYPES);
          powerups.push({ x: boss.x + (i-1)*40, y: boss.y + 20, dy: 1.5, rot: 0, pu });
        }
      }
    }
  });

  bullets = bullets.filter(b => !b.hit);
  enemies = enemies.filter(e => e.alive);

  // Enemy bullet vs player
  if (player.invincible <= 0) {
    enemyBullets.forEach(b => {
      if (Math.hypot(b.x - player.x, b.y - player.y) < 18) {
        b.gone = true;
        playerHit();
      }
    });
    enemyBullets = enemyBullets.filter(b => !b.gone);
  }

  enemies.forEach(e => {
    if (e.y > H - 40) { e.alive = false; playerHit(); }
  });
  enemies = enemies.filter(e => e.alive);

  // Powerups
  powerups = powerups.filter(p => {
    p.y += p.dy;
    if (Math.hypot(p.x - player.x, p.y - player.y) < 24) {
      applyPowerup(p.pu, p.x, p.y);
      return false;
    }
    return p.y < H + 30;
  });

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life--;
    return p.life > 0;
  });

  // Wave complete
  if (enemies.length === 0 && !bossAlive) {
    gameState = 'levelclear';
    showLevelClear();
  }

  updateHUD();
}

function playerHit() {
  lives--;
  player.invincible = 120;
  explode(player.x, player.y, '#00fff5', 20);
  updateHUD();
  if (lives <= 0) {
    gameState = 'gameover';
    if (score > hiScore) hiScore = score;
    setTimeout(showGameOver, 400);
  }
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render() {
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(0,80,120,0.12)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = bgScrollY % 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  drawParticles();
  drawPowerups();
  bullets.forEach(b => drawBullet(b, false));
  enemyBullets.forEach(b => drawBullet(b, true));
  enemies.forEach(e => drawEnemy(e));
  if (boss && boss.alive) drawBoss();
  if (gameState === 'playing') drawPlayer();

  if (gameState === 'paused') {
    ctx.fillStyle = 'rgba(0,0,20,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00fff5'; ctx.shadowBlur = 20; ctx.shadowColor = '#00fff5';
    ctx.font = '22px "Press Start 2P"'; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.font = '8px "Press Start 2P"'; ctx.fillStyle = '#fff'; ctx.shadowBlur = 0;
    ctx.fillText('PRESS P TO RESUME', W/2, H/2 + 40);
  }

  if (gameState === 'levelclear' || gameState === 'gameover') {
    // Just keep drawing particles
  }
}

// ═══════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════
function updateHUD() {
  document.getElementById('score-display').textContent = String(score).padStart(6, '0');
  document.getElementById('hi-score-display').textContent = String(Math.max(score, hiScore)).padStart(6, '0');
  document.getElementById('lives-display').textContent = '♥'.repeat(Math.max(0, lives));
  document.getElementById('level-display').textContent = String(level).padStart(2, '0');
}

function updatePowerupHUD() {
  const si = document.getElementById('shot-indicator');
  si.innerHTML = '';
  for (let i = 1; i <= 3; i++) {
    const d = document.createElement('span');
    d.className = 'pu-dot' + (i <= shotLevel ? ' active multi' : '');
    si.appendChild(d);
  }
  const rd = document.getElementById('rapid-dot');
  rd.className = 'pu-dot' + (rapidFire ? ' active rapid' : '');
}

// ═══════════════════════════════════════════
// OVERLAY SYSTEM
// ═══════════════════════════════════════════
const overlay = document.getElementById('overlay');

function showOverlay(html) {
  overlay.classList.remove('hidden');
  overlay.innerHTML = html;
  // Force reflow then add visible
  overlay.offsetHeight;
  overlay.classList.add('visible');
}

function hideOverlay() {
  overlay.classList.remove('visible');
  setTimeout(() => overlay.classList.add('hidden'), 450);
}

function showLevelClear() {
  level++;
  updateHUD();
  showOverlay(`
    <div class="overlay-title yellow">LEVEL<br>CLEAR!</div>
    <div class="level-clear-info">
      SCORE: ${String(score).padStart(6,'0')}<br>
      LEVEL ${String(level-1).padStart(2,'0')} → LEVEL ${String(level).padStart(2,'0')}<br>
      <span style="font-size:7px;color:#888">POWERUPS CARRY OVER</span>
    </div>
    <button class="start-btn" id="continueBtn" style="color:#ffff00;border-color:#ffff00;box-shadow:0 0 15px rgba(255,255,0,0.4)">► NEXT WAVE</button>
  `);
  document.getElementById('continueBtn').addEventListener('click', () => {
    hideOverlay();
    bullets = []; enemyBullets = [];
    player.x = W/2; player.y = H - 70;
    player.invincible = 60;
    bossAlive = false; boss = null;
    spawnWave();
    setTimeout(() => { gameState = 'playing'; }, 460);
  });
}

function showGameOver() {
  showOverlay(`
    <div class="overlay-title pink">GAME<br>OVER</div>
    <div class="score-result">
      SCORE: ${String(score).padStart(6,'0')}<br>
      HI-SCORE: ${String(Math.max(score,hiScore)).padStart(6,'0')}<br>
      LEVEL REACHED: ${String(level).padStart(2,'0')}
    </div>
    <button class="start-btn" id="startBtn">► PLAY AGAIN</button>
  `);
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function startGame() {
  hideOverlay();
  setTimeout(() => {
    resetGame();
    gameState = 'playing';
  }, 460);
}

// Initial menu button
document.getElementById('startBtn').addEventListener('click', startGame);

// ═══════════════════════════════════════════
// INPUT — KEYBOARD
// ═══════════════════════════════════════════
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  if (e.key === 'p' || e.key === 'P') {
    if (gameState === 'playing') gameState = 'paused';
    else if (gameState === 'paused') gameState = 'playing';
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
}, { passive: false });

// ═══════════════════════════════════════════
// INPUT — TOUCH
// ═══════════════════════════════════════════
let touchShootPulse = false;
let touchHolding = false;
let touchMoveAccum = 0;

// Track individual touches for swipe vs tap
let primaryTouchId = null;
let primaryTouchStartX = 0;
let primaryTouchStartY = 0;
let primaryTouchStartTime = 0;
let lastTouchX = 0;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState !== 'playing') return;
  const t = e.changedTouches[0];
  if (primaryTouchId === null) {
    primaryTouchId = t.identifier;
    primaryTouchStartX = t.clientX;
    primaryTouchStartY = t.clientY;
    primaryTouchStartTime = Date.now();
    lastTouchX = t.clientX;
    touchHolding = true;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (gameState !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.identifier === primaryTouchId) {
      const dx = t.clientX - lastTouchX;
      lastTouchX = t.clientX;
      // Convert screen pixels → canvas pixels (accounts for CSS scaling + canvas CSS size)
      const rect = canvas.getBoundingClientRect();
      const cssToCanvas = W / rect.width;
      touchMoveX += dx * cssToCanvas;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === primaryTouchId) {
      primaryTouchId = null;
      touchHolding = false;

      const dt = Date.now() - primaryTouchStartTime;
      const dist = Math.hypot(t.clientX - primaryTouchStartX, t.clientY - primaryTouchStartY);

      // Tap = short duration + small movement = SHOOT
      if (dt < 250 && dist < 20) {
        touchShootPulse = true;
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchcancel', e => {
  primaryTouchId = null;
  touchHolding = false;
}, { passive: false });

// ═══════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
updateHUD();
updatePowerupHUD();
</script>
