let levels;
let _coinSnap=[], levelCoins=0;

// ── player
const player={x:0,y:0,w:30,h:40,vx:0,vy:0,onGround:false,jumpsLeft:2,facingRight:true};
const GRAVITY=0.52, SPEED=3.2, JUMP=-11;

function resetPlayer(){
  const s=levels[currentLevel].start;
  player.x=s.x; player.y=s.y; player.vx=0; player.vy=0;
  player.onGround=false; player.jumpsLeft=2;
  levels[currentLevel].bullets=[];
}
function tryJump(){
  if(player.jumpsLeft>0){
    player.vy=JUMP*(player.jumpsLeft===2?1:0.82);
    player.jumpsLeft--;
    addP(player.x+player.w/2,player.y+player.h,'#00ffcc',6);
  }
}

// ── particles
function addP(x,y,color,n){
  for(let i=0;i<n;i++) particles.push({
    x,y, vx:(Math.random()-.5)*5, vy:-Math.random()*4-1,
    life:18+Math.random()*12, maxLife:30, color, size:2+Math.random()*3
  });
}

// ── stars
const stars=Array.from({length:120},()=>({
  x:Math.random()*5000, y:Math.random()*H*0.9,
  s:Math.random()*1.8+.3, t:Math.random()*Math.PI*2,
}));

// ── collision
function over(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function cirR(cx,cy,r,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw)), ny=Math.max(ry,Math.min(cy,ry+rh));
  return (cx-nx)**2+(cy-ny)**2<r*r;
}

// ── update
function update(){
  frame++;
  const lv=levels[currentLevel];

  lv.bouncers.forEach(b=>{ b.y+=b.dir*b.speed; if(Math.abs(b.y-b.oy)>=b.range) b.dir*=-1; });

  lv.turrets.forEach(t=>{ t.timer++; if(t.timer>=t.interval){ t.timer=0; lv.bullets.push({x:t.x,y:t.y+7,vx:-3.5,vy:0,r:5}); } });
  lv.bullets=lv.bullets.filter(b=>{ b.x+=b.vx; return b.x>-30&&b.x<lv.worldW+30; });

  lv.lasers.forEach(l=>{ if(!l.range) return; if(l.ox===undefined) l.ox=l.x; l.x+=l.dir*l.speed; if(Math.abs(l.x-l.ox)>=l.range) l.dir*=-1; });

  if(keys['ArrowLeft']){ player.vx=-SPEED; player.facingRight=false; }
  else if(keys['ArrowRight']){ player.vx=SPEED; player.facingRight=true; }
  else player.vx*=0.75;

  player.vy+=GRAVITY; player.x+=player.vx; player.y+=player.vy;
  player.onGround=false;

  lv.plats.forEach(p=>{
    if(over(player,p)&&player.vy>0&&player.y+player.h-player.vy<=p.y+4){
      player.y=p.y-player.h; player.vy=0; player.onGround=true; player.jumpsLeft=2;
    }
  });

  player.x=Math.max(0,Math.min(player.x,lv.worldW-player.w));

  lv.coins.forEach(c=>{
    if(c.collected) return;
    if(cirR(c.x,c.y,10,player.x,player.y,player.w,player.h)){
      c.collected=true; levelCoins++; totalCoins++;
      addP(c.x,c.y,'#ffdd33',10); updateHUD();
    }
  });

  // hazards
  lv.lasers.forEach(l=>{ if(over(player,l)) die(); });
  lv.spikes.forEach(s=>{ if(over(player,{x:s.x+4,y:s.y+4,w:s.w-8,h:s.h-4})) die(); });
  lv.bouncers.forEach(b=>{ if(cirR(b.x,b.y,b.r+2,player.x,player.y,player.w,player.h)) die(); });
  lv.bullets.forEach(b=>{ if(cirR(b.x,b.y,b.r+2,player.x,player.y,player.w,player.h)) die(); });

  if(over(player,lv.portal)) winLevel();
  if(player.y>H+100) die();

  particles=particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; return p.life>0; });
}

function snapCoins(){ _coinSnap=levels[currentLevel].coins.map(c=>c.collected); }
function restoreCoins(){ levels[currentLevel].coins.forEach((c,i)=>c.collected=_coinSnap[i]); totalCoins-=levelCoins; }

function die(){
  addP(player.x+15,player.y+20,'#ff4466',18);
  restoreCoins(); levelCoins=0;
  tries++; resetPlayer(); updateHUD();
}

function winLevel(){
  addP(levels[currentLevel].portal.x+17,levels[currentLevel].portal.y+27,'#00ffcc',25);
  const collected=levels[currentLevel].coins.filter(c=>c.collected).length;
  const total=levels[currentLevel].coins.length;
  const starCount=collected===total?3:collected>=Math.ceil(total/2)?2:collected>0?1:0;
  prog.done[currentLevel]=true;
  prog.stars[currentLevel]=Math.max(prog.stars[currentLevel],starCount);
  if(currentLevel+1<8) prog.unlocked[currentLevel+1]=true;
  saveProg();
  showWin(collected,total,starCount);
}

// ── draw
function draw(){
  const lv=levels[currentLevel];
  const camX=Math.max(0,Math.min(player.x-W/2+player.w/2,lv.worldW-W));
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,lv.bg[0]); bg.addColorStop(1,lv.bg[1]);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ctx.save();
  stars.forEach(s=>{
    s.t+=0.018; const a=0.25+Math.sin(s.t)*0.25;
    const sx=((s.x-camX*.2)%(lv.worldW*.5+W)+lv.worldW*.5+W)%(lv.worldW*.5+W);
    ctx.globalAlpha=a; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(sx,s.y,s.s,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1; ctx.restore();

  ctx.save(); ctx.translate(-camX,0);

  // platforms
  lv.plats.forEach(p=>{
    ctx.shadowColor=lv.pc; ctx.shadowBlur=10;
    ctx.fillStyle=lv.pc; ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fillRect(p.x,p.y,p.w,3);
    ctx.shadowBlur=0;
  });

  // spikes
  lv.spikes.forEach(s=>{
    ctx.save(); ctx.shadowColor='#ff8800'; ctx.shadowBlur=8;
    ctx.fillStyle='#ff8800';
    ctx.beginPath(); ctx.moveTo(s.x,s.y+s.h); ctx.lineTo(s.x+s.w/2,s.y); ctx.lineTo(s.x+s.w,s.y+s.h); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffcc00';
    ctx.beginPath(); ctx.moveTo(s.x+4,s.y+s.h); ctx.lineTo(s.x+s.w/2,s.y+3); ctx.lineTo(s.x+s.w-4,s.y+s.h); ctx.closePath(); ctx.fill();
    ctx.restore();
  });

  // lasers
  lv.lasers.forEach(l=>{
    ctx.save(); ctx.shadowColor='#ff2244'; ctx.shadowBlur=16;
    ctx.fillStyle='#ff2244'; ctx.fillRect(l.x,l.y,l.w,l.h);
    ctx.fillStyle='#ff8899'; ctx.fillRect(l.x,l.y,l.w,2);
    ctx.restore();
  });

  // bouncers
  lv.bouncers.forEach(b=>{
    ctx.save(); ctx.shadowColor='#ff9900'; ctx.shadowBlur=14;
    ctx.fillStyle='#ff9900'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffdd66'; ctx.beginPath(); ctx.arc(b.x-3,b.y-3,b.r*.35,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // turrets
  lv.turrets.forEach(t=>{
    ctx.save(); ctx.shadowColor='#ff5500'; ctx.shadowBlur=12;
    ctx.fillStyle='#cc3300'; ctx.fillRect(t.x-10,t.y,22,14);
    ctx.fillStyle='#ff5500'; ctx.fillRect(t.x-15,t.y+3,15,7);
    ctx.fillStyle='#ff9966'; ctx.fillRect(t.x-15,t.y+4,15,2);
    if(Math.floor(frame/15)%2===0){ ctx.fillStyle='#ffff00'; ctx.beginPath(); ctx.arc(t.x+8,t.y+3,3,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  });

  // bullets
  lv.bullets.forEach(b=>{
    ctx.save(); ctx.shadowColor='#ff5500'; ctx.shadowBlur=10;
    ctx.fillStyle='#ff8833'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // coins
  lv.coins.forEach(c=>{
    if(c.collected) return;
    const bob=Math.sin(frame*.08+c.x)*3;
    ctx.save(); ctx.shadowColor='#ffdd33'; ctx.shadowBlur=14;
    ctx.fillStyle='#ffdd33'; ctx.beginPath(); ctx.arc(c.x,c.y+bob,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff5'; ctx.beginPath(); ctx.arc(c.x-2,c.y+bob-3,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // portal
  drawPortal(lv.portal);
  drawPlayer();
  ctx.restore();

  // particles
  ctx.save(); ctx.translate(-camX,0);
  particles.forEach(p=>{ ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); });
  ctx.globalAlpha=1; ctx.restore();
}

function drawPortal(portal){
  const cx=portal.x+portal.w/2, cy=portal.y+portal.h/2, pulse=Math.sin(frame*.07)*4;
  ctx.save(); ctx.shadowColor='#00ffcc'; ctx.shadowBlur=30;
  ctx.strokeStyle='#00ffcc'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(cx,cy,portal.w/2+pulse,portal.h/2+pulse,0,0,Math.PI*2); ctx.stroke();
  const g=ctx.createRadialGradient(cx,cy,2,cx,cy,portal.w/2);
  g.addColorStop(0,'#00ffcc55'); g.addColorStop(1,'#00ffcc00');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,portal.w/2+pulse,portal.h/2+pulse,0,0,Math.PI*2); ctx.fill();
  for(let i=0;i<6;i++){
    const a=(frame*.04)+(i/6)*Math.PI*2;
    ctx.strokeStyle=`rgba(0,255,200,${.3+i*.05})`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*(portal.w/2+pulse),cy+Math.sin(a)*(portal.h/2+pulse)); ctx.stroke();
  }
  ctx.shadowBlur=0; ctx.fillStyle='#00ffcc'; ctx.font='7px Press Start 2P'; ctx.textAlign='center';
  ctx.fillText('ZIEL',cx,portal.y-8); ctx.restore();
}

function drawPlayer(){
  const p=player;
  ctx.save();
  if(!p.facingRight){ ctx.translate(p.x+p.w,0); ctx.scale(-1,1); ctx.translate(-p.x,0); }
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(p.x+p.w/2,355,14,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#00aaff'; ctx.fillRect(p.x+4,p.y+13,p.w-8,p.h-13);
  ctx.fillStyle='#ffcc99'; ctx.fillRect(p.x+5,p.y,p.w-10,16);
  ctx.fillStyle='#003366'; ctx.fillRect(p.x+5,p.y,p.w-10,10);
  ctx.fillStyle='#66ccff55'; ctx.fillRect(p.x+7,p.y+1,p.w-14,6);
  ctx.fillStyle='#00ffcc'; ctx.fillRect(p.x+9,p.y+3,4,4); ctx.fillRect(p.x+18,p.y+3,4,4);
  ctx.fillStyle='#fff'; ctx.fillRect(p.x+10,p.y+3,2,2); ctx.fillRect(p.x+19,p.y+3,2,2);
  ctx.fillStyle='#0066cc'; ctx.fillRect(p.x+4,p.y+20,p.w-8,4);
  ctx.fillStyle='#888'; ctx.fillRect(p.x+p.w-6,p.y+13,6,16);
  if(!p.onGround){ ctx.shadowColor='#ff6600'; ctx.shadowBlur=10; ctx.fillStyle='#ff6600'; ctx.fillRect(p.x+p.w-4,p.y+28,3,5+Math.random()*4); ctx.shadowBlur=0; }
  const ls=p.onGround?Math.sin(frame*.28)*5:0;
  ctx.fillStyle='#0055aa'; ctx.fillRect(p.x+5,p.y+p.h-11,9,11+ls); ctx.fillRect(p.x+16,p.y+p.h-11,9,11-ls);
  ctx.fillStyle='#002255'; ctx.fillRect(p.x+4,p.y+p.h-3,11,4); ctx.fillRect(p.x+15,p.y+p.h-3,11,4);
  ctx.restore();
}

// ── HUD
function updateHUD(){
  lvlTxt.textContent = gameState==='playing' ? `${levels[currentLevel].name}` : 'SPACE DASH';
  coinTxt.textContent= `STERNE: ${totalCoins}`;
  tryTxt.textContent = `VERSUCHE: ${tries}`;
}

// ── SCREENS
function btn(label,cls,cb){
  const b=document.createElement('button');
  b.className='ov-btn '+(cls||''); b.textContent=label;
  b.onclick=cb; return b;
}
function clearOv(){ overlay.innerHTML=''; overlay.style.display='flex'; }

function showMenu(){
  gameState='menu'; clearOv();
  const t=document.createElement('div'); t.className='ov-title'; t.textContent='SPACE DASH'; overlay.appendChild(t);
  const s=document.createElement('p'); s.className='ov-sub'; s.innerHTML='Erreiche das Portal · Sammle Sterne<br>Weiche Lasern, Spikes, Bällen und Geschossen aus'; overlay.appendChild(s);
  overlay.appendChild(btn('► LEVEL WÄHLEN','',showLevelSelect));
  updateHUD();
}

function showLevelSelect(){
  gameState='levelselect'; clearOv();
  const t=document.createElement('div'); t.className='ov-title'; t.style.fontSize='17px'; t.textContent='LEVEL AUSWAHL'; overlay.appendChild(t);
  const grid=document.createElement('div'); grid.id='levelGrid'; overlay.appendChild(grid);
  levels.forEach((lv,i)=>{
    const b=document.createElement('button');
    const done=prog.done[i], unlocked=prog.unlocked[i];
    b.className='lvl-btn '+(done?'done':unlocked?'unlocked':'');
    const stars=done?'★'.repeat(prog.stars[i])+'☆'.repeat(3-prog.stars[i]):'';
    b.innerHTML=`${i+1}<br><span style="font-size:7px;color:#aaa">${lv.name}</span><br><span style="font-size:8px;color:#ffdd33">${stars}</span>`;
    if(unlocked||done) b.onclick=()=>startLevel(i);
    else b.disabled=true;
    grid.appendChild(b);
  });
  overlay.appendChild(btn('◄ ZURÜCK','sm',showMenu));
}

function startLevel(idx){
  levels=makeLevels();
  currentLevel=idx; tries=0; totalCoins=0; levelCoins=0;
  particles=[]; frame=0;
  snapCoins(); resetPlayer();
  overlay.style.display='none';
  gameState='playing'; updateHUD();
}

function showWin(collected,total,starCount){
  gameState='win'; clearOv();
  const isLast=currentLevel===levels.length-1;
  const t=document.createElement('div'); t.className='ov-title';
  t.style.cssText='color:#ffdd33;text-shadow:0 0 30px #ffdd33,3px 3px #554400;font-size:20px';
  t.textContent=isLast?'ALL CLEAR! 🚀':'LEVEL KLAR!'; overlay.appendChild(t);
  const s=document.createElement('p'); s.style.cssText='font-size:14px;color:#ffdd33;text-shadow:0 0 10px #ffdd33';
  s.textContent='★'.repeat(starCount)+'☆'.repeat(3-starCount)+`  ${collected}/${total} Sterne`; overlay.appendChild(s);
  const t2=document.createElement('p'); t2.className='ov-sub'; t2.textContent=`Versuche: ${tries}`; overlay.appendChild(t2);
  if(!isLast) overlay.appendChild(btn('► WEITER','gold',()=>startLevel(currentLevel+1)));
  overlay.appendChild(btn('LEVEL AUSWAHL','sm',showLevelSelect));
}

// ── LOOP
function loop(){
  if(gameState==='playing'){ update(); draw(); }
  requestAnimationFrame(loop);
}

levels=makeLevels();
showMenu();
loop();
</script>
