<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STICKMAN BRAWL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:linear-gradient(180deg,#f5f5f5 0%,#e8e8e8 50%,#d5d5d5 100%);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;overflow-y:auto;overflow-x:hidden;
  font-family:'Share Tech Mono',monospace;color:#333;user-select:none;
  padding:20px 0;
}

/* ─── TITEL ─── */
#title-wrap{text-align:center;margin-bottom:15px}
#main-title{
  font-family:'Black Ops One',cursive;font-size:4rem;letter-spacing:12px;
  color:#222;text-shadow:3px 3px 0 rgba(0,0,0,0.1);
  line-height:1.1;
}
#main-subtitle{font-size:0.75rem;color:#666;letter-spacing:5px;margin-top:4px}

/* ─── LEVEL-AUSWAHL ─── */
#level-select{
  display:flex;flex-wrap:wrap;justify-content:center;gap:16px;
  max-width:750px;margin:25px auto;
}
.level-card{
  width:155px;height:100px;background:white;
  border:2px solid #ccc;border-radius:8px;
  cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px;
}
.level-card:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,0.15);border-color:#999;}
.level-card.locked{opacity:0.4;cursor:not-allowed;filter:grayscale(0.6)}
.level-card.locked:hover{transform:none;box-shadow:0 3px 10px rgba(0,0,0,0.08);border-color:#ccc}
.level-card.completed{border-color:#4caf50}
.level-card.completed::after{
  content:'✓';position:absolute;top:6px;right:10px;
  font-size:1.1rem;color:#4caf50;font-weight:bold;
}
.level-num{font-family:'Black Ops One',cursive;font-size:1.4rem;color:#222;letter-spacing:3px}
.level-name{font-size:0.65rem;color:#888;letter-spacing:2px;margin-top:3px}
.level-bots{font-size:0.55rem;color:#aaa;margin-top:3px}

/* ─── BUTTONS ─── */
#action-buttons{
  display:flex;gap:15px;margin:10px auto 20px;
  justify-content:center;
}
.btn{
  background:white;border:2px solid #333;color:#333;
  padding:12px 32px;font-family:'Black Ops One',cursive;
  font-size:0.9rem;letter-spacing:3px;cursor:pointer;
  transition:all 0.2s;
  border-radius:4px;
  text-align:center;
  min-width:150px;
}
.btn:hover{background:#333;color:#fff;transform:scale(1.04)}
.btn:active{transform:scale(0.96)}
.btn.primary{border-color:#222;background:#222;color:#fff}
.btn.primary:hover{background:#444;border-color:#444}
.btn.green{border-color:#2a7a2a;color:#2a7a2a}
.btn.green:hover{background:#2a7a2a;color:#fff}
.btn.small{font-size:0.65rem;padding:6px 18px;min-width:auto;letter-spacing:2px;border-color:#aaa;color:#888}
.btn.small:hover{background:#aaa;color:#fff}

/* ─── GAME SCREEN ─── */
#game-screen{display:none;flex-direction:column;align-items:center}
#back-btn{
  align-self:flex-start;margin-left:30px;margin-bottom:5px;
  background:none;border:1px solid #999;color:#666;border-radius:4px;
  padding:5px 15px;font-family:'Share Tech Mono',monospace;
  font-size:0.65rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;
}
#back-btn:hover{background:#eee;color:#222}
#game-title{font-family:'Black Ops One',cursive;font-size:1.8rem;letter-spacing:6px;color:#222;margin-bottom:4px}
#game-subtitle{font-size:0.6rem;color:#888;letter-spacing:3px;margin-bottom:6px}

#hud{display:flex;width:800px;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
.health-wrap{display:flex;flex-direction:column;gap:3px;flex:1}
.health-wrap.right{align-items:flex-end}
.fighter-label{font-size:0.68rem;letter-spacing:3px;color:#444;font-weight:bold}
.hp-outer{width:100%;height:14px;background:#ddd;border:1px solid #999;overflow:hidden;position:relative;border-radius:2px}
.hp-inner{height:100%;transition:width 0.15s linear;border-radius:2px}
#p1hp{background:linear-gradient(90deg,#333,#555)}
.bot-hps{display:flex;flex-direction:column;gap:4px;align-items:flex-end;width:100%}
.bot-hp-bar{width:100%;height:14px;background:#ddd;border:1px solid #999;overflow:hidden;position:relative;border-radius:2px}
.bot-hp-fill{height:100%;transition:width 0.15s linear;border-radius:2px}
#center-hud{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:100px}
#round-label{font-family:'Black Ops One',cursive;font-size:0.72rem;color:#555;letter-spacing:3px}
#timer-box{font-family:'Black Ops One',cursive;font-size:1.9rem;color:#222;line-height:1}
#level-label{font-size:0.55rem;color:#888;letter-spacing:2px}

#game-wrap{position:relative;width:800px;height:360px;border:2px solid #999;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.15);border-radius:4px}
#game-wrap canvas{position:absolute;top:0;left:0}
#screen-flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:15;transition:opacity 0.1s}

#game-overlay{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(255,255,255,0.95);z-index:20;gap:8px;
  border-radius:4px;
}
#game-overlay h2{
  font-family:'Black Ops One',cursive;font-size:2.4rem;color:#222;
  text-shadow:2px 2px 4px rgba(0,0,0,0.1);letter-spacing:4px;text-align:center;
}
#game-overlay .sub{font-size:0.75rem;color:#666;letter-spacing:2px;text-align:center}
#game-overlay .win{font-size:0.85rem;color:#2a7a2a;letter-spacing:2px;text-align:center;font-weight:bold}

#combo-display{position:absolute;bottom:5px;left:7px;font-family:'Black Ops One',cursive;font-size:0.65rem;z-index:5;color:#222}
#attack-hud{position:absolute;bottom:9px;right:10px;display:flex;gap:12px;z-index:5;align-items:flex-end}
.atk-btn{display:flex;flex-direction:column;align-items:center;gap:3px}
.atk-label{font-size:0.62rem;letter-spacing:1px;color:#666}
.atk-outer{width:60px;height:9px;background:#ddd;border:1px solid #aaa;overflow:hidden;border-radius:2px}
.atk-bar{height:100%;width:100%;transition:width 0.1s linear;border-radius:2px;background:#555}
#game-keys{display:flex;gap:18px;margin-top:8px;font-size:0.58rem;color:#888;letter-spacing:1px;flex-wrap:wrap;justify-content:center}
#game-keys b{color:#333}
</style>
</head>
<body>

<!-- ═══ HOMESCREEN ═══ -->
<div id="home-screen">
  <div id="title-wrap">
    <div id="main-title">STICKMAN BRAWL</div>
    <div id="main-subtitle">7 LEVELS · KÄMPFE GEGEN ROTE STRICHMENSCHEN</div>
  </div>

  <div id="level-select"></div>

  <div id="action-buttons">
    <button class="btn primary" onclick="startFromLevel(1)">NEUES SPIEL</button>
    <button class="btn" onclick="startFromLevel(getLastUnlocked())">WEITER</button>
  </div>

  <div id="game-keys" style="margin-top:5px">
    <span>← → Laufen</span><span>↑/W Springen</span>
    <span><b>A</b> Schlag</span><span><b>S</b> Kick</span><span><b>D</b> Block</span>
  </div>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div id="game-screen">
  <button id="back-btn" onclick="backToHome()">← ZURÜCK</button>
  <div id="game-title">STICKMAN BRAWL</div>
  <div id="game-subtitle"></div>
  <div id="hud">
    <div class="health-wrap">
      <div class="fighter-label" id="player-label">PLAYER</div>
      <div class="hp-outer"><div class="hp-inner" id="p1hp" style="width:100%"></div></div>
    </div>
    <div id="center-hud">
      <div id="round-label">LEVEL 1</div>
      <div id="timer-box">99</div>
      <div id="level-label">WIESE</div>
    </div>
    <div class="health-wrap right" id="right-hud">
      <div class="fighter-label" id="bot-label">GEGNER</div>
      <div id="bot-hps"></div>
    </div>
  </div>
  <div id="game-wrap">
    <canvas id="bg" width="800" height="360"></canvas>
    <canvas id="gc" width="800" height="360"></canvas>
    <div id="screen-flash"></div>
    <div id="game-overlay"></div>
    <div id="combo-display"></div>
    <div id="attack-hud">
      <div class="atk-btn"><div class="atk-label">SCHLAG [A]</div><div class="atk-outer"><div class="atk-bar" id="bar-punch"></div></div></div>
      <div class="atk-btn"><div class="atk-label">KICK [S]</div><div class="atk-outer"><div class="atk-bar" id="bar-kick"></div></div></div>
    </div>
  </div>
  <div id="game-keys">
    <span>← → Laufen</span><span>↑/W Springen</span>
    <span><b>A</b> Schlag</span><span><b>S</b> Kick</span><span><b>D</b> Block</span>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// SAVE / PROGRESS
// ══════════════════════════════════════════════════════════════════════════
const STORAGE_KEY='stickman_brawl_progress_v2';
let progress={unlocked:1};
try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)progress=JSON.parse(saved);}catch(e){}

function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}catch(e){}}
function getLastUnlocked(){return progress.unlocked}
function unlockLevel(lvl){if(lvl>progress.unlocked&&lvl<=TOTAL_LEVELS){progress.unlocked=lvl;saveProgress()}}

// ══════════════════════════════════════════════════════════════════════════
// CANVAS / KONSTANTEN
// ══════════════════════════════════════════════════════════════════════════
const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
const gc=document.getElementById('gc'),gx=gc.getContext('2d');
const flashEl=document.getElementById('screen-flash');
const W=800,H=360,GY=H-55,G=0.58;
const TOTAL_LEVELS=7;
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}

// ══════════════════════════════════════════════════════════════════════════
// HOMESCREEN – LEVEL CARDS
// ══════════════════════════════════════════════════════════════════════════
const LEVEL_META=[
  {name:'WIESE',desc:'1 Gegner · Einfach'},
  {name:'PARK',desc:'1 Gegner · Bäume'},
  {name:'STADT',desc:'1 Gegner · Dächer'},
  {name:'DOJO',desc:'1 Gegner · Schnell'},
  {name:'ARENA',desc:'2 Gegner · Mittel'},
  {name:'FABRIK',desc:'3 Gegner · Schwer'},
  {name:'BOSS LAIR',desc:'BOSS + 2 Schergen'},
];

function buildHomeScreen(){
  const container=document.getElementById('level-select');
  container.innerHTML='';
  for(let i=1;i<=TOTAL_LEVELS;i++){
    const meta=LEVEL_META[i-1];
    const locked=i>progress.unlocked;
    const completed=i<progress.unlocked;

    const card=document.createElement('div');
    card.className='level-card';
    if(locked)card.classList.add('locked');
    if(completed)card.classList.add('completed');

    card.innerHTML=`
      <div class="level-num">LEVEL ${i}</div>
      <div class="level-name">${meta.name}</div>
      <div class="level-bots">${meta.desc}</div>
    `;

    if(!locked)card.addEventListener('click',()=>startLevel(i));
    container.appendChild(card);
  }
}

// ══════════════════════════════════════════════════════════════════════════
// HINTERGRÜNDE
// ══════════════════════════════════════════════════════════════════════════
function drawCloud(c,x,y,scale){
  c.fillStyle='rgba(255,255,255,0.8)';c.beginPath();
  c.arc(x,y,18*scale,0,Math.PI*2);c.arc(x+22*scale,y-8*scale,22*scale,0,Math.PI*2);
  c.arc(x+45*scale,y,18*scale,0,Math.PI*2);c.arc(x+22*scale,y+5*scale,20*scale,0,Math.PI*2);c.fill();
}

function drawMeadow(c){
  c.fillStyle='#f0f8ff';c.fillRect(0,0,W,GY);
  drawCloud(c,100,40,1);drawCloud(c,300,60,0.8);drawCloud(c,550,35,1.1);drawCloud(c,700,55,0.7);
  c.fillStyle='#ffe066';c.beginPath();c.arc(720,50,30,0,Math.PI*2);c.fill();
  c.fillStyle='#fff9db';c.beginPath();c.arc(720,50,20,0,Math.PI*2);c.fill();
  c.fillStyle='#d5e8d4';c.beginPath();
  c.moveTo(0,GY);c.lineTo(0,GY-50);c.lineTo(80,GY-90);c.lineTo(160,GY-40);c.lineTo(250,GY-80);
  c.lineTo(350,GY-30);c.lineTo(450,GY-70);c.lineTo(550,GY-35);c.lineTo(650,GY-55);
  c.lineTo(750,GY-25);c.lineTo(W,GY-45);c.lineTo(W,GY);c.closePath();c.fill();
  const mg=c.createLinearGradient(0,GY,0,H);mg.addColorStop(0,'#7cb342');mg.addColorStop(1,'#558b2f');
  c.fillStyle=mg;c.fillRect(0,GY,W,H-GY);
  c.strokeStyle='#8bc34a';c.lineWidth=1.5;
  for(let i=0;i<W;i+=6){const h=4+Math.sin(i*0.4)*3;c.beginPath();c.moveTo(i,GY);c.lineTo(i+1.5,GY-h);c.stroke()}
  c.strokeStyle='#558b2f';c.lineWidth=2.5;c.beginPath();c.moveTo(0,GY);c.lineTo(W,GY);c.stroke();
  [[80,GY-3],[200,GY-2],[350,GY-4],[500,GY-2],[620,GY-3],[740,GY-2]].forEach(([fx,fy])=>{
    c.fillStyle='#fff176';c.beginPath();c.arc(fx,fy-4,3,0,Math.PI*2);c.fill();
  });
}

function drawPark(c){
  drawMeadow(c);
  c.fillStyle='#8d6e63';c.fillRect(80,GY-60,40,60);c.fillStyle='#4caf50';c.beginPath();c.arc(100,GY-75,35,0,Math.PI*2);c.fill();
  c.fillStyle='#8d6e63';c.fillRect(680,GY-60,40,60);c.fillStyle='#4caf50';c.beginPath();c.arc(700,GY-75,35,0,Math.PI*2);c.fill();
}

function drawCity(c){
  c.fillStyle='#f0f0f0';c.fillRect(0,0,W,GY);
  [[20,GY-80,60,80],[90,GY-110,50,110],[150,GY-70,70,70],[230,GY-100,55,100],[295,GY-85,65,85],[370,GY-120,50,120],[430,GY-75,60,75],[500,GY-95,55,95],[565,GY-65,70,65],[645,GY-105,50,105],[705,GY-80,60,80]].forEach(([bx,by,bw,bh])=>{
    c.fillStyle='#e0e0e0';c.fillRect(bx,by,bw,bh);c.strokeStyle='#ccc';c.lineWidth=1;c.strokeRect(bx,by,bw,bh);
    c.fillStyle='#bdddf5';for(let wy=by+8;wy<GY-8;wy+=14)for(let wx=bx+5;wx<bx+bw-5;wx+=12)c.fillRect(wx,wy,6,8);
  });
  c.fillStyle='#999';c.fillRect(0,GY,W,H-GY);
}

function drawDojo(c){
  c.fillStyle='#faf8f0';c.fillRect(0,0,W,GY);
  c.strokeStyle='#e8e0d0';c.lineWidth=1;
  for(let x=0;x<W;x+=35){c.beginPath();c.moveTo(x,0);c.lineTo(x,GY);c.stroke()}
  for(let y=0;y<GY;y+=35){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  c.fillStyle='#d7ccc8';c.fillRect(0,GY,W,H-GY);
  c.strokeStyle='#bcaaa4';c.lineWidth=2;c.beginPath();c.moveTo(0,GY);c.lineTo(W,GY);c.stroke();
}

function drawArena(c){
  c.fillStyle='#fafafa';c.fillRect(0,0,W,GY);
  for(let i=0;i<30;i++){const cx=i*28+15,cy=GY-95+Math.sin(i*1.8)*10;c.fillStyle='#ddd';c.beginPath();c.arc(cx,cy,8,Math.PI,0);c.fill();c.fillStyle='#ccc';c.beginPath();c.arc(cx,cy-8,5,0,Math.PI*2);c.fill()}
  const ag=c.createLinearGradient(0,GY,0,H);ag.addColorStop(0,'#d7ccc8');ag.addColorStop(1,'#bcaaa4');
  c.fillStyle=ag;c.fillRect(0,GY,W,H-GY);
}

function drawFactory(c){
  c.fillStyle='#e8e8e8';c.fillRect(0,0,W,GY);
  c.fillStyle='#d0d0d0';for(let x=50;x<W;x+=120)c.fillRect(x,0,40,GY);
  c.fillStyle='#999';c.fillRect(0,GY,W,H-GY);
}

function drawBossLair(c){
  c.fillStyle='#f5f0eb';c.fillRect(0,0,W,GY);
  [100,400,700].forEach(fx=>{c.fillStyle='#8d6e63';c.fillRect(fx-3,GY-70,6,70);c.fillStyle='#ff9800';c.beginPath();c.arc(fx,GY-75,8,0,Math.PI*2);c.fill()});
  c.fillStyle='#795548';c.fillRect(0,GY,W,H-GY);
}

const DRAW_FNS=[drawMeadow,drawPark,drawCity,drawDojo,drawArena,drawFactory,drawBossLair];

// ══════════════════════════════════════════════════════════════════════════
// FIGHTER
// ══════════════════════════════════════════════════════════════════════════
class Fighter{
  constructor(x,dir,isBot,lvlData,isBoss=false){
    this.x=x;this.y=GY;this.vy=0;this.vx=0;this.dir=dir;this.isBot=isBot;this.isBoss=isBoss;
    this.maxHp=isBoss?220:100;this.hp=this.maxHp;
    this.state='idle';this.stateTimer=0;this.blocking=false;this.onGround=true;this.hurtTimer=0;
    this.frame=0;this.frameTimer=0;
    this.platforms=lvlData.platforms||[];
    this.speed=isBot?lvlData.botSpeed:4.2;
    this.aggr=isBot?lvlData.botAggr:0;
    this.attackDelay=isBot?lvlData.botAttackDelay:0;
    this.punchDmg=lvlData.punchDmg*(isBoss?1.5:1);
    this.kickDmg=lvlData.kickDmg*(isBoss?1.5:1);
    this.lHip=0;this.rHip=0;this.lKnee=0;this.rKnee=0;this.lShoulder=0;this.rShoulder=0;this.lElbow=0;this.rElbow=0;
    this.bodyLean=0;this.headTilt=0;
    this.aiTimer=Math.floor(Math.random()*25);this.aiAction='idle';this.aiDuration=0;
    this.combo=0;this.comboTimer=0;
    this.punchCd=0;this.kickCd=0;this.punchCdMax=55;this.kickCdMax=75;
  }
  jump(){if(this.onGround&&!['punch','kick','hurt'].includes(this.state)){this.vy=-13.8;this.onGround=false;this.state='jump'}}
  punch(others){
    if(['punch','kick','hurt','dead'].includes(this.state)||this.punchCd>0)return;
    this.state='punch';this.stateTimer=20;this.punchCd=this.punchCdMax;
    setTimeout(()=>{
      if(this.state!=='punch')return;
      for(const o of(Array.isArray(others)?others:[others])){
        if(o.state==='dead')continue;
        const dx=o.x-this.x;
        if(Math.abs(dx)<70&&Math.abs(o.y-this.y)<50&&((this.dir===1&&dx>0)||(this.dir===-1&&dx<0))){
          let d=o.blocking&&Math.sign(dx)===this.dir?Math.max(1,Math.floor(this.punchDmg*0.2)):this.punchDmg;
          o.takeDamage(d,this.dir,0);spawnHitEffect(o.x,o.y-52,d,0);if(!this.isBot){this.combo++;this.comboTimer=90}
        }
      }
    },90);
  }
  kick(others){
    if(['punch','kick','hurt','dead'].includes(this.state)||this.kickCd>0)return;
    this.state='kick';this.stateTimer=26;this.kickCd=this.kickCdMax;
    setTimeout(()=>{
      if(this.state!=='kick')return;
      for(const o of(Array.isArray(others)?others:[others])){
        if(o.state==='dead')continue;
        const dx=o.x-this.x;
        if(Math.abs(dx)<85&&Math.abs(o.y-this.y)<55&&((this.dir===1&&dx>0)||(this.dir===-1&&dx<0))){
          let d=o.blocking&&Math.sign(dx)===this.dir?Math.max(1,Math.floor(this.kickDmg*0.25)):this.kickDmg;
          o.takeDamage(d,this.dir,1);spawnHitEffect(o.x,o.y-52,d,1);if(!this.isBot){this.combo++;this.comboTimer=90}
        }
      }
    },110);
  }
  takeDamage(dmg,fromDir,type){
    if(this.state==='dead')return;
    this.hp=Math.max(0,this.hp-dmg);this.hurtTimer=18;
    if(this.state!=='block'){this.state='hurt';this.stateTimer=14;this.vx=fromDir*5.5;this.vy=-3}
    if(this.hp<=0)this.state='dead';
    if(dmg>=10)flashScreen();
  }
  update(keys,others){
    if(this.state==='dead')return;
    if(!this.onGround){this.vy+=G;this.y+=this.vy;
      if(this.vy>0)for(const p of this.platforms)if(this.x>p.x-10&&this.x<p.x+p.w+10&&this.y>=p.y-2&&this.y<=p.y+16){this.y=p.y;this.vy=0;this.onGround=true;if(this.state==='jump')this.state='idle';break}
      if(!this.onGround&&this.y>=GY){this.y=GY;this.vy=0;this.onGround=true;if(this.state==='jump')this.state='idle'}
    }
    if(this.onGround&&this.y<GY-1){let onP=false;for(const p of this.platforms)if(this.x>p.x-12&&this.x<p.x+p.w+12&&this.y<=p.y+3){onP=true;break}if(!onP)this.onGround=false}
    this.vx*=0.72;this.x+=this.vx;this.x=clamp(this.x,18,W-18);
    if(this.stateTimer>0){this.stateTimer--;if(this.stateTimer===0&&['punch','kick','hurt'].includes(this.state))this.state='idle'}
    if(this.hurtTimer>0)this.hurtTimer--;if(this.comboTimer>0)this.comboTimer--;else this.combo=0;
    if(this.punchCd>0)this.punchCd--;if(this.kickCd>0)this.kickCd--;
    if(this.isBot)this.updateAI(others);else this.updatePlayer(keys,others);
    const tgts=Array.isArray(others)?others:[others];
    const nearest=tgts.filter(o=>o&&o.state!=='dead').sort((a,b)=>Math.abs(a.x-this.x)-Math.abs(b.x-this.x))[0];
    if(nearest&&this.onGround&&['idle','walk'].includes(this.state))this.dir=nearest.x>this.x?1:-1;

  updatePlayer(keys,others){
    this.blocking=false;if(['punch','kick','hurt'].includes(this.state))return;
    if(keys['ArrowLeft']||keys['KeyA']){this.x-=this.speed;this.dir=-1;if(this.onGround)this.state='walk'}
    else if(keys['ArrowRight']||keys['KeyD']){this.x+=this.speed;this.dir=1;if(this.onGround)this.state='walk'}
    else if(this.onGround&&this.state==='walk')this.state='idle';
    if((keys['ArrowUp']||keys['KeyW']||keys['Space'])&&this.onGround){this.jump();keys['ArrowUp']=false;keys['KeyW']=false;keys['Space']=false}
    if(keys['KeyZ']){this.punch(others);keys['KeyZ']=false}
    if(keys['KeyX']){this.kick(others);keys['KeyX']=false}
    if(keys['KeyC']){this.blocking=true;this.state='idle'}
  }
  updateAI(pl){
    const tgts=Array.isArray(pl)?pl.filter(p=>p&&p.state!=='dead'):(pl&&pl.state!=='dead'?[pl]:[]);
    if(!tgts.length)return;
    const t=tgts.sort((a,b)=>Math.abs(a.x-this.x)-Math.abs(b.x-this.x))[0];
    if(!t)return;this.aiTimer--;const dx=t.x-this.x,dist=Math.abs(dx);
    if(this.aiTimer<=0){const r=Math.random();
      if(dist>120){this.aiAction='chase';this.aiDuration=25+Math.random()*35}
      else if(dist<65&&r<this.aggr){this.aiAction=r<this.aggr*0.45?'punch':'kick';this.aiDuration=this.attackDelay/3|0}
      else if(r<0.12){this.aiAction='jump';this.aiDuration=10}else if(r<0.25){this.aiAction='block';this.aiDuration=20}
      else if(r<0.55){this.aiAction='approach';this.aiDuration=18}else{this.aiAction='retreat';this.aiDuration=14}
      this.aiTimer=this.aiDuration;
    }
    this.dir=dx>0?1:-1;this.blocking=false;if(['punch','kick','hurt'].includes(this.state))return;
    if(this.aiAction==='chase'||this.aiAction==='approach'){this.x+=this.dir*this.speed*0.85;if(this.onGround)this.state='walk'}
    else if(this.aiAction==='retreat'){this.x-=this.dir*this.speed*0.55;if(this.onGround)this.state='walk'}
    else if(this.aiAction==='punch')this.punch(t);else if(this.aiAction==='kick')this.kick(t);
    else if(this.aiAction==='jump')this.jump();else if(this.aiAction==='block')this.blocking=true;
    else if(this.onGround)this.state='idle';
  }
  animateLimbs(){
    const t=this.frame/8*Math.PI*2;const w=this.state==='walk',j=!this.onGround,p=this.state==='punch',k=this.state==='kick',bl=this.blocking,h=this.state==='hurt';const D=this.dir,s=0.28;
    if(w){this.lHip=lerp(this.lHip,Math.sin(t)*0.65,s);this.rHip=lerp(this.rHip,-Math.sin(t)*0.65,s);this.lKnee=lerp(this.lKnee,Math.max(0,Math.sin(t))*0.5,s);this.rKnee=lerp(this.rKnee,Math.max(0,-Math.sin(t))*0.5,s)}
    else if(j){this.lHip=lerp(this.lHip,-0.55,0.2);this.rHip=lerp(this.rHip,-0.35,0.2);this.lKnee=lerp(this.lKnee,0.65,0.2);this.rKnee=lerp(this.rKnee,0.55,0.2)}
    else if(k){this.lHip=lerp(this.lHip,0.1,0.35);this.rHip=lerp(this.rHip,D*1.5,0.4);this.lKnee=lerp(this.lKnee,0,0.35);this.rKnee=lerp(this.rKnee,Math.max(0,D*0.75),0.4)}
    else{this.lHip=lerp(this.lHip,0,0.15);this.rHip=lerp(this.rHip,0,0.15);this.lKnee=lerp(this.lKnee,0,0.15);this.rKnee=lerp(this.rKnee,0,0.15)}
    if(p){this.rShoulder=lerp(this.rShoulder,D*1.2,0.45);this.lShoulder=lerp(this.lShoulder,-D*0.5,0.35);this.rElbow=lerp(this.rElbow,D*0.55,0.45);this.lElbow=lerp(this.lElbow,0,0.3)}
    else if(k){this.lShoulder=lerp(this.lShoulder,-0.6,0.35);this.rShoulder=lerp(this.rShoulder,0.45,0.35);this.lElbow=lerp(this.lElbow,0,0.3);this.rElbow=lerp(this.rElbow,0,0.3)}
    else if(bl){this.lShoulder=lerp(this.lShoulder,D*0.75,0.35);this.rShoulder=lerp(this.rShoulder,D*1.0,0.35);this.lElbow=lerp(this.lElbow,D*0.5,0.35);this.rElbow=lerp(this.rElbow,D*0.5,0.35)}
    else if(h){this.lShoulder=lerp(this.lShoulder,-D*0.45,0.35);this.rShoulder=lerp(this.rShoulder,-D*0.45,0.35);this.lElbow=lerp(this.lElbow,0,0.3);this.rElbow=lerp(this.rElbow,0,0.3)}
    else if(!w){this.lShoulder=lerp(this.lShoulder,0,0.13);this.rShoulder=lerp(this.rShoulder,0,0.13);this.lElbow=lerp(this.lElbow,0,0.13);this.rElbow=lerp(this.rElbow,0,0.13)}
    else{this.lShoulder=lerp(this.lShoulder,-Math.sin(t)*0.45,s);this.rShoulder=lerp(this.rShoulder,Math.sin(t)*0.45,s)}
    if(w)this.bodyLean=lerp(this.bodyLean,D*0.1,0.15);else if(p)this.bodyLean=lerp(this.bodyLean,D*0.3,0.35);
    else if(h)this.bodyLean=lerp(this.bodyLean,-D*0.35,0.35);else this.bodyLean=lerp(this.bodyLean,0,0.13);
    this.headTilt=lerp(this.headTilt,h?-D*0.3:D*0.08,0.15);
  }
  draw(c){
    if(this.state==='dead'){this.drawDead(c);return}
    const x=this.x,y=this.y;const flicker=this.hurtTimer>0&&(this.hurtTimer%4<2);
    const fillCol=this.isBot?'#dd2222':'#333333';const outlineCol=this.isBot?'#880000':'#111111';
    c.save();c.globalAlpha=flicker?0.6:1;
    const bob=this.state==='walk'?Math.sin(this.frame/8*Math.PI*2)*2.5:0;
    const base=y+bob,lean=this.bodyLean,D=this.dir,scale=this.isBoss?1.3:1;
    const hipX=x,hipY=base-26*scale;
    const shoulderX=x+Math.sin(lean)*28*scale,shoulderY=base-52*scale;

    c.lineWidth=this.isBoss?5:3.5;c.beginPath();c.moveTo(hipX,hipY);c.lineTo(shoulderX,shoulderY);c.stroke();
    c.lineWidth=(this.isBoss?5:3)*0.85;c.beginPath();c.moveTo(shoulderX-11*scale,shoulderY);c.lineTo(shoulderX+11*scale,shoulderY);c.stroke();
    this._arm(c,shoulderX,shoulderY,this.lShoulder,this.lElbow,0.7,scale,fillCol,outlineCol);
    this._arm(c,shoulderX,shoulderY,this.rShoulder,this.rElbow,1.0,scale,fillCol,outlineCol);

    c.beginPath();c.moveTo(shoulderX,shoulderY);c.lineTo(headX,headY+12*scale);c.stroke();
    c.lineWidth=this.isBoss?5:3.5;c.fillStyle='white';c.strokeStyle=outlineCol;c.beginPath();c.arc(headX,headY,12*scale,0,Math.PI*2);c.fill();c.stroke();
    if(this.isBoss){c.fillStyle=fillCol;c.lineWidth=2.5;c.beginPath();c.moveTo(headX-14,headY-12);c.lineTo(headX-14,headY-24);c.lineTo(headX-5,headY-17);c.lineTo(headX,headY-26);c.lineTo(headX+5,headY-17);c.lineTo(headX+14,headY-24);c.lineTo(headX+14,headY-12);c.closePath();c.fill();c.stroke()}
    c.fillStyle='#000';c.beginPath();c.arc(headX+D*5*scale,headY-1*scale,2.5*scale,0,Math.PI*2);c.fill();
    c.strokeStyle='#000';c.lineWidth=1.8;
    if(this.blocking)c.beginPath(),c.arc(headX+D*3,headY+4,4,0.1,Math.PI-0.1),c.stroke();
    else if(this.state==='punch')c.beginPath(),c.moveTo(headX+D*2,headY+4),c.lineTo(headX+D*7,headY+2),c.stroke();
    else if(this.hurtTimer>0)c.beginPath(),c.arc(headX+D*2,headY+6,4.5,Math.PI+0.3,Math.PI*2-0.3),c.stroke();
    else c.beginPath(),c.moveTo(headX+D*2,headY+5),c.lineTo(headX+D*5,headY+4),c.stroke();
    if(this.blocking){c.globalAlpha*=0.3;c.strokeStyle='#666';c.fillStyle='rgba(200,200,200,0.3)';c.lineWidth=5;c.beginPath();c.arc(x,base-40,36*scale,0,Math.PI*2);c.fill();c.stroke()}
    c.restore();
  }
  _leg(c,px,py,hip,knee,alpha,sc,fill,out){c.save();c.globalAlpha*=alpha;c.strokeStyle=out;c.lineWidth=4*sc;const tx=px+Math.sin(hip)*28*sc,ty=py+Math.cos(hip)*28*sc;c.beginPath();c.moveTo(px,py);c.lineTo(tx,ty);c.stroke();const ka=hip+knee*0.85,fx=tx+Math.sin(ka)*25*sc,fy=ty+Math.cos(ka)*25*sc;c.beginPath();c.moveTo(tx,ty);c.lineTo(fx,fy);c.stroke();c.lineWidth=3*sc;c.beginPath();c.moveTo(fx,fy);c.lineTo(fx+this.dir*10*sc,fy+3);c.stroke();c.restore()}

}

let particles=[],hitTexts=[];
function spawnParticles(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:1,col,r:1.5+Math.random()*3})}}
function spawnHitEffect(x,y,dmg,type){const col=type===0?'#ff6600':'#cc0000';spawnParticles(x,y,col,dmg>10?14:8);hitTexts.push({x,y,text:type===0?'PUNCH!':'KICK!',life:1,vy:-1.8,col,size:dmg>10?18:14})}
function flashScreen(){flashEl.style.opacity='0.2';setTimeout(()=>flashEl.style.opacity='0',80)}
function updateFX(){particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.035});hitTexts=hitTexts.filter(t=>t.life>0);hitTexts.forEach(t=>{t.y+=t.vy;t.life-=0.024})}
function drawFX(c){particles.forEach(p=>{c.save();c.globalAlpha=p.life*0.9;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();c.restore()});hitTexts.forEach(t=>{c.save();c.globalAlpha=t.life;c.fillStyle=t.col;c.font=`900 ${t.size}px 'Black Ops One',cursive`;c.textAlign='center';c.fillText(t.text,t.x,t.y);c.restore()})}

const keys={};
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyS','KeyD','KeyW','KeyZ','KeyX','KeyC'].includes(e.code))e.preventDefault();
  if(e.code==='ArrowLeft')keys['ArrowLeft']=true;
  if(e.code==='ArrowRight')keys['ArrowRight']=true;
  if(e.code==='ArrowUp'){keys['ArrowUp']=true;keys['KeyW']=true}
  if(e.code==='KeyW'){keys['KeyW']=true;keys['ArrowUp']=true}
  if(e.code==='Space'){keys['Space']=true;keys['ArrowUp']=true}
  if(e.code==='KeyA')keys['KeyZ']=true;
  if(e.code==='KeyS')keys['KeyX']=true;
  if(e.code==='KeyD')keys['KeyC']=true;
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft')keys['ArrowLeft']=false;
  if(e.code==='ArrowRight')keys['ArrowRight']=false;
  if(e.code==='ArrowUp'){keys['ArrowUp']=false;keys['KeyW']=false}
  if(e.code==='KeyW'){keys['KeyW']=false;keys['ArrowUp']=false}
  if(e.code==='Space'){keys['Space']=false;keys['ArrowUp']=false}
  if(e.code==='KeyA')keys['KeyZ']=false;
  if(e.code==='KeyS')keys['KeyX']=false;
  if(e.code==='KeyD')keys['KeyC']=false;
});

// GAME STATE

let player,bots=[],running=false,animId=null,currentLevel=1;
let timerSecs=99,timerInterval=null;

function buildBotHpBars(bts){
  const container=document.getElementById('bot-hps');
  const label=document.getElementById('bot-label');
  container.innerHTML='';
  if(bts.length===1){
    const b=bts[0];label.textContent=b.isBoss?'BOSS':'GEGNER';label.style.color='#cc0000';
    const outer=document.createElement('div');outer.className='hp-outer';outer.style.width='100%';
    const inner=document.createElement('div');inner.className='hp-inner';inner.id='b0hp';inner.style.width='100%';
    inner.style.background=b.isBoss?'linear-gradient(90deg,#ff4400,#cc0000)':'linear-gradient(270deg,#dd2222,#cc0000)';
    outer.appendChild(inner);container.appendChild(outer);
  }else{
    label.textContent='GEGNER ('+bts.length+')';label.style.color='#666';
    bts.forEach((b,i)=>{
      const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:1px;align-items:flex-end;width:100%';
      const lbl=document.createElement('div');lbl.style.cssText='font-size:0.5rem;letter-spacing:2px;color:#cc0000';lbl.textContent=b.isBoss?'BOSS':'BOT '+(i+1);
      const outer=document.createElement('div');outer.className='bot-hp-bar';outer.style.width='100%';
      const inner=document.createElement('div');inner.className='bot-hp-fill';inner.id='b'+i+'hp';inner.style.width='100%';
      inner.style.background=b.isBoss?'linear-gradient(270deg,#ff4400,#cc0000)':'linear-gradient(270deg,#dd2222,#cc0000)';
      outer.appendChild(inner);wrap.appendChild(lbl);wrap.appendChild(outer);container.appendChild(wrap);
    });
  }
}

function updateHUD(){
  document.getElementById('p1hp').style.width=clamp(player.hp/player.maxHp*100,0,100)+'%';
  bots.forEach((b,i)=>{const el=document.getElementById('b'+i+'hp');if(el)el.style.width=clamp(b.hp/b.maxHp*100,0,100)+'%'});
  const t=timerSecs,tb=document.getElementById('timer-box');
  tb.textContent=t<10?'0'+t:t;tb.style.color=t<=10?'#cc0000':'#222';
  const cd=document.getElementById('combo-display');
  if(player.combo>=2){cd.textContent='COMBO ×'+player.combo;cd.style.color=player.combo>=5?'#cc0000':'#555'}
  else cd.textContent='';
  const pR=clamp(1-(player.punchCd/player.punchCdMax),0,1),kR=clamp(1-(player.kickCd/player.kickCdMax),0,1);
  document.getElementById('bar-punch').style.width=(pR*100)+'%';document.getElementById('bar-kick').style.width=(kR*100)+'%';
}

function showGameOverlay(html){const ov=document.getElementById('game-overlay');ov.innerHTML=html;ov.style.display='flex'}
function hideGameOverlay(){document.getElementById('game-overlay').style.display='none'}

function endGame(title,sub,playerWon){
  running=false;clearInterval(timerInterval);
  if(playerWon)unlockLevel(currentLevel+1);
  setTimeout(()=>{
    const nl=currentLevel+1,has=nl<=TOTAL_LEVELS&&nl<=progress.unlocked;
    let btns=`<button class="btn" onclick="startLevel(${currentLevel})">NOCHMAL</button>`;
    if(playerWon&&has)btns=`<button class="btn green" onclick="startLevel(${nl})">LEVEL ${nl}: ${LEVELS[nl-1].name} →</button>`+btns;
    btns+=`<button class="btn small" onclick="backToHome()">ZUM MENÜ</button>`;
    showGameOverlay(`<h2>${title}</h2><div class="${playerWon?'win':'sub'}">${sub}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px">${btns}</div>`);
  },1200);
}

function startLevel(lvl){
  if(lvl>progress.unlocked)return;
  currentLevel=lvl;const lv=LEVELS[lvl-1];
  document.getElementById('home-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  document.getElementById('round-label').textContent='LEVEL '+lvl;
  document.getElementById('level-label').textContent=lv.name;
  document.getElementById('game-subtitle').textContent='LEVEL '+lvl+' · '+lv.name;
  hideGameOverlay();
  bgX.clearRect(0,0,W,H);DRAW_FNS[lvl-1](bgX);
  player=new Fighter(100,1,false,lv);
  bots=[];const botCount=lv.bots,spacing=Math.floor(W/(botCount+1));
  for(let i=0;i<botCount;i++){const bx=spacing*(i+1)+Math.floor(Math.random()*80-40),isBoss=lv.boss&&i===0;bots.push(new Fighter(clamp(bx,150,W-60),-1,true,lv,isBoss))}
  bots.forEach((b,i)=>b.aiTimer=15+i*20);
  buildBotHpBars(bots);particles=[];hitTexts=[];timerSecs=99;clearInterval(timerInterval);
  timerInterval=setInterval(()=>{if(!running)return;timerSecs--;if(timerSecs<=0){timerSecs=0;running=false;clearInterval(timerInterval);const ab=bots.filter(b=>b.state!=='dead'),thp=ab.reduce((s,b)=>s+b.hp,0),avg=ab.length>0?thp/ab.length:0,pw=player.hp>0&&player.hp>avg;setTimeout(()=>endGame(pw?'ZEIT ABGELAUFEN – SIEG!':'ZEIT ABGELAUFEN – NIEDERLAGE',pw?'DU HATTEST MEHR HP!':'GEGNER HAT MEHR HP!',pw),600)}},1000);
  running=true;if(animId)cancelAnimationFrame(animId);updateHUD();gameLoop();
}

function startFromLevel(lvl){startLevel(Math.min(lvl,progress.unlocked))}

function backToHome(){
  running=false;clearInterval(timerInterval);if(animId)cancelAnimationFrame(animId);
  document.getElementById('game-screen').style.display='none';
  document.getElementById('home-screen').style.display='block';
  buildHomeScreen();
}

function gameLoop(){
  gx.clearRect(0,0,W,H);const aliveBots=bots.filter(b=>b.state!=='dead');
  player.update(keys,aliveBots.length>0?aliveBots:bots);bots.forEach(b=>b.update(keys,player));updateFX();
  const all=[...bots,player].filter(f=>f.state!=='dead');all.sort((a,b)=>a.y-b.y);all.forEach(f=>f.draw(gx));
  bots.forEach(b=>{if(b.state==='dead')b.draw(gx)});if(player.state==='dead')player.draw(gx);drawFX(gx);
  gx.save();gx.font='bold 9px "Share Tech Mono"';gx.textAlign='center';
  if(player.state!=='dead'){gx.fillStyle='#222';gx.fillText('YOU',player.x,player.y-(player.y<GY?90:82))}
  bots.forEach((b,i)=>{if(b.state==='dead')return;gx.fillStyle='#cc0000';const ly=b.y-(b.y<GY?92:84);gx.fillText(b.isBoss?'BOSS':('BOT '+(i+1)),b.x,ly);const bw=46,bh=5,bx2=b.x-bw/2,by2=ly+5;gx.fillStyle='#ddd';gx.fillRect(bx2,by2,bw,bh);const hpPct=b.hp/b.maxHp;gx.fillStyle=hpPct>0.5?'#cc0000':(hpPct>0.25?'#ff6600':'#ff0000');gx.fillRect(bx2,by2,bw*hpPct,bh);gx.strokeStyle='#999';gx.lineWidth=1;gx.strokeRect(bx2,by2,bw,bh)});
  gx.restore();updateHUD();
  if(bots.every(b=>b.state==='dead')){endGame('SIEG!',currentLevel===TOTAL_LEVELS?'DU HAST DAS SPIEL DURCHGESPIELT!':'ALLE GEGNER BESIEGT!',true);return}
  if(player.state==='dead'){endGame('NIEDERLAGE','DU WURDEST BESIEGT!',false);return}
  if(running)animId=requestAnimationFrame(gameLoop);
}

// ══════════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════════
buildHomeScreen();
DRAW_FNS[0](bgX);
</script>
